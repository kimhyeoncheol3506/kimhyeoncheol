<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* 뉴럴서랍 시험 장면(5초): 글자가 한 자씩 튀어나오는 키네틱 제목 + 강조 낱말 빛남 */
      @font-face { font-family: P; src: url("fonts/Pretendard-Black.otf"); }
      :root { --ground: #10050E; --ink: #ffffff; --acc: #FF4FB0; --font-display: P, sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(circle at 50% 45%, #2A0820, var(--ground) 70%); }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-display); }
      #l1, #l2 { position: absolute; left: 0; right: 0; text-align: center; color: var(--ink); letter-spacing: -0.03em; }
      #l1 { top: 330px; font-size: 130px; }
      #l2 { top: 520px; font-size: 150px; color: var(--acc); text-shadow: 0 0 50px #FF4FB088; }
      .ch { display: inline-block; }
      #bar { position: absolute; left: 560px; top: 760px; width: 800px; height: 14px; border-radius: 7px; background: var(--acc); transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="l1" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
      <div id="l2" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
      <div id="bar" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
    </div>
    <script>
      const split = (id, text) => { document.getElementById(id).innerHTML = [...text].map(c => `<span class="ch">${c === " " ? "&nbsp;" : c}</span>`).join(""); };
      split("l1", "글도 못 쓰는 AI가");
      split("l2", "200배 빠르다고?");
      const tl = gsap.timeline({ paused: true });
      tl.from("#l1 .ch", { y: 80, opacity: 0, duration: 0.35, ease: "back.out(2)", stagger: 0.05 }, 0.2);
      tl.from("#l2 .ch", { scale: 0, opacity: 0, duration: 0.4, ease: "back.out(3)", stagger: 0.06 }, 1.2);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 2.4);
      tl.to("#l2", { scale: 1.06, duration: 0.5, yoyo: true, repeat: 2, ease: "sine.inOut" }, 3.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
