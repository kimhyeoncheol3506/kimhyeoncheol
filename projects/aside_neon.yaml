#     '윈도우 설치', 첫 장면 '월요일 아침마다 숫자 옮겨 적기' 상황(문장은 새로 씀).
# 사실은 1차 자료만: aside.com(기능·성적·요금·다운로드), docs.aside.com/help(설치·심부름·옆창·권한·루틴·AI 연결), 한국경제 2026-10-05.
slug: aside_neon
style: neon
format: longform
brand: 뉴럴서랍
title: "AI 브라우저 어사이드(Aside) 사용법 총정리 — 말 한마디면 인터넷 일을 대신 해 줍니다"
intro_chapter: 인트로 · 어사이드가 뭐길래
summary: |
  한국인 세 명이 만든 AI 브라우저 어사이드(Aside)를 처음 쓰는 분도 따라 할 수 있게 쉬운 말로 정리했습니다.
  어사이드가 무엇인지, 설치하는 법, 첫 심부름 시키는 법, 엑셀 정리·문의 정리·예약 같은 활용법, 안전하게 쓰는 법, 요금까지 다룹니다.
  결제·글쓰기·메시지 보내기는 어사이드가 늘 사람에게 먼저 확인을 받습니다. 그래도 회사 계정과 개인 정보는 조심해서 쓰세요.
tags: ["#어사이드", "#Aside", "#AI브라우저", "#업무자동화", "#AI비서", "#직장인AI", "#뉴럴서랍"]
disclaimer: 이 영상은 광고가 아닙니다. 성적(벤치마크)은 회사가 직접 발표한 숫자이며, 기능·요금은 바뀔 수 있으니 공식 사이트에서 확인하세요.
voice:
  speed: 1.05            # 35~50세 대상: 네온 기본(1.15)보다 조금 천천히
  instruct: "친절한 선생님처럼 또렷하고 다정하게, 어려운 말은 천천히 짚어 준다. 높낮이를 살려 단조롭지 않게, 문장 끝은 부드럽게 닫는다."
say_as: {Aside: 어사이드, aside.com: 어사이드 닷컴, Pro: 프로, Max: 맥스, YC: 와이씨}
numbers_ok: ["1", "2", "3", "4", "5", "6", "01", "02", "03", "04", "05", "06", "9", "2026", "10"]   # 2026·10 = 한경 기사 날짜 표기
