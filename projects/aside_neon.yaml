    instruct: "차분하게 정리하듯."
    scene: {kind: recap, slash: /use, items: [{k: "1", v: "흩어진 [[숫자 모으기]]"}, {k: "2", v: "문의 정리 · 답장 초안"}, {k: "3·4", v: "예약 · 매주 [[루틴]]"}]}
    sync: {at: [0, "숫자", "예약,", "반복되는"]}

  # ───────────── PART 05 /safe
  - say: "다섯 번째, 안전하게 쓰는 법이에요. 이건 꼭 지켜 주세요."
    chapter: "PART 05 · 안전하게 쓰기"
    scene: {kind: part, num: PART 05, slash: /safe, title: 안전하게 쓰기}
    sync: {at: [0, "안전하게", "꼭"]}

  - say: "결제나 보내기 확인 창이 뜨면, 내용을 끝까지 읽고 눌러 주세요. 확인 버튼은 사람이 누르는 마지막 문이에요."
    instruct: "낮고 단호하게, 경고하듯."
    scene: {kind: warn, tag: 주의 1, title: "확인 창은 [[끝까지]] 읽기", lines: ["금액 · 받는 사람 · 내용 확인", "확인 버튼 = 사람이 지키는 마지막 문"]}
    sync: {at: [0, "끝까지", "마지막"]}

  - say: "회사 계정이나 개인 정보가 많은 사이트는, 회사 규칙부터 확인하고 쓰는 게 좋아요."
    instruct: "낮고 단호하게."
    scene: {kind: list, num: "!", title: 조심할 곳, items: ["회사 계정 · 사내 시스템", "은행 · 개인 정보가 많은 곳", "[[회사 규칙]]부터 확인"]}
    sync: {at: [0, "회사", "개인", "규칙부터"]}

  - say: "회사 일을 맡길 거라면, 회사용 프로필을 따로 만들어 쓰는 걸 추천해요. 개인 은행이나 쇼핑 로그인과 섞이지 않게요."
    scene: {kind: icons, tag: 주의 2, label: "회사 일은 [[회사용 프로필]]로", items: [{glyph: "🏢", name: 회사용 프로필}, {glyph: "🏠", name: 개인용 프로필}, {glyph: "✕", name: 서로 섞지 않기, color: "#FF5D5D"}]}
    sync: {at: [0, "회사용", "개인"]}
  - say: "그리고 댓글을 자동으로 잔뜩 다는 일은 조심하세요. 사이트 규칙에 어긋나면 계정이 막힐 수도 있어요."
    instruct: "낮고 단호하게, 걱정해 주듯."
    scene: {kind: warn, tag: 주의 3, title: "자동 댓글은 [[적당히]]", lines: ["사이트마다 규칙이 다름", "어기면 계정이 막힐 수도"]}
    sync: {at: [0, "댓글을", "계정이"], beats: ["조심하세요.", "규칙에"]}

  # ───────────── PART 06 /price
  - say: "솔직한 이야기도 할게요. 아직 나온 지 얼마 안 된 서비스라, 써 본 분들은 가끔 느리거나 멈출 때가 있다고 해요. 그래서 시켜 놓고 다른 일을 하는 게 좋아요."
    instruct: "솔직하게 털어놓듯 차분하게."
    scene: {kind: warn, tag: 솔직 후기, title: "아직은 [[초기]] 서비스", lines: ["가끔 느리거나 멈출 수 있음", "시켜 놓고 다른 일 하기"]}
    sync: {at: [0, "느리거나", "시켜"], beats: ["서비스라,", "다른"]}
  - say: "마지막으로 요금이에요. 무료로 시작할 수 있어요."
    chapter: "PART 06 · 요금"
    scene: {kind: part, num: PART 06, slash: /price, title: 요금}
    sync: {at: [0, "요금이에요.", "무료로"]}

  - say: "무료 요금제는 한 달에 500크레딧, 그러니까 쓸 수 있는 양이 정해져 있고, 더 많이 쓰고 싶으면 프로는 세 배, 맥스는 마흔 배까지 쓸 수 있어요."
    source: "aside.com/pricing"
    scene: {kind: list, num: "₩", title: 요금제 한눈에, items: ["무료: 한 달 [[500크레딧]] · 루틴 3개", "프로: 무료의 [[3배]] · 루틴 무제한", "맥스: 무료의 [[40배]]"]}
    sync: {at: [0, "500크레딧,", "프로는", "맥스는"], beats: ["정해져"]}

  - say: "처음엔 무료로 충분히 써 보고, 정말 매일 쓰게 되면 그때 올려도 늦지 않아요."
    instruct: "친한 선배가 조언하듯 다정하게."
    scene: {kind: hook, small: "추천", line1: "처음엔 [[무료]]로", line2: "매일 쓰게 되면 그때"}
    sync: {at: [0, "무료로", "매일"]}

  # ───────────── 마무리
  - say: "제 생각엔, 어사이드의 진짜 장점은 어려운 걸 몰라도 된다는 거예요. 평소에 하던 말로 시키고, 마지막 확인만 내가 하면 되니까요."
    instruct: "진심을 담아 차분하게, 마지막 문장은 따뜻하게."
    scene: {kind: recap, slash: /neural, items: [{k: AI, v: "찾고 · 누르고 · 정리하고"}, {k: 나, v: "[[말로 시키고]] · 마지막 확인"}]}
    sync: {at: [0, "평소에", "마지막"], beats: ["진짜", "몰라도"]}

  - say: "조급하게 다 바꿀 필요는 없어요. 오늘은 딱 하나, 매주 반복하는 인터넷 일 하나만 맡겨 보세요."
    instruct: "따뜻하게 권하듯."
    scene: {kind: hook, small: "오늘 해 볼 것", line1: "반복하는 일", line2: "[[딱 하나]]만 맡기기"}
    sync: {at: [0, "필요는", "딱"], beats: ["다", "오늘은", "맡겨"]}      # 첫 줄이 3초 늦게 떠 정지(11-04 검수)

  - say: "오늘 내용이 도움이 됐다면 구독과 좋아요 부탁드려요. 공식 사이트 주소는 설명란에 남겨 둘게요."
    instruct: "밝고 경쾌하게."
    hold: 8
    scene: {kind: cta, title: "도움이 됐다면 [[구독과 좋아요]]", button: 구독, next: "공식 사이트 주소는 설명란에 · 뉴럴서랍"}
    sync: {at: [0, "구독과", "공식"]}      # 다음 편 예고는 넣지 않는다(EDIT-12)
