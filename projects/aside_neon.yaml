scenes:
  # ───────────── 후킹
  - say: "매주 월요일 아침, 사이트 서너 곳을 돌면서 숫자를 엑셀에 옮겨 적고 계신가요?"
    instruct: "공감하듯 말을 걸며, 질문 끝을 올린다."
    scene: {kind: hook, small: "혹시 이런 분?", line1: "월요일마다", line2: "[[숫자 옮겨 적기]]"}
    sync: {at: [0, "사이트", "엑셀에"]}

  - say: "이제는 그 일을 말 한마디로 맡길 수 있어요. 인터넷 창이 직접 알아서 해 주거든요."
    instruct: "놀라운 소식을 전하듯 밝고 힘 있게."
    scene: {kind: chat, tag: "이렇게만 말하면 · 예시", label: "말 한마디로\n[[끝]]", app: 어사이드, messages: [{who: me, text: "이번 주 환율이랑 유가 찾아서 지난주와 비교 표로 만들어 줘"}, {who: ai, text: "사이트 두 곳에서 찾아 비교 표로 만들었어요. 파일로 저장해 둘게요."}]}
    sync: {at: [0, "말", "인터넷"]}

  - say: "바로 요즘 가장 뜨거운 AI 브라우저, 어사이드입니다."
    scene: {kind: title, tag: 오늘의 도구, kicker: "AI 브라우저", title: Aside, sub: "어사이드 · 인터넷 창 속 [[AI 비서]]"}
    sync: {at: [0, "어사이드입니다."]}

  - say: "한국인 세 명이 만든 회사인데요, 실리콘밸리 최대 창업 지원 회사 대표가 이런 말을 남겼어요."
    source: "한국경제 2026-10-05"
    scene: {kind: icons, tag: 만든 사람들, label: "한국인 [[세 명]]의 회사", items: [{glyph: "①", name: 김준 대표}, {glyph: "②", name: 이찬희 CPO}, {glyph: "③", name: 공동 창업자}]}
    sync: {at: [0, "세", "실리콘밸리"]}

  - say: "로그인해 둔 사이트를 사람처럼 다루는 능력은, 지금까지 본 AI 브라우저 중 단연 최고다."
    source: "한국경제 2026-10-05 (Y콤비네이터 게리 탄 CEO 발언 인용)"
    instruct: "남의 말을 인용하듯 또박또박, '단연 최고'에 힘을 준다."
    scene: {kind: doc, tag: 와이콤비네이터 대표의 평가, meta: "한국경제 · 2026-10-05 보도", title: "\"내가 본 AI 브라우저 중 최고\"", lines: ["웹과 로그인 정보에 사람처럼 접근하는 능력에서", "어사이드는 {{단연 최고}}다", "스타트업이 {{큰 회사들보다 앞설 수 있다}}는 게 놀랍다"]}
    sync: {at: [0, "단연", "최고다."]}

  - say: "지난 6월 23일에 나왔는데, 광고도 없이 2주 만에 2만 명이 모였다고 합니다."
    source: "한국경제 2026-10-05"
    scene: {kind: number, tag: 입소문, label: 출시 2주 만에, to: 20000, unit: 명, sub: "광고 없이 [[입소문]]만으로"}
    sync: {at: [0, "2만", "모였다고"]}

  - say: "그래서 오늘은 어사이드가 무엇인지부터, 설치, 첫 심부름, 활용법, 안전하게 쓰는 법, 요금까지 아주 쉽게 알려 드릴게요."
    scene:
      kind: agenda
      items:
        - {slash: /what, text: "어사이드가 뭐예요?"}
        - {slash: /install, text: 설치하기}
        - {slash: /start, text: 첫 심부름 시키기}
        - {slash: /use, text: 이렇게 써요}
        - {slash: /safe, text: 안전하게 쓰기}
        - {slash: /price, text: 요금}
    sync: {at: [0, "무엇인지부터,", "설치,", "첫", "활용법,", "안전하게", "요금까지"]}

  # ───────────── PART 01 /what
  - say: "첫 번째, 어사이드가 도대체 뭔지부터 볼게요."
    chapter: "PART 01 · 어사이드가 뭐예요?"
    scene: {kind: part, num: PART 01, slash: /what, title: "어사이드가 뭐예요?"}
    sync: {at: [0, "어사이드가", "뭔지부터"]}

  - say: "먼저 브라우저는, 크롬이나 엣지처럼 인터넷을 보는 창을 말해요. 어사이드도 그런 인터넷 창이에요."
    instruct: "어려운 말을 풀어 주듯 다정하고 천천히."
    scene: {kind: icons, tag: 쉬운 말로, label: "브라우저 = [[인터넷 보는 창]]", items: [{glyph: "◎", name: 크롬}, {glyph: "◐", name: 엣지}, {glyph: "★", name: 어사이드, color: "#7CD1BB"}]}
    sync: {at: [0, "크롬이나", "엣지처럼", "어사이드도"]}

  - say: "다른 점은, 그 창 안에 똑똑한 AI 비서가 같이 산다는 거예요."
    scene: {kind: hook, small: "다른 점 하나", line1: "인터넷 창 안에", line2: "[[AI 비서]]가 산다"}
    sync: {at: [0, "창", "AI"]}

  - say: "챗GPT 같은 AI는 방법을 말로 알려 주기만 하죠. 어사이드는 직접 사이트에 들어가서, 사람처럼 누르고 입력해 줘요."
    scene:
      kind: flow
      tag: 무엇이 다를까
      label: 알려 주는 AI → [[해 주는]] AI
      nodes:
        - {glyph: "💬", name: 보통 AI, sub: 방법만 알려 줌}
        - {glyph: "🖱", name: 어사이드, sub: 직접 누르고 입력}
        - {glyph: "✓", name: 일이 끝남, sub: 결과만 받기}
    sync: {at: [0, "알려", "직접", "입력해"]}

  - say: "게다가 내가 이미 로그인해 둔 사이트를 그대로 써요. 따로 연결하거나 설정할 게 없어요."
    source: "docs.aside.com · aside.com/download"
    scene: {kind: list, num: "✓", title: 설정이 필요 없는 이유, items: ["내가 [[로그인해 둔]] 사이트를 그대로", "메일 · 쇼핑 · 회사 사이트까지", "따로 연결할 것 [[없음]]"]}
    sync: {at: [0, "로그인해", "그대로", "따로"]}

  - say: "자주 쓰는 사이트와 메뉴도 기억해요. 그래서 매번 길게 설명할 필요 없이, 해 줘 한마디면 됩니다."
    source: "aside.com · 한국경제 2026-10-05"
    scene: {kind: chat, tag: "기억 · 예시", label: "매번 설명 안 해도\n[[알아서]]", app: 어사이드, messages: [{who: me, text: "어제 보던 그 엑셀, 다시 열어 줘"}, {who: ai, text: "어제 오후에 열었던 '주간 보고' 파일을 열었어요."}]}
    sync: {at: [0, "기억해요.", "해"]}

  - say: "기억한 내용은 내 컴퓨터 안에만 남고, 다른 곳에 보내지 않는다고 회사는 설명합니다."
    source: "aside.com"
    scene: {kind: warn, tag: 내 정보는, title: 기억은 내 컴퓨터에만, lines: ["기억·작업 내용은 [[내 기기]]에", "AI 회사에도 보내지 않음 (회사 설명)"]}
    sync: {at: [0, "컴퓨터", "보내지"]}

  - say: "비밀번호도 걱정 마세요. 로그인 칸에 자동으로 채워 줄 뿐, AI에게는 비밀번호를 보여 주지 않아요."
    source: "aside.com · docs.aside.com/help/security"
    scene: {kind: flow, tag: 비밀번호, label: "AI는 비밀번호를 [[모른다]]", nodes: [{glyph: "🔒", name: 비밀번호 금고}, {glyph: "▭", name: 로그인 칸에 자동 입력}, {glyph: "🙈", name: AI에겐 안 보임}]}
    sync: {at: [0, "로그인", "자동으로", "보여"]}

  - say: "그리고 결제나 글 올리기, 메시지 보내기처럼 중요한 일은 꼭 나에게 먼저 물어봐요."
    source: "aside.com"
    instruct: "안심시키듯 차분하게, '꼭'에 힘을 준다."
    scene: {kind: list, num: "?", title: 꼭 먼저 물어보는 일, items: ["💳 결제", "✍ 글 올리기", "✉ 메시지 보내기"]}
    sync: {at: [0, "결제나", "글", "메시지"]}

  - say: "실력은 어떨까요? 회사가 발표한 시험 성적으로는, 인터넷 심부름 시험 세 가지에서 모두 1위를 했다고 해요."
    source: "aside.com (회사 발표 성적)"
    scene: {kind: number, tag: 시험 성적, label: "인터넷 심부름 시험", to: 99.0, unit: "%", sub: "시험 3가지 모두 [[1위]] · 회사 발표"}
    sync: {at: [0, "성적으로는,", "1위를"]}

  - say: "정리하면, 어사이드는 내가 로그인한 사이트를 직접 다루고, 나를 기억하고, 중요한 일은 꼭 물어보는 인터넷 창 속 AI 비서예요."
    instruct: "차분하게 정리하듯, 핵심 낱말을 또박또박."
    scene: {kind: recap, slash: /what, items: [{k: 직접, v: "사이트에 들어가 [[누르고 입력]]"}, {k: 기억, v: "자주 쓰는 곳을 내 컴퓨터에"}, {k: 안전, v: "비밀번호 숨김 · 중요한 일은 확인"}]}
    sync: {at: [0, "직접", "기억하고,", "물어보는"]}

  # ───────────── PART 02 /install
  - say: "두 번째, 설치하는 법이에요. 생각보다 훨씬 쉬워요."
    chapter: "PART 02 · 설치하기"
    scene: {kind: part, num: PART 02, slash: /install, title: 설치하기}
    sync: {at: [0, "설치하는", "쉬워요."]}

  - say: "aside.com에 들어가서 다운로드를 누르세요. 맥과 윈도우 둘 다 있어요."
    source: "aside.com/download"
    scene: {kind: terminal, tag: 내려받기, title: 인터넷 주소창, lines: ["$ aside.com", "# 오른쪽 위 [Download] 누르기", "# 맥 · 윈도우 중 내 컴퓨터 고르기"]}
    sync: {at: [0, "다운로드를", "맥과"]}

  - say: "윈도우는 받은 파일을 열고 안내대로 다음만 누르면 되고, 맥은 받은 파일을 응용 프로그램 폴더로 끌어다 놓으면 돼요."
    source: "aside.com/download"
    scene: {kind: list, num: "02", title: 설치는 이렇게, items: ["윈도우: 파일 열고 [[다음]]만 누르기", "맥: 응용 프로그램 폴더로 [[끌어다 놓기]]", "다 되면 어사이드 열기"]}
    sync: {at: [0, "윈도우는", "맥은", "놓으면"]}

  - say: "처음 열면 가입을 하고, 쓰던 브라우저의 방문 기록과 즐겨찾기를 그대로 가져올 수 있어요. 로그인해 둔 상태도 같이 옮겨 와요."
    source: "docs.aside.com/help/get-started"
    scene: {kind: flow, tag: 처음 켜면, label: "쓰던 걸 [[그대로]] 가져오기", nodes: [{glyph: "①", name: 가입하기}, {glyph: "②", name: 기록·즐겨찾기 가져오기}, {glyph: "③", name: 로그인 상태도 함께}]}
    sync: {at: [0, "가입을", "방문", "로그인해"]}

  - say: "다음은 비밀번호 금고를 켜는 단계예요. 여기 저장한 비밀번호로, AI가 로그인까지 대신 해 줍니다."
    source: "docs.aside.com/help/get-started"
    scene: {kind: hook, small: "설치 마지막 단계", line1: "비밀번호 금고 켜기", line2: "로그인까지 [[대신]]"}
    sync: {at: [0, "비밀번호", "로그인까지"]}

  - say: "AI는 기본으로 들어 있는 걸 써도 되고, 이미 쓰는 챗GPT나 클로드 유료 구독을 연결해서 쓸 수도 있어요."
    source: "docs.aside.com/help/ai"
