  - say: "이건 매님으로 만든 공식과 그래프 장면이에요."
    scene: {kind: clip, video: ../output/_motion_test/manim_test.mp4, fit: contain}
  - say: "이건 하이퍼프레임즈로 만든 글자 장면이에요."
