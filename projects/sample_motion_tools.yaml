# 시험용(배포 안 함): 새 도구로 만든 클립을 기존 neon 파이프라인에 끼우는지 확인 — 2026-11-07
slug: sample_motion_tools
name: 도구시험_클립장면
style: neon
format: longform
brand: 뉴럴서랍
look: {bg: "#10050E", acc: "#FF4FB0", sky: rain, frame: none, cam: zoom, enter: slide, bright: 0.45}
title: "도구 시험"
voice: {speed: 1.2}
numbers_ok: ["0", "1", "2", "3", "5", "200", "444.6", "444"]
scenes:
