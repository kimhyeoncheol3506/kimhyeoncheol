scenes:
  # ───────────── 후킹
  - say: "영상을 하나 만들고, 배경을 숲으로 바꿔 줘. 이번엔 성으로. 말 한마디에 배경만 싹 바뀌어요. 이게 진짜일까요?"
    source: "구글 공식 블로그(2026-11-05) 예시"
    instruct: "궁금증을 확 끌어올리듯 힘 있게, 마지막 질문은 끝을 올려."
    scene: {kind: clip, video: ../output/_clips/omni/OmniTurns.mp4}

  - say: "구글이 11월 5일 내놓은 영상 AI, 제미나이 옴니 1.2 이야기예요. 이제 한 번에 15초까지 만들어요."
    source: "구글 공식 블로그(2026-11-05)"
    instruct: "놀라운 소식을 전하듯, 숫자는 또박또박."
    scene: {kind: number, tag: 옴니 1.2, label: "한 번에 만드는 길이", to: 15, unit: 초, sub: "1.1은 10초 · [[이제 15초]]"}
    sync: {at: [0, "11월", "15초까지"]}

  - say: "게다가 가격은 30%나 내렸어요. 더 길어졌는데 더 싸졌다니, 뭔가 이상하지 않나요?"
    source: "구글 공식 블로그 · Gemini API 가격표"
    instruct: "의아한 듯, 질문은 끝을 올려."
    scene: {kind: hook, small: "게다가", line1: "더 길어졌는데", line2: "[[30% 더 싸졌다?]]", punch: true}
    sync: {at: [0, "30%나", "더"], beats: ["뭔가"]}

  - say: "그런데 어떤 유튜버는 열 번 대결을 붙이고, 제목에 그런데 1.1이 이겼다고 달았어요. 왜 그랬을까요?"
    source: "AnassKartit 영상 제목(결과 내용은 확인 못 함)"
    scene: {kind: hook, small: "그런데", line1: "10라운드 대결", line2: "[[\"1.1이 이겼다?\"]]", fx: stamp}
    sync: {at: [0, "열", "제목에", "왜"]}

  - say: "옴니가 뭔지부터, 새로 생긴 기능, 쓰는 곳, 가격, 한계까지. 1부터 100까지 한 번에 정리해 볼게요."
    instruct: "영화 예고편처럼 낮고 힘 있게."
    scene: {kind: intro, kicker: "말로 만들고 말로 고치는 영상 AI", title: "Gemini Omni 1.2", sub: "제미나이 옴니 1.2 · [[1부터 100까지]]"}
    sync: {at: [0, "새로", "가격,", "1부터"]}

  - say: "오늘 순서는요, 옴니의 정체, 1.2에서 달라진 점, 할 수 있는 일, 쓰는 곳과 가격, 그리고 한계예요."
    scene:
      kind: agenda
      items:
        - {slash: /what, text: "옴니가 뭐예요?"}
        - {slash: /new, text: "1.2 달라진 7가지"}
        - {slash: /use, text: "할 수 있는 일 10가지"}
        - {slash: /where, text: "어디서 · 얼마에"}
        - {slash: /limit, text: "한계와 고르는 법"}
    sync: {at: [0, "정체,", "달라진", "할", "쓰는", "한계예요."]}

  # ───────────── PART 01 /what
  - say: "첫 번째, 옴니가 도대체 뭔지부터 볼게요."
    chapter: "PART 01 · 옴니가 뭐예요?"
    scene: {kind: part, num: PART 01, slash: /what, title: "옴니가 뭐예요?"}
    sync: {at: [0, "옴니가"]}

  - say: "구글은 옴니를 이렇게 소개해요. 무엇이든 넣으면 무엇이든 만든다. 그 시작이 영상이라고요."
    source: "구글 공식 블로그(2026-05-19)"
    scene: {kind: doc, tag: 구글 발표, meta: "2026년 5월 · 구글 I/O", title: "\"무엇이든 넣으면 무엇이든\"", lines: ["글 · 사진 · 영상 · 소리를 {{섞어서}}", "{{영상}}부터 시작", "이미지 · 오디오 출력은 {{나중에}}"]}
    sync: {at: [0, "무엇이든", "시작이"]}

  - say: "비유하면 사진을 말로 고치던 나노 바나나의 영상 버전이에요. 구글도 똑같이 설명해요."
    source: "구글 딥마인드 옴니 소개"
    instruct: "다정하고 부드럽게."
    scene: {kind: flow, tag: 비유하면, label: "영상판 [[나노 바나나]]", nodes: [{glyph: "🍌", name: 나노 바나나, sub: 사진을 말로}, {glyph: "→", name: 이번엔, sub: 한 단계 더}, {glyph: "🎬", name: 옴니, sub: 영상을 말로}]}
    sync: {at: [0, "사진을", "영상"]}

  - say: "글만 넣어도 되고, 사진, 짧은 영상, 목소리까지 섞어 넣으면 하나의 영상으로 엮어 줘요. 소리도 같이 나와요."
    source: "구글 공식 블로그 · Gemini API 옴니 가이드"
    scene: {kind: icons, tag: 넣을 수 있는 것, label: "섞어 넣으면 [[하나의 영상]]", items: [{glyph: "✍", name: 글}, {glyph: "🖼", name: "사진 · 영상"}, {glyph: "🎙", name: "목소리", color: "#FFC23D"}]}
    sync: {at: [0, "글만", "섞어", "소리도"]}

  - say: "버전 흐름도 볼게요. 5월에 처음 나왔고, 8월에 1.1, 그리고 11월 5일에 1.2가 나왔어요."
    source: "구글 블로그 · Gemini API 변경 기록"
    instruct: "날짜를 하나씩 또박또박."
    scene: {kind: flow, tag: 버전 흐름, label: "반년 만에 [[세 번째]]", nodes: [{glyph: "🌱", name: 옴니 플래시, sub: 5월 19일}, {glyph: "🌿", name: 1.1, sub: 8월 27일}, {glyph: "🌳", name: 1.2, sub: 11월 5일}]}
    sync: {at: [0, "5월에", "8월에", "11월"]}

  - say: "화질은 360p부터 4K까지 골라요. 다만 1080p와 4K는 작게 만든 걸 키우는 방식이에요."
    source: "Gemini API 변경 기록(8월 27일)"
    scene: {kind: list, num: "4", title: 고를 수 있는 화질, items: ["360p · 720p(기본)", "1080p · 4K", "※ 큰 화질은 [[키워서]] 만듦"]}
    sync: {at: [0, "360p부터", "1080p와"]}

  - say: "구글은 옴니를 생각하는 힘과 만드는 힘이 만난 모델이래요. 다음에 무슨 일이 일어날지 따지고 그린대요."
    source: "구글 공식 블로그(2026-05-19)"
    scene: {kind: flow, tag: 옴니의 비밀, label: "생각하고 [[그린다]]", nodes: [{glyph: "🧠", name: 생각하는 힘, sub: 제미나이}, {glyph: "＋", name: 만나서, sub: 하나로}, {glyph: "🎨", name: 만드는 힘, sub: 영상}]}
