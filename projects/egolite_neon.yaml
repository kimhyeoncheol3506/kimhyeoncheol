# 참고 영상(현철님 스크린샷 2026-11-04, 'ego lite' 검색 결과 7개):
#   코난쌤 mbkMc1BpL6c 7:44 · AI 직원 연구소 z8ZR-OUG2HU 9:04 · 데키랩 1hufs1Mlmns 8:26(유료광고 포함) · AI 겸임교수 이종범 7VUfC_bf_IE 13:00 ·
#   허드의 AI딸깍 b0zTO8jxFfA 16:01 · 코드팩토리 TxnVTk72a3E 5:54 · Aiden의 친절한 AI 3Eou-uRhOGY 11:42
#   자막을 읽은 것: 코난쌤·데키랩·이종범·Aiden (나머지 셋은 유튜브 봇 확인으로 막힘 → 제목·썸네일 구도만 참고).
#   가져온 것(문장은 새로 씀): Aiden '판단은 AI, 운전은 에고 라이트(자동차)' 비유·오른쪽 위 숫자=작업방·쇼핑몰 3곳 동시·영수증 라벨·
#     '하지 말 것' 적기·권한 무시 모드 끄기·마지막 버튼은 직접 / 코난쌤 4배(로그인 조건 차이 솔직히)·키체인 암호 창·마지막 화면 옵션 끄기·
#     내 앞 화면 안 건드림 / 데키랩 테이크오버·리턴, 블로그 비공개 발행 시간 비교(광고 포함 표시) / 이종범 '작성만 해 줘'→발행 사고, 에고는 임시 저장.
# 사실은 1차 자료: lite.ego.app(벤치마크 숫자), github.com/citrolabs/ego-lite README(맥·윈도우, 무료, 스페이스, ego-browser, 크롬 가져오기, 데이터는 내 기기).
