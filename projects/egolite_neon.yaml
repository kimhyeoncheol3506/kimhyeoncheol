scenes:
  # ───────────── 콜드 오픈(후킹)
  - say: "AI한테 인터넷 일을 시켰더니, 내 마우스를 뺏어 가서 아무것도 못 한 적 있으세요?"
    instruct: "공감하듯 말을 걸며, 질문 끝을 확 올린다."
    scene: {kind: hook, small: "혹시 이런 경험?", line1: "AI가 일하는 동안", line2: "[[나는 멈춤]]?"}
    sync: {at: [0, "인터넷", "마우스를"], beats: ["아무것도"]}

  - say: "로그인해 달라, 이거 눌러도 되냐, 계속 물어보고요. 결국 제가 직접 하는 게 더 빨랐죠."
    instruct: "답답했던 기억을 떠올리듯, 살짝 한숨 섞어."
    scene: {kind: chat, tag: "그동안의 AI · 예시", label: "결국 내가\n[[다시 로그인]]", app: AI 비서, messages: [{who: ai, text: "로그인이 필요해요. 비밀번호를 입력해 주시겠어요?"}, {who: ai, text: "이 버튼을 눌러도 될까요? 화면을 잠시 쓸게요."}]}
    sync: {at: [0, "로그인해", "눌러도"], beats: ["결국"]}

  - say: "그런데 이제는 달라요. AI는 자기 방에서 따로 일하고, 저는 제 일을 그대로 하면 돼요."
    instruct: "반전을 알리듯 힘 있게, '그대로'에 힘을 준다."
    scene: {kind: hook, small: "그런데 이제는", line1: "AI는 자기 방에서", line2: "[[나는 내 일 그대로]]", punch: true}
    sync: {at: [0, "AI는", "저는"], beats: ["달라요."]}

  - say: "AI 에이전트 전용 브라우저, 에고 라이트입니다."
    instruct: "영화 예고편처럼 낮고 힘 있게, 이름을 또박또박."
    scene: {kind: intro, kicker: "AI 에이전트 전용 브라우저", title: "ego lite", sub: "내 AI에게 [[브라우저]]를 하나 따로"}
    sync: {at: [0, "브라우저,", "에고"]}

  - say: "게다가 이 브라우저는 무료예요. 맥과 윈도우 둘 다 받을 수 있어요."
    source: "github.com/citrolabs/ego-lite"
    scene: {kind: hook, small: "가격은?", line1: "브라우저는", line2: "[[0원]]", punch: true}
    sync: {at: [0, "브라우저는", "무료예요."], beats: ["맥과", "윈도우"]}

  - say: "회사가 직접 잰 시험에서는, 복잡한 인터넷 일을 다른 도구보다 훨씬 빨리 끝냈다고 해요."
    source: "lite.ego.app (회사 발표 · Real-World Bench 31개 작업)"
    scene:
      kind: bars
      label: "복잡한 웹 일 31개 · 평균 걸린 시간(초)"
      bars:
        - {label: ego lite, value: 398, show: "398초"}
        - {label: chrome-devtools-cli, value: 587, show: "587초"}
        - {label: agent-browser, value: 605, show: "605초"}
        - {label: playwright-cli, value: 648, show: "648초"}
      sub: "짧을수록 빠름 · 회사 발표"
    sync: {at: [0, "직접", "복잡한", "다른", "빨리"]}

  - say: "오늘은 AI가 처음인 분도, 이 영상 하나로 첫 심부름까지 해 보실 수 있게 아주 쉽게 알려 드릴게요."
    instruct: "든든하게 약속하듯 다정하고 확신 있게."
    scene: {kind: hook, small: "오늘의 약속", line1: "AI 초보도", line2: "[[오늘 첫 심부름]]"}
    sync: {at: [0, "처음인", "첫"], beats: ["쉽게"]}

  - say: "순서는 이래요. 무엇인지, 왜 좋은지, 설치, 첫 심부름, 활용법, 그리고 안전하게 쓰는 법까지요."
    scene:
      kind: agenda
      items:
        - {slash: /what, text: "에고 라이트가 뭐예요?"}
        - {slash: /why, text: "왜 초보에게 좋을까"}
        - {slash: /install, text: 설치하기}
        - {slash: /start, text: 첫 심부름}
        - {slash: /use, text: 이렇게 써요}
        - {slash: /safe, text: 안전하게 쓰기}
    sync: {at: [0, "무엇인지,", "왜", "설치,", "첫", "활용법,", "안전하게"]}

  # ───────────── PART 01 /what
  - say: "첫 번째, 에고 라이트가 도대체 뭔지부터 볼게요."
    chapter: "PART 01 · 에고 라이트가 뭐예요?"
    scene: {kind: part, num: PART 01, slash: /what, title: "에고 라이트가 뭐예요?"}
    sync: {at: [0, "에고", "뭔지부터"]}

  - say: "에고 라이트는 크롬처럼 인터넷을 보는 창이에요. 겉모습도 크롬이랑 거의 똑같아요."
    instruct: "어려운 말을 풀어 주듯 다정하고 천천히."
    source: "lite.ego.app"
    scene: {kind: icons, tag: 쉬운 말로, label: "생김새는 [[크롬과 거의 같아요]]", items: [{glyph: "◎", name: 크롬}, {glyph: "=", name: 거의 같음}, {glyph: "●", name: 에고 라이트, color: "#7CD1BB"}]}
    sync: {at: [0, "크롬처럼", "겉모습도", "똑같아요."]}

  - say: "다른 점은 딱 하나예요. AI가 운전하기 좋게 만들어졌어요. 생각은 AI가 하고, 클릭과 입력은 에고 라이트가 해요."
    scene:
      kind: flow
      tag: 무엇이 다를까
      label: "생각은 AI · [[손발은 에고 라이트]]"
      nodes:
        - {glyph: "🧠", name: AI 에이전트, sub: 생각하고 판단}
        - {glyph: "🖱", name: 에고 라이트, sub: 클릭하고 입력}
        - {glyph: "✓", name: 일이 끝남, sub: 결과만 받기}
    sync: {at: [0, "운전하기", "생각은", "클릭과"], beats: ["하나예요."]}

  - say: "쉽게 말하면, AI 운전사에게 운전하기 좋은 자동차를 한 대 따로 주는 거예요."
    instruct: "비유를 들려주듯 다정하고 부드럽게."
    scene: {kind: hook, small: "비유하면", line1: "AI 운전사에게", line2: "[[전용 자동차]] 한 대"}
    sync: {at: [0, "AI", "자동차를"], beats: ["따로"]}

  - say: "지난번에 소개한 어사이드는 AI가 안에 들어 있는 브라우저였죠. 에고 라이트는 내가 쓰는 AI가 와서 쓰는 브라우저예요."
