    sync: {at: [0, "부르면", "옆자리"]}

  - say: "누구를 위해 만들었을까요? 할 일이 너무 많은 직장인, 그리고 작은 가게 사장님들이에요."
    source: "앤트로픽 발표 글"
    scene: {kind: icons, tag: 이런 분께, label: "챙길 일이 [[너무 많은]] 사람", items: [{glyph: "💼", name: 바쁜 직장인}, {glyph: "🏪", name: 작은 가게 사장님}, {glyph: "📋", name: 1인 사업자}]}
    sync: {at: [0, "직장인,", "사장님들이에요."]}

  - say: "말 거는 법도 쉬워요. 동료한테 문자 보내듯 글이나 음성으로 보내면, 알아서 일을 시작해요."
    source: "제품 페이지 · 도움말"
    scene:
      kind: chat
      tag: "듀엣 앱 · 예시"
      label: "문자 보내듯\n[[그냥 말하기]]"
      app: Duet
      messages:
        - {who: me, text: "오늘 두 시 미팅 전에 그 회사 정리 좀 해 줘"}
        - {who: ai, text: "정리해서 할 일 탭에 올려 둘게요. 끝나면 알려 드릴게요."}
    sync: {at: [0, "동료한테", "알아서"]}

  - say: "새로 배울 것도 적어요. 클로드에서 쓰던 기억과 스킬, 연결한 앱을 첫 메시지부터 그대로 써요."
    source: "제품 페이지 · 발표 글"
    scene: {kind: list, num: "3", title: "그대로 이어받는 것", items: ["[[기억]] · 예전에 한 말", "스킬", "연결한 앱(커넥터)"]}
    sync: {at: [0, "기억과", "스킬,", "연결한"]}

