      kind: agenda
      items:
        - {slash: /what, text: "듀엣이 뭐예요?"}
        - {slash: /who, text: "누가 · 얼마에 쓰나"}
        - {slash: /how, text: "안에서 어떻게 일하나"}
        - {slash: /use, text: "할 수 있는 일"}
        - {slash: /safe, text: "안전장치 · 금지선"}
        - {slash: /limit, text: "아직 안 되는 것"}
    sync: {at: [0, "정체,", "얼마에,", "일하는", "할", "안전장치,", "한계예요."]}

  # ───────────── PART 01 /what
  - say: "첫 번째, 듀엣이 도대체 뭔지부터 볼게요."
    chapter: "PART 01 · 듀엣이 뭐예요?"
