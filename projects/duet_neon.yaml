  - say: "앤트로픽이 내놓은 클로드 듀엣이에요. 6천 개가 넘는 커넥터와 플러그인으로 내 앱들과 이어져요."
    source: "클로드 듀엣 제품 페이지"
    instruct: "놀라운 소식을 전하듯, 숫자는 또박또박."
