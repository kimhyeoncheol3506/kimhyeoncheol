    sync: {at: [0, "보통", "듀엣은", "먼저"]}

  - say: "앤트로픽은 듀엣을 먼저 움직이는 에이전트라고 불러요. 10월 21일, 리서치 프리뷰로 처음 공개했죠."
    source: "앤트로픽 발표 글(2026-10-21)"
    scene: {kind: doc, tag: 앤트로픽 발표, meta: "2026년 10월 21일", title: "\"먼저 움직이는 에이전트\"", lines: ["필요한 걸 {{먼저}} 알려 주고", "자리를 비워도 {{계속}} 일하고", "대신 하기 전엔 {{꼭 확인}}"]}
    sync: {at: [0, "먼저", "10월", "리서치"]}

