    scene: {kind: hook, small: "결국", line1: "맡길 일 ↔ 내가 쥘 일", line2: "[[선은 내가 긋기]]"}
    sync: {at: [0, "맡길", "선을"]}

  - say: "도움이 되셨다면 구독과 좋아요 부탁드려요. 공식 발표와 도움말 주소는 설명란에 모두 넣어 둘게요."
    instruct: "밝고 경쾌하게, 마지막 문장은 웃으며."
    hold: 8
    scene: {kind: cta, title: "도움이 됐다면 [[구독과 좋아요]]", button: 구독, next: "공식 발표 · 도움말은 설명란에 · 뉴럴서랍"}
    sync: {at: [0, "구독과", "설명란에"]}
