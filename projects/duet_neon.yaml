    sync: {at: [0, "듀엣이에요.", "6천", "이어져요."]}

  - say: "그런데 듀엣에겐 내가 허락해도 절대 안 하는 일이 있어요. 그게 뭘까요?"
    instruct: "낮게 깔았다가 질문은 끝을 올려."
    scene: {kind: hook, small: "그런데", line1: "내가 허락해도", line2: "[[절대 안 하는 일]]", punch: true}
    sync: {at: [0, "허락해도", "절대"], beats: ["뭘까요?"]}

  - say: "게다가 지금은 미국에서, 대기 명단으로만 열려 있어요. 그래도 미리 알아 둘 이유가 충분해요."
    instruct: "차분하게, 뒷문장은 힘 있게."
    scene: {kind: hook, small: "게다가", line1: "지금은 [[미국만]]", line2: "그래도 알아 둘 이유", fx: stamp}
    sync: {at: [0, "미국에서,", "그래도"]}

  - say: "듀엣이 뭔지부터 누가 쓰는지, 요금, 할 수 있는 일, 금지선, 한계까지. 십 분에 정리해 볼게요."
    instruct: "영화 예고편처럼 낮고 힘 있게."
    scene: {kind: intro, kicker: "먼저 말 거는 AI 비서", title: "Claude Duet", sub: "클로드 듀엣 · [[총정리]]"}
    sync: {at: [0, "누가", "요금,", "금지선,"]}

  - say: "오늘 순서는요, 정체, 누가 얼마에, 일하는 방식, 할 수 있는 일, 안전장치, 그리고 한계예요."
