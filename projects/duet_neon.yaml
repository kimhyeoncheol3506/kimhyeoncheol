scenes:
  # ───────────── 후킹: 새 도구 클립으로 콜드 오픈
  - say: "아침에 폰을 켰더니 AI가 먼저 말을 걸어요. 오늘 꼭 챙길 일은 두 가지예요. 이런 비서, 믿고 맡겨도 될까요?"
    instruct: "궁금증을 확 끌어올리듯 힘 있게, 마지막 질문은 끝을 올려."
