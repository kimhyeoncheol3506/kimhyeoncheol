    scene: {kind: split, left: {glyph: "👓", title: AI 안경이 찍으면, lines: ["숨은 글씨에", "[[AI가 속음]]"], color: "#93C5FD"}, right: {glyph: "🖨", title: 막는 쪽은, lines: ["시험지만", "[[잘 인쇄하면]]"], color: "#E879F9"}}
