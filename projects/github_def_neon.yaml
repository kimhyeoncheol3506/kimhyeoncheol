scenes:
  # ───────────── 후킹
  - say: "논문이나 회사 보고서, 이런 파일 이름 만들어 본 적 있으시죠? 최종, 진짜 최종, 진짜진짜 최종."
    instruct: "공감하듯 웃음을 살짝 머금고, 파일 이름은 하나씩 리듬 있게."
    scene: {kind: files, label: "이런 파일, [[익숙하죠?]]", files: ["보고서_최종.hwp", "보고서_진짜최종.hwp", "보고서_진짜최종_수정.hwp", "보고서_진짜진짜최종.hwp"], clean: "보고서.hwp + 바뀐 기록"}
    sync: {at: [0, "논문이나", "이런", "최종,", "진짜"], beats: ["있으시죠?", "진짜진짜"]}      # 넷째 파일 뒤 1.2초에 한 장으로(장면 끝에 몰리지 않게)
    # 마지막 at = 파일이 한 장으로 빨려 드는 순간

  - say: "그런데 이 파일들, 뭐가 바뀌었는지 기억나세요? 대부분은 기억이 안 나요."
    instruct: "질문 끝을 올렸다가, 뒷문장은 웃으며 단정하게."
    scene: {kind: hook, small: "솔직히", line1: "뭐가 바뀌었는지", line2: "[[기억 안 나요]]", fx: glitch}
    sync: {at: [0, "파일들,", "대부분은"], beats: ["기억나세요?"]}

  - say: "이 문제를 깔끔하게 해결해 주는 게 바로 깃, 그리고 깃허브예요."
    instruct: "정답을 공개하듯 힘 있게, '깃허브'에 힘을 준다."
    scene: {kind: hook, small: "이걸 해결하는 게", line1: "바로", line2: "[[깃 & 깃허브]]", fx: stamp}
    sync: {at: [0, "깔끔하게", "깃,"]}

  - say: "처음 듣는 분도 5분이면 이해하는, 깃허브 이야기 시작할게요."
    instruct: "영화 예고편처럼 낮고 힘 있게."
    scene: {kind: intro, kicker: "처음 듣는 분도 5분이면", title: "GitHub", sub: "깃허브가 [[도대체 뭔데?]]"}
    sync: {at: [0, "5분이면", "깃허브"]}

  - say: "깃허브를 쓰는 개발자는 무려 2억 2,500만 명이 넘어요. 지난주에 깃허브가 발표한 최신 숫자예요."
    source: "GitHub Octoverse 2026 (2026-10-28)"
    instruct: "놀라운 숫자를 알려 주듯, 숫자를 또박또박 힘 있게."
    scene: {kind: hook, small: "깃허브를 쓰는 개발자", line1: "무려", line2: "[[2억 2,500만 명+]]", fx: stamp}
    sync: {at: [0, "개발자는", "2억"], beats: ["지난주에", "최신"]}

  - say: "순서는 이래요. 깃이 뭔지, 깃허브가 뭔지, 둘의 차이, 꼭 알아야 할 단어 세 개, 그리고 왜 지금 알아야 하는지까지요."
    scene:
      kind: agenda
      items:
        - {slash: /git, text: "깃이 뭐예요?"}
        - {slash: /github, text: "깃허브가 뭐예요?"}
        - {slash: /vs, text: 둘의 차이}
        - {slash: /words, text: 꼭 알 단어 3개}
        - {slash: /why, text: 왜 지금 알아야 할까}
    sync: {at: [0, "깃이", "깃허브가", "차이,", "단어", "왜"]}

  # ───────────── PART 01 /git
  - say: "첫 번째, 먼저 깃부터 알아볼게요."
    chapter: "PART 01 · 깃이 뭐예요?"
    scene: {kind: part, num: PART 01, slash: /git, title: "깃이 뭐예요?"}
    sync: {at: [0, "깃부터"], beats: ["먼저"]}

  - say: "깃은 파일이 바뀐 내용을 기록해 두는 프로그램이에요. 저장할 때마다 언제, 무엇을 바꿨는지 한 줄씩 남겨요."
    source: "GitHub Docs"
    instruct: "어려운 말을 풀어 주듯 다정하고 천천히."
    scene: {kind: timeline, label: "저장할 때마다 [[기록 한 줄]]", points: [{label: 처음, sub: 뼈대 쓰기}, {label: 수정 1, sub: 표 추가}, {label: 수정 2, sub: 오타 고침}, {label: 완성, sub: 제출}]}
    sync: {at: [0, "바뀐", "기록해", "저장할", "무엇을", "한"]}

  - say: "그래서 깃을 한마디로 하면, 버전 관리 도구예요."
    instruct: "정의를 또박또박, '버전 관리'에 힘을 준다."
    scene: {kind: hook, small: "한 줄 정의", line1: "깃 =", line2: "버전 관리 도구", fx: type}
    sync: {at: [0, "깃을", "버전"]}

  - say: "덕분에 파일을 여러 개 만들 필요가 없어요. 파일은 하나, 기록은 여러 개. 그리고 언제든 예전으로 돌아갈 수 있어요."
    scene:
      kind: flow
      tag: 깃이 좋은 이유
      label: "파일은 하나 · [[기록은 여러 개]]"
      nodes:
        - {glyph: "▣", name: 파일은 하나, sub: 이름 고민 끝}
        - {glyph: "≡", name: 기록은 여러 개, sub: 언제 · 무엇을}
        - {glyph: "↺", name: 언제든 되돌리기, sub: 예전 상태로}
    sync: {at: [0, "파일은", "기록은", "언제든"], beats: ["필요가"]}

  - say: "깃은 2005년에 리누스 토르발스라는 개발자가 만들었어요. 무료이고, 누구나 쓸 수 있는 오픈 소스예요."
    source: "Wikipedia 'Git' · GitHub Docs"
    scene: {kind: icons, tag: 깃의 시작, label: "누구나 쓰는 [[무료 도구]]", items: [{glyph: "05", name: 2005년 탄생}, {glyph: "LT", name: 리누스 토르발스}, {glyph: "0원", name: 무료 · 오픈 소스, color: "#7CD1BB"}]}
    sync: {at: [0, "2005년에", "리누스", "무료이고,"], beats: ["오픈"]}

  - say: "정리하면, 깃은 내 컴퓨터 안에서 파일이 바뀐 기록을 남겨 주는 버전 관리 도구예요."
    instruct: "차분하게 정리하듯 또박또박."
    scene: {kind: recap, slash: /git, items: [{k: 하는 일, v: "바뀐 내용 [[기록]]"}, {k: 장점, v: "언제든 되돌리기"}, {k: 어디서, v: "내 컴퓨터 안"}]}
    sync: {at: [0, "내", "기록을", "버전"]}

  # ───────────── PART 02 /github
  - say: "두 번째, 그럼 깃허브는 뭘까요?"
    chapter: "PART 02 · 깃허브가 뭐예요?"
    instruct: "궁금증을 끌어올리듯, 질문 끝을 올린다."
    scene: {kind: part, num: PART 02, slash: /github, title: "깃허브가 뭐예요?"}
    sync: {at: [0, "깃허브는"], beats: ["두"]}

  - say: "깃허브는 깃으로 남긴 기록을 인터넷에 올려 두는 곳이에요. 쉽게 말하면, 개발자용 구글 드라이브예요."
    source: "GitHub Docs"
    instruct: "비유를 들려주듯 밝게, '구글 드라이브'에 힘을 준다."
    scene: {kind: hook, small: "쉽게 말하면", line1: "깃허브 =", line2: "[[개발자용 구글 드라이브]]", fx: stamp}
    sync: {at: [0, "깃허브는", "개발자용"], beats: ["인터넷에"]}

  - say: "내 컴퓨터에서 깃으로 기록하고, 그 기록을 깃허브에 올려요. 그러면 다른 컴퓨터에서도, 다른 사람도 볼 수 있어요."
    scene: {kind: flow, tag: 이렇게 이어져요, label: "내 컴퓨터 → [[깃허브]]", nodes: [{glyph: "💻", name: 내 컴퓨터, sub: 깃으로 기록}, {glyph: "⬆", name: 올리기, sub: 인터넷으로}, {glyph: "🌐", name: 깃허브, sub: 어디서나 보기}]}
    sync: {at: [0, "기록하고,", "올려요.", "다른"], beats: ["다른"]}

  - say: "깃허브에서는 이 보관함을 저장소, 영어로 리포지토리라고 불러요. 프로젝트 하나에 저장소 하나라고 생각하면 돼요."
    source: "GitHub Docs"
    scene: {kind: terminal, tag: 새 단어, title: "저장소 = Repository", lines: ["# 저장소(리포지토리) = 프로젝트 보관함", "$ my-first-project", "# 프로젝트 하나 = 저장소 하나"]}
    sync: {at: [0, "저장소,", "리포지토리라고", "프로젝트"]}

  - say: "보관만 하는 게 아니에요. 여러 사람이 같은 프로젝트를 나눠 고치고, 서로 검토한 다음 하나로 합칠 수 있어요."
    source: "GitHub Docs"
    scene: {kind: list, num: "+", title: 보관 그 이상, items: ["[[보관]] : 노트북을 잃어버려도 안전", "[[함께 고치기]] : 여러 사람이 나눠서", "[[검토하고 합치기]] : 확인 후 하나로"]}
    sync: {at: [0, "보관만", "나눠", "합칠"]}

  - say: "개인은 무료로 쓸 수 있어요. 공개 저장소도, 나만 보는 비공개 저장소도 개수 제한 없이 만들 수 있어요."
    source: "GitHub Docs · GitHub's plans"
