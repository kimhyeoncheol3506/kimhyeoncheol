# 「깃허브가 도대체 뭔데? — 처음 듣는 사람도 5분이면 이해하는 GitHub」 (S2 neon · 여의도여자) 약 5분
# 참고 영상(현철님 스크린샷 2026-11-04): 레인 Y8lGdEyNv-M(커밋·브랜치·gitignore 3가지 + 비개발자 꿀팁) · 짐코딩 vSmHKX0gba4('선택이 아닌 필수') ·
#   유노코딩 PwIei1tdHSU(깃과 깃허브가 처음인 당신에게 #1) · 사짜들의 AI sxq-ob_KhEU(비개발자용, 버전 타임라인 썸네일) ·
#   조코딩 Fley6IFhlC8(졸업논문_최종_진짜.hwp 비유) · bkamp -vBtNVK49ls('개발자용 구글드라이브', '이것도 모르면서 바이브코딩?')
#   자막은 유튜브 봇 확인으로 막힘 → 제목·썸네일·화면에 보이는 비유만 참고, 문장은 새로 씀.
# 사실 확인(1차 자료): GitHub Docs 'GitHub란?'(깃=변경 추적 버전 제어, 깃허브=클라우드에서 저장소 호스팅+협업) · GitHub 요금제 문서(개인 무료, 공개·비공개 저장소 무제한) ·
#   Octoverse 2026(2026-10-28 발표, 최근 1주 안 새 숫자: 개발자 2억 2,500만 명+, PR 40%+가 에이전트로 시작, 한국 공개 푸시 7위) · 위키백과(깃 2005-04 리누스 토르발스, 깃허브 2008-04, MS 인수 발표 2018-06-04 75억 달러).
#   흔히 퍼진 옛 숫자('깃허브 사용자 1억 명' 등)는 쓰지 않고 2026-10-28 최신 숫자로 바꿈.
# 이번 영상 새 모션(현철님: '영상 폼이 지루할 수 있으니 엣지 있게'): files(파일 더미가 한 장으로) · timeline(세이브 포인트·갈래) · split(VS 쾅) · hook fx(stamp 도장·glitch·type 타자)
