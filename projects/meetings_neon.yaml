scenes:
  # ───────────── 후킹(첫 20초 안에 질문)
  - say: "다음 회의부터는, 참가자 명단에 클로드라는 이름이 하나 더 보일 수 있어요."
    instruct: "깜짝 놀란 소식을 전하듯 힘 있고 빠르게."
    source: "Anthropic 공식 발표 · Claude Meetings"
    scene: {kind: hook, small: "11월 새 기능", line1: "회의 참가자에", line2: "[[AI가 한 명 더]]", punch: true}
    sync: {at: [0, 0.15, "클로드라는"]}

  - say: "에이아이가 회의에 들어와서 듣고, 받아 적고, 할 일까지 정리해요. 그럼 회의록은, 이제 누가 써야 할까요?"
    instruct: "궁금증을 끌어올리듯, 질문은 끝을 올려."
    source: "Anthropic 공식 발표 · Claude Meetings"
    scene: {kind: hook, small: "질문 하나", line1: "회의록은", line2: "[[이제 누가 쓸까?]]", fx: stamp}
    sync: {at: [0, 0.2, "그럼"]}

  - say: "앤트로픽이 이번 달, 회의와 표와 화이트보드를 한꺼번에 들고 나왔어요."
    scene: {kind: icons, tag: 11월에 나온 것, label: "회의 · 표 · [[보드]]", items: [{glyph: "🎥", name: 클로드 미팅, color: "#FFB020"}, {glyph: "📊", name: 클로드 시트}, {glyph: "🧩", name: 클로드 화이트보드, color: "#FF6A1A"}]}
    sync: {at: [0, "회의와", "화이트보드를"]}

  - say: "오늘은 이 새 기능을, 처음 쓰는 분 눈높이로 켜는 법부터 하나씩 보여 드릴게요."
    instruct: "영화 예고편처럼 힘 있게."
    scene: {kind: intro, kicker: "AI 회의록 · AI 표 · AI 보드", title: "클로드 미팅 사용법", sub: "켜는 법 · 쓰는 예 · [[주의점]]", size: 150}
    sync: {at: [0, "처음", "켜는"]}

  - say: "오늘 순서는요, 무엇이 나왔는지, 미팅, 시트, 화이트보드, 한국에서 쓰는 법과 요금제, 그리고 주의할 점이에요."
    scene:
      kind: agenda
      items:
        - {slash: /new, text: "무엇이 나왔나 · 4가지"}
        - {slash: /meet, text: "① 클로드 미팅"}
        - {slash: /sheet, text: "② 클로드 시트"}
        - {slash: /board, text: "③ 화이트보드 + 데이터"}
        - {slash: /plan, text: "한국에서 · 요금제"}
        - {slash: /care, text: "주의할 점"}
    sync: {at: [0, "무엇이", "미팅,", "화이트보드,", "한국에서", "그리고"]}

  # ───────────── PART 01 /new
  - say: "먼저, 이번에 무엇이 나왔는지 한눈에 볼게요."
    chapter: "PART 01 · 무엇이 나왔나 · 4가지 한눈에"
    scene: {kind: part, num: PART 01, slash: /new, title: "무엇이 나왔나"}
    sync: {at: [0, "한눈에"]}

  - say: "클로드를 만든 앤트로픽은, 올해 6월 미국 상장 서류를 냈다고 밝혀서 요즘 자주 이름이 오르죠. 오늘은 회사 이야기 말고, 새 기능 쓰는 법만 볼게요."
    instruct: "가볍게 지나가듯."
    source: "Anthropic 뉴스"
    scene: {kind: doc, tag: 배경 한 줄, meta: "Anthropic 뉴스 · 2026년 6월", title: "\"상장 서류 제출\"", lines: ["오늘 이야기는 {{회사가 아니라}}", "{{새 기능 쓰는 법}}"]}
    sync: {at: [0, "올해", "오늘은"]}

  - say: "먼저 시트와 화이트보드가, 11월 10일에 베타로 나왔어요. 미팅은 그다음, 11월 12일에 나왔고요."
    source: "Anthropic 공식 발표 · Whiteboards·Sheets·Data"
    scene: {kind: timeline, label: "11월에 [[이렇게]] 나왔어요", points: [{label: 11월 10일, sub: "시트 · 화이트보드 베타"}, {label: 11월 10일, sub: "대시보드 → 데이터"}, {label: 11월 12일, sub: "[[미팅 베타]]"}]}
    sync: {at: [0, "11월", "미팅은"]}

  - say: "그리고 예전 대시보드 기능은, 클로드 데이터라는 새 이름으로 정식 출시됐어요."
    source: "Anthropic 공식 발표 · Whiteboards·Sheets·Data"
    scene: {kind: split, left: {glyph: "📈", title: 예전 이름, lines: ["클로드 대시보드", "베타"], color: "#FF6A1A"}, right: {glyph: "🗄", title: 새 이름, lines: ["클로드 데이터", "[[정식 출시]]"], color: "#FFB020"}}
    sync: {at: [0, "그리고", "클로드"]}

  - say: "네 가지를 한 줄씩 정리하면 이래요. 미팅은 회의에 들어오고, 시트는 표를 만들고, 화이트보드는 생각을 그리고, 데이터는 회사 숫자에 답해요."
    scene: {kind: list, num: "4", title: "한 줄로 정리", items: ["미팅 · 회의에 [[참가자로]]", "시트 · 말로 표 만들기", "화이트보드 · 생각을 그림으로", "데이터 · 회사 숫자에 질문"]}
    sync: {at: [0, "미팅은", "시트는", "화이트보드는", "데이터는"]}

  - say: "베타라는 건, 써 볼 수는 있지만 아직 다듬는 중이라는 뜻이에요. 메뉴나 기능이 바뀔 수 있어요."
    scene: {kind: warn, tag: "베타란?", title: "써 볼 수 있지만 [[다듬는 중]]", lines: ["메뉴 · 기능이 바뀔 수 있음", "중요한 일은 한 번 더 확인"]}
    sync: {at: [0, "베타라는", "메뉴나"]}

  # ───────────── PART 02 /meet
  - say: "그럼 오늘의 주인공, 클로드 미팅부터 볼게요."
    chapter: "PART 02 · ① 클로드 미팅 · AI가 회의에 들어온다"
    scene: {kind: part, num: PART 02, slash: /meet, title: "① 클로드 미팅"}
    sync: {at: [0, "주인공,"]}

  - say: "클로드가 화상회의에, 눈에 보이는 참가자로 들어와요. 몰래 듣는 게 아니라, 화면에 이름이 뜨고 채팅창에 안내 글도 올려요."
    source: "Anthropic 공식 발표 · Claude Meetings"
    scene:
      kind: chat
      tag: "회의 채팅창 · 예시 화면"
      label: "보이는\n[[참가자]]"
      app: 화상회의
      messages:
        - {who: ai, text: "클로드가 회의에 들어왔어요. 이 회의는 받아 적고 요약해요."}
        - {who: me, text: "좋아요, 오늘 회의 정리 부탁해요."}
    sync: {at: [0, "몰래", "채팅창에"]}

  - say: "지금은 구글 미트만 돼요. 다른 화상회의 프로그램은 곧 지원한다고만 나와 있어요."
    source: "Anthropic 공식 발표 · Claude Meetings"
    scene: {kind: split, left: {glyph: "✅", title: 지금 되는 곳, lines: ["구글 미트", "[[이것만]]"], color: "#FFB020"}, right: {glyph: "⏳", title: 나머지, lines: ["다른 화상회의", "\"곧 지원\""], color: "#FF6A1A"}}
    sync: {at: [0, "지금은", "다른"]}

  - say: "회의 중에 하는 일은 크게 세 가지예요. 듣고 받아 적기, 묻는 말에 답하기, 그리고 자료를 그 자리에서 만들기예요."
    source: "Anthropic 공식 발표 · Claude Meetings"
    scene: {kind: icons, tag: 회의 중에, label: "적고 · 답하고 · [[만들고]]", items: [{glyph: "📝", name: 받아 적기}, {glyph: "💬", name: 묻는 말에 답하기, color: "#FFB020"}, {glyph: "🧩", name: 자료 바로 만들기, color: "#FF6A1A"}]}
    sync: {at: [0, "회의", "듣고", "묻는", "그리고"]}

  - say: "질문은 말로 해도 되고, 채팅으로 써도 돼요. 답은 기본으로 채팅창에 글로 올려 줘요."
    source: "Anthropic 공식 발표 · Claude Meetings"
    scene: {kind: flow, tag: 이렇게 물어요, label: "말로 · 글로 · [[답은 글로]]", nodes: [{glyph: "🗣", name: 말로 묻기, sub: "\"클로드, 지난주 숫자는?\""}, {glyph: "⌨", name: 채팅으로 묻기, sub: 회의 채팅창에}, {glyph: "📩", name: 답은 글로, sub: "[[채팅창에]]"}]}
    sync: {at: [0, "질문은", "답은"]}

  - say: "말로 부탁하면, 클로드가 지금 누가 말했는지 한 번 확인해요. 엉뚱한 사람 이름으로 일을 하지 않게요."
    source: "Anthropic 공식 발표 · Claude Meetings"
    scene: {kind: doc, tag: 말로 부탁할 때, meta: "공식 발표", title: "\"지금 말한 분이 [[누구세요?]]\"", lines: ["말한 사람을 {{한 번 확인}}", "그다음에 일 시작"]}
    sync: {at: [0, "말로", "엉뚱한"]}

  - say: "회의가 끝나면, 클로드 화면에 회의 페이지가 생겨요. 회의록, 대화 기록, 회의 중에 만든 자료가 한곳에 모여요."
    source: "Anthropic 공식 발표 · Claude Meetings"
    scene: {kind: browser, url: "claude.ai · 회의 페이지", ptitle: "주간 회의 · [[회의 페이지]]", rows: ["요약 · 오늘 정한 것 3가지", "할 일 · 누가 · 언제까지", "대화 기록 · 회의 중 만든 자료"], mode: 예시 화면}
    sync: {at: [0, "회의가", "회의록,"]}

  - say: "중요한 점, 소리 파일은 저장하지 않아요. 글로 된 대화 기록과 요약, 그리고 화면 설명만 남겨요."
    instruct: "또박또박, '저장하지 않아요'에 힘을 준다."
    source: "Anthropic 공식 발표 · Claude Meetings"
    scene: {kind: score, round: 무엇이 남나, title: "글은 남고 [[소리는 안 남아요]]", left: {name: 남는 것, color: "#FFB020"}, right: {name: 안 남는 것, color: "#FF6A1A"}, rows: [{k: 대화 기록, l: "[[글로 저장]]", r: "", win: l}, {k: 요약 · 화면 설명, l: "[[저장]]", r: "", win: l}, {k: 녹음 소리, l: "", r: "저장 안 함", win: r}], score: [2, 1]}
    sync: {at: [0, "중요한", "글로"]}

  - say: "이제 켜는 법이에요. 순서는 딱 네 단계예요."
    instruct: "체크리스트를 꺼내듯."
    source: "Claude 도움말 · Claude Meetings"
    scene: {kind: hook, small: "켜는 법", line1: "클로드 미팅", line2: "[[딱 4단계]]", fx: stamp}
    sync: {at: [0, "이제", "순서는"]}

  - say: "하나, 왼쪽 메뉴에서 미팅. 둘, 구글 캘린더 연결. 셋, 일정에서 회의 고르기. 넷, 클로드 추가를 누르면 끝이에요."
    source: "Claude 도움말 · Claude Meetings"
    scene: {kind: list, num: "4", title: "클로드 미팅 켜는 법", items: ["메뉴에서 [[미팅]] 누르기", "구글 캘린더 연결", "일정에서 회의 고르기", "[[클로드 추가]] 누르기"]}
    sync: {at: [0, "하나,", "둘,", "셋,", "넷,"]}

  - say: "단, 캘린더 연결은 회사 관리자가 먼저 허용해야 해요. 메뉴가 안 보이면 관리자에게 물어보세요."
    source: "Claude 도움말 · Claude Meetings"
    scene: {kind: doc, tag: 안 될 때, meta: "Claude 도움말", title: "\"관리자가 [[먼저 허용]]\"", lines: ["구글 캘린더 연결은 {{관리자 허용}}", "메뉴가 없으면 {{관리자에게}}"]}
    sync: {at: [0, "단,", "메뉴가"]}

  - say: "매번 누르기 귀찮다면 자동 참가도 있어요. 설정에서 모든 회의에, 아니면 일대일 회의만 빼고 들어오게 할 수 있어요."
    source: "Claude 도움말 · Claude Meetings"
    scene: {kind: terminal, tag: 자동 참가, title: 설정 경로, lines: ["설정 > 기능 > 미팅 > 자동 참가", "○ 모든 회의", "● 일대일 회의만 빼고", "# 관리자가 대신 켤 수는 없어요"]}
    sync: {at: [0, "매번", "설정에서"]}

  - say: "회의 중에 나가 달라고 말하면 나가고, 잠깐 듣지 말라고 하면 멈춰요. 회의 하나에 최대 8시간까지 머물 수 있어요."
    source: "Claude 도움말 · Claude Meetings"
    scene: {kind: icons, tag: 회의 중 조절, label: "나가기 · 멈추기 · [[최대 8시간]]", items: [{glyph: "🚪", name: "\"나가 줘\""}, {glyph: "⏸", name: "\"잠깐 듣지 마\"", color: "#FFB020"}, {glyph: "⏱", name: 최대 8시간, color: "#FF6A1A"}]}
    sync: {at: [0, "회의", "잠깐", "회의"]}

  - say: "실제로 이렇게 써요. 회의 중에 클로드, 방금 정한 할 일을 표로 정리해 줘, 하고 말하면 돼요."
    scene:
      kind: chat
      tag: "클로드 미팅 · 예시 화면"
      label: "회의 중\n[[할 일 정리]]"
      app: 회의 채팅창
      messages:
        - {who: me, text: "클로드, 방금 정한 할 일을 표로 정리해 줘."}
        - {who: ai, text: "할 일 세 개를 정리했어요. 담당자와 마감일도 적었어요. 맞는지 봐 주세요."}
    sync: {at: [0, "실제로", "클로드,"]}

  - say: "회의가 끝나기 전에 정리가 나오니까, 회의록 쓰느라 남는 사람이 없어지는 거죠."
    scene: {kind: split, left: {glyph: "😩", title: 예전, lines: ["회의 끝나고", "회의록 따로 쓰기"], color: "#FF6A1A"}, right: {glyph: "😌", title: 이제, lines: ["회의 중에 정리", "[[끝나면 바로 공유]]"], color: "#FFB020"}}
    sync: {at: [0, "회의가", "회의록"]}

  - say: "정리하면, 클로드 미팅은 구글 미트에 들어오는 에이아이 서기예요. 소리는 안 남기고, 글로 정리해 줘요."
    scene: {kind: recap, slash: /meet, items: [{k: 하는 일, v: "듣고 · 적고 · 답하고 · 만들기"}, {k: 되는 곳, v: "구글 미트(지금)"}, {k: 켜는 법, v: "미팅 → 캘린더 → 회의 → 추가"}, {k: 남는 것, v: "[[글 기록 · 소리는 없음]]"}]}
    sync: {at: [0, "정리하면,", "소리는"]}

  # ───────────── PART 03 /sheet
  - say: "두 번째, 클로드 시트예요. 엑셀 같은 표를 말로 만들어 줘요."
    chapter: "PART 03 · ② 클로드 시트 · 말로 만드는 표"
    scene: {kind: part, num: PART 03, slash: /sheet, title: "② 클로드 시트"}
    sync: {at: [0, "엑셀"]}

  - say: "시작하는 방법은 두 가지예요. 대화창에 표를 만들어 달라고 하거나, 아티팩트 탭에서 시트 칸을 누르면 돼요."
    source: "Claude 도움말 · Claude Sheets"
    scene: {kind: split, left: {glyph: "💬", title: 대화창에서, lines: ["\"가계부 표 만들어 줘\"", "말로 부탁"], color: "#FFB020"}, right: {glyph: "🗂", title: 아티팩트 탭에서, lines: ["시트 칸 누르기", "[[빈 표로도 시작]]"], color: "#FF6A1A"}}
    sync: {at: [0, "시작하는", "아티팩트"]}

  - say: "예를 들어, 우리 팀 이번 달 행사 예산표를 만들어 줘, 항목별로 합계도 넣어서, 이렇게 부탁해요."
    scene:
      kind: chat
      tag: "클로드 시트 · 예시 화면"
      label: "말 한마디로\n[[예산표]]"
      app: 클로드
      messages:
        - {who: me, text: "우리 팀 이번 달 행사 예산표 만들어 줘. 항목별 합계도 넣어서."}
        - {who: ai, text: "탭 두 개로 만들었어요. 항목 칸은 고를 수 있게 했고, 합계는 수식으로 넣었어요."}
    sync: {at: [0, "예를", "이렇게"]}

  - say: "그러면 탭이 여러 개인 표를 만들고, 수식과 색깔 표시, 고르는 칸, 체크 칸, 차트까지 넣어 줘요."
    source: "Claude 도움말 · Claude Sheets"
    scene: {kind: list, num: "5", title: "시트에 들어가는 것", items: ["탭 여러 개 · 탭끼리 수식", "색깔 표시(조건부 서식)", "고르는 칸 · 체크 칸", "차트(막대 · 선 · 원)", "칸마다 [[메모 남기기]]"]}
    sync: {at: [0, "그러면", "수식과", "고르는", "차트까지"]}

  - say: "좋은 점은, 클로드가 어디를 고쳤는지 표시해 준다는 거예요. 마음에 안 들면 예전 버전으로 되돌릴 수도 있어요."
    source: "Claude 도움말 · Claude Sheets"
    scene: {kind: browser, url: "클로드 시트 · 예시", ptitle: "행사 예산표 · [[고친 곳 표시]]", rows: ["장소 대관 · 수정됨", "다과 · 새로 추가", "합계 · 수식 바뀜"], panel: [{who: ai, text: "세 칸을 고쳤어요. 표시된 곳을 확인해 주세요."}], mode: 예시 화면}
    sync: {at: [0, "좋은", "마음에"]}

  - say: "공유를 누르면 팀원도 같은 표를 같이 고칠 수 있어요. 나, 팀원, 클로드가 동시에 한 표를 만지는 거죠."
    source: "Claude 도움말 · Claude Sheets"
    scene: {kind: flow, tag: 같이 고치기, label: "공유 · 동시에 · [[셋이 함께]]", nodes: [{glyph: "🔒", name: 처음엔 나만, sub: 기본은 비공개}, {glyph: "🔗", name: 공유 누르기, sub: 고칠 수 있게}, {glyph: "👥", name: 동시에 편집, sub: "[[나 · 팀원 · 클로드]]"}]}
    sync: {at: [0, "공유를", "나,"]}

  - say: "엑셀 같은 표 파일로 내보낼 수 있고, 반대로 엑셀이나 구글 시트 파일을 가져올 수도 있어요."
    source: "Claude 도움말 · Claude Sheets"
    scene: {kind: split, left: {glyph: "📤", title: 내보내기, lines: [".xlsx(엑셀)", "CSV"], color: "#FFB020"}, right: {glyph: "📥", title: 가져오기, lines: ["엑셀 · 구글 시트", "[[CSV · 붙여 넣기]]"], color: "#FF6A1A"}}
    sync: {at: [0, "엑셀", "반대로"]}

  - say: "대신 아직은 기본 기능이에요. 피벗 테이블은 아직 없고, 매크로는 지원하지 않아요. 무거운 작업은 엑셀로 내보내서 하세요."
    instruct: "차분하게."
    source: "Claude 도움말 · Claude Sheets"
    scene: {kind: warn, tag: 아직 안 되는 것, title: "피벗 · 매크로는 [[아직]]", lines: ["피벗 테이블 · PDF 내보내기 아직", "매크로 · VBA 지원 안 함"]}
    sync: {at: [0, "대신", "피벗", "무거운"]}

  - say: "크기는 채워진 칸 20만 개 이상까지 담을 수 있다고 안내돼 있어요. 웬만한 업무 표는 충분해요."
    source: "Claude 도움말 · Claude Sheets"
    scene: {kind: number, tag: 클로드 시트, label: "채워진 칸", to: 20, unit: "만 칸+", sub: "도움말 기준 · [[적어도 이만큼]]"}
    sync: {at: [0, "크기는", "웬만한"]}

  - say: "정리하면, 클로드 시트는 말로 만드는 표, 무거운 일은 엑셀로 넘기는 거예요."
    scene: {kind: recap, slash: /sheet, items: [{k: 하는 일, v: "말로 표 · 수식 · 차트"}, {k: 같이, v: "공유하면 동시에 편집"}, {k: 파일, v: "엑셀 · CSV 내보내기"}, {k: 아직, v: "[[피벗 · 매크로 없음]]"}]}
    sync: {at: [0, "정리하면,", "무거운"]}

  # ───────────── PART 04 /board
  - say: "세 번째, 클로드 화이트보드예요. 회의실 벽에 붙이던 포스트잇을, 화면 위로 옮겨 왔다고 보면 돼요."
    chapter: "PART 04 · ③ 클로드 화이트보드 + 클로드 데이터"
    scene: {kind: part, num: PART 04, slash: /board, title: "③ 화이트보드 + 데이터"}
    sync: {at: [0, "회의실", "화면"]}

  - say: "생각을 말하거나 적으면, 클로드가 도형과 화살표, 구역으로 그려 줘요. 그리고 누구든 그걸 끌어서 옮길 수 있어요."
    source: "Claude 도움말 · Claude Whiteboards"
    scene: {kind: flow, tag: 이렇게 그려요, label: "말하면 · 그리고 · [[함께 옮기기]]", nodes: [{glyph: "🗣", name: 생각 말하기, sub: 마이크로도 돼요}, {glyph: "🔷", name: "도형 · 화살표", sub: 클로드가 그림}, {glyph: "✋", name: 끌어서 옮기기, sub: "[[누구든]]"}]}
    sync: {at: [0, "생각을", "그리고"]}

  - say: "입력창 옆 마이크를 누르면 말로 불러 줄 수도 있어요. 받아쓰기는 브라우저 언어를 따라가고, 여러 언어를 지원해요."
    source: "Claude 도움말 · Claude Whiteboards"
    scene: {kind: doc, tag: 말로 불러 주기, meta: "Claude 도움말", title: "\"마이크 누르고 [[말하기]]\"", lines: ["브라우저 언어를 {{따라감}}", "여러 언어 지원"]}
    sync: {at: [0, "입력창", "받아쓰기는"]}

  - say: "예를 들어, 신제품 출시 계획을 짜 줘, 하면 할 일을 붙이고, 비슷한 것끼리 묶고, 일정표로 바꿔 줘요."
    scene:
      kind: browser
      url: "클로드 화이트보드 · 예시"
      ptitle: "신제품 출시 · [[일정표로]]"
      rows: ["1주차 · 시장 조사 · 담당 김 대리", "2주차 · 디자인 확정 · 담당 이 과장", "3주차 · 출시 행사 · 담당 박 팀장"]
      panel: [{who: me, text: "비슷한 것끼리 묶고 일정표로 바꿔 줘"}, {who: ai, text: "세 묶음으로 나누고 주차별 일정표로 바꿨어요."}]
      mode: 예시 화면
    sync: {at: [0, "예를", "비슷한"]}

  - say: "빠진 단계가 뭐냐고 물으면 제안도 해 줘요. 보드의 한 부분만 끌어서 고르면, 그 부분만 따로 물어볼 수도 있어요."
    source: "Claude 도움말 · Claude Whiteboards"
    scene: {kind: icons, tag: 보드에서 묻기, label: "빠진 것 · [[골라서 묻기]]", items: [{glyph: "❓", name: "\"빠진 단계는?\""}, {glyph: "⬚", name: 한 부분만 골라 묻기, color: "#FFB020"}, {glyph: "👀", name: 팀원 화면 따라가기, color: "#FF6A1A"}]}
    sync: {at: [0, "빠진", "보드의"]}

  - say: "다 그린 보드는 문서나 발표 자료로 바꿔 달라고 할 수 있고, 루시드, 미로 같은 다른 보드 도구로 보내거나, 그림 파일로 저장할 수 있어요."
    source: "Claude 도움말 · Claude Whiteboards"
    scene: {kind: list, num: "3", title: "다 그린 보드는", items: ["문서 · [[발표 자료]]로 바꾸기", "다른 보드 도구로 보내기", "그림 파일(PNG)로 저장"]}
    sync: {at: [0, "다", "루시드,", "그림"]}

  - say: "그리고 이 화이트보드는 미팅 안에서도 써요. 사람들이 말하는 동안, 보드가 실시간으로 채워지는 거죠."
    source: "Anthropic 공식 발표 · Claude Meetings"
    scene: {kind: split, left: {glyph: "🎥", title: 회의 중, lines: ["사람들이 말하면", "클로드가 듣고"], color: "#FF6A1A"}, right: {glyph: "🧩", title: 보드가, lines: ["실시간으로", "[[채워져요]]"], color: "#FFB020"}}
    sync: {at: [0, "그리고", "사람들이"]}

  - say: "마지막으로 클로드 데이터는 짧게만요. 회사 데이터 창고에 연결해서, 이번 달 매출 어때? 하고 물어보는 기능이에요."
    source: "Anthropic 공식 발표 · Whiteboards·Sheets·Data"
    scene: {kind: doc, tag: 클로드 데이터, meta: "정식 출시 · 예전 이름 대시보드", title: "\"회사 숫자에 [[질문하기]]\"", lines: ["데이터 창고 · 영업 관리 도구에 {{연결}} 필요", "주로 {{회사 · 팀}}용"]}
    sync: {at: [0, "마지막으로", "회사"]}

  - say: "정리하면, 화이트보드는 함께 쓰는 생각 정리판이고, 데이터는 회사 숫자 비서예요."
    scene: {kind: recap, slash: /board, items: [{k: 화이트보드, v: "말하면 도형 · 일정표로"}, {k: 보내기, v: "문서 · 발표 자료 · PNG"}, {k: 미팅 안에서, v: "실시간으로 채움"}, {k: 데이터, v: "[[회사 숫자에 질문]]"}]}
    sync: {at: [0, "정리하면,", "데이터는"]}

  # ───────────── PART 05 /plan
  - say: "자, 가장 많이 궁금하실 부분이에요. 한국에서 쓸 수 있는지, 돈은 얼마인지 볼게요."
    chapter: "PART 05 · 한국에서 쓸 수 있나 · 요금제"
    scene: {kind: part, num: PART 05, slash: /plan, title: "한국에서 · 요금제"}
    sync: {at: [0, "가장", "한국에서"]}

  - say: "먼저, 한국에서 되는지부터요. 앤트로픽 공식 지원 국가 목록에 한국이 들어 있어요. 그래서 클로드 자체는 한국에서 그대로 쓸 수 있어요."
    source: "Anthropic 지원 국가·지역"
    scene: {kind: hook, small: "공식 지원 국가 목록", line1: "한국에서", line2: "[[쓸 수 있어요]]", fx: stamp}
    sync: {at: [0, "앤트로픽", "그래서"]}

  - say: "다만 미팅이 한국어 회의를 얼마나 잘 받아 적는지는, 공식 안내에 아직 적혀 있지 않아요."
    instruct: "솔직하고 차분하게."
    source: "Claude 도움말 · Claude Meetings"
    scene: {kind: warn, tag: 아직 모르는 것, title: "한국어 회의 지원은 [[안내 없음]]", lines: ["공식 도움말에 언어 언급 없음", "짧은 회의로 먼저 시험"]}
    sync: {at: [0, "공식"]}

  - say: "그러니 처음에는, 짧은 회의로 먼저 시험해 보세요."
    scene: {kind: hook, small: "한국어 회의라면", line1: "처음엔", line2: "[[짧은 회의로]] 시험", fx: stamp}
    sync: {at: [0, "짧은"]}

  - say: "다음은 요금제예요. 시트와 화이트보드는 유료 요금제면 모두 쓸 수 있어요. 무료 요금제에는 없어요."
    source: "Claude 요금제"
    scene: {kind: score, round: 시트 · 화이트보드, title: "유료면 [[모두 가능]]", left: {name: 쓸 수 있음, color: "#FFB020"}, right: {name: 없음, color: "#FF6A1A"}, rows: [{k: 무료, l: "", r: "없음", win: r}, {k: 프로 · 맥스 · 울트라, l: "[[가능]]", r: "", win: l}, {k: 팀 · 엔터프라이즈, l: "[[가능]]", r: "", win: l}], score: [2, 1]}
    sync: {at: [0, "다음은", "무료"]}

  - say: "그런데 미팅은 달라요. 회사용 요금제인 팀과 엔터프라이즈에서만 쓸 수 있어요. 개인용 프로나 맥스에는 아직 없어요."
    instruct: "'달라요'에 힘을 준다."
    source: "Anthropic 공식 발표 · Claude Meetings"
    scene: {kind: split, left: {glyph: "🏢", title: 미팅 되는 곳, lines: ["팀 요금제", "[[엔터프라이즈]]"], color: "#FFB020"}, right: {glyph: "🙋", title: 아직 안 되는 곳, lines: ["무료 · 프로", "맥스 · 울트라"], color: "#FF6A1A"}}
    sync: {at: [0, "그런데", "개인용"]}

  - say: "가격표 기준으로, 개인용 프로는 월 결제면 한 달 20달러예요."
    source: "Claude 요금제"
    scene: {kind: hook, small: "개인용 프로 · 월 결제", line1: "한 달", line2: "[[20달러]]", fx: stamp}
    sync: {at: [0, "개인용"]}

  - say: "팀 요금제는 연 결제면 한 사람당 월 20달러, 월 결제면 25달러예요. 최소 두 명부터예요."
    source: "Claude 요금제"
    scene: {kind: bars, label: "한 달 요금 · [[가격표 기준]]", bars: [{label: "프로 · 월 결제", value: 20, show: "20달러"}, {label: "팀 · 연 결제(1인)", value: 20, show: "20달러"}, {label: "팀 · 월 결제(1인)", value: 25, show: "25달러"}], sub: "claude.com 가격표 · 2026-11-17 확인 · 팀은 2명부터"}
    sync: {at: [0, "연", "최소"]}

  - say: "그리고 베타 동안 미팅의 회의록과 대화 기록은 팀과 엔터프라이즈 요금 안에 포함돼요. 회의 중에 만든 자료도 내년 2월 10일까지는 따로 돈을 받지 않아요."
    source: "Anthropic 공식 발표 · Claude Meetings"
    scene: {kind: timeline, label: "베타 동안 [[추가 요금 없음]]", points: [{label: 회의록 · 기록, sub: "요금제에 포함"}, {label: 회의 중 답변, sub: "연결 도구 안 쓰면 포함"}, {label: "2월 10일까지", sub: "[[회의 중 자료 무료]]"}]}
    sync: {at: [0, "그리고", "회의"]}

  - say: "단, 회의 중에 다른 연결 도구를 쓰면, 그만큼은 내 사용량에서 빠져요."
    source: "Claude 도움말 · Claude Meetings"
    scene: {kind: doc, tag: 알아 둘 것, meta: "Claude 도움말", title: "\"연결 도구는 [[사용량에 포함]]\"", lines: ["메일 · 문서 도구를 부르면", "{{내 사용량}}에서 빠짐"]}
    sync: {at: [0, "단,"]}

  - say: "회사에서 팀 요금제를 쓰면 대부분 처음부터 켜져 있고, 엔터프라이즈는 관리자가 켜 줘야 해요."
    source: "Anthropic 공식 발표 · Whiteboards·Sheets·Data"
    scene: {kind: terminal, tag: 관리자가 켜는 곳, title: 조직 설정, lines: ["조직 설정 > 아티팩트   # 시트 · 화이트보드", "조직 설정 > 제품 > 클로드 미팅(베타)", "# 팀: 기본 켜짐 · 엔터프라이즈: 관리자가 켜기"]}
    sync: {at: [0, "회사에서", "엔터프라이즈는"]}

  - say: "정리하면, 한국에서도 되고, 시트와 보드는 유료면 다, 미팅은 회사용 요금제만이에요."
    scene: {kind: recap, slash: /plan, items: [{k: 나라, v: "한국 · 공식 지원 국가"}, {k: 시트 · 보드, v: "유료 요금제 모두"}, {k: 미팅, v: "[[팀 · 엔터프라이즈만]]"}, {k: 한국어 회의, v: "안내 없음 · 먼저 시험"}]}
    sync: {at: [0, "정리하면,", "시트와", "미팅은"]}

  # ───────────── PART 06 /care
  - say: "마지막으로, 꼭 지켜야 할 주의점이에요. 특히 미팅은 사람 목소리를 받아 적는 일이라 더 조심해야 해요."
    chapter: "PART 06 · 주의할 점 · 동의와 회사 보안"
    scene: {kind: part, num: PART 06, slash: /care, title: "주의할 점"}
    sync: {at: [0, "꼭", "특히"]}

  - say: "첫째, 동의예요. 클로드를 부르거나 자동 참가를 켜기 전에, 회의에 온 사람 모두가 받아 적는 걸 괜찮아하는지 먼저 물어보세요."
    instruct: "낮고 단호하게."
    source: "Claude 도움말 · Claude Meetings"
    scene: {kind: warn, tag: 첫째 · 동의, title: "부르기 전에 [[모두에게 묻기]]", lines: ["\"오늘 회의, AI가 받아 적어도 될까요?\"", "자동 참가는 더 신중하게"]}
    sync: {at: [0, "첫째,", "클로드를"]}

  - say: "공식 도움말도 똑같이 권해요. 채팅창 안내 글만 믿지 말고, 회의 시작할 때 말로 한 번 알려 주는 게 좋아요."
    source: "Claude 도움말 · Claude Meetings"
    scene: {kind: doc, tag: 공식 도움말, meta: "Claude 도움말 · Claude Meetings", title: "\"모두 괜찮은지 [[먼저 확인]]\"", lines: ["채팅 안내 글 + {{말로 한 번 더}}", "싫다는 사람이 있으면 {{부르지 않기}}"]}
    sync: {at: [0, "공식", "채팅창"]}

  - say: "둘째, 외부 손님이에요. 다른 회사 사람이 있는 회의는 관리자 설정에 따라 달라요. 허용돼도 클로드는 받아 적기만 하고, 손님에게는 회의 페이지가 가지 않아요."
    source: "Claude 도움말 · Claude Meetings"
    scene: {kind: flow, tag: 둘째 · 외부 손님, label: "설정 확인 · [[적기만]]", nodes: [{glyph: "⚙", name: 관리자 설정, sub: 허용할지 정함}, {glyph: "📝", name: 받아 적기만, sub: 채팅 답은 안 함}, {glyph: "🚫", name: 손님은 못 받음, sub: "[[회의 페이지 · 요약 메일]]"}]}
    sync: {at: [0, "둘째,", "허용돼도"]}

  - say: "셋째, 회사 보안이에요. 개인정보, 비밀 이야기가 오가는 회의라면, 쓰기 전에 회사 규칙부터 확인하세요."
    source: "Claude 도움말 · Claude Meetings"
    scene: {kind: list, num: "3", title: "셋째 · 회사 보안", items: ["비밀 회의는 [[회사 규칙 먼저]]", "고객 정보 · 개인정보 조심"]}
    sync: {at: [0, "셋째,", "개인정보,"]}

  - say: "그리고 아주 엄격한 보안 설정을 쓰는 회사에는, 아직 열려 있지 않기도 해요."
    source: "Claude 도움말 · Claude Meetings"
    scene: {kind: warn, tag: 보안 설정, title: "엄격한 보안 조직은 [[아직 제외]]", lines: ["데이터를 남기지 않는 설정", "의료 정보 보호 설정 등"]}
    sync: {at: [0, "아직"]}

  - say: "넷째, 에이아이가 만든 회의록은 꼭 사람이 한 번 읽어 보세요. 특히 이름과 숫자, 마감일은요."
    instruct: "다정하지만 단호하게."
    scene: {kind: hook, small: "넷째", line1: "AI 회의록은", line2: "[[사람이 한 번 더]]", fx: stamp}
    sync: {at: [0, "넷째,", "특히"]}

  - say: "정리하면, 묻고 부르기, 손님 설정 확인, 회사 규칙 먼저, 그리고 마지막은 사람이 확인하기예요."
    scene: {kind: recap, slash: /care, items: [{k: 동의, v: "부르기 전에 모두에게"}, {k: 외부 손님, v: "관리자 설정 확인"}, {k: 보안, v: "회사 규칙 먼저"}, {k: 마지막, v: "[[사람이 확인]]"}]}
    sync: {at: [0, "정리하면,", "손님", "회사", "그리고"]}

  # ───────────── 마무리
  - say: "오늘 내용을 한 장으로 보면 이래요. 미팅은 회의 서기, 시트는 말로 만드는 표, 화이트보드는 함께 쓰는 생각판이에요."
    scene: {kind: icons, tag: 한 장 정리, label: "서기 · 표 · [[생각판]]", items: [{glyph: "🎥", name: "미팅 · 회의 서기", color: "#FFB020"}, {glyph: "📊", name: "시트 · 말로 표"}, {glyph: "🧩", name: "화이트보드 · 생각판", color: "#FF6A1A"}]}
    sync: {at: [0, "미팅은", "시트는", "화이트보드는"]}

  - say: "제 생각은 이래요. 회의록을 대신 써 주는 것보다, 회의가 끝나는 순간 할 일이 정해져 있다는 게 진짜 달라지는 점이에요."
    scene: {kind: doc, tag: 뉴럴서랍의 생각, meta: "오늘의 한 줄", title: "\"회의 끝 = [[할 일 끝]]\"", lines: ["회의록은 {{덤}}", "진짜는 {{바로 정해지는 할 일}}"]}
    sync: {at: [0, "제", "회의가"]}

  - say: "오늘 바로 해 볼 건 하나예요. 유료 요금제라면, 클로드에게 이번 주 할 일을 화이트보드로 정리해 줘, 하고 말해 보세요."
    instruct: "다정하게 권하듯."
    scene: {kind: terminal, tag: 오늘 해 볼 것, title: 클로드 입력창, lines: ["> 이번 주 할 일을 화이트보드로 정리해 줘", "> 비슷한 것끼리 묶고 일정표로 바꿔 줘", "# 유료 요금제(프로 이상)"]}
    sync: {at: [0, "오늘", "유료"]}

  - say: "여러분 회사라면, 회의에 에이아이를 들이실 건가요? 댓글로 의견 들려주세요."
    instruct: "궁금하다는 듯 끝을 올려."
    scene: {kind: hook, small: "여러분이라면?", line1: "회의에 AI,", line2: "[[들이실 건가요?]]"}
    sync: {at: [0, "여러분", "댓글로"]}

  - say: "도움이 되셨다면 구독과 좋아요 눌러 주세요. 오늘 나온 공식 발표와 도움말 주소는 설명란에 모두 넣어 둘게요."
    instruct: "밝고 경쾌하게, 마지막 문장은 웃으며."
    hold: 8
    scene: {kind: cta, title: "도움이 됐다면 [[구독과 좋아요]]", button: 구독, next: "공식 발표 · 도움말 주소는 설명란에 · 뉴럴서랍"}
    sync: {at: [0, "구독과", "설명란에"]}
