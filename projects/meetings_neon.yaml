sources:
  - id: meet
    outlet: Anthropic 공식 발표 · Claude Meetings
    title: "Introducing Claude Meetings"
    date: 2026-11-12
    url: https://claude.com/resources/articles/claude-meetings
    verified: true
    facts:
      - "Claude can now join your video calls as a visible participant"
      - "11월 12일 = 12일 beta on Team and Enterprise plans = 팀 · 엔터프라이즈"
      - "Google Meet only for now, other platforms coming soon"
      - "ask out loud or in chat; answers in writing by default; builds docs, whiteboards live; notes and action items"
      - "after the call: notes, transcript, artifacts on a meeting page in claude.ai"
      - "posts a notice in the call's chat; saves transcript, summary, screen descriptions, not audio"
      - "confirms who is speaking when asked out loud"
      - "not available for ZDR, HIPAA-ready, CMEK organizations"
      - "beta: notes and transcripts free; answers free unless a connected tool; artifacts free through February 10, 2027 = 2월 10일"
  - id: meethelp
    outlet: Claude 도움말 · Claude Meetings
    title: "Claude Meetings (support 18325154)"
    date: 2026-11-17
    url: https://support.claude.com/en/articles/18325154
    verified: true
    facts:
      - "steps: Meetings (claude.ai/meetings) → connect Google Calendar → select a meeting → Add Claude = 4단계 = 01 02 03 04"
      - "organization owner must enable Google Calendar first"
      - "auto-join: Settings > Capabilities > Meetings > Auto-join; all meetings or all except one-on-ones"
      - "host can admit; if declined Claude won't retry"
      - "ask Claude to leave or 'Remove Claude'; pause by asking to stop listening"
      - "stays up to eight hours = 8시간, warns before leaving"
      - "admin: Organization settings > Products > Claude Meetings (beta); Team on by default, Enterprise owner turns on"
      - "external guests: Claude listens and takes notes but doesn't reply in call chat; guests don't get meeting page or recap"
      - "language support and regional availability not stated"
      - "make sure everyone on the call is okay with being transcribed"
  - id: swd
    outlet: Anthropic 공식 발표 · Whiteboards·Sheets·Data
    title: "Introducing Claude Whiteboards, Claude Sheets, and Claude Data"
    date: 2026-11-10
    url: https://claude.com/resources/articles/sheets-whiteboards-data
    verified: true
    facts:
      - "11월 10일 = 10일 Whiteboards and Sheets beta; Claude Dashboards becomes generally available as Claude Data"
      - "all paid plans; web, desktop, mobile"
      - "Team: on by default; Enterprise: Whiteboards and Sheets off by default"
      - "Data: ask questions of company data in warehouses (Redshift, BigQuery, ClickHouse); needs a data connector"
      - "Sheets: basic for now; export .xlsx or CSV, or use Claude for Excel"
      - "Whiteboards: board to doc or deck; send to Lucid, Miro, Vani by Zoho"
  - id: sheets
    outlet: Claude 도움말 · Claude Sheets
    title: "Claude Sheets (support 18324300)"
    date: 2026-11-17
    url: https://support.claude.com/en/articles/18324300
    verified: true
    facts:
      - "create from chat or Artifacts tab → Sheets tile"
      - "multiple tabs, cross-tab formulas, formatting, conditional formatting, dropdowns, checkboxes, charts, comments"
      - "outlined edits; simultaneous editing; version history"
      - "at least 200,000 filled cells = 20만 칸"
      - "not yet: pivot tables, protected ranges, PDF export; not supported: macros, VBA"
      - "import CSV, Google Sheets, Excel; export .xlsx or CSV"
      - "private by default; Share → Can edit"
      - "beta on Pro, Max, Ultra, Team, Enterprise; mobile limited; usage counts toward plan limits"
  - id: wb
    outlet: Claude 도움말 · Claude Whiteboards
    title: "Claude Whiteboards (support 18324319)"
    date: 2026-11-17
    url: https://support.claude.com/en/articles/18324319
    verified: true
    facts:
      - "shapes, arrows, sections; regroup by theme, turn into a timeline; ask what's missing; drag area to ask"
      - "dictation mic; follows browser language, many languages"
      - "everyone live; follow a teammate; Share"
      - "convert to doc or deck; Send to Lucid, Miro, Zoho Vani; export PNG"
      - "beta on Pro, Max, Ultra, Team, Enterprise; web, desktop, mobile"
  - id: price
    outlet: Claude 요금제
    title: "Claude pricing"
    date: 2026-11-17
    url: https://claude.com/pricing
    verified: true
    facts:
      - "Free $0: Sheets and Whiteboards not included"
      - "Pro $20 monthly = 20달러 ($17 billed annually)"
      - "Team standard $25 monthly = 25달러, $20 annually; for teams of 2 to 150 = 2명"
  - id: region
    outlet: Anthropic 지원 국가·지역
    title: "Supported countries and regions"
    date: 2026-11-12
    url: https://www.anthropic.com/supported-countries
    verified: true
    facts: ["South Korea listed = 한국", "effective Nov 12, 2026"]
  - id: ipo
    outlet: Anthropic 뉴스
    title: "Anthropic confidentially submits draft registration statement (Form S-1)"
