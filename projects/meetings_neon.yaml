title: "클로드 미팅 사용법 — AI가 회의에 들어와 회의록까지? 시트·화이트보드 총정리 (켜는 법·요금제·주의점)"
title_alt:
  - "AI 회의록 이제 클로드가 씁니다 — 클로드 미팅·시트·화이트보드 새 기능 쉬운 사용법"
  - "클로드 엑셀(시트)·화이트보드·미팅 베타 나왔다! 한국에서 쓰는 법과 요금제 한 번에 정리"
intro_chapter: 인트로 · 회의에 AI가 참가자로 들어온다면?
release_note: "첫 풀영상"
summary: |
  앤트로픽이 11월 10일과 12일에 클로드의 새 업무 기능을 내놓았습니다.
  ① 클로드 미팅(베타, 11/12) — 구글 미트 화상회의에 클로드가 '보이는 참가자'로 들어와 회의록·할 일·자료를 만들어 줍니다.
  ② 클로드 시트(베타, 11/10) — 말로 부탁하면 탭·수식·드롭다운·차트가 있는 표를 만들고, 엑셀 파일(.xlsx)·CSV 로 내보냅니다.
  ③ 클로드 화이트보드(베타, 11/10) — 회의에서 나온 생각을 도형·화살표·일정표로 정리하는 함께 쓰는 보드입니다.
  ④ 클로드 데이터(정식, 11/10) — 예전 '대시보드'가 이름을 바꿨습니다. 회사 데이터에 질문하는 기능입니다.
  누가 쓸 수 있는지(요금제), 한국에서 되는지, 켜는 법, 실제로 쓰는 예, 회의 녹취 동의·회사 보안 주의점까지 담았습니다.
  모든 내용은 Anthropic 공식 발표·도움말·가격표(2026-11-17 확인) 기준이며, 화면 속 회의·표·보드는 예시 화면입니다.
