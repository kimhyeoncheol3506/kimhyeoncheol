scenes:
  # ───────────── 인트로 · 후킹
  - say: "클로드, 깔아 두고 채팅만 하고 계신가요? 사실 클로드는 도구를 붙일수록 일을 훨씬 많이 합니다."
    instruct: "아쉬운 점을 콕 집듯 말을 걸며 시작하고, 질문은 끝을 올린다. 둘째 문장은 힘 있게."
    scene: {kind: hook, small: "아직도 채팅만?", line1: "클로드는 붙일수록", line2: "[[일을 합니다]]"}
    sync: {at: [0, "채팅만", "도구를"]}

  - say: "오늘은 꼭 설치해 볼 만한 도구 24가지를, 하나씩 무슨 뜻인지까지 풀어 드릴게요."
    instruct: "기대감을 주듯 밝고 빠르게, '24가지'에 힘을 준다."
    scene: {kind: number, label: 꼭 설치할 도구, to: 24, unit: 가지, sub: "플러그인 8 · 스킬 8 · [[MCP 8]]"}
    sync: {at: [0, "24가지를,", "풀어"]}

  - say: "먼저 용어부터요. 플러그인은 팀을 통째로 채용하는 것, 스킬은 한 줄로 일을 끝내는 단축키, MCP는 실제 앱에 손을 뻗는 커넥터예요."
    instruct: "비유를 하나씩 또박또박, 다정하게 설명한다."
    scene:
      kind: list
      num: 용어
      title: 세 가지만 알면 끝
      items: ["플러그인 = [[팀 채용]] (도구 묶음 통째로)", "스킬 = [[단축키]] (한 줄로 작업 전체)", "MCP = [[커넥터]] (앱에 읽기·쓰기·실행)"]
    sync: {at: [0, "플러그인은", "스킬은", "MCP는"]}

  - say: "순서는 플러그인, 스킬, MCP, 그리고 설치 전에 꼭 확인할 것까지 네 파트입니다."
    scene:
      kind: agenda
      items:
        - {slash: /plugin, text: 플러그인 8개}
        - {slash: /skill, text: 스킬 8개}
        - {slash: /mcp, text: MCP 8개}
        - {slash: /check, text: 설치 전 확인할 것}
    sync: {at: [0, "플러그인,", "스킬,", "MCP,", "설치"]}

  # ───────────── PART 01 플러그인
  - say: "첫 번째 파트, 팀을 통째로 들이는 플러그인 여덟 개입니다."
    chapter: "PART 01 · 플러그인 8개"
    scene: {kind: part, num: PART 01, slash: /plugin, title: 플러그인 8개}
    sync: {at: [0, "플러그인"]}

  - say: "marketingskills는 마케팅 일을 돕는 스킬 모음이에요. 전환율 개선, 광고 문구, 검색 최적화, 분석까지 마케터가 하는 일을 AI 에이전트에게 가르쳐 둡니다."
    source: "github.com/coreyhaines31/marketingskills"
    scene: {kind: list, num: "01", title: marketingskills, items: ["전환율 개선 · 랜딩페이지", "광고 문구 · 카피", "검색 최적화 · 분석"]}
    sync: {at: [0, "전환율", "광고", "검색"]}

  - say: "social-media-skills는 내 말투를 익혀서, 링크드인 글과 릴스 대본, 이미지 프롬프트까지 써 주는 공개 스킬 17개예요."
    source: "github.com/charlie947/social-media-skills"
    scene:
      kind: icons
      tag: "02 · social-media-skills"
      label: 내 말투로 [[SNS 글]]까지
      items:
        - {glyph: "✎", name: 내 말투 학습}
        - {glyph: "in", name: 링크드인 글}
        - {glyph: "▶", name: 릴스 대본}
        - {glyph: "▦", name: 이미지 프롬프트}
    sync: {at: [0, "말투를", "링크드인", "릴스", "이미지"]}

  - say: "gstack은 와이콤비네이터 대표 Garry Tan이 매일 쓰는 설정을 공개한 거예요. 클로드 코드를 제품을 다시 보는 대표, 설계를 맡는 매니저, 디자이너, 리뷰어가 있는 가상의 개발팀으로 바꿔 줍니다."
    source: "github.com/garrytan/gstack"
    scene:
      kind: flow
      tag: "03 · gstack"
      label: 클로드 코드가 [[개발팀]]으로
      nodes:
        - {glyph: "◆", name: 대표, sub: 제품을 다시 본다}
        - {glyph: "▤", name: 매니저, sub: 설계를 굳힌다}
        - {glyph: "✓", name: 리뷰어, sub: 버그를 잡는다}
    sync: {at: [0, "Garry", "대표,", "매니저,", "리뷰어가"]}

  - say: "superpowers는 완성형 개발 방법론이에요. 바로 코드부터 짜지 않고, 아이디어를 다듬고 계획을 세운 다음, 시험을 먼저 쓰고 나눠서 만들게 합니다."
    source: "github.com/obra/superpowers"
    scene:
      kind: flow
      tag: "04 · superpowers"
      label: 코드보다 [[순서]]가 먼저
      nodes:
        - {glyph: "✦", name: 아이디어 다듬기}
        - {glyph: "▤", name: 계획 세우기}
        - {glyph: "✓", name: 시험 먼저 쓰기}
    sync: {at: [0, "아이디어를", "계획을", "시험을"]}

  - say: "codex-plugin-cc는 오픈에이아이가 직접 만든 플러그인이에요. 클로드 코드 안에서 Codex를 불러 코드 리뷰를 받거나, 일을 통째로 넘길 수 있습니다."
    source: "github.com/openai/codex-plugin-cc"
    scene:
      kind: terminal
      tag: "05 · codex-plugin-cc"
      title: Claude Code
      lines: ["$ /codex:review", "# Codex가 읽기 전용으로 코드 리뷰", "$ /codex:rescue", "# 막힌 일을 Codex에게 넘기기"]
    sync: {at: [0, "Codex를", "리뷰를", "통째로"]}

  - say: "financial-services는 앤트로픽이 낸 금융 전용 묶음이에요. 투자은행, 주식 리서치, 사모펀드, 자산관리 업무에 맞춘 에이전트와 커넥터가 들어 있습니다."
    source: "github.com/anthropics/financial-services"
    scene: {kind: list, num: "06", title: financial-services, items: ["투자은행 · 주식 리서치", "사모펀드 · 자산관리", "에이전트 + 데이터 커넥터"]}
    sync: {at: [0, "투자은행,", "사모펀드,", "에이전트와"]}

  - say: "claude-for-legal도 앤트로픽 공식 묶음입니다. 사내 계약, 개인정보, 노무, 소송, 지식재산처럼 법무팀이 자주 하는 일을 다뤄요."
    source: "github.com/anthropics/claude-for-legal"
    scene:
      kind: icons
      tag: "07 · claude-for-legal"
      label: 법무팀 일을 [[통째로]]
      items:
        - {glyph: "✍", name: 사내 계약}
        - {glyph: "⚿", name: 개인정보}
        - {glyph: "⚖", name: 소송}
        - {glyph: "©", name: 지식재산}
    sync: {at: [0, "사내", "개인정보,", "소송,", "지식재산처럼"]}

  - say: "claude-skills는 커뮤니티가 모은 스킬 창고예요. 스킬과 플러그인이 411개나 되고, 클로드 말고도 13가지 코딩 도구에서 씁니다."
    source: "github.com/alirezarezvani/claude-skills"
    scene: {kind: number, tag: "08 · claude-skills", label: 커뮤니티 스킬, to: 411, unit: 개, sub: "코딩 도구 [[13가지]]에서 사용"}
    sync: {at: [0, "411개나", "13가지"]}

  - say: "정리하면, 마케팅과 SNS, 개발팀, 금융과 법무까지, 플러그인은 한 분야의 일을 통째로 맡기는 방법이에요."
    instruct: "차분하게 정리하듯, 분야 이름을 또박또박."
    scene:
      kind: recap
      slash: /plugin
      items:
        - {k: 마케팅·SNS, v: "marketingskills · social-media-skills"}
        - {k: 개발, v: "gstack · superpowers · codex-plugin-cc"}
        - {k: 전문 분야, v: "financial-services · claude-for-legal"}
    sync: {at: [0, "마케팅과", "개발팀,", "금융과"]}

  # ───────────── PART 02 스킬
  - say: "두 번째 파트, 한 줄로 일을 끝내는 스킬 여덟 개입니다."
    chapter: "PART 02 · 스킬 8개"
    scene: {kind: part, num: PART 02, slash: /skill, title: 스킬 8개}
    sync: {at: [0, "스킬"]}

  - say: "frontend-design은 앤트로픽 공식 스킬이에요. 웹 화면을 만들 때, 어디서 본 듯한 템플릿 대신 의도가 보이는 디자인을 고르게 도와줍니다."
    source: "github.com/anthropics/skills"
    scene:
      kind: doc
      tag: "01 · frontend-design"
      meta: "anthropics/skills · frontend-design"
      title: AI 티 나는 디자인 탈출
      lines: ["Guidance for {{distinctive, intentional}} visual design", "making choices that {{don't read as templated defaults}}."]
    sync: {at: [0, "템플릿", "의도가"]}

  - say: "humanizer는 AI가 쓴 글을 사람이 쓴 것처럼 고쳐 줘요. 위키백과가 정리한 AI 글의 흔적을 기준으로 다듬고, 탐지기를 속이는 게 목적은 아니라고 밝히고 있습니다."
    source: "github.com/blader/humanizer"
    scene:
      kind: chat
      tag: "02 · humanizer"
      label: "AI 글 냄새 빼기\n[[뜻은 그대로]]"
      messages:
        - {who: me, text: "/humanizer 이 글 사람이 쓴 것처럼 다듬어 줘"}
        - {who: ai, text: "뜻은 그대로 두고, 과장된 표현과 기계적인 반복을 덜어 냈어요."}
    sync: {at: [0, "고쳐", "탐지기를"]}

  - say: "ai-second-brain은 카파시가 소개한 개인 위키 아이디어를 스킬로 만든 거예요. 흩어진 AI 대화 기록을 정리해서, 링크로 이어지는 나만의 위키로 쌓아 줍니다."
