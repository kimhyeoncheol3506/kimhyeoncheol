  - say: "지금은 2차 논술 답안을 채점 전문가가 다시 살펴보고 있어요. 결과는 아직 나오지 않았어요."
    source: "경향신문 · 공단 보도설명자료"
    scene: {kind: timeline, label: "공단 확인 · [[진행 중]]", points: [{label: 감독위원 확인, sub: 특이사항 없음}, {label: 1차 채점 자료, sub: 이상 없음}, {label: 2차 답안 재검토, sub: "[[진행 중]]"}]}
    sync: {at: [0, "2차", "채점", "결과는"]}

  - say: "수석 합격자는 억울하다는 입장이에요. 에이아이 안경으로 100점을 맞을 수 있다면 공부를 왜 하겠냐며, 모르는 문제는 소거법으로 풀었다고 했어요."
    source: 시사저널
    scene: {kind: doc, tag: 수석 합격자의 입장, meta: "시사저널 · 한국경제 인용", title: "\"억울하다\"", lines: ["\"공부를 왜 하겠느냐\"", "모르는 문제는 {{소거법}}으로"]}
    sync: {at: [0, "억울하다는", "공부를", "소거법으로"]}

  - say: "한국세무사회도 진상조사를 요구하면서, 성적만으로 부정행위를 단정하면 안 된다고 했어요."
    source: 시사저널
    scene: {kind: split, left: {glyph: "🔎", title: 진상조사, lines: ["철저한 조사", "촉구"], color: "#93C5FD"}, right: {glyph: "⚖", title: 동시에, lines: ["성적만으로", "[[단정은 신중히]]"], color: "#E879F9"}}
    sync: {at: [0, "진상조사를", "성적만으로"]}
  - say: "세무사 시험 제도를 맡은 국세청도, 상황을 살펴보고 있다고 밝혔어요."
    source: 이코리아
    scene: {kind: icons, tag: 살펴보는 곳, label: "지금 [[확인 중]]", items: [{glyph: "🏢", name: 한국산업인력공단, color: "#E879F9"}, {glyph: "🏛", name: 국세청}, {glyph: "⚖", name: 한국세무사회 · 촉구, color: "#93C5FD"}]}
    sync: {at: [0, "국세청도", "살펴보고"]}


  - say: "정리하면, 의혹은 있지만 확인된 건 없고, 조사는 아직 진행 중이에요."
    scene: {kind: recap, slash: /now, items: [{k: 감독위원 4명, v: "특이사항 없음"}, {k: 신고, v: "직접 목격 신고 없음"}, {k: 2차 답안, v: "전문가 재검토 중"}, {k: 결론, v: "[[아직 없음]]"}]}
    sync: {at: [0, "의혹은", "조사는"]}

  # ───────────── 마무리
  - say: "점수가 높다는 것만으로 누군가를 의심하는 건 조심해야 해요. 동시에, 기술은 시험보다 빨리 움직이고 있죠."
    instruct: "생각을 나누듯 천천히."
    scene: {kind: doc, tag: 뉴럴서랍의 생각, meta: "오늘의 한 줄", title: "\"사람은 [[신중하게]]\"", lines: ["높은 점수 ≠ {{부정행위}}", "기술은 {{시험보다 빠르다}}"]}
    sync: {at: [0, "점수가", "동시에"]}

  - say: "기술이 앞서갈 때, 시험은 어떻게 바뀌어야 할까요? 여러분 생각을 댓글로 들려주세요."
    instruct: "여운을 남기듯, 질문은 끝을 올려."
    scene: {kind: hook, small: "여러분 생각은?", line1: "기술이 앞서갈 때", line2: "시험은 [[어떻게 바뀌어야 할까?]]"}
    sync: {at: [0, "기술이", "여러분"]}

  - say: "도움이 되셨다면 구독과 좋아요 눌러 주세요. 오늘 본 기사와 법 조문 출처는 설명란에 모두 넣어 둘게요."
    instruct: "밝고 경쾌하게, 마지막 문장은 웃으며."
    hold: 8
    scene: {kind: cta, title: "도움이 됐다면 [[구독과 좋아요]]", button: 구독, next: "기사 · 법 조문 출처는 설명란에 · 뉴럴서랍"}
    sync: {at: [0, "구독과", "설명란에"]}
