scenes:
  # ───────────── 후킹(첫 20초 안에 질문)
  - say: "네 명 중 세 명이 과락한 과목에서, 100점을 받은 사람이 있어요."
    instruct: "놀라운 사실을 전하듯 힘 있게, 하지만 단정하지 않게."
    source: 경향신문
    scene: {kind: hook, small: "평균 30점 과목에서", line1: "네 명 중 세 명 과락", line2: "[[그런데 100점]]", punch: true}
    sync: {at: [0, "세", "100점을"]}

  - say: "그러자 인터넷에서는 에이아이 안경 이야기까지 나왔죠. 확인된 건 없어요. 그런데 궁금해지죠. 에이아이 안경으로, 정말 시험 커닝이 될까요?"
    instruct: "궁금증을 끌어올리듯, '확인된 건 없어요'는 차분하게, 질문은 끝을 올려."
