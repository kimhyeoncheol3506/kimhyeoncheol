intro_chapter: 인트로 · 안경 하나로 가능할까?
release_note: "첫 풀영상"
summary: |
  올해 세무사 시험 수석 합격자의 높은 점수를 두고 온라인에서 'AI 안경' 의혹이 나왔습니다.
  이 영상은 누가 무엇을 했는지 판단하지 않습니다. 대신 "AI 안경으로 시험장에서 그게 기술적으로 되나?"를 따져 봅니다.
  ① 무슨 일이 있었나(공개된 점수와 과목 평균) ② AI 안경이란 ③ 기술로 따져 보기(되는 것과 어려운 것)
  ④ AI 시험 코너: 직접 만든 세법 스타일 예시 문제 2개를 AI(클로드)에게 실제로 풀려 본 결과
  ⑤ 이미 벌어진 적발 사례와 바뀌는 시험(교육부·수능) ⑥ 지금 확인된 것(2026년 11월 13일 기준)
  한국산업인력공단은 감독위원 4명 모두 특이사항이 없었다고 밝혔고, 부정행위가 확인된 것은 없습니다. 수석 합격자는 억울하다는 입장입니다.
tags: ["#AI안경", "#스마트안경", "#세무사시험", "#시험부정행위", "#수능", "#AI", "#클로드", "#Claude", "#부가가치세", "#AI시험", "#AI뉴스", "#AI입문", "#뉴럴서랍"]
disclaimer: 이 영상은 특정인의 부정행위를 주장하지 않습니다. 2026년 11월 13일까지 보도된 언론 기사와 공식 발표만 정리했으며, 공단 조사는 아직 진행 중입니다. AI 시험 코너의 문제는 실제 기출이 아닌 직접 만든 예시 문제이고, 화면의 AI 답은 실제로 받은 답을 그대로 옮긴 것입니다.
