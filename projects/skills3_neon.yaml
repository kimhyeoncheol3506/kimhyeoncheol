summary: |
  이번 주(2026년 11월 4일~11일) 가장 많이 설치된 클로드(Claude Code) 스킬 중, 만든 곳이 분명하고 초보도 바로 쓸 수 있는 3개를 골랐습니다.
  ① find-skills(버셀) — "이런 스킬 있어?" 하고 말로 물으면 스킬을 찾아 깔아 주는 스킬
  ② agent-browser(버셀) — AI 가 크롬 브라우저를 직접 열고 누르고 읽게 해 주는 스킬
  ③ hyperframes(헤이젠) — HTML 로 장면을 짜면 MP4 영상으로 만들어 주는 스킬
  스킬마다 무엇인지, 설치 명령, 실제로 쓰는 예, 꼭 알아야 할 주의점을 담았고, 마지막에 셋을 한눈에 비교했습니다.
  설치 수는 공개 스킬 순위 사이트 skills.sh 의 '최근 24시간' 칸(2026-11-11 확인)과 npm 주간 다운로드(11/04~11/10) 기준입니다.
