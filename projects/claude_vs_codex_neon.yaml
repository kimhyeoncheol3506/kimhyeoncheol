    source: "Claude Code 문서 · openai/codex README"
    scene: {kind: list, num: "4", title: 쓰는 곳 4곳, items: ["[[터미널]] : 까만 명령 창", "[[편집기]] : 브이에스 코드 등", "[[데스크톱 앱]] : 버튼으로", "[[웹]] : 인터넷 창에서"]}
    sync: {at: [0, "터미널,", "편집기,", "데스크톱", "웹에서도"]}

  - say: "기능도 많이 닮았어요. 먼저 계획 세우기, 일 나눠 맡기기, 규칙 파일, 다른 앱 연결하기까지 둘 다 있어요."
