    sync: {at: [0, "점수는", "클로드는", "코덱스는", "작은"]}

  # ───────────── PART 04 /bench
  - say: "네 번째, 회사들이 자랑하는 성적표, 그대로 믿어도 될까요?"
    chapter: "PART 04 · 회사 자랑, 믿어도 돼?"
    instruct: "의심스럽다는 듯, 질문 끝을 올린다."
