        - {slash: /bench, text: "회사 자랑, 믿어도 돼?"}
        - {slash: /pick, text: "나한테 맞는 도구"}
    sync: {at: [0, "둘이", "가격,", "5라운드", "회사", "나한테"]}

  # ───────────── PART 01 /what
  - say: "첫 번째, 둘이 도대체 뭔지부터 알아볼게요."
    chapter: "PART 01 · 둘이 뭐예요?"
    scene: {kind: part, num: PART 01, slash: /what, title: "둘이 뭐예요?"}
