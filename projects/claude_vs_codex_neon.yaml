    sync: {at: [0, "둘", "계획을", "코덱스로"]}

  - say: "꿀팁 하나 더요. 프로젝트 규칙을 적어 두는 파일, 클로드 엠디와 에이전츠 엠디는 도구를 바꿔도 남는 내 재산이에요. 클로드 코드는 에이전츠 엠디도 읽을 수 있어요."
