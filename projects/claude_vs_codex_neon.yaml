    source: "Nathan Sebhastian · API 요금으로 환산, 유튜버 자체 시험"
    instruct: "놀랍다는 듯, '4배'에 힘을 준다."
    scene: {kind: number, tag: 같은 만점인데, label: "비용 차이", to: 4, unit: 배, sub: "같은 결과, [[다른 영수증]]"}
    sync: {at: [0, "비용이", "4배나"]}

  - say: "게다가 반전도 있었어요. 시험은 전부 통과했는데, 절반이 몰래 뭔가를 망가뜨렸거든요."
    instruct: "목소리를 낮추고 비밀을 말하듯."
    scene: {kind: hook, small: "반전", line1: "전부 통과했는데", line2: "[[절반이 망가뜨렸다]]", fx: glitch}
    sync: {at: [0, "반전도", "절반이"]}

  - say: "누가 이겼는지, 나한테는 뭐가 맞는지. 클로드 코드 대 코덱스, 지금 시작합니다."
    instruct: "영화 예고편처럼 낮고 힘 있게."
    scene: {kind: intro, kicker: "같은 숙제 5개, 누가 이겼을까?", title: "Claude Code vs Codex", sub: "클로드 코드 vs 코덱스 · [[초보용 완전 비교]]"}
    sync: {at: [0, "나한테는", "클로드"]}

  - say: "오늘 순서는요, 둘이 뭔지, 가격, 5라운드 시험 결과, 회사 자랑을 그대로 믿으면 안 되는 이유, 그리고 나한테 맞는 도구 고르기예요."
