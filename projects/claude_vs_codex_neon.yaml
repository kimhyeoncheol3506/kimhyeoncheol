    sync: {at: [0, "모델과", "엔진이고,", "자동차예요."]}

  - say: "그래서 같은 엔진이라도 자동차에 따라 달리는 느낌이 달라요. 오늘은 엔진과 자동차를 한 세트로 비교하는 거예요."
