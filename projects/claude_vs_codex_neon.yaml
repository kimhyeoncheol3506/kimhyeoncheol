    sync: {at: [0, "오퍼스", "66.4점,", "57.9점이라고"]}

  - say: "그런데 각주를 보면, 두 모델이 생각하는 깊이 설정이 서로 달랐어요. 그리고 오픈에이아이는 또 자기들한테 유리한 시험 결과를 내놓죠."
