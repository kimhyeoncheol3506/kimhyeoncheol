    sync: {at: [0, "각주를", "생각하는", "오픈에이아이는"]}

  - say: "쉽게 말하면, 숙제를 낸 학생이 자기 숙제를 스스로 채점하는 거예요. 그래서 회사 성적표는 참고만 하고, 직접 써 보는 게 제일 정확해요."
