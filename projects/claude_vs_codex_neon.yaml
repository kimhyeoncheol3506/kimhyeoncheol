    source: "Claude Code 문서 · openai/codex README"
    scene: {kind: flow, tag: 둘 다 하는 일, label: "읽고 · 고치고 · [[실행까지]]", nodes: [{glyph: "📂", name: 코드 읽기, sub: 내 폴더 안에서}, {glyph: "✎", name: 고치기, sub: 파일 직접 수정}, {glyph: "▶", name: 실행 · 확인, sub: 잘 되나 시험}]}
    sync: {at: [0, "읽고,", "고치고,", "실행까지"]}

  - say: "클로드 코드는 클로드를 만든 앤트로픽의 도구이고, 코덱스는 챗지피티를 만든 오픈에이아이의 도구예요."
    source: "Claude Code 문서 · openai/codex README"
    scene: {kind: icons, tag: 누가 만들었나, label: "회사가 [[달라요]]", items: [{glyph: "✳", name: "클로드 코드 · 앤트로픽", color: "#FF8A3D"}, {glyph: "VS", name: 맞대결}, {glyph: ">_", name: "코덱스 · 오픈AI", color: "#5B8CFF"}]}
    sync: {at: [0, "클로드", "코덱스는"]}

  - say: "여기서 헷갈리기 쉬운 게 있어요. 모델과 도구는 달라요. 모델은 자동차 엔진이고, 클로드 코드나 코덱스는 그 엔진을 얹은 자동차예요."
    source: "참고 영상 3편 공통 비유"
    instruct: "비유를 들려주듯 다정하고 천천히."
