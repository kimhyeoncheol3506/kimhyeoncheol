    scene: {kind: list, num: "1", title: 수동 승인, items: ["동작 [[하나하나]] 허락", "가장 느리지만", "[[가장 안전]] · 처음 쓸 때 추천"]}
    sync: {at: [0, "수동", "허락을", "안전해요."]}

  - say: "둘째, 자동 승인. 허락 없이 계속 일하지만, 동작마다 안전 검사가 따로 붙어요. 지금 기본으로 켜져 있는 모드예요."
    source: "Claude 도움말 · 안전하게 쓰기"
    scene: {kind: list, num: "2", title: 자동 승인, items: ["허락 없이 [[계속 진행]]", "동작마다 [[안전 검사]]", "지금 [[기본값]]"]}
    sync: {at: [0, "자동", "안전", "기본으로"]}

  - say: "셋째, 모든 승인 건너뛰기. 묻지도 않고 검사도 안 해요. 공식 문서도 완전히 믿을 수 있을 때만 쓰라고 해요."
    source: "Claude 도움말 · 권한 안내"
    instruct: "낮고 단호하게, 경고하듯."
    scene: {kind: warn, tag: 3번 모드, title: "모든 승인 [[건너뛰기]]", lines: ["묻지도 않고 · 검사도 안 함", "초보는 쓰지 마세요"]}
    sync: {at: [0, "건너뛰기.", "검사도"], beats: ["완전히"]}

  - say: "제 추천은 이래요. 처음엔 수동 승인으로 클로드가 어떻게 일하는지 지켜보고, 익숙해지면 자동 승인으로 바꾸세요."
    instruct: "다정하게 조언하듯."
    scene: {kind: flow, tag: 뉴럴서랍 추천, label: "처음엔 [[천천히]]", nodes: [{glyph: "1", name: 수동 승인, sub: 지켜보기}, {glyph: "→", name: 익숙해지면, sub: 며칠 써 보고}, {glyph: "2", name: 자동 승인, sub: 편하게}]}
    sync: {at: [0, "수동", "익숙해지면", "자동"]}

  - say: "꿀팁 하나 더요. 여러 탭을 같이 시키고 싶으면, 그 탭들을 클로드 탭 그룹 안으로 끌어다 넣어야 해요. 그냥 열어 두기만 하면 클로드가 못 봐요."
    source: "Claude 도움말 · 시작하기"
    scene: {kind: warn, tag: 꿀팁, title: "탭은 [[그룹 안으로]]", lines: ["클로드 탭 그룹으로 끌어다 넣기", "그냥 열어 두면 못 봐요"]}
    sync: {at: [0, "여러", "끌어다", "그냥"]}

  - say: "정리하면, 웹 스토어에서 설치하고, 압정으로 고정하고, 처음엔 수동 승인 모드로 시작하세요."
    scene: {kind: recap, slash: /setup, items: [{k: 설치, v: "웹 스토어 · 앤트로픽 확인"}, {k: 고정, v: "퍼즐 → 압정"}, {k: 모드, v: "처음엔 [[수동 승인]]"}]}
    sync: {at: [0, "웹", "압정으로", "수동"]}

  # ───────────── PART 04 /use
  - say: "네 번째, 이제 제일 재밌는 부분이에요. 어떤 일을 맡기면 좋을까요?"
