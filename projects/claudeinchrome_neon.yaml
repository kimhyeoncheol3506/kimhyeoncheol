    instruct: "궁금증을 끌어올리듯, 질문 끝을 올린다."
    scene: {kind: part, num: PART 02, slash: /who, title: "누가 쓸 수 있어요?"}
    sync: {at: [0, "누가"], beats: ["두"]}

  - say: "먼저 짧은 역사부터요. 2025년 8월, 딱 1,000명만 써 보는 실험으로 시작했어요."
    source: "Anthropic News (2025-08-25)"
    scene:
