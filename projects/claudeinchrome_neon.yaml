  - say: "그다음 2025년 12월에 모든 유료 요금제로 넓어졌고, 2026년 8월 26일에 드디어 정식으로 출시됐어요."
    source: "Claude 릴리스 노트 · 정식 출시 발표 (2026-08-26)"
    instruct: "'정식으로 출시'에 힘을 주며 밝게."
    scene: {kind: hook, small: "정식 출시", line1: "2026년", line2: "[[8월 26일]]", fx: stamp}
    sync: {at: [0, "2026년", "8월"], beats: ["12월에", "드디어"]}

  - say: "참고로 일부 영상에서는 출시가 '3주 전'이라고 하는데, 공식 발표 날짜는 8월 26일이 맞아요. 그리고 옆 칸에는 아직 베타, 그러니까 시험판이라는 딱지가 붙어 있어요."
    source: "정식 출시 발표 · Claude 도움말 '안전하게 쓰기'"
    instruct: "바로잡아 주듯 차분하고 정확하게."
    scene: {kind: split, left: {glyph: "✕", title: 잘못 알려진 것, lines: ["출시 '3주 전'"]}, right: {glyph: "✓", title: 공식 발표, lines: ["[[2026년 8월 26일]]", "옆 칸은 아직 베타"]}}
    sync: {at: [0, "참고로", "공식"], beats: ["베타,", "딱지가"]}

  - say: "중요한 건 요금이에요. 클로드 인 크롬은 무료 요금제에서는 쓸 수 없어요. 제일 싼 프로 요금제, 한 달 20달러부터 쓸 수 있어요."
    source: "claude.com/pricing (2026-11-04)"
    instruct: "중요한 정보를 짚어 주듯 분명하게."
    scene: {kind: split, left: {glyph: "✕", title: 무료 요금제, lines: ["[[사용 불가]]"]}, right: {glyph: "✓", title: 유료 요금제, lines: ["프로 [[월 20달러]]부터", "맥스 · 팀 · 기업용도 OK"]}}
    sync: {at: [0, "요금이에요.", "무료", "프로"], beats: ["20달러부터"]}

  - say: "그리고 크롬에서만 돼요. 휴대폰에서는 안 되고, 컴퓨터의 구글 크롬에서 써야 해요."
