scenes:
  # ───────────── 후킹
  - say: "AI한테 물어보면 답은 잘 알려 주죠. 그런데 그다음 클릭은, 결국 다 내가 해야 했어요."
    instruct: "공감하듯 가볍게 시작해서, 뒷문장은 살짝 한숨 섞어."
    scene: {kind: hook, small: "지금까지는", line1: "답은 AI가", line2: "[[클릭은 내가]]", fx: glitch}
    sync: {at: [0, "AI한테", "그런데"], beats: ["클릭은,"]}

  - say: "그런데 이제는 달라요. 부탁 한마디면, AI가 내 크롬 안에서 직접 칸을 채우고 버튼 앞까지 가요."
    instruct: "놀라운 장면을 보여 주듯 신나게."
    scene:
      kind: browser
      url: forms.example.com/apply
      ptitle: "체험 학습 [[신청서]]"
      fields: [{label: 이름, value: 김뉴럴}, {label: 학년, value: 중학교 2학년}, {label: 날짜, value: 11월 15일 토요일}]
      button: 제출
      stop: "여기서 멈춤"
      panel: [{who: me, text: "이 신청서 내 정보로 채워 줘"}, {who: ai, text: "세 칸을 채웠어요. 제출은 직접 눌러 주세요."}]
      mode: 예시 화면
    sync: {at: [0, "부탁", "AI가", "크롬", "칸을", "버튼", "가요."]}

  - say: "마우스가 혼자 움직인다고요? 네, 진짜예요."
    instruct: "깜짝 놀란 듯 질문을 끌어올렸다가, 뒷말은 자신 있게."
    scene: {kind: hook, small: "잠깐,", line1: "마우스가", line2: "[[혼자 움직인다고?]]", punch: true}
    sync: {at: [0, "마우스가", "혼자"], beats: ["진짜예요."]}

  - say: "이 프로그램을 설치한 사람이 벌써 2,100만 명이 넘어요."
    source: "Chrome 웹 스토어 (2026-11-04 확인)"
    instruct: "숫자를 또박또박 힘 있게."
    scene: {kind: number, tag: 크롬 웹 스토어, label: "설치한 사람", to: 2100, unit: "만+", sub: "벌써 [[2,100만 명]]이 넘게 설치"}
    sync: {at: [0, "설치한", "2,100만"]}

  - say: "그런데 잘못 쓰면 위험한 부분도 있어요. 이 영상을 끝까지 보셔야 하는 이유예요."
    instruct: "목소리를 낮추고 진지하게."
    scene: {kind: hook, small: "하지만", line1: "잘못 쓰면", line2: "[[위험할 수도]]", fx: stamp}
    sync: {at: [0, "잘못", "위험한"], beats: ["끝까지"]}

  - say: "중학생도 이해할 수 있게 천천히 알려 드릴게요. 클로드 인 크롬, 시작합니다."
    instruct: "영화 예고편처럼 낮고 힘 있게."
    scene: {kind: intro, kicker: "AI가 내 크롬에서 직접 클릭한다", title: "Claude in Chrome", sub: "클로드 인 크롬 · [[처음부터 끝까지]]"}
    sync: {at: [0, "천천히", "클로드"]}

  - say: "오늘 순서는요, 이게 뭔지, 누가 쓸 수 있는지, 설치하는 법, 맡기기 좋은 일, 안전하게 쓰는 법, 그리고 다른 AI 브라우저와 비교까지요."
    scene:
      kind: agenda
      items:
        - {slash: /what, text: "이게 뭐예요?"}
        - {slash: /who, text: "누가 쓸 수 있어요?"}
        - {slash: /setup, text: 설치하고 설정하기}
        - {slash: /use, text: 맡기기 좋은 일}
        - {slash: /safe, text: 안전하게 쓰기}
        - {slash: /vs, text: 다른 AI 브라우저와 비교}
    sync: {at: [0, "뭔지,", "누가", "설치하는", "맡기기", "안전하게", "비교까지요."]}

  # ───────────── PART 01 /what
  - say: "첫 번째, 클로드 인 크롬이 도대체 뭔지부터 알아볼게요."
    chapter: "PART 01 · 클로드 인 크롬이 뭐예요?"
    scene: {kind: part, num: PART 01, slash: /what, title: "이게 뭐예요?"}
    sync: {at: [0, "클로드"], beats: ["도대체"]}

  - say: "클로드는 앤트로픽이라는 회사가 만든 AI예요. 그리고 크롬은 우리가 매일 쓰는 인터넷 창, 구글 크롬이죠."
    instruct: "단어를 하나씩 소개하듯 또박또박."
    scene: {kind: icons, tag: 단어 두 개, label: "[[클로드]] + [[크롬]]", items: [{glyph: "AI", name: "클로드 · 앤트로픽의 AI"}, {glyph: "＋", name: 합치면}, {glyph: "🌐", name: "크롬 · 인터넷 창"}]}
    sync: {at: [0, "클로드는", "그리고", "크롬은"]}

  - say: "클로드 인 크롬은, 크롬에 끼워 쓰는 작은 프로그램이에요. 이런 걸 확장 프로그램이라고 불러요."
    source: "Chrome 웹 스토어"
    instruct: "새 단어 '확장 프로그램'에서 잠깐 멈췄다가 힘을 준다."
    scene: {kind: hook, small: "새 단어", line1: "크롬에 끼우는 작은 프로그램", line2: "[[확장 프로그램]]", fx: type, size: 96}
    sync: {at: [0, "클로드", "확장"]}

  - say: "휴대폰에 케이스를 끼우면 기능이 하나 늘어나죠? 확장 프로그램도 똑같아요. 크롬에 끼우면, 크롬이 새 기능을 갖게 돼요."
    instruct: "비유를 들려주듯 다정하고 부드럽게."
    scene: {kind: flow, tag: 비유하면, label: "끼우면 [[기능이 늘어나요]]", nodes: [{glyph: "📱", name: 휴대폰 + 케이스, sub: 기능 하나 추가}, {glyph: "🧩", name: 크롬 + 확장 프로그램, sub: 새 기능 추가}, {glyph: "✨", name: 클로드가 들어옴, sub: 크롬 안에서 일함}]}
    sync: {at: [0, "휴대폰에", "확장", "크롬에"], beats: ["새"]}

  - say: "설치하면 크롬 오른쪽에 작은 옆 칸이 생겨요. 여기가 클로드랑 대화하는 곳이에요. 영어로는 사이드 패널이라고 해요."
    source: "Claude 도움말 · 시작하기"
    scene:
      kind: browser
      url: news.example.com
      ptitle: "오늘의 [[과학 뉴스]]"
      rows: ["화성 탐사선, 새 사진 보내와", "바다 쓰레기 줍는 로봇 등장", "올겨울 첫눈은 언제?"]
      panel: [{who: me, text: "안녕, 클로드!"}]
      app: 클로드
      mode: "← 여기가 '옆 칸'(사이드 패널)"
    sync: {at: [0, "오른쪽에", "여기가", "영어로는", "사이드", "패널이라고"]}

  - say: "예전 AI는 답만 알려 주는 선생님이었다면, 클로드 인 크롬은 내 옆자리에 앉아서 마우스를 대신 잡아 주는 친구예요."
    instruct: "앞은 담담하게, '마우스를 대신 잡아 주는 친구'에 힘을 준다."
    scene: {kind: split, left: {glyph: "💬", title: 예전 AI, lines: ["답만 알려 줌", "클릭은 [[내가]]"]}, right: {glyph: "🖱", title: 클로드 인 크롬, lines: ["직접 읽고 · 누르고", "칸 채우기는 [[클로드가]]"]}}
    sync: {at: [0, "예전", "클로드"], beats: ["친구예요."]}

  - say: "클로드가 할 수 있는 일은 네 가지예요. 화면을 읽고, 버튼을 누르고, 글자를 치고, 신청서 같은 칸을 채워요."
    source: "claude.com/chrome"
    scene: {kind: list, num: "4", title: 클로드가 하는 일, items: ["[[읽기]] : 화면 내용을 읽어요", "[[누르기]] : 버튼 · 링크 클릭", "[[치기]] : 검색창에 글자 입력", "[[채우기]] : 신청서 칸 채우기"]}
    sync: {at: [0, "네", "읽고,", "누르고,", "치고,", "채워요."]}

  - say: "어떻게 보는 걸까요? 클로드는 화면을 사진처럼 찍어서 보고, 어디에 버튼이 있는지 찾아서 눌러요. 사람이 눈으로 보고 손으로 누르는 것과 비슷하죠."
    source: "Claude 도움말 · 시작하기"
    instruct: "궁금증을 던졌다가 친절하게 풀어 준다."
    scene: {kind: flow, tag: 이렇게 일해요, label: "보고 · 찾고 · [[누르기]]", nodes: [{glyph: "📸", name: 화면 찍기, sub: 사진처럼}, {glyph: "🔍", name: 버튼 찾기, sub: "어디 있지?"}, {glyph: "👆", name: 누르기, sub: 사람처럼}]}
    sync: {at: [0, "찍어서", "찾아서", "눌러요."], beats: ["사람이"]}

  - say: "제일 큰 장점은, 내가 이미 로그인한 사이트를 그대로 쓴다는 거예요. 따로 연결하거나 설정할 필요가 없어요."
    source: "claude.com/chrome"
    scene: {kind: hook, small: "제일 큰 장점", line1: "내가 로그인한 사이트", line2: "[[그대로 써요]]", fx: stamp}
    sync: {at: [0, "로그인한", "그대로"], beats: ["필요가"]}

  - say: "정리하면, 클로드 인 크롬은 크롬에 끼우는 확장 프로그램이고, 옆 칸에 부탁하면 클로드가 직접 읽고, 누르고, 채워요."
    instruct: "차분하게 정리하듯 또박또박."
    scene: {kind: recap, slash: /what, items: [{k: 정체, v: "크롬 [[확장 프로그램]]"}, {k: 부탁하는 곳, v: "오른쪽 옆 칸"}, {k: 하는 일, v: "읽기 · 누르기 · 채우기"}]}
    sync: {at: [0, "확장", "옆", "직접"]}

  # ───────────── PART 02 /who
  - say: "두 번째, 그럼 누가 쓸 수 있을까요?"
