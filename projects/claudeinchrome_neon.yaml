    scene: {kind: warn, tag: "어디서 돼요?", title: "컴퓨터의 [[크롬]]에서만", lines: ["휴대폰 · 태블릿은 안 돼요", "다른 인터넷 창은 공식 지원 안 함"]}
    sync: {at: [0, "크롬에서만", "휴대폰에서는"], beats: ["컴퓨터의"]}

  - say: "정리하면, 정식 출시는 2026년 8월 26일, 유료 요금제만, 그리고 컴퓨터 크롬에서만 쓸 수 있어요."
    scene: {kind: recap, slash: /who, items: [{k: 정식 출시, v: "2026년 8월 26일"}, {k: 요금, v: "[[유료]] · 프로 월 20달러부터"}, {k: 어디서, v: "컴퓨터 크롬"}]}
    sync: {at: [0, "정식", "유료", "컴퓨터"]}

  # ───────────── PART 03 /setup
  - say: "세 번째, 이제 직접 설치해 볼게요. 천천히 따라오세요."
    chapter: "PART 03 · 설치하고 설정하기"
    scene: {kind: part, num: PART 03, slash: /setup, title: 설치하고 설정하기}
    sync: {at: [0, "설치해"], beats: ["천천히"]}

  - say: "먼저 크롬을 열고, 크롬 웹 스토어에서 클로드를 검색해요. 만든 곳이 앤트로픽인지 꼭 확인하세요. 비슷한 가짜가 있을 수 있거든요."
    source: "Chrome 웹 스토어"
    scene: {kind: list, num: "1", title: 찾기, items: ["크롬 열기", "[[크롬 웹 스토어]]에서 '클로드' 검색", "만든 곳 = [[앤트로픽]] 확인"]}
    sync: {at: [0, "크롬을", "웹", "앤트로픽인지"], beats: ["가짜가"]}

  - say: "찾았으면 크롬에 추가 버튼을 누르고, 내 클로드 계정으로 로그인해요."
    source: "Claude 도움말 · 시작하기"
    scene:
      kind: browser
      url: chromewebstore.google.com
      ptitle: "Claude · [[앤트로픽]]"
      rows: ["클로드가 크롬에서 읽고, 누르고, 채워요"]
      button: "Chrome에 추가"
      panel: [{who: me, text: "설치는 내가 직접!"}]
      mode: 설치 화면 예시
    sync: {at: [0, "찾았으면", "크롬에", "추가", "로그인해요."]}

  - say: "그다음 오른쪽 위에 있는 퍼즐 조각 모양 아이콘을 눌러요. 목록에서 클로드 옆의 압정 모양을 누르면, 클로드 아이콘이 항상 보이게 고정돼요."
    source: "Claude 도움말 · 시작하기"
    instruct: "손으로 짚어 주듯 천천히."
    scene: {kind: flow, tag: 아이콘 고정, label: "퍼즐 → 압정 → [[고정]]", nodes: [{glyph: "🧩", name: 퍼즐 조각, sub: 오른쪽 위}, {glyph: "📌", name: 압정 누르기, sub: 클로드 옆}, {glyph: "✓", name: 아이콘 고정, sub: 항상 보여요}]}
    sync: {at: [0, "퍼즐", "압정", "고정돼요."]}

  - say: "이제 클로드 아이콘을 누르면 오른쪽에 옆 칸이 열려요. 처음 들어가는 사이트에서는 클로드가 물어봐요. 이 사이트에서 일해도 될까요?"
    source: "Claude 도움말 · 권한 안내"
