# 「클로드 인 크롬 — AI가 내 크롬에서 직접 클릭한다」 (S2 neon · 여의도여자) 약 11분, 중학생 눈높이
# 참고 영상(현철님 스크린샷 2026-11-04, 자막 analysis/claudeinchrome/): 코난쌤 prulDeo3giI · VIZENSOFT R6IPiuNS4KQ · 길호의 실전 AI FAou-K5Wad4 ·
#   AI 박사 닥블랙 6GPRGJMdNsA · AI 까꿍 _BzjNGOkhTI · SJ Tech _Yyic1TsGAk · 옆자리 연구원 HVbAZc1YfQk · 메이커 에반 x8wET33DqfI
#   길이 = 참고 8편 평균(약 11분). 문장은 새로 씀. 정보·예시·원칙('칸은 AI, 마지막 버튼은 나')만 가져옴.
# 사실 확인: docs/research/claude-in-chrome-factsheet-2026-11-04.md (공식 페이지를 연 것만 숫자로 씀)
#   정식 출시 2026-08-26(한국 영상의 '26일·3주 전'은 틀림 → 8월 26일로 바로잡음). 기본 모델은 공식 문서에 없음 → 말하지 않음.
#   사이드 패널은 안전 문서에 아직 '베타' 표기 → "정식 출시됐지만 옆 칸엔 아직 베타 딱지"로 말함.
# EDIT-13 화면 모양: 앞 영상들(별자리·민트·다가가기·떠오르기)과 다르게 → 남색 바탕·주황 강조·원근 격자·꺾쇠 틀·옆으로 흐르는 카메라·옆에서 밀려오는 등장.
# 새 장면: browser(브라우저 창 + 옆 칸 대화, 커서가 스스로 칸을 채우고 마지막 버튼 앞에서 멈춤)
