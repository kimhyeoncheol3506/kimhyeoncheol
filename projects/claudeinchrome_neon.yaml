    sync: {at: [0, "열려요.", "이"]}

  - say: "대답은 세 가지예요. 이번만 허용, 이 사이트는 항상 허용, 아니면 거절. 처음 쓸 때는 첫 번째 대답을 고르세요."
    source: "Claude 도움말 · 권한 안내"
    scene: {kind: icons, tag: 대답 세 가지, label: "처음엔 [[이번만 허용]]", items: [{glyph: "1회", name: 이번만 허용, color: "#FF9F45"}, {glyph: "항상", name: 이 사이트 항상 허용}, {glyph: "✕", name: 거절}]}
    sync: {at: [0, "이번만", "항상", "거절."], beats: ["첫"]}

  - say: "여기서 제일 중요한 설정이 있어요. 바로 권한 모드예요. 클로드가 얼마나 스스로 움직일지 정하는 거예요."
