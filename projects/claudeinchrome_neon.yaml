  - say: "다섯 번째, 자주 하는 일은 단축키로 저장해 두세요. 잘 된 부탁을 저장해 두면, 다음에는 빗금 하나만 쳐서 바로 다시 시킬 수 있어요."
    source: "Claude 도움말 · 시작하기"
