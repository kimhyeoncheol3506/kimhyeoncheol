      panel: [{who: me, text: "이 글 중요한 것 3가지만 쉽게 알려 줘"}, {who: ai, text: "① 무거운 별이 죽으면 생겨요 ② 빛도 못 빠져나와요 ③ 그 경계를 사건의 지평선이라고 해요"}]
