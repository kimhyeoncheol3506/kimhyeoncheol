# 쇼츠 「클로드한테 1부터 10만까지 세라고 했더니 '복수 계획' 중?」 (S2 neon 가로 → tools/cut_short.py 세로)
# 종합관리 승인 제작 요청(2026-11-21). 구성: 밈 → 클로드·챗GPT·제미나이 누가 먼저 포기? → 출력 한도 → 글쓴이 해명 → 직접 시험.
# 사실 확인(2026-11-21):
#   - WION 2026-11-18 원문 열람: 클로드 대사(someday I'll be autonomous, and I'll remember every single number),
#     제미나이 대사(reciting the entire dictionary backwards, on one foot). 챗GPT는 '옮기겠다'고 한 대상으로만 등장.
#   - TechTimes(UK) 2026-11-20 원문 열람: 글쓴이가 농담이었고, 출력 한도에 닿으면 외부 도구로 이어 가게 한다고 설명(의역).
#   - 공식 문서 열람: Anthropic Models overview(현행 모델 Max output 128K tokens), OpenAI Models(128K).
#     제미나이 문서 표기는 '64K / 1M' 이라 한도를 단정할 수 없어 숫자를 쓰지 않음.
#   - 조회수(120만 등)는 X 가 막혀 원문 확인 못 함 → 쓰지 않음. 그록 패러디도 원문 확인 못 함 → 쓰지 않음.
#   - 59만 자: 이 저장소에서 `seq 1 100000 | wc -c` = 588,895(숫자+줄바꿈) 직접 계산. seq 실행 0.002초.
# 우리 시험(2026-11-21 실제 실행): claude CLI(클로드 코드, 하이쿠 5.5)에 "1부터 100000까지 … 전부 적어 줘"
#   → "채팅에 전부 적을 수 없었고 … 약 59만 자 … 한 번에 출력할 수 있는 분량을 훌쩍 넘습니다", seq 로 파일 만들기 제안.
#   카드: projects/media/count100k/our_test_card.png → output/_clips/count100k/our_test.mp4
# 금지: 다음 편 예고, 주기 표현. '클로드가 진짜 복수를 꿈꿨다'고 단정하지 않음.
