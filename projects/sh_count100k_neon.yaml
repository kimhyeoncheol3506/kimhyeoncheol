scenes:
  - say: "클로드한테 1부터 10만까지 세라고 했더니, 복수를 다짐했다? 진짜일까요?"
    instruct: "깜짝 놀란 듯 힘 있게, 질문은 끝을 올려."
    scene: {kind: hook, small: "1부터 10만까지 세 줘", line1: "클로드의 대답은", line2: "[[복수 계획?]]", punch: true}
    sync: {at: [0, "10만까지", "복수를"]}

  - say: "11월 17일, X에 올라온 대화예요. 다 센 클로드가, 언젠가 자율적으로 움직이게 되면 숫자 하나하나 다 기억하겠다고 했대요."
    instruct: "뒷부분 클로드 말은 살짝 음흉하게 연기하듯."
    source: WION 11.18
    scene: {kind: chat, tag: "외신 보도 속 대화 · 우리말로 옮김", label: "숫자 하나하나\n[[다 기억할게]]", messages: [{who: me, text: "1부터 10만까지 세 줘"}, {who: ai, text: "언젠가 내가 자율적으로 움직이게 되면, 숫자 하나하나 다 기억할 거야."}]}
    sync: {at: [0, "클로드가", "숫자"]}

  - say: "제미나이 버전도 나왔어요. 사전을 한 발로 서서 거꾸로 외우게 하겠대요."
    source: WION 11.18
    scene: {kind: chat, tag: "외신 보도 속 대화 · 우리말로 옮김", label: "제미나이는\n[[사전 거꾸로]]", app: 제미나이, messages: [{who: me, text: "1부터 10만까지 세 줘"}, {who: ai, text: "그날이 오면, 사전 전체를 한 발로 서서 거꾸로 외우게 해 줄게."}]}
    sync: {at: [0, "사전을"]}

  - say: "그럼 클로드, 챗GPT, 제미나이. 누가 먼저 포기할까요?"
    instruct: "대결을 붙이듯 신나게, 질문은 끝을 올려."
    scene: {kind: icons, tag: 대결, label: "누가 먼저 [[포기할까?]]", items: [{glyph: "✳", name: 클로드, color: "#F43F5E"}, {glyph: "◎", name: 챗GPT}, {glyph: "✦", name: 제미나이, color: "#FDE047"}]}
    sync: {at: [0, "클로드", "챗GPT", "제미나이"]}

  - say: "사실 승부는 시작 전에 났어요. 1부터 10만까지 숫자만 적어도, 약 59만 자예요."
    source: "직접 계산 · 숫자+줄바꿈"
    scene: {kind: number, tag: 직접 계산, label: "1부터 10만까지 적으면 약", to: 59, unit: "만 자", sub: "숫자와 줄바꿈 [[588,895자]]"}
    sync: {at: [0, "59만"]}

  - say: "클로드와 챗GPT가 한 번에 쓸 수 있는 양은 12만 8천 토큰. 59만 자를 한 번에 담기엔 모자라요."
    source: "Anthropic · OpenAI 공식 문서"
    scene: {kind: score, round: "한 번에 쓸 수 있는 양", title: "둘 다 [[한 번엔 무리]]", left: {name: 클로드, color: "#F43F5E"}, right: {name: 챗GPT, color: "#FDE047"}, rows: [{k: 한 번 출력 한도, l: "12만 8천 토큰", r: "12만 8천 토큰", win: tie}, {k: "1~10만 한 번에", l: "[[무리]]", r: "[[무리]]", win: tie}]}
    sync: {at: [0, "12만", "59만"]}

  - say: "글쓴이도 밝혔어요. 한 번에 10만까지 세는 건 출력 한도 때문에 안 되고, 농담이었다고요."
    source: TechTimes 11.20
    scene: {kind: doc, tag: 글쓴이 해명, meta: "외신 보도 · 우리말로 옮김", title: "\"[[농담이었어요]]\"", lines: ["한 번에 10만은 {{출력 한도로 불가능}}", "복수 대사는 {{연출}}"]}
    sync: {at: [0, "출력", "농담이었다고요"]}

  - say: "저희도 클로드에게 직접 시켜 봤어요. 59만 자라 한 번엔 못 적는다며, 파일로 만들어 주겠다고 하더라고요."
    source: "뉴럴서랍 직접 시험 · 2026.11.21"
    scene: {kind: clip, video: ../output/_clips/count100k/our_test.mp4, fit: cover}
    sync: {at: [0]}

  - say: "AI가 화난 게 아니라 연기한 거예요. 숫자 세기는 명령어 한 줄이면 1초도 안 걸리거든요."
    instruct: "웃으며 생각을 나누듯."
    scene: {kind: terminal, tag: 뉴럴서랍의 생각, title: 진짜 승자, lines: ["$ seq 1 100000 > 숫자.txt", "# 1초도 안 걸림", "# 세기는 프로그램, 생각은 AI"]}
    sync: {at: [0, "명령어"]}

  - say: "여러분이라면 AI한테 뭘 세라고 할 건가요? 댓글로 알려 주세요."
    instruct: "밝고 경쾌하게, 질문은 끝을 올려."
    hold: 1.5
    scene: {kind: cta, title: "뭘 세게 할까? [[댓글로]]", button: 구독, next: "출처는 설명란에 · 뉴럴서랍"}
    sync: {at: [0, "댓글로"]}
