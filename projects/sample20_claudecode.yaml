scenes:
  - say: "숙제로 나만의 웹페이지를 만들어야 하는데, 코딩은 한 줄도 몰라요. 그런데 말 한마디만 했더니, 이게 딸깍 만들어졌어요."
    instruct: "신기한 걸 보여 주듯 밝고 들뜬 목소리로, '딸깍'에 힘을 준다."
    scene: {kind: chat, tag: "딸깍 · 예시", label: "말 한마디로\n[[웹페이지 완성]]", app: 클로드 코드, messages: [{who: me, text: "시험 D-day 랑 할 일 목록이 있는 예쁜 웹페이지 만들어 줘"}, {who: ai, text: "index.html 파일을 만들었어요. 열어 보시면 D-day 가 빨간색으로 보여요!"}]}
    sync: {at: [0, "숙제로", "말"], beats: ["몰라요."]}

  - say: "이걸 만든 건 사람이 아니라, 클로드 코드라는 AI예요. 제가 한 일은 원하는 걸 말한 것뿐이에요."
    instruct: "비밀을 털어놓듯 웃으며, '말한 것뿐'에 힘을 준다."
    scene: {kind: hook, small: "제가 한 일은", line1: "원하는 걸", line2: "[[말한 것뿐]]", fx: stamp}
    sync: {at: [0, "제가", "말한"], beats: ["클로드"]}

  - say: "근데 막상 해 보려고 하면, 까만 화면에 글자만 가득해서 겁부터 나죠? 괜찮아요. 오늘은 진짜 처음인 분 기준으로, 아주 쉽고 천천히 갈게요."
    instruct: "공감하듯 다정하게, 뒷문장은 든든하게."
    scene: {kind: terminal, tag: 솔직히 무섭죠, title: "처음 보는 까만 화면", lines: ["$ _", "# 뭘 쳐야 하지…?", "# 괜찮아요, 오늘은 천천히 갈게요"]}
    sync: {at: [0, "까만", "겁부터", "괜찮아요."]}

  - say: "터미널을 몰라도, 영어를 몰라도 괜찮아요. 이 영상 하나로 설치부터 첫 작품까지, 같이 딸깍 해 봐요."
    instruct: "약속하듯 힘 있게, '딸깍'에서 신나게."
    scene: {kind: hook, small: "오늘의 약속", line1: "설치부터 첫 작품까지", line2: "[[같이 딸깍]]", fx: glitch}
    sync: {at: [0, "설치부터", "딸깍"], beats: ["몰라도,"]}

  - say: "진짜 쌩초보를 위한, 클로드 코드 완전 정복. 시작할게요."
    instruct: "영화 예고편처럼 낮고 힘 있게."
    scene: {kind: intro, kicker: "진짜 쌩초보를 위한", title: "Claude Code", sub: "말 한마디에 [[딸깍]]"}
    sync: {at: [0, "클로드", "시작할게요."]}
