# 에디토리얼(종이 인포그래픽) 스타일 컨셉 파일럿. 참고 영상: 미주일기 「앤스로픽이 예측한 2030년」(RfzOmJKdm5g)
# 스타일 비교를 위해 같은 1차 자료(앤스로픽 보고서)를 썼다. 문장·구성은 우리 것. 숫자는 모두 원문을 열어 확인함(2026-11-02).
#   python editorial/make_editorial.py projects/pilot_editorial_ai2030.yaml
# 장면 종류와 값은 editorial/scene.html 머리말, 규칙 수치는 style.yaml editorial:
slug: pilot_editorial_ai2030
format: pilot
title: AI를 만드는 사람들이 본 2030년 (컨셉 파일럿)
summary: |
  앤스로픽이 2026년 10월 16일 공개한 설문 보고서(미국 성인 10,980명, 자사 직원 1,334명)를 바탕으로,
  기술의 최전선에 있는 사람들과 일반인이 2030년을 얼마나 다르게 보는지 짚었습니다.
tags: ["#앤스로픽", "#AI전망", "#2030년", "#AI일자리"]
voice: {backend: auto, speed: 1.05}
bgm_mood: calm
disclaimer: 영상은 특정 종목의 매수·매도 권유가 아닙니다.
sources:
  - id: anthropic_gap
    outlet: Anthropic
    title: The AI expectations gap
    date: 2026-10-16
    url: https://www.anthropic.com/research/ai-expectations-gap
    verified: true                # 원문을 열어 문장 단위로 확인함(2026-11-02)
    facts: ["2026-10-16", "2026.10.16", "10,980", "1,334", "91%", "39%", "75%", "28%", "2030", "2027", "80%", "5%", "12.2%", "4.2%", "8월"]

scenes:
  - say: "2030년, 인공지능은 노벨상급 발견을 해낼 수 있을까요?"
    scene: {kind: year, text: "2026", to: "2030", up: 낙관, down: 비관}
    sync: {at: [0, "인공지능은", "발견을"]}

  - say: "앤스로픽이 미국 성인 10,980명과 자사 직원 1,334명에게 물었습니다."
    source: "Anthropic, The AI expectations gap (2026.10.16)"
    scene:
      kind: doc
      tag: 보고서
      meta: "Anthropic · Economics · 2026.10.16"
      title: The AI expectations gap
      lines:
        - "In August 2026, we surveyed two groups: a sample of US adults"
        - "that was nationally representative and [[Anthropic staff.]]"
        - "10,980 US adults · 1,334 staff respondents"
    sync: {at: [0, "직원"]}

  - say: "가능하다고 본 미국 성인은 39%, 직원은 91%였습니다."
    source: "Anthropic, The AI expectations gap (2026.10.16)"
    scene:
      kind: bars
      theme: dark
      title: 2030년까지 AI가 노벨상급 발견
      sub: 가능하다고 답한 비율
      unit: "%"
      max: 100
      items:
        - {label: 미국 성인, value: 39, color: pink}
        - {label: 앤스로픽 직원, value: 91, color: sky}
    sync: {at: [0, "39%", "91%"]}

  - say: "내 일을 인공지능이 대신할 몫도 28%와 75%로 갈렸습니다."
    source: "Anthropic, The AI expectations gap (2026.10.16)"
    scene:
      kind: waffle
      title: 내 업무 중 AI가 대신할 몫
      sub: 2030년 기준, 응답 평균
      groups:
        - {label: 미국 근로자, value: 28, color: red}
        - {label: 앤스로픽 직원, value: 75, color: navy}
    sync: {at: [0, "28%", "75%"]}

  - say: "만드는 사람들은 왜 다른 미래를 볼까요?"
    chapter: 기술의 최전선이 본 2030년
    scene: {kind: chapter, kicker: 오늘의 이야기, title: "기술의 최전선이 본\n2030년"}
