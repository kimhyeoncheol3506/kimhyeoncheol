# 참고 영상(현철님 스크린샷 2026-11-04, 자막 analysis/claudeinchrome/): 코난쌤 prulDeo3giI · VIZENSOFT R6IPiuNS4KQ · 길호의 실전 AI FAou-K5Wad4 ·
