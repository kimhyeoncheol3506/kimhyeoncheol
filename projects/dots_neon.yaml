scenes:
  # ───────────── 후킹
  - say: "내가 잠든 사이에도 AI가 일을 하고, 아침엔 내가 정할 것만 골라서 물어본다면, 어떨 것 같으세요?"
    source: "오픈에이아이 공식 도움말 · Meet dots"
    instruct: "궁금증을 확 끌어올리듯 힘 있게, 마지막 질문은 끝을 올려."
    scene: {kind: clip, video: ../output/_clips/dots/DotsNight.mp4}

  - say: "오픈에이아이가 내놓은 꺼지지 않는 AI 비서, 챗지피티 닷츠 이야기예요. 대화를 끝내도 일은 계속돼요."
    source: "오픈에이아이 공식 도움말"
    instruct: "놀라운 소식을 터뜨리듯 힘 있고 빠르게."
    scene: {kind: hook, small: "오픈에이아이의 새 비서", line1: "꺼지지 않는 AI", line2: "[[챗GPT 닷츠]]", fx: glitch}
    sync: {at: [0, "꺼지지", "챗지피티", "대화를"]}

  - say: "그런데 가장 싼 요금제가 한 달에 100달러예요. 누구나 가볍게 쓸 비서는 아니죠."
    source: "챗GPT 요금 안내"
    instruct: "의아한 듯, 숫자는 또박또박."
    scene: {kind: number, tag: 닷츠 시작 가격, label: "가장 싼 요금제 · 한 달", to: 100, unit: 달러, sub: "프로 요금제부터 · [[무료는 없어요]]"}
    sync: {at: [0, "가장", "누구나"]}

  - say: "그래서 진짜 궁금한 건 이거예요. 한국에서 되나? 그리고 내 메일과 계정을 맡겨도 정말 안전할까?"
    instruct: "의심스럽게, 두 질문 모두 끝을 올려."
    scene: {kind: hook, small: "진짜 궁금한 건", line1: "한국에서 될까?", line2: "[[맡겨도 안전할까?]]", fx: stamp}
    sync: {at: [0, "한국에서", "내"]}

  - say: "닷츠의 정체부터, 일하는 방식, 한국과 요금, 안전장치, 한계까지 한 번에 정리해 볼게요."
    instruct: "영화 예고편처럼 낮고 힘 있게."
    scene: {kind: intro, kicker: "잠든 사이에도 일하는 AI 비서", title: "ChatGPT dots", sub: "챗GPT 닷츠 · [[1부터 100까지]]"}
    sync: {at: [0, "일하는", "한국과", "한계까지"]}

  - say: "오늘 순서는요, 닷츠의 정체, 일하는 방식, 할 수 있는 일, 한국과 요금, 안전장치, 그리고 한계예요."
    scene:
      kind: agenda
      items:
        - {slash: /what, text: "닷츠가 뭐예요?"}
        - {slash: /how, text: "어떻게 일해요?"}
        - {slash: /use, text: "할 수 있는 일"}
        - {slash: /where, text: "한국 · 요금"}
        - {slash: /safe, text: "안전장치"}
        - {slash: /limit, text: "한계"}
    sync: {at: [0, "정체,", "일하는", "할", "한국과", "안전장치,", "한계예요."]}

  # ───────────── PART 01 /what
  - say: "첫 번째, 닷츠가 도대체 뭔지부터 볼게요."
    chapter: "PART 01 · 닷츠가 뭐예요?"
    scene: {kind: part, num: PART 01, slash: /what, title: "닷츠가 뭐예요?"}
    sync: {at: [0, "닷츠가"]}

  - say: "공식 소개는 이래요. 항상 켜져 있는 에이전트. 일을 계속 굴리다가, 내 결정이 필요할 때만 묻는다."
    source: "오픈에이아이 공식 도움말 · Meet dots"
    scene: {kind: doc, tag: 공식 소개, meta: "learn.chatgpt.com · Meet dots", title: "\"항상 켜져 있는 에이전트\"", lines: ["일을 {{계속 굴리고}}", "결정이 필요할 때만 {{나에게 묻기}}", "대화와 대화 {{사이에도}} 일함"]}
    sync: {at: [0, "항상", "일을", "내"]}

  - say: "보통 채팅은 질문하면 답하고 끝나요. 닷츠는 대화가 끝나도 그 일을 계속 챙겨요."
    source: "오픈에이아이 공식 도움말"
    scene: {kind: split, left: {glyph: "💬", title: 보통 채팅, lines: ["물으면 답하고", "[[끝]]"], color: "#9C8A78"}, right: {glyph: "🟠", title: 닷츠, lines: ["대화가 끝나도", "[[계속 챙김]]"], color: "#FF8A1F"}}
    sync: {at: [0, "보통", "닷츠는"]}

  - say: "비결은 클라우드에 따로 있는 자기 컴퓨터와 브라우저예요. 그래서 내 컴퓨터를 꺼도 일이 멈추지 않아요."
    source: "오픈에이아이 공식 도움말"
