summary: |
  앤트로픽이 11월 5일 클로드에 붙인 새 기능 '개인 재무(Personal Finance)'를 처음부터 끝까지 정리했습니다.
  은행·카드 계좌를 Plaid 로 연결하면 지출을 항목별로 나눠 주고, 두 번 결제된 돈·수수료·오른 요금을 찾아 주고, 월급날까지 남는 돈을 계산해 줍니다.
  누가 쓸 수 있는지(미국 Pro·Max·Ultra), 클로드가 보는 것과 안 보는 것, 학습에 쓰이는지, 못 하는 일, 챗GPT와의 비교, 그리고 한국에서 되는지까지 공식 글·도움말 기준으로 담았습니다.
