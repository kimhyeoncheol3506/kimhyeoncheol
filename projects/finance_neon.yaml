    facts: ["thousands of apps = 수천 개", "don't share username and password with your apps", "AES-256 and TLS"]
  - id: tc
    outlet: TechCrunch
    title: "Claude can now analyze your spending with its new Personal Finance tool"
    date: 2026-11-05
    url: https://techcrunch.com/2026/11/05/claude-can-now-analyze-your-spending-with-its-new-personal-finance-tool/
    verified: true
    facts: ["OpenAI's ChatGPT introduced similar personal finance tools in May = 5월", "Claude is playing catch-up"]

