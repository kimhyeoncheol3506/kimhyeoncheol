sources:
  - id: intro
    outlet: 클로드 공식 · 소개 글
    title: "Introducing Personal Finance in Claude"
    date: 2026-11-05
    url: https://claude.com/resources/articles/introducing-personal-finance-in-claude
    verified: true
    facts:
      - "November 5 2026 = 11월 5일, rolling out in beta this week"
      - "Pro, Max, and Ultra plans in the US"
      - "read-only: can't move, manage, or invest your money"
      - "no ads or sponsored recommendations; doesn't offer credit cards, loans, or savings accounts of its own"
      - "payday is still 10 days away = 열흘"
      - "Where did my money go this month? → total $4,309.37 = 4,309달러, more than half rent and utilities = 절반 넘게, $1,024.51 food and drink = 1,024달러"
      - "previous months → membership renewal; four payments before payday = 4건; left $1,393.22 = 1,393달러"
      - "charges that hit twice, unexpected fees, a bill that's crept up all year = 1년"
      - "Am I spending more than I make? What's an APR, and what has mine cost me this year?"
      - "weekly spending chart, a calendar of what's due, a dashboard"
      - "not designed to give investment advice; can make mistakes; check important figures with your bank"
      - "sign in to your bank yourself through Plaid; Claude doesn't ask for or see your bank password"
      - "bank name, account name, type, last four digits = 끝 4자리, balances and credit limits, up to two years of transactions = 2년"
      - "Personal Finance hub conversations aren't used to train our models; outside the hub your privacy settings apply"
      - "unlink anytime; a first step; licensed professionals and regulated firms"
  - id: help
    outlet: 클로드 도움말
    title: "Use Personal Finance with Claude"
    date: 2026-11-10
    url: https://support.claude.com/en/articles/18185620-use-personal-finance-with-claude
    verified: true
    facts:
      - "bank, credit card, loan, and investment accounts = 4종류"
      - "beta on Pro, Max, and Ultra plans in the US only; Claude, Claude Desktop, iOS, Android; not Free, Team, or Enterprise"
      - "widgets: spending, cash flow, accounts, subscriptions, upcoming bills, insights = 5개"
      - "steps: Personal Finance in side menu → Get started → choose goals or skip → Link accounts with Plaid → choose bank, sign in, choose accounts = 3단계"
      - "finish within 10 minutes = 10분; transactions take a few minutes to sync"
      - "link up to 16 banks = 16곳"
      - "up to 24 months of transactions = 24개월: amount, date, merchant, category, description"
      - "full number in account name or description may be visible"
      - "investments, loans, cards: balances and credit limits, not holdings, trades, rates, or terms"
      - "chats that used accounts: not saved to memory, not searched later, left out of monthly recap"
      - "asks before publishing an artifact; shared chat link shows figures"
      - "Turn Plaid off or on: + → Connectors → Plaid; Needs approval asks before each read"
      - "unlink → Claude stops reading; disconnect at my.plaid.com"
      - "last bank unlinked: dashboard, widgets, budgets deleted, can't be undone"
      - "balances can be a day or two old = 하루 이틀; linked through two logins may be counted twice = 두 번; bank can't be read → budget shows more money left"
      - "plan ends: can't open, banks stay linked until you unlink"
      - "US banks only; outside the US Personal Finance doesn't appear"
      - "not in scheduled tasks, Cowork tasks, Claude Code; not in Claude Duet"
  - id: pricing
    outlet: 클로드 요금제
    title: "Claude pricing"
    date: 2026-11-10
    url: https://claude.com/pricing
