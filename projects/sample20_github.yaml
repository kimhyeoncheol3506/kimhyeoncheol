summary: |
  '깃허브'라는 말을 처음 들어도 괜찮습니다. 파일 이름에 '최종_진짜_최종'을 붙여 본 경험에서 시작해,
  깃(Git)과 깃허브(GitHub)가 무엇인지, 둘은 어떻게 다른지, 꼭 알아야 할 단어 세 개(커밋·푸시·브랜치)를 쉬운 비유로 설명합니다.
  깃허브가 2026년 10월 28일 발표한 최신 숫자(Octoverse 2026)도 함께 담았습니다.
