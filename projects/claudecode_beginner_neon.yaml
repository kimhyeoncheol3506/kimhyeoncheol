  클로드 코드를 처음 듣는 분도, 터미널이 무서운 분도 괜찮습니다. 고등학생 눈높이로 아주 쉽고 천천히 설명합니다.
  클로드 코드가 무엇인지, 준비물과 요금, 설치, 첫 웹페이지 '딸깍' 만들기, 망쳐도 되돌리는 안전장치, 꼭 쓰는 명령어,
  그리고 스킬·MCP·Mods 같은 한 단계 더까지 2026년 11월 공식 문서 기준으로 정리했습니다.
