scenes:
  # ═════════════ 콜드 오픈
  - say: "숙제로 나만의 웹페이지를 만들어야 하는데, 코딩은 한 줄도 몰라요. 그런데 말 한마디만 했더니, 이게 딸깍 만들어졌어요."
    instruct: "신기한 걸 보여 주듯 밝고 들뜬 목소리로, '딸깍'에 힘을 준다."
    scene: {kind: chat, tag: "딸깍 · 예시", label: "말 한마디로\n[[웹페이지 완성]]", app: 클로드 코드, messages: [{who: me, text: "시험 D-day 랑 할 일 목록이 있는 예쁜 웹페이지 만들어 줘"}, {who: ai, text: "index.html 파일을 만들었어요. 열어 보시면 D-day 가 빨간색으로 보여요!"}]}
    sync: {at: [0, "숙제로", "말"], beats: ["몰라요."]}

  - say: "이걸 만든 건 사람이 아니라, 클로드 코드라는 AI예요. 제가 한 일은 원하는 걸 말한 것뿐이에요."
    instruct: "비밀을 털어놓듯 웃으며, '말한 것뿐'에 힘을 준다."
    scene: {kind: hook, small: "제가 한 일은", line1: "원하는 걸", line2: "[[말한 것뿐]]", fx: stamp}
    sync: {at: [0, "클로드", "말한"], beats: ["제가"]}

  - say: "근데 막상 해 보려고 하면, 까만 화면에 글자만 가득해서 겁부터 나죠? 괜찮아요. 오늘은 진짜 처음인 분 기준으로, 아주 쉽고 천천히 갈게요."
    instruct: "공감하듯 다정하게, 뒷문장은 든든하게."
    scene: {kind: terminal, tag: 솔직히 무섭죠, title: "처음 보는 까만 화면", lines: ["$ _", "# 뭘 쳐야 하지…?", "# 괜찮아요, 오늘은 천천히 갈게요"]}
    sync: {at: [0, "막상", "겁부터", "괜찮아요."], beats: ["처음인", "천천히"]}

  - say: "터미널을 몰라도, 영어를 몰라도 괜찮아요. 이 영상 하나로 설치부터 첫 작품까지, 같이 딸깍 해 봐요."
    instruct: "약속하듯 힘 있게, '딸깍'에서 신나게."
    scene: {kind: hook, small: "오늘의 약속", line1: "설치부터 첫 작품까지", line2: "[[같이 딸깍]]", fx: glitch}
    sync: {at: [0, "영어를", "딸깍"], beats: ["설치부터"]}

  - say: "진짜 쌩초보를 위한, 클로드 코드 완전 정복. 시작할게요."
    instruct: "영화 예고편처럼 낮고 힘 있게."
    scene: {kind: intro, kicker: "진짜 쌩초보를 위한", title: "Claude Code", sub: "말 한마디에 [[딸깍]]"}
    sync: {at: [0, "클로드", "시작할게요."]}

  - say: "오늘 순서예요. 클로드 코드가 뭔지와 요금, 설치, 첫 딸깍과 말 잘하는 법, 되돌리는 법, 명령어, 그리고 자주 묻는 질문까지요."
    scene:
      kind: agenda
      items:
        - {slash: /what, text: "뭐예요? · 준비물과 요금"}
        - {slash: /install, text: 설치하기}
        - {slash: /first, text: "첫 딸깍 · 말 잘하는 법"}
        - {slash: /safe, text: 망쳐도 되돌리기}
        - {slash: /tips, text: 꼭 쓰는 명령어}
        - {slash: /faq, text: 자주 묻는 질문}
    sync: {at: [0, "뭔지와", "설치,", "첫", "되돌리는", "명령어,", "자주"]}

  - say: "오늘 같이 만들 것도 미리 보여 드릴게요. 할 일 웹페이지, 공부 타이머, 사진 이름 정리, 그리고 우리 반 시간표까지 네 개예요."
    instruct: "신나게 미리보기를 보여 주듯."
    scene: {kind: icons, tag: 오늘 만들 것, label: "같이 만들 [[네 가지]]", items: [{glyph: "✅", name: 할 일 웹페이지}, {glyph: "⏱", name: 공부 타이머}, {glyph: "🗓", name: 사진 정리 · 시간표}]}
    sync: {at: [0, "할", "공부", "사진"], beats: ["네"]}

  - say: "전부 코딩 한 줄 없이, 말로만 만들어요. 제가 할 수 있으면, 여러분도 무조건 할 수 있어요."
    instruct: "자신 있게 응원하듯."
    scene: {kind: hook, small: "약속해요", line1: "코딩 한 줄 없이", line2: "[[말로만 딸깍]]", fx: glitch}
    sync: {at: [0, "코딩", "말로만"], beats: ["무조건"]}

  - say: "그리고 마지막엔 보너스로, 고수들이 쓰는 스킬이나 모즈 같은 기능도 맛보기로 보여 드릴게요. 끝까지 같이 가요!"
    instruct: "신나게 예고하듯 밝게."
    scene: {kind: hook, small: "그리고 보너스", line1: "고수들의 기능", line2: "[[맛보기까지]]", punch: true}
    sync: {at: [0, "보너스로,", "맛보기로"], beats: ["끝까지"]}

  # ═════════════ PART 01 /what
  - say: "첫 번째, 클로드 코드가 도대체 뭔지부터 알아볼게요."
    chapter: "PART 01 · 클로드 코드가 뭐예요?"
    scene: {kind: part, num: PART 01, slash: /what, title: "클로드 코드가 뭐예요?"}
    sync: {at: [0, "클로드", "뭔지부터"]}

  - say: "우리가 아는 챗GPT나 클로드 채팅은, 물어보면 대답을 해 주죠. 코드를 알려 주면, 그걸 복사해서 붙이는 건 내 몫이에요."
    scene: {kind: flow, tag: 보통 AI 채팅, label: "알려 주기만 · [[붙이는 건 나]]", nodes: [{glyph: "💬", name: 질문하기}, {glyph: "📋", name: 코드 받기}, {glyph: "😵", name: 내가 복사 · 붙이기}]}
    sync: {at: [0, "물어보면", "알려", "복사해서"]}

  - say: "클로드 코드는 달라요. 내 컴퓨터 안에서 직접 파일을 만들고, 고치고, 실행해서 확인까지 해 줘요."
    instruct: "차이를 강조하듯 힘 있게."
    scene: {kind: flow, tag: 클로드 코드, label: "직접 [[만들고 · 고치고 · 확인]]", nodes: [{glyph: "📝", name: 파일 만들기}, {glyph: "🔧", name: 고치기}, {glyph: "✓", name: 실행해서 확인}]}
    sync: {at: [0, "파일을", "고치고,", "확인까지"], beats: ["달라요."]}

  - say: "공식 문서 표현으로는, 내 코드를 읽고, 파일을 고치고, 명령을 실행하는 에이전트형 코딩 도구래요."
    source: "code.claude.com/docs (Overview)"
    scene: {kind: doc, tag: 공식 정의, meta: "Claude Code 공식 문서 · Overview", title: "\"에이전트형 코딩 도구\"", lines: ["내 코드를 {{읽고}}", "파일을 {{고치고}}", "명령을 {{실행한다}}"]}
    sync: {at: [0, "읽고,", "고치고,", "실행하는"]}

  - say: "클로드 코드가 일하는 순서는 네 단계예요. 먼저 내 폴더를 읽고, 계획을 세우고, 실행하고, 마지막으로 잘 됐는지 확인해요."
    scene: {kind: timeline, label: "일하는 순서 [[4단계]]", points: [{label: 읽기, sub: 내 폴더 살펴보기}, {label: 계획, sub: 어떻게 할지}, {label: 실행, sub: 만들고 고치기}, {label: 확인, sub: 잘 됐나 보기}]}
    sync: {at: [0, "읽고,", "계획을", "실행하고,", "확인해요."]}

  - say: "그래서 실수를 해도, 확인하다가 스스로 알아채고 다시 고치기도 해요. 그냥 채팅이랑 제일 다른 점이 바로 이거예요."
    scene: {kind: hook, small: "그래서", line1: "실수해도", line2: "[[스스로 다시 고쳐요]]", fx: stamp}
    sync: {at: [0, "실수를", "스스로"], beats: ["채팅이랑"]}

  - say: "그래도 마지막 확인은 사람 몫이에요. 결과를 직접 열어 보고, 내가 원하던 게 맞는지 보는 건 꼭 우리가 해야 해요."
    instruct: "차분하게, '사람 몫'에 힘을 준다."
