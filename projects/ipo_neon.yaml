    sync: {at: [0, "몸값", "최대"]}

  - say: "숫자가 너무 커서 감이 잘 안 오시죠? 그래서 오늘은 공식 서류를 직접 열어서, 하나씩 쉽게 바꿔 볼게요."
    scene: {kind: hook, small: "감이 안 오는 숫자", line1: "공식 서류를 열어", line2: "[[하나씩 쉽게]]"}
