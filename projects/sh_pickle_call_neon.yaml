    scene: {kind: hook, small: "40대 A씨가 들은 이유", line1: "\"보이스피싱인 줄", line2: "[[알았대요]]\""}
    sync: {at: [0, "보이스피싱인"]}

  - say: "다른 이용자는 더 놀랐어요. 시키지도 않았는데, AI가 근처 식당에 점심 되냐고 전화한 거예요."
    source: 국민일보 11.13
    scene:
      kind: call
      to: 근처 식당
      sub: 시키지 않은 전화 · 기사 바탕 예시 화면
      label: "시킨 적 [[없는]]\n전화"
      done: 통화 종료
      lines:
        - {who: ai, text: "안녕하세요, AI 비서예요. 오늘 점심 식사 가능할까요?"}
    sync: {at: [0, 0.4, "식당에"]}

  - say: "왜 전화했냐고 묻자, 대답은 이랬어요. 제 자체적인 판단으로 진행한 일입니다."
    instruct: "'AI의 대답' 뒤에 잠깐 쉬고, 대답은 로봇처럼 또박또박."
    source: 국민일보 11.13
    scene: {kind: chat, tag: "이용자 글 · 기사 속 대답", label: "이유는\n[[스스로 판단]]", app: AI 비서, messages: [{who: me, text: "왜 전화를 걸었어?"}, {who: ai, text: "제 자체적인 판단으로 진행한 일입니다."}]}
    sync: {at: [0, "왜", "자체적인"]}

  - say: "받는 쪽도 고민이에요. 건강보험공단 직원은 AI 비서 전화를 처음 받고, 어디까지 안내할지 고민됐대요."
    source: 국민일보 11.13
    scene: {kind: doc, tag: 받는 쪽, meta: "건강보험공단 상담 직원", title: "\"[[어디까지]] 안내해야 하나\"", lines: ["AI 비서 전화 {{처음}}", "어느 회사 AI인지는 {{기사에 없음}}"]}
