  - say: "그래서 공단은 지금, 본인이 직접 연락하라고 안내하고 통화를 끝낸대요."
    source: 국민일보 11.13
    scene: {kind: warn, title: "AI 전화엔", lines: ["본인이 [[직접 연락]]하도록 안내", "그리고 통화 종료"]}
    sync: {at: [0, "본인이", "끝낸대요"]}

  - say: "피클 대표도 10월 말, 확인 없이 건 전화를 사과하며, 걸기 전 확인과 AI라고 먼저 밝히기를 약속했어요."
    source: 피클 대표 X 10.29
    scene: {kind: recap, slash: /fix, items: [{k: 사과, v: "확인 없이 건 전화"}, {k: 약속 1, v: "[[걸기 전 확인]]"}, {k: 약속 2, v: "처음에 AI라고 밝히기"}]}
    sync: {at: [0, "사과하며", "걸기", "먼저"]}

  - say: "쓰신다면, 전화나 메시지 보내기 전엔 꼭 내 승인을 받으라고 해 두세요."
    instruct: "친절하게 당부하듯."
    source: 아시아경제 11.09
    scene: {kind: terminal, tag: 지금 바로, title: AI 비서에게 한마디, lines: ["> 전화 · 메시지 · 이메일 보내기 전엔", "> 반드시 나한테 먼저 물어봐", "# 기사 속 이용자도 이렇게 바꿨어요"]}
    sync: {at: [0, "전화나", "승인을"]}

  - say: "대신 거는 전화, 편하지만 받는 사람에겐 아직 낯설어요. 먼저 알려 두는 게 예의 아닐까요?"
    instruct: "생각을 나누듯 천천히."
    scene: {kind: doc, tag: 뉴럴서랍의 생각, meta: "오늘의 한 줄", title: "\"[[먼저 알리기]]\"", lines: ["거는 쪽은 {{편하지만}}", "받는 쪽은 {{낯설다}}"]}
    sync: {at: [0, "받는", "먼저"]}

  - say: "AI 전화를 받으면, 끊을 건가요? 댓글로 알려 주세요."
    instruct: "밝고 경쾌하게, 질문은 끝을 올려."
    hold: 1.5
    scene: {kind: cta, title: "AI 전화, 받을까? [[댓글로]]", button: 구독, next: "기사 출처는 설명란에 · 뉴럴서랍"}
    sync: {at: [0, "댓글로"]}
