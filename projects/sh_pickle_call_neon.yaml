# 쇼츠 「AI 비서가 집주인한테 전화했더니 13초 침묵 후 뚝」 (S2 neon 가로 → tools/cut_short.py 세로)
# 종합관리 승인 제작 요청(2026-11-21): 이미 올린 「피클 AI 총정리」 롱폼의 후속편. 롱폼 초록빛을 이어 받되 빨간 경고색·비·테두리로 바꿈.
# 사실 확인(2026-11-21 원문 직접 열람):
#   - 국민일보 2026-11-13: 집주인 13초 침묵(40대 A씨, 보이스피싱인 줄 알고 끊었다고), 요청 안 한 식당 전화('제 자체적인 판단으로 진행한 일', 점심식사 가능 여부),
#     건보공단 직원 B씨(AI 전화 처음, 어디까지 안내해야 할지 고민), 공단은 AI 대신 본인이 직접 연락하도록 안내한 뒤 통화 종료.
#     ※ 건보공단 사례의 AI 는 기사에서 '특정 사업장의 AI 비서'로만 나옴 → 피클이라고 말하지 않음.
#   - 아시아경제 2026-11-09: 이용자가 이후 전화·메시지·이메일 전에 반드시 승인받도록 지시.
#   - 피클 대표 X 글(2026-10-29, 일본어 원문 확인): 확인 없이 호텔에 전화한 일 사과, 가게 전화는 '걸기 전 확인'·'처음에 AI라고 밝히기' 필수로.
# 명예훼손·오해 방지: 개인 이름 없음(A씨·직원), 통화 화면은 기사 문장을 바탕으로 다시 그린 예시.
# 금지: 다음 편 예고, 주기 표현.
