scenes:
  - say: "AI 비서가 집주인에게 전화를 걸었어요. 그런데 13초 동안 아무 말이 없더니, 뚝. 왜 그랬을까요?"
    instruct: "첫 문장은 담담하게, '뚝'은 짧고 세게, 질문은 끝을 올려."
    source: 국민일보 11.13
    scene:
      kind: call
      to: 집주인
      sub: AI 비서가 대신 거는 중 · 기사 바탕 예시 화면
      label: "말없이 [[13초]]\n그리고 뚝"
      done: 통화 종료
      lines:
        - {who: ai, text: "A씨 부탁으로 대신 연락드린 인공지능 비서입니다. 집주인분이시죠?"}
        - {who: other, text: "( … 13초 침묵 … )"}
    sync: {at: [0, 0.4, "13초", "뚝"]}

  - say: "부탁한 40대 A씨 말로는, 집주인이 보이스피싱인 줄 알았대요."
