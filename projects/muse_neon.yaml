scenes:
  # ───────────── 후킹: 새 도구 클립으로 콜드 오픈
  - say: "토요일 아침, 폰을 켰더니 AI가 밤새 일을 해 놨어요. 식당 자리 찾고, 잊은 구독까지요. 이게 진짜 될까요?"
    instruct: "궁금증을 확 끌어올리듯 힘 있게, 마지막 질문은 끝을 올려."
    scene: {kind: clip, video: ../output/_clips/muse/MuseOpen.mp4}

  - say: "메타가 만든 AI 비서, 뮤즈 이야기예요. 미국에서 나오자마자 앱스토어 차트 1위까지 올라갔어요."
    source: "TechCrunch(2026-09-18)"
    instruct: "놀라운 소식을 전하듯, 1위는 또박또박."
    scene: {kind: number, tag: 출시 직후, label: "미국 앱스토어 차트", to: 1, unit: 위, sub: "메타의 AI 비서 [[뮤즈]]"}
    sync: {at: [0, "뮤즈", "1위까지"]}

  - say: "그런데 한 보안 전문가는 이렇게 말했어요. 제발 설치하지 마세요. 왜 그랬을까요?"
    source: "iTnews · 패트릭 워들"
    instruct: "낮게 깔았다가 질문은 끝을 올려."
    scene: {kind: hook, small: "그런데", line1: "보안 전문가", line2: "[[\"제발 설치하지 마세요\"]]", punch: true}
    sync: {at: [0, "보안", "제발"], beats: ["왜"]}

  - say: "게다가 한국에선 아직 못 써요. 그런데도 지금 알아 둬야 할 이유가 있어요."
    instruct: "차분하게, 뒷문장은 힘 있게."
    scene: {kind: hook, small: "게다가", line1: "한국은 [[아직]]", line2: "그래도 알아 둘 이유", fx: stamp}
    sync: {at: [0, "한국에선", "그런데도"]}

  - say: "뮤즈가 뭔지부터 할 수 있는 일, 요금, 조심할 점까지. 1부터 100까지 한 번에 정리해 볼게요."
    instruct: "영화 예고편처럼 낮고 힘 있게."
    scene: {kind: intro, kicker: "앱을 닫아도 일하는 AI 비서", title: "Meta Muse", sub: "메타 뮤즈 · [[1부터 100까지]]"}
    sync: {at: [0, "할", "요금,", "1부터"]}

  - say: "오늘 순서는요, 정체, 쓰는 곳, 일하는 방식, 할 수 있는 일, 요금, 조심할 점, 그리고 비교예요."
    scene:
      kind: agenda
      items:
        - {slash: /what, text: "뮤즈가 뭐예요?"}
        - {slash: /where, text: "어디서 · 누가 쓰나"}
        - {slash: /how, text: "안에서 어떻게 일하나"}
        - {slash: /use, text: "할 수 있는 일 10가지"}
        - {slash: /safe, text: "요금 · 설정 · 사고"}
        - {slash: /vs, text: "듀엣 · 닷츠와 비교"}
    sync: {at: [0, "정체,", "쓰는", "일하는", "할", "요금,", "비교예요."]}

  # ───────────── PART 01 /what
  - say: "첫 번째, 뮤즈가 도대체 뭔지부터 볼게요."
    chapter: "PART 01 · 뮤즈가 뭐예요?"
    scene: {kind: part, num: PART 01, slash: /what, title: "뮤즈가 뭐예요?"}
    sync: {at: [0, "뮤즈가"]}

  - say: "지금까지 AI는 물어봐야 대답했죠. 뮤즈는 대답에서 끝나지 않고, 내 대신 일을 해요."
    source: "메타 공식 출시 글"
    scene: {kind: split, left: {glyph: "💬", title: 보통 AI, lines: ["물어보면", "[[대답만]]"], color: "#B79B8C"}, right: {glyph: "🖐", title: 뮤즈, lines: ["시키면", "[[대신 해 줌]]"], color: "#FF7A59"}}
    sync: {at: [0, "지금까지", "뮤즈는"]}

  - say: "비유하면 부르면 오는 직원이 아니라, 옆자리에 늘 앉아 있는 비서예요."
    instruct: "다정하고 부드럽게."
