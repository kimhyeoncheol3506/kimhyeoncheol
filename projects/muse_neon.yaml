summary: |
  메타가 9월 8일 미국에서 내놓은 개인용 AI 비서 앱, 뮤즈(Muse)를 처음부터 끝까지 정리했습니다.
  뮤즈가 무엇인지, 어느 나라에서 쓸 수 있는지(한국은 아직), 안에서 어떻게 일하는지(전용 클라우드 컴퓨터·센티넬·일회용 카드),
  할 수 있는 일 10가지, 요금, 켜자마자 확인할 설정, 출시 뒤 있었던 보안 사고, 그리고 클로드 듀엣·챗GPT 닷츠와의 비교까지 담았습니다.
tags: ["#메타뮤즈", "#뮤즈", "#MetaMuse", "#AI비서", "#AI에이전트", "#메타AI", "#클로드듀엣", "#닷츠", "#AI입문", "#뉴럴서랍"]
disclaimer: 이 영상은 광고가 아닙니다. 기능·출시 국가는 2026년 11월 7일 메타 공식 발표 기준이며 바뀔 수 있습니다. 요금·사용량·일부 사고 내용은 한 유튜버(옆자리 연구원)의 정리를 인용했습니다. 한국은 아직 정식 출시 전입니다.
