      - "Start with medium and increase it if the improvement in quality is worth the added time and tokens"
      - "When migrating from GPT-5.6 Terra, compare both models on representative images and workflows using the same reasoning effort"
      - "Astra and 6.1 Sol do not support none; Terra, 6 Sol, Luna do"
