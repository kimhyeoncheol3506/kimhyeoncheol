  - id: terra
    outlet: 오픈에이아이 개발자 문서 · 모델 문서
    title: "GPT-6.1 Terra"
    date: 2026-11-10
    url: https://learn.chatgpt.com/api/docs/models/gpt-6.1-terra
    verified: true
    facts:
      - "A fast, efficient model for visual reasoning, precise computer use, and clear, natural writing"
      - "match product photos to catalog entries, interpret technical drawings, act on application screens, draft and revise text"
      - "reasoning.effort none, low, medium (default), high, xhigh, max = 6단계"
      - "Input text, image; output text; unsupported audio, video"
      - "1,050,000 context window = 105만 토큰; maximum input 922,000; 128,000 max output = 128K = 12만 8천"
      - "Jun 01, 2026 knowledge cutoff = 2026년 6월"
      - "Input $1, Cached input $0.05 = 5%, Cache writes $1.25, Output $5 per 1M tokens = 100만 토큰"
      - "more than 272K input tokens = 27만 2천: 2x input and cache, 1.5x output"
      - "Batch and Flex 50% lower; Regional processing 10% premium; Fast mode 2x"
      - "Tool calling requires the Responses API; tools web_search, file_search, image_generation, code_interpreter, hosted_shell, apply_patch, skills, computer_use, mcp, tool_search"
      - "no fine_tuning; Amazon Bedrock openai.gpt-6.1-terra; Google Cloud private preview"
