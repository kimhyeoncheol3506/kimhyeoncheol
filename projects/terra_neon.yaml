scenes:
  # ───────────── 후킹: 새 도구 클립으로 콜드 오픈
  - say: "오픈에이아이가 새 모델, GPT-6.1 테라를 내놨어요. 사진을 보고, 화면을 직접 눌러 가며 일하는 모델이에요."
    instruct: "놀라운 소식을 터뜨리듯 힘 있고 빠르게."
    source: "오픈에이아이 모델 문서"
    scene: {kind: clip, video: ../output/_clips/openai/TerraOpen.mp4}

  - say: "그런데 입력 가격은 이전 테라의 딱 절반이에요. 더 좋아졌는데 더 싸다니, 진짜일까요?"
    instruct: "낮게 깔았다가 질문은 끝을 올려."
    scene: {kind: hook, small: "그런데", line1: "더 좋아졌는데", line2: "[[더 싸졌다?]]", punch: true}
    sync: {at: [0, "입력", "더"], beats: ["진짜일까요?"]}

  - say: "에이피아이 입력 가격은 100만 토큰당 1달러예요. 이전 5.6 테라는 2달러였어요."
    source: "오픈에이아이 API 가격표"
    instruct: "숫자는 또박또박, 힘 있게."
    scene: {kind: number, tag: GPT-6.1 테라, label: "입력 100만 토큰당", to: 1, unit: "달러", sub: "이전 5.6 테라 2달러 → [[절반]]"}
    sync: {at: [0, "100만", "이전"]}

  - say: "그리고 평소 쓰는 챗 지피티 대화창에선 이 모델을 못 골라요. 그럼 대체 어디서 쓰는 걸까요?"
    instruct: "궁금증을 끌어올리듯, 질문은 끝을 올려."
    scene: {kind: hook, small: "그리고", line1: "챗GPT 대화창에선", line2: "[[못 고른다?]]", fx: stamp}
    sync: {at: [0, "그리고", "못"], beats: ["어디서"]}

  - say: "정체부터 달라진 점, 가격, 쓰는 곳, 한국에서 쓰는 법, 한계까지. 한 번에 정리해 볼게요."
    instruct: "영화 예고편처럼 낮고 힘 있게."
    scene: {kind: intro, kicker: "오픈AI 새 모델", title: "GPT-6.1 Terra", sub: "GPT-6.1 테라 · [[총정리]]"}
    sync: {at: [0, "가격,", "한국에서", "한계까지."]}

  - say: "오늘 순서는요, 정체, 이전과 차이, 가격과 사용량, 쓰는 곳, 한국에서 쓰기, 그리고 한계예요."
    scene:
      kind: agenda
      items:
        - {slash: /what, text: "테라가 뭐예요?"}
        - {slash: /diff, text: "이전 모델과 무엇이 다른가"}
        - {slash: /price, text: "가격과 사용량"}
        - {slash: /where, text: "어디서 쓰나"}
        - {slash: /korea, text: "한국에서 쓰기"}
        - {slash: /limit, text: "한계와 주의"}
    sync: {at: [0, "정체,", "이전과", "가격과", "쓰는", "한국에서", "한계예요."]}

  # ───────────── PART 01 /what
  - say: "첫 번째, 테라가 도대체 어떤 모델인지부터 볼게요."
    chapter: "PART 01 · 테라가 뭐예요?"
    scene: {kind: part, num: PART 01, slash: /what, title: "테라가 뭐예요?"}
    sync: {at: [0, "도대체"]}

  - say: "오픈에이아이는 테라를 이렇게 소개해요. 빠르고 효율적인 모델, 잘하는 건 세 가지래요."
    source: "오픈에이아이 모델 문서"
    scene: {kind: doc, tag: 공식 소개, meta: "GPT-6.1 Terra 모델 문서", title: "\"빠르고 효율적인 모델\"", lines: ["{{시각 추론}} · 정확한 {{컴퓨터 사용}}", "분명하고 자연스러운 {{글쓰기}}"]}
    sync: {at: [0, "빠르고", "세"]}

  - say: "사진과 화면을 읽는 눈, 컴퓨터를 직접 다루는 손, 그리고 깔끔한 글솜씨예요."
    source: "오픈에이아이 모델 문서"
    scene: {kind: icons, tag: 잘하는 것 세 가지, label: "눈 · 손 · [[글솜씨]]", items: [{glyph: "👁", name: 이미지·화면 이해}, {glyph: "🖱", name: 컴퓨터 직접 조작}, {glyph: "✍", name: 분명한 글쓰기, color: "#FDE68A"}]}
    sync: {at: [0, "사진과", "컴퓨터를", "깔끔한"]}

  - say: "나온 날은 10월 26일이에요. 에이피아이와 워크, 코덱스에 같은 날 열렸고, 11월 4일엔 닷츠에도 들어갔어요."
    source: "오픈에이아이 API 변경 기록 · What's new"
    scene: {kind: flow, tag: 나온 순서, label: "[[닷츠까지]] 합류", nodes: [{glyph: "🚀", name: 10월 26일, sub: API · 워크 · 코덱스}, {glyph: "🟢", name: 11월 4일, sub: 닷츠 합류}]}
    sync: {at: [0, "10월", "같은", "11월"]}

