      kind: agenda
      items:
        - {slash: /what, text: "제브가 뭐예요?"}
        - {slash: /how, text: 어떻게 일하나}
        - {slash: /speed, text: "진짜 200배?"}
        - {slash: /use, text: 어디에 쓰나}
        - {slash: /start, text: 시작하는 법}
        - {slash: /watch, text: 주의할 점}
    sync: {at: [0, "뭔지,", "어떻게", "진짜", "어디에", "시작하는", "주의할"]}

  # ───────────── PART 01 /what
  - say: "첫 번째, 제브가 도대체 뭔지부터 볼게요."
    chapter: "PART 01 · 제브가 뭐예요?"
    scene: {kind: part, num: PART 01, slash: /what, title: "제브가 뭐예요?"}
    sync: {at: [0, "제브가"], beats: ["도대체"]}

  - say: "챗지피티나 클로드는 글을 써 주죠. 제브는 글을 안 써요. 대신 정해 준 보기 중에 하나를 고르거나, 점수를 매기거나, 맞는지 틀린지를 판단해요."
    source: "TypeSafe 공식 문서"
    scene: {kind: split, left: {glyph: "✎", title: 보통 AI, lines: ["글 · 대화 · 코드", "길게 [[써 줌]]"], color: "#9FB3C8"}, right: {glyph: "✓", title: 제브, lines: ["고르기 · 점수 · 참거짓", "[[판단만]] 딱"], color: "#FF4FB0"}}
    sync: {at: [0, "챗지피티나", "제브는"], beats: ["점수를", "틀린지를"]}

  - say: "쉽게 비유하면, 보통 AI가 긴 보고서를 쓰는 작가라면, 제브는 우체국에서 편지를 순식간에 칸칸이 나누는 분류 직원이에요."
    instruct: "비유를 들려주듯 다정하고 생생하게."
    scene: {kind: flow, tag: 비유하면, label: "작가 말고 [[분류 직원]]", nodes: [{glyph: "📝", name: 보통 AI, sub: 긴 글 쓰는 작가}, {glyph: "↔", name: 그런데 제브는, sub: 글은 안 씀}, {glyph: "📮", name: 분류 직원, sub: 순식간에 칸칸이}]}
    sync: {at: [0, "보통", "제브는", "분류"]}

  - say: "회사는 이걸 시스템 원 모델이라고 불러요. 사람 생각에는 빠른 직감과 느린 고민이 있다는 유명한 이야기에서 따온 이름이에요. 제브는 빠른 직감 쪽이에요."
    source: "TypeSafe 출시 글 · 카너먼 『생각에 관한 생각』"
    scene: {kind: split, left: {glyph: "⚡", title: 시스템 1, lines: ["빠른 [[직감]]", "제브가 하는 일"], color: "#FF4FB0"}, right: {glyph: "🐢", title: 시스템 2, lines: ["느린 [[고민]]", "글 쓰는 AI의 일"], color: "#7CF7FF"}}
    sync: {at: [0, "시스템", "빠른", "제브는"]}

  - say: "만든 곳은 미국의 타입세이프라는 회사예요. 대표는 챗지피티가 사람 말을 잘 듣게 만든 연구에 참여했던 사람이고, 지난 9월에 처음 공개했어요."
    source: "TypeSafe 팀 페이지 · 출시 글(2026-09-15) · TechCrunch"
    scene: {kind: icons, tag: 만든 곳, label: "[[타입세이프]] · 미국 스타트업", items: [{glyph: "🏢", name: 타입세이프}, {glyph: "🧠", name: "대표 · RLHF 연구 참여"}, {glyph: "9월", name: "2026년 공개", color: "#FF4FB0"}]}
    sync: {at: [0, "타입세이프라는", "대표는", "9월에"]}

  - say: "이름도 재밌어요. 제브는 어떤 물건이 싸지면 오히려 훨씬 더 많이 쓰이게 된다는, 제번스라는 경제학자의 이야기에서 따왔대요. AI 판단이 싸지면 쓸 곳이 폭발적으로 늘어난다는 뜻이죠."
