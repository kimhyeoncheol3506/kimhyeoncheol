      count: 500
      unit: 개
      cost: "해외 사례 · 약 [[3.5센트]]"
    sync: {at: [0, "메일", "3.5센트였대요."], beats: ["50원도"]}

  - say: "만든 회사는 비슷한 결과를 내면서 193배 빠르고, 444배 싸다고 자랑해요."
    source: "TypeSafe 공식 사이트(회사 자체 평가)"
    instruct: "숫자를 크게 강조하듯."
    scene: {kind: number, tag: 회사 발표, label: "더 싸다고?", to: 444.6, unit: 배, sub: "193.6배 빠르고 · [[회사 자체 평가]]"}
    sync: {at: [0, "193배", "444배"]}

  - say: "그런데 진짜일까요? 직접 재 본 유튜버들의 결과는 조금 달랐어요."
    instruct: "의심스럽다는 듯 질문 끝을 올렸다가, 뒷문장은 비밀을 말하듯."
    scene: {kind: hook, small: "그런데", line1: "진짜 200배?", line2: "[[직접 재 봤더니]]", punch: true}
    sync: {at: [0, "진짜일까요?", "직접"]}

  - say: "판단만 하는 이상한 AI, 제브. 초보도 이해할 수 있게 지금부터 정리해 볼게요."
    instruct: "영화 예고편처럼 낮고 힘 있게."
    scene: {kind: intro, kicker: "글도 못 쓰는데 왜 난리일까?", title: "Jev", sub: "제브 · [[판단만 하는 AI]]"}
    sync: {at: [0, "판단만", "제브."]}

  - say: "오늘 순서는요, 제브가 뭔지, 어떻게 일하는지, 진짜 빠른지, 어디에 쓰는지, 시작하는 법, 그리고 주의할 점이에요."
