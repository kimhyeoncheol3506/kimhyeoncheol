# 20초 컨셉 파일럿: "한국인은 왜 커피를 이렇게 많이 마실까?"
# 구조: 0~3초 질문 훅 → 숫자 충격 → 비교 → 기사 근거 → 오늘의 주제 카드
slug: pilot_coffee
title: 한국인은 왜 커피를 이렇게 많이 마실까?
voice: {backend: auto, speed: 1.05}
bgm_mood: bright

scenes:
  - type: stage
    cast: [{pose: [shock, think], x: 0.5}]
    props:
      - {kind: coffee, x: 0.70, y: 0.50, scale: 1.3}
      - {kind: question, x: 0.32, y: 0.36, at: 1}
    big: "1년에 몇 잔?"
    say: "한국인 한 명이 [[1년]]에 마시는 커피, 과연 몇 잔일까요?"

  - type: number
    label: 한국인 1인당 연간 커피 소비량
    value: 405
    unit: 잔
    sub: "전 세계 평균의 2배 이상"
    cast: [{pose: shock}]
    source: "유로모니터 2023년 기준 · 아시아경제 2023.12.22"
    say: "무려 [[405잔]]입니다."

  - type: compare
    label: 1인당 연간 커피 소비량
    unit: 잔
    items:
      - {label: 세계 평균, value: 152, color: "#9AA5B1"}
      - {label: 한국, value: 405, color: "#FF4D4D", at: 1}
    cast: [{pose: [talk, point]}]
    source: "유로모니터 2023년 기준 · 아시아경제 2023.12.22"
    say: "전 세계 평균 [[152잔]]의, [[두 배]]가 넘는 수치죠."

  - type: headline
    outlet: 아시아경제
    date: 2023.12.22
    title: "한국인, 올해 평균 커피 405잔 마셨다"
    highlight: "405잔"
    highlight_at: 0
    source: "아시아경제 2023.12.22 (view.asiae.co.kr)"
    say: "실제로 기사에도, 이렇게 나왔는데요."

  - type: title
    kicker: 오늘의 주제
    title: "한국인은 왜 이렇게 커피를 많이 마실까?"
    band: "#1B1B1B"
    say:
      - "도대체 왜 이렇게 많이 마시는 걸까요?"
      - "오늘, 그 이유를 [[파헤쳐]] 봅니다."
    tail: 0.8
