# 편집규칙집의 "기계용" 버전. docs/편집규칙집.md 와 1:1로 대응한다.
# analyze_reference.py 로 참고영상을 측정하면 `measured:` 값이 채워지고,
# 그 값이 있으면 아래 기본값보다 우선 적용된다.

video:
  width: 1920
  height: 1080
  fps: 30
  crf: 20

pacing:
  # 컷(카메라 펀치인/아웃 또는 장면 전환) 간격 목표치. 자막 덩어리 1개 = 컷 1개.
  cut_min_sec: 1.2
  cut_target_sec: 2.6
  cut_max_sec: 4.5
  gap_in_sentence: 0.06     # 같은 문장 안 자막 덩어리 사이 무음
  gap_sentence: 0.22        # 문장 사이 무음
  gap_scene: 0.32           # 장면 사이 무음
  punch_zoom: 1.10          # 컷마다 번갈아 들어가는 확대 배율
  drift_zoom: 0.025         # 한 컷 안에서 천천히 밀어 들어가는 양

subtitle:
  start_delay: 0.15            # 자막은 목소리 시작 +0.15초에 뜬다(스마트대디 규칙: 너무 일찍 뜨면 어색)
  end_hold: 0.20               # 말이 끝난 뒤 0.2초 더 남긴다
  font: Pretendard-ExtraBold.otf
  size: 66
  color: "#FFFFFF"
  emphasis_color: "#FFE14D"   # [[강조]] 단어
  stroke: 8
  stroke_color: "#111111"
  shadow: [0, 5, "#00000099"]
  y: 0.885                    # 화면 높이 대비 자막 중심 위치
  max_chars_per_line: 17
  max_lines: 2

big_caption:                   # {{큰자막}} : 화면 위쪽에 팝업되는 강조 자막
  font: BlackHanSans.ttf
  size: 128
  color: "#FFFFFF"
  box_color: "#FF4D4D"
  stroke: 0
  y: 0.17
  pop_sec: 0.22
  overshoot: 1.25

source_label:                  # 자료 출처 표기
  font: Pretendard-Medium.otf
  size: 26
  color: "#FFFFFFDD"
  box: "#00000088"
  pos: top_right

palette:
  bg: ["#FFE9A8", "#BDE3FF", "#FFD1DC", "#C9F2D0", "#E3D5FF", "#FFE0C2"]
  ink: "#1B1B1B"
  accent: "#FF4D4D"
  accent2: "#2E7CF6"
  highlight: "#FFE14D"

character:
  head_r: 78
  outline: 7
  skin: "#FFFFFF"
  shirt: ["#2E7CF6", "#FF7A45", "#22B07D", "#8C5CF6"]
  blink_every: 3.1
  bob_hz: 1.6

transition:
  scene: whoosh_slide          # 장면 전환: 휙 슬라이드 + whoosh 효과음
  dur: 0.22

audio:
  voice_db: 0
  bgm_db: -24                  # 내레이션 대비 배경음
  duck_ratio: 6
  sfx_db: -9
  loudness_lufs: -14

intro:
  hook_max_sec: 3.0            # 첫 질문/충격 문장은 3초 안에 끝낸다
  title_card_by_sec: 20        # 제목 카드(오늘 주제)는 20초 안에 등장
outro:
  cta: "구독과 좋아요는 영상 제작에 큰 힘이 됩니다"
  endscreen_sec: 8             # 롱폼 끝 8초는 유튜브 최종화면 요소 자리로 비워둔다

rules:                          # 숫자로 쓴 규칙만 지켜진다 → 빌드/검수가 자동으로 점검
  sfx_max_per_min: {longform: 6, short: 24}   # 효과음 분당 상한. 롱폼(본편)은 스마트대디 기준 1~5개, 모션 위주 쇼츠는 24
  sfx_min_gap_sec: 0.35         # 효과음 사이 최소 간격(다닥다닥 금지)
  same_layout_max_sec: 10       # 같은 구도로 10초 넘게 두지 않는다
  syllables_per_sec: [6.8, 8.6] # 내레이션 속도 허용 범위(7.7이 기준: 6.4는 느리고 8.4는 빠르다는 피드백)
  card_end_freeze_sec: 0.5      # 카드 끝 0.5초는 멈춰서 편집 때 늘릴 수 있게
  no_fake_numbers: true         # 가짜 댓글·가짜 차트·꾸민 숫자 금지: 숫자는 source 가 있어야 함
  intro_question_by_sec: 20     # 첫 20초 안에 영상이 답할 질문을 던진다

shorts:                          # "공장이 지키는 원칙" 6가지를 숫자로 (shorts/make_short.py 가 자동 점검)
  duration_sec: [40, 50]         # 02 쇼츠 길이. 20초 컨셉판(format: concept)은 concept_sec
  concept_sec: [15, 25]
  roles: [hook, twist, core, pov, todo, end]   # 02 줄마다 할 일(처음 등장 순서 고정, hook 으로 시작·end 로 끝)
  no_adjacent_core: true         # 02 설명(core)만 두 줄 이어지지 않게
  bottom_empty_ratio: 0.18       # 03 아래 18%는 비운다(유튜브 버튼 자리). 렌더마다 픽셀로 검사
  caption_max_chars: 13          # 04 한 화면 13자 안팎(어절 단위, 최대 15)
  caption_hard_max: 15
  require_pov: true              # 05 내 관점 한 줄 필수
  topics: {pick: 5, news: 3, evergreen: 2, news_window_hours: 72}   # 01 소재는 오늘에서
  sources_verified: true         # 06 기사 원문을 열어 확인(verified: true), 숫자는 출처 facts 에 있어야 함

external_tools:                  # 영상·이미지를 만들어 주는 외부 사이트. 사람이 사이트에서 만들고 파일을 projects/media/ 에 넣는다(제가 로그인·결제는 하지 않음)
  pavo:
    name: Pavo AI
    url: https://app.pavo-ai.work/
    api: 공개 API/MCP 없음(로그인 웹앱)
    terms_checked: "2026-10-25"          # 약관 전문(중국어)을 읽고 확인
    commercial: "조건부: 결과물 소유권은 사용자, 공개·상업 이용 시 합법성·저작권은 사용자가 검토(4.4). 운영사에 영구·전세계·재사용허락 가능한 이용권을 줌(4.2, 홍보 포함, 해지 후에도 유지)"
    label: "기본으로 눈에 보이는 AI 생성 표시+메타데이터 삽입. 가리거나 지우면 안 됨(5.4). 표시 없는 버전은 신청 가능하나 사용자가 다른 눈에 띄는 방법으로 'AI 생성'을 직접 표시해야 함(5.5)"
    refund: "결제 후 환불 없음, 구독 자동 갱신(6)"
    operator: "南京市爱思人工智能科技有限公司 (중화인민공화국 법 적용, 분쟁은 운영사 소재지 법원)"
  digen:
    name: Digen AI
    url: https://digen.ai/
    api: 공개 API/MCP 확인 못 함(로그인 웹앱)
    terms_checked: null                  # 약관 주소를 찾지 못함 → 사용 전 앱 안에서 확인해야 함
    commercial: 미확인
  pollo:
    name: Pollo AI
    url: https://pollo.ai/
    api: MCP 연결됨(제가 직접 생성 가능)
    terms_checked: null
    commercial: 미확인
  higgsfield:
    name: Higgsfield
    url: https://higgsfield.ai/
    api: MCP 는 조회만(생성 불가)
    terms_checked: null
    commercial: 미확인
  openart:
    name: OpenArt
    url: https://openart.ai/
    api: MCP 연결됨
    terms_checked: null
    commercial: "일부 요금제만 상업 이용 가능하다는 출처가 있음(미확인)"

  suno:
    name: Suno
    url: https://suno.com/
    api: 공개 API/MCP 없음(브라우저에서 사람이 만듦)
    terms_checked: null
    commercial: "미확인(요금제에 따라 상업 이용 가능 여부가 다르다고 알려져 있으나 확인 못 함)"

editorial:                       # '종이 인포그래픽' 롱폼(editorial/make_editorial.py). 참고: 미주일기 RfzOmJKdm5g, docs/참고분석_미주일기.md
  # 실측(스토리보드 170칸·자동자막 1,102낱말, 2026-11-02): 종이 화면 75%, 검정 16%, 종이 #E3DDD3, 검정 #171310, 채도 매우 낮음
  # 5초 간격 화면 변화: 거의 그대로 20% · 같은 판에 요소 추가 42% · 장면 교체 38% → 장면 하나 평균 10~13초, 그 안에서 2~4번 쌓기
  video: {width: 1920, height: 1080, fps: 30}
  voice: {backend: voicebox, name: 여의도여자, speed: 1.0}   # 2026-11-02 현철님: 이 스타일 목소리는 여의도여자만(PC의 Voicebox)
  caption_max_chars: 34          # 자막은 문장 통째(참고 영상: 아래 가운데 어두운 띠 한 줄). 넘으면 쪼갬
  caption_hard_max: 42
  gap_sentence: 0.45             # 문장 사이 숨(차분한 해설 톤)
  scene_lead: 0.35               # 장면 시작 후 첫 말까지
  scene_tail: 0.55               # 마지막 말 뒤 여유(끝 0.5초 정지 포함)
  scene_min_sec: 3.0
  scene_max_sec: 18              # 같은 판을 18초 넘게 두지 않는다(참고 영상 최장 약 15초)
  same_kind_max_run: 2           # 같은 장면 종류가 3번 연속되지 않게
  syllables_per_sec: [4.6, 6.2]  # 참고 영상 실측 약 4.6~5.5(자동자막 기준). 쇼츠·캐릭터 규칙(6.8~8.6)과 다름
  sfx_max_per_min: 8             # 종이·형광펜·챕터 소리만, 작게
  question_by_sec: 20            # 첫 20초 안에 영상이 답할 질문
  audio:                         # 참고 영상 오디오는 받지 못해 실측 아님(장르 관례로 추정). 현철님 귀로 확인 필요
    voice_db: 0
    bgm_db: -27                  # 말할 때 거의 안 들리고, 쉴 때 살짝 차오르는 정도
    duck_ratio: 4
    sfx_db: -4
    loudness_lufs: -14
    voice_chain: "highpass=f=75,equalizer=f=250:t=q:w=1:g=-2,equalizer=f=3800:t=q:w=1.2:g=2.5,acompressor=threshold=-20dB:ratio=2.5:attack=8:release=140:makeup=2"

styles:                          # 영상 스타일 라이브러리(docs/스타일_라이브러리.md). 대본의 style: 로 고르면 editorial: 값 위에 덮어쓴다
  paper:                         # S1 미주일기형: 종이 인포그래픽·차분한 해설 (editorial: 값 그대로)
    html: editorial/scene.html
  neon:                          # S2 개발의 신형: 검정 별자리 바탕·민트 강조·빠른 팝. 실측: 5초 간격 큰 변화 60%, 5.1~5.2음절/초, 1초+ 쉼 분당 9회
    html: editorial/scene_neon.html
    voice: {backend: voicebox, name: 여의도여자, speed: 1.0}   # 2026-11-02 현철님: 이 스타일도 여의도여자
    caption_max_chars: 32
    caption_hard_max: 40
    gap_sentence: 0.22           # 쉼이 짧다(미주일기의 절반)
    scene_lead: 0.12
    scene_tail: 0.35
    scene_min_sec: 2.4
    scene_max_sec: 9             # 3~5초마다 그림이 바뀌고 한 판은 9초를 넘기지 않는다
    syllables_per_sec: [5.0, 6.8]
    sfx_max_per_min: 16
    sfx_style: neon              # 장면 전환 휙, 등장 팝, 숫자 딩, 타자 틱
    bgm_mood: bright
    audio: {voice_db: 0, bgm_db: -23, duck_ratio: 6, sfx_db: -5, loudness_lufs: -14,
            voice_chain: "highpass=f=80,equalizer=f=3500:t=q:w=1.2:g=2,acompressor=threshold=-18dB:ratio=3:attack=6:release=120:makeup=2"}

ai_media:
  require_fields: [tool, model, generated_on]   # AI 소재마다 기록
  badge: true                                   # 화면에 'AI 생성 · 도구' 배지(끄면 경고)

qc:
  asr_cer_retry: 0.18          # 음성-대본 글자오류율이 이 값 넘으면 TTS 재생성
  asr_cer_fail: 0.30
  max_silence_sec: 0.9         # 내레이션 구간 안 무음이 이보다 길면 '소리 끊김'
  freeze_sec: 2.0              # 화면이 이 시간 이상 정지하면 '화면 멈춤'
  ocr_every_sec: 1.0

measured: {}                   # analyze_reference.py 가 채움
