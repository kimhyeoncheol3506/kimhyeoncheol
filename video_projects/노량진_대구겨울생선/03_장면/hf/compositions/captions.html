<template><style>@font-face{font-family:"MJ";src:url("assets/fonts/NanumMyeongjo-ExtraBold.ttf");font-weight:800}@font-face{font-family:"PX";src:url("assets/fonts/Pretendard-Bold.otf");font-weight:700}@font-face{font-family:"PX";src:url("assets/fonts/Pretendard-SemiBold.otf");font-weight:500}@font-face{font-family:"PXB";src:url("assets/fonts/Pretendard-ExtraBold.otf");font-weight:800}#root{position:absolute;inset:0;font-family:PX,sans-serif}.cap{position:absolute;left:0;right:0;bottom:56px;text-align:center;overflow:visible}.cap span{display:inline-block;background:rgba(0,0,0,.56);color:#fff;font-size:87px;font-weight:700;line-height:1.2;padding:6px 26px;white-space:nowrap}.cap b{color:#FFD640;font-weight:700}</style><div id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div class="clip cap" id="cap0" data-start="0.700" data-duration="1.540" data-track-index="1"><span>대구 한 마리에 <b>3</b>만 원</span></div><div class="clip cap" id="cap1" data-start="2.240" data-duration="2.280" data-track-index="1"><span>일주일 새 <b>5,000원</b>이</span></div><div class="clip cap" id="cap2" data-start="4.520" data-duration="1.793" data-track-index="1"><span>올랐다는 소식 보셨나요?</span></div><div class="clip cap" id="cap3" data-start="6.813" data-duration="2.060" data-track-index="1"><span>하지만 노량진 새벽 경매에서</span></div><div class="clip cap" id="cap4" data-start="8.873" data-duration="1.420" data-track-index="1"><span>선어 대구는 최근 <b>2</b>주</span></div><div class="clip cap" id="cap5" data-start="10.293" data-duration="2.080" data-track-index="1"><span>킬로그램당 평균 <b>4,648원</b>에</span></div><div class="clip cap" id="cap6" data-start="12.373" data-duration="0.573" data-track-index="1"><span>팔렸어요</span></div><div class="clip cap" id="cap7" data-start="13.446" data-duration="1.640" data-track-index="1"><span>이번 주는 <b>4,088원</b>으로</span></div><div class="clip cap" id="cap8" data-start="15.086" data-duration="2.307" data-track-index="1"><span>오히려 내려오는 중이었습니다</span></div><div class="clip cap" id="cap9" data-start="17.893" data-duration="1.660" data-track-index="1"><span>오늘은 대구 값 소식의 배경과</span></div><div class="clip cap" id="cap10" data-start="19.553" data-duration="2.020" data-track-index="1"><span>노량진 경락가 아귀와 물메기</span></div><div class="clip cap" id="cap11" data-start="21.573" data-duration="1.600" data-track-index="1"><span>같은 겨울 탕거리 시세까지</span></div><div class="clip cap" id="cap12" data-start="23.173" data-duration="0.905" data-track-index="1"><span>정리해 볼게요</span></div><div class="clip cap" id="cap13" data-start="26.178" data-duration="1.960" data-track-index="1"><span>가격은 노량진수산 주식회사가</span></div><div class="clip cap" id="cap14" data-start="28.138" data-duration="1.580" data-track-index="1"><span>매일 공개하는 어종별 경락시세</span></div><div class="clip cap" id="cap15" data-start="29.718" data-duration="2.517" data-track-index="1"><span>새벽 경매의 도매 낙찰가예요</span></div><div class="clip cap" id="cap16" data-start="32.736" data-duration="2.100" data-track-index="1"><span><b>11월</b> <b>12일</b>부터 <b>25일</b>까지</span></div><div class="clip cap" id="cap17" data-start="34.836" data-duration="1.840" data-track-index="1"><span><b>12</b>경매일 동안 선어 대구와</span></div><div class="clip cap" id="cap18" data-start="36.675" data-duration="1.960" data-track-index="1"><span>아귀는 킬로그램 단위 경매만</span></div><div class="clip cap" id="cap19" data-start="38.636" data-duration="1.420" data-track-index="1"><span>물메기는 상자 단위로 모아</span></div><div class="clip cap" id="cap20" data-start="40.056" data-duration="1.852" data-track-index="1"><span>거래량을 반영해 평균 냈습니다</span></div><div class="clip cap" id="cap21" data-start="42.408" data-duration="1.565" data-track-index="1"><span><b>2가지</b>를 먼저 알아 두세요</span></div><div class="clip cap" id="cap22" data-start="44.473" data-duration="1.960" data-track-index="1"><span>첫째 경락가는 도매가라서</span></div><div class="clip cap" id="cap23" data-start="46.433" data-duration="1.815" data-track-index="1"><span>가게에서 사는 값과 다릅니다</span></div><div class="clip cap" id="cap24" data-start="48.748" data-duration="1.990" data-track-index="1"><span>둘째 소매 가격은 한 마리</span></div><div class="clip cap" id="cap25" data-start="50.738" data-duration="1.010" data-track-index="1"><span>기준이고 경락가는</span></div><div class="clip cap" id="cap26" data-start="51.748" data-duration="1.860" data-track-index="1"><span>킬로그램당이라 숫자를 바로</span></div><div class="clip cap" id="cap27" data-start="53.608" data-duration="1.232" data-track-index="1"><span>비교할 수는 없어요</span></div><div class="clip cap" id="cap28" data-start="56.940" data-duration="1.960" data-track-index="1"><span>한국물가정보 조사에서 <b>11월</b></span></div><div class="clip cap" id="cap29" data-start="58.900" data-duration="1.380" data-track-index="1"><span><b>9일</b> 기준 대구 대자 한</span></div><div class="clip cap" id="cap30" data-start="60.280" data-duration="1.580" data-track-index="1"><span>마리는 <b>60</b>cm 기준</span></div><div class="clip cap" id="cap31" data-start="61.860" data-duration="1.160" data-track-index="1"><span><b>3</b>만 원으로 전주보다</span></div><div class="clip cap" id="cap32" data-start="63.020" data-duration="1.330" data-track-index="1"><span><b>5,000원</b> 올랐어요</span></div><div class="clip cap" id="cap33" data-start="64.850" data-duration="1.400" data-track-index="1"><span>생태도 <b>50</b>cm 대자 한</span></div><div class="clip cap" id="cap34" data-start="66.250" data-duration="1.520" data-track-index="1"><span>마리가 <b>3,000원</b> 올라 <b>1</b>만</span></div><div class="clip cap" id="cap35" data-start="67.770" data-duration="1.131" data-track-index="1"><span><b>3,000원</b>이었습니다</span></div><div class="clip cap" id="cap36" data-start="69.401" data-duration="1.640" data-track-index="1"><span>한국물가정보는 찬물을 좋아하는</span></div><div class="clip cap" id="cap37" data-start="71.041" data-duration="1.640" data-track-index="1"><span>냉수성 어종인 대구와 생태가</span></div><div class="clip cap" id="cap38" data-start="72.681" data-duration="2.240" data-track-index="1"><span>기온이 내려간 뒤에도 바닷물</span></div><div class="clip cap" id="cap39" data-start="74.921" data-duration="1.320" data-track-index="1"><span>수온이 높게 유지되면서</span></div><div class="clip cap" id="cap40" data-start="76.241" data-duration="1.800" data-track-index="1"><span>어획량이 줄어든 걸 원인으로</span></div><div class="clip cap" id="cap41" data-start="78.041" data-duration="0.505" data-track-index="1"><span>봤어요</span></div><div class="clip cap" id="cap42" data-start="79.046" data-duration="2.060" data-track-index="1"><span>반면 낙지는 <b>1</b>코 그러니까</span></div><div class="clip cap" id="cap43" data-start="81.106" data-duration="1.520" data-track-index="1"><span><b>4~5</b>마리에 <b>1,000원</b> 내린</span></div><div class="clip cap" id="cap44" data-start="82.626" data-duration="1.603" data-track-index="1"><span><b>1</b>만 <b>5,000원</b>이었다고 해요</span></div><div class="clip cap" id="cap45" data-start="86.330" data-duration="1.340" data-track-index="1"><span>우리 바다의 어종 지도도</span></div><div class="clip cap" id="cap46" data-start="87.670" data-duration="1.448" data-track-index="1"><span>빠르게 바뀌고 있어요</span></div><div class="clip cap" id="cap47" data-start="89.618" data-duration="1.040" data-track-index="1"><span>헤럴드경제에 따르면</span></div><div class="clip cap" id="cap48" data-start="90.658" data-duration="1.700" data-track-index="1"><span><b>2010년</b>대 이후 살오징어</span></div><div class="clip cap" id="cap49" data-start="92.358" data-duration="2.080" data-track-index="1"><span>어획량은 급감했고 고등어와</span></div><div class="clip cap" id="cap50" data-start="94.438" data-duration="1.800" data-track-index="1"><span>멸치는 정체된 반면 방어와</span></div><div class="clip cap" id="cap51" data-start="96.238" data-duration="1.400" data-track-index="1"><span>삼치 같은 난류성 어종은</span></div><div class="clip cap" id="cap52" data-start="97.638" data-duration="0.622" data-track-index="1"><span>늘었습니다</span></div><div class="clip cap" id="cap53" data-start="98.760" data-duration="1.740" data-track-index="1"><span>국립수산과학원은 최근 <b>10년</b></span></div><div class="clip cap" id="cap54" data-start="100.500" data-duration="1.460" data-track-index="1"><span>우리 바다 수온이 해마다</span></div><div class="clip cap" id="cap55" data-start="101.960" data-duration="2.140" data-track-index="1"><span><b>0.09</b>도씩 올라 <b>58년</b> 장기</span></div><div class="clip cap" id="cap56" data-start="104.100" data-duration="1.840" data-track-index="1"><span>평균보다 <b>3배</b> 넘게 빠르다고</span></div><div class="clip cap" id="cap57" data-start="105.940" data-duration="0.642" data-track-index="1"><span>밝혔어요</span></div><div class="clip cap" id="cap58" data-start="107.083" data-duration="1.520" data-track-index="1"><span>찬물 생선인 대구에겐 불리한</span></div><div class="clip cap" id="cap59" data-start="108.603" data-duration="0.983" data-track-index="1"><span>흐름인 셈이죠</span></div><div class="clip cap" id="cap60" data-start="111.686" data-duration="1.920" data-track-index="1"><span>노량진에 들어온 대구는 어디서</span></div><div class="clip cap" id="cap61" data-start="113.606" data-duration="2.160" data-track-index="1"><span>왔을까요? 물량 많은 산지</span></div><div class="clip cap" id="cap62" data-start="115.766" data-duration="0.986" data-track-index="1"><span>순으로 봤어요</span></div><div class="clip cap" id="cap63" data-start="117.252" data-duration="1.340" data-track-index="1"><span>포항산은 킬로그램당</span></div><div class="clip cap" id="cap64" data-start="118.592" data-duration="2.080" data-track-index="1"><span><b>3,490원</b> <b>2</b>주 동안</span></div><div class="clip cap" id="cap65" data-start="120.672" data-duration="2.148" data-track-index="1"><span><b>1,130kg</b>이 경매됐어요</span></div><div class="clip cap" id="cap66" data-start="123.320" data-duration="1.650" data-track-index="1"><span>후포산은 킬로그램당</span></div><div class="clip cap" id="cap67" data-start="124.970" data-duration="2.070" data-track-index="1"><span><b>4,715원</b> <b>2</b>주 동안</span></div><div class="clip cap" id="cap68" data-start="127.040" data-duration="1.855" data-track-index="1"><span><b>826kg</b>이 경매됐어요</span></div><div class="clip cap" id="cap69" data-start="129.394" data-duration="1.420" data-track-index="1"><span>방어진산은 킬로그램당</span></div><div class="clip cap" id="cap70" data-start="130.814" data-duration="2.280" data-track-index="1"><span><b>4,607원</b> <b>2</b>주 동안</span></div><div class="clip cap" id="cap71" data-start="133.094" data-duration="1.735" data-track-index="1"><span><b>497kg</b>이 경매됐어요</span></div><div class="clip cap" id="cap72" data-start="135.329" data-duration="1.590" data-track-index="1"><span>속초산은 킬로그램당</span></div><div class="clip cap" id="cap73" data-start="136.919" data-duration="2.170" data-track-index="1"><span><b>7,286원</b> <b>2</b>주 동안</span></div><div class="clip cap" id="cap74" data-start="139.089" data-duration="2.053" data-track-index="1"><span><b>493kg</b>이 경매됐어요</span></div><div class="clip cap" id="cap75" data-start="141.643" data-duration="1.320" data-track-index="1"><span>속초산이 킬로그램당</span></div><div class="clip cap" id="cap76" data-start="142.963" data-duration="1.980" data-track-index="1"><span><b>7,286원</b>으로 가장 비쌌고</span></div><div class="clip cap" id="cap77" data-start="144.943" data-duration="2.340" data-track-index="1"><span>물량이 가장 많은 포항산은</span></div><div class="clip cap" id="cap78" data-start="147.283" data-duration="1.994" data-track-index="1"><span><b>3,490원</b>으로 가장 쌌어요</span></div><div class="clip cap" id="cap79" data-start="149.777" data-duration="2.400" data-track-index="1"><span>포항과 후포 속초처럼 동해안</span></div><div class="clip cap" id="cap80" data-start="152.177" data-duration="1.272" data-track-index="1"><span>산지가 대부분이었어요</span></div><div class="clip cap" id="cap81" data-start="155.549" data-duration="2.720" data-track-index="1"><span>크기별로도 봤어요 규격의</span></div><div class="clip cap" id="cap82" data-start="158.269" data-duration="1.736" data-track-index="1"><span>숫자가 작을수록 큰 대구예요</span></div><div class="clip cap" id="cap83" data-start="160.505" data-duration="2.560" data-track-index="1"><span><b>1미</b>는 킬로그램당 <b>4,847원</b></span></div><div class="clip cap" id="cap84" data-start="163.065" data-duration="2.884" data-track-index="1"><span><b>3미</b>는 <b>3,75 </span></div><div class="clip cap" id="cap206" data-start="400.086" data-duration="2.240" data-track-index="1"><span>둘째 같은 대구라도 크기에</span></div><div class="clip cap" id="cap207" data-start="402.326" data-duration="1.101" data-track-index="1"><span>따라 값이 달라요</span></div><div class="clip cap" id="cap208" data-start="403.927" data-duration="2.280" data-track-index="1"><span>셋째 그날 노량진 경락가를</span></div><div class="clip cap" id="cap209" data-start="406.207" data-duration="1.082" data-track-index="1"><span>미리 확인하세요</span></div><div class="clip cap" id="cap210" data-start="407.789" data-duration="2.280" data-track-index="1"><span>넷째 도루묵처럼 끝물이 빠른</span></div><div class="clip cap" id="cap211" data-start="410.069" data-duration="1.484" data-track-index="1"><span>생선은 제철 안에 드세요</span></div><div class="clip cap" id="cap212" data-start="412.053" data-duration="1.860" data-track-index="1"><span>다섯째 원산지 표시도 꼭</span></div><div class="clip cap" id="cap213" data-start="413.913" data-duration="0.735" data-track-index="1"><span>확인하세요</span></div><div class="clip cap" id="cap214" data-start="415.148" data-duration="1.880" data-track-index="1"><span>이 화면은 캡처해 두셨다가 장</span></div><div class="clip cap" id="cap215" data-start="417.028" data-duration="1.508" data-track-index="1"><span>보러 갈 때 꺼내 보세요</span></div><div class="clip cap" id="cap216" data-start="422.136" data-duration="1.314" data-track-index="1"><span>다시 한 번 말씀드립니다</span></div><div class="clip cap" id="cap217" data-start="423.950" data-duration="1.660" data-track-index="1"><span>오늘 경매 값은 모두 노량진</span></div><div class="clip cap" id="cap218" data-start="425.610" data-duration="2.300" data-track-index="1"><span>도매 경락가이고 가게에서 사는</span></div><div class="clip cap" id="cap219" data-start="427.910" data-duration="0.901" data-track-index="1"><span>값과는 달라요</span></div><div class="clip cap" id="cap220" data-start="429.310" data-duration="2.180" data-track-index="1"><span>소매 대구 값은 올랐다지만</span></div><div class="clip cap" id="cap221" data-start="431.490" data-duration="1.500" data-track-index="1"><span>노량진 도매가는 물량이 늘며</span></div><div class="clip cap" id="cap222" data-start="432.990" data-duration="2.180" data-track-index="1"><span>내려오는 중이었어요 장 보실</span></div><div class="clip cap" id="cap223" data-start="435.170" data-duration="1.490" data-track-index="1"><span>때 단위와 크기를 꼭</span></div><div class="clip cap" id="cap224" data-start="436.660" data-duration="0.628" data-track-index="1"><span>확인하세요</span></div><div class="clip cap" id="cap225" data-start="437.788" data-duration="2.360" data-track-index="1"><span>노량진과 가락시장 소래포구까지</span></div><div class="clip cap" id="cap226" data-start="440.148" data-duration="1.640" data-track-index="1"><span>전국 시장의 도매가를 계속</span></div><div class="clip cap" id="cap227" data-start="441.788" data-duration="1.920" data-track-index="1"><span>정리해 드릴게요 시세</span></div><div class="clip cap" id="cap228" data-start="443.708" data-duration="1.788" data-track-index="1"><span>재생목록도 함께 봐 주세요</span></div><div class="clip cap" id="cap229" data-start="445.996" data-duration="2.800" data-track-index="1"><span>여러분은 겨울에 대구탕 아귀찜</span></div><div class="clip cap" id="cap230" data-start="448.796" data-duration="1.540" data-track-index="1"><span>물메기탕 중 뭘 제일 즐겨</span></div><div class="clip cap" id="cap231" data-start="450.336" data-duration="2.376" data-track-index="1"><span>드세요? 댓글로 알려 주세요</span></div></div><script>const tl = gsap.timeline({ paused: true }); window.__timelines["captions"] = tl;</script></template>
