an>선어가 싸다고 나쁜 물건이라는</span></div><div class="clip cap" id="cap293" data-start="541.393" data-duration="1.968" data-track-index="1"><span>뜻은 아닙니다 선어는 등급과</span></div><div class="clip cap" id="cap294" data-start="543.361" data-duration="1.574" data-track-index="1"><span>용도가 다른 물건이에요</span></div><div class="clip cap" id="cap295" data-start="545.410" data-duration="1.839" data-track-index="1"><span>활어는 회를 뜨기 위한 물건</span></div><div class="clip cap" id="cap296" data-start="547.249" data-duration="1.839" data-track-index="1"><span>선어는 구이나 조림처럼 익혀</span></div><div class="clip cap" id="cap297" data-start="549.088" data-duration="1.962" data-track-index="1"><span>먹는 데 많이 쓰이는 물건으로</span></div><div class="clip cap" id="cap298" data-start="551.050" data-duration="1.471" data-track-index="1"><span>보시면 이해가 쉽습니다</span></div><div class="clip cap" id="cap299" data-start="552.997" data-duration="1.734" data-track-index="1"><span>한 수산 전문가는 선어가</span></div><div class="clip cap" id="cap300" data-start="554.731" data-duration="1.868" data-track-index="1"><span>잡혀서 경매를 거쳐 가게에</span></div><div class="clip cap" id="cap301" data-start="556.599" data-duration="1.734" data-track-index="1"><span>오기까지 최소 <b>36시간</b>쯤</span></div><div class="clip cap" id="cap302" data-start="558.333" data-duration="1.334" data-track-index="1"><span>걸린다고 설명합니다</span></div><div class="clip cap" id="cap303" data-start="560.142" data-duration="2.031" data-track-index="1"><span>횟감으로는 잡힌 지 <b>24시간</b></span></div><div class="clip cap" id="cap304" data-start="562.174" data-duration="2.031" data-track-index="1"><span>이내를 권하지만 반찬감으로는</span></div><div class="clip cap" id="cap305" data-start="564.205" data-duration="2.167" data-track-index="1"><span>선어도 충분히 싱싱하다고 해요</span></div><div class="clip cap" id="cap306" data-start="566.847" data-duration="1.671" data-track-index="1"><span>반전도 하나 있습니다</span></div><div class="clip cap" id="cap307" data-start="568.992" data-duration="1.754" data-track-index="1"><span>고등어는 냉동이 <b>6</b>천 원
