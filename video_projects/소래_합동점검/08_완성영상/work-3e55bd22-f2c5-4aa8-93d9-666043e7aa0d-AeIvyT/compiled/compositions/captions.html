<template><style>@font-face{font-family:"MJ";src:url("assets/fonts/NanumMyeongjo-ExtraBold.ttf");font-weight:800}@font-face{font-family:"PX";src:url("assets/fonts/Pretendard-Bold.otf");font-weight:700}@font-face{font-family:"PX";src:url("assets/fonts/Pretendard-SemiBold.otf");font-weight:500}@font-face{font-family:"PXB";src:url("assets/fonts/Pretendard-ExtraBold.otf");font-weight:800}#root{position:absolute;inset:0;font-family:PX,sans-serif}.cap{position:absolute;left:0;right:0;bottom:56px;text-align:center;overflow:visible}.cap span{display:inline-block;background:rgba(0,0,0,.56);color:#fff;font-size:87px;font-weight:700;line-height:1.2;padding:6px 26px;white-space:nowrap}.cap b{color:#FFD640;font-weight:700}</style><div id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div class="clip cap" id="cap0" data-start="0.700" data-duration="1.860" data-track-index="1"><span>바가지 오명이 따라다니던 인천</span></div><div class="clip cap" id="cap1" data-start="2.560" data-duration="1.820" data-track-index="1"><span>소래포구가 다시 민관</span></div><div class="clip cap" id="cap2" data-start="4.380" data-duration="1.423" data-track-index="1"><span>합동점검에 나섰습니다</span></div><div class="clip cap" id="cap3" data-start="6.303" data-duration="2.170" data-track-index="1"><span>남동구는 원산지와 위생 저울</span></div><div class="clip cap" id="cap4" data-start="8.473" data-duration="2.750" data-track-index="1"><span>호객행위 광장 불법 점용까지</span></div><div class="clip cap" id="cap5" data-start="11.223" data-duration="1.720" data-track-index="1"><span><b>5가지</b>를 살폈다고 <b>11월</b></span></div><div class="clip cap" id="cap6" data-start="12.943" data-duration="1.331" data-track-index="1"><span><b>24일</b> 밝혔어요</span></div><div class="clip cap" id="cap7" data-start="14.774" data-duration="1.700" data-track-index="1"><span>앞으로 손님이 몰리는 <b>4~5월</b></span></div><div class="clip cap" id="cap8" data-start="16.474" data-duration="2.060" data-track-index="1"><span><b>9~11월</b>에는 매달 점검하고</span></div><div class="clip cap" id="cap9" data-start="18.534" data-duration="1.980" data-track-index="1"><span>고의로 부당한 장사를 하면</span></div><div class="clip cap" id="cap10" data-start="20.514" data-duration="2.160" data-track-index="1"><span>상인회 자체 징계까지 하겠다고</span></div><div class="clip cap" id="cap11" data-start="22.674" data-duration="0.416" data-track-index="1"><span>합니다</span></div><div class="clip cap" id="cap12" data-start="23.590" data-duration="1.440" data-track-index="1"><span>오늘은 점검 내용과 그동안</span></div><div class="clip cap" id="cap13" data-start="25.030" data-duration="2.100" data-track-index="1"><span>소래포구에 있었던 일 그리고</span></div><div class="clip cap" id="cap14" data-start="27.130" data-duration="1.760" data-track-index="1"><span>손님이 직접 확인할 것들을</span></div><div class="clip cap" id="cap15" data-start="28.890" data-duration="0.865" data-track-index="1"><span>정리해 볼게요</span></div><div class="clip cap" id="cap16" data-start="31.854" data-duration="1.460" data-track-index="1"><span>오늘 내용은 남동구 발표를</span></div><div class="clip cap" id="cap17" data-start="33.314" data-duration="2.080" data-track-index="1"><span>전한 보도와 서울신문 SBS</span></div><div class="clip cap" id="cap18" data-start="35.394" data-duration="2.100" data-track-index="1"><span>Biz YTN 같은 공개 보도</span></div><div class="clip cap" id="cap19" data-start="37.494" data-duration="2.280" data-track-index="1"><span>그리고 국가기술표준원 자료를</span></div><div class="clip cap" id="cap20" data-start="39.774" data-duration="1.102" data-track-index="1"><span>바탕으로 했어요</span></div><div class="clip cap" id="cap21" data-start="41.376" data-duration="1.620" data-track-index="1"><span>특정 가게나 상인을 지목하지</span></div><div class="clip cap" id="cap22" data-start="42.996" data-duration="2.160" data-track-index="1"><span>않고 보도된 사례는 사례로만</span></div><div class="clip cap" id="cap23" data-start="45.156" data-duration="2.240" data-track-index="1"><span>소개합니다 상인 측 반론이</span></div><div class="clip cap" id="cap24" data-start="47.396" data-duration="1.540" data-track-index="1"><span>있었던 건 그것도 함께</span></div><div class="clip cap" id="cap25" data-start="48.936" data-duration="0.589" data-track-index="1"><span>전할게요</span></div><div class="clip cap" id="cap26" data-start="51.625" data-duration="1.640" data-track-index="1"><span>이번 점검에는 구청 관련</span></div><div class="clip cap" id="cap27" data-start="53.265" data-duration="1.740" data-track-index="1"><span>부서와 인천시 특별사법경찰</span></div><div class="clip cap" id="cap28" data-start="55.005" data-duration="2.440" data-track-index="1"><span>그리고 어시장 상인회와 어촌계</span></div><div class="clip cap" id="cap29" data-start="57.445" data-duration="1.916" data-track-index="1"><span>부녀회까지 함께 했어요</span></div><div class="clip cap" id="cap30" data-start="59.861" data-duration="1.540" data-track-index="1"><span>행정 단속에 상인들 스스로의</span></div><div class="clip cap" id="cap31" data-start="61.401" data-duration="1.620" data-track-index="1"><span>책임을 더하겠다는 취지라고</span></div><div class="clip cap" id="cap32" data-start="63.021" data-duration="0.401" data-track-index="1"><span>합니다</span></div><div class="clip cap" id="cap33" data-start="63.922" data-duration="1.760" data-track-index="1"><span>살펴본 건 수산물 원산지 표시</span></div><div class="clip cap" id="cap34" data-start="65.682" data-duration="2.380" data-track-index="1"><span>식당 위생 저울이 정확한지</span></div><div class="clip cap" id="cap35" data-start="68.062" data-duration="2.340" data-track-index="1"><span>호객행위와 통행 방해 그리고</span></div><div class="clip cap" id="cap36" data-start="70.402" data-duration="1.420" data-track-index="1"><span>광장을 불법으로 차지하고</span></div><div class="clip cap" id="cap37" data-start="71.822" data-duration="0.782" data-track-index="1"><span>있는지였어요</span></div><div class="clip cap" id="cap38" data-start="73.104" data-duration="1.760" data-track-index="1"><span>가벼운 위반은 현장에서 바로</span></div><div class="clip cap" id="cap39" data-start="74.864" data-duration="2.200" data-track-index="1"><span>고치게 했고 일부러 부당하게</span></div><div class="clip cap" id="cap40" data-start="77.064" data-duration="1.840" data-track-index="1"><span>장사하다 걸리면 법에 따른</span></div><div class="clip cap" id="cap41" data-start="78.904" data-duration="1.460" data-track-index="1"><span>행정처분에 상인회 자체</span></div><div class="clip cap" id="cap42" data-start="80.364" data-duration="1.621" data-track-index="1"><span>징계까지 이어지게 했습니다</span></div><div class="clip cap" id="cap43" data-start="84.086" data-duration="2.080" data-track-index="1"><span>남동구는 앞서 <b>9월</b>에 소래포구</span></div><div class="clip cap" id="cap44" data-start="86.166" data-duration="2.020" data-track-index="1"><span>현장지원센터를 열고 상권</span></div><div class="clip cap" id="cap45" data-start="88.186" data-duration="2.247" data-track-index="1"><span>합동점검 태스크포스도 꾸렸어요</span></div><div class="clip cap" id="cap46" data-start="90.933" data-duration="1.600" data-track-index="1"><span>또 방문객이 많은 <b>4~5월</b></span></div><div class="clip cap" id="cap47" data-start="92.533" data-duration="2.200" data-track-index="1"><span><b>9~11월</b>에는 매달 합동점검을</span></div><div class="clip cap" id="cap48" data-start="94.733" data-duration="1.112" data-track-index="1"><span>하기로 했습니다</span></div><div class="clip cap" id="cap49" data-start="96.345" data-duration="1.640" data-track-index="1"><span>이병래 남동구청장은 일회성</span></div><div class="clip cap" id="cap50" data-start="97.985" data-duration="2.260" data-track-index="1"><span>단속에 그치지 않고 지속적인</span></div><div class="clip cap" id="cap51" data-start="100.245" data-duration="1.570" data-track-index="1"><span>현장 점검과 상권의 체질</span></div><div class="clip cap" id="cap52" data-start="101.815" data-duration="1.710" data-track-index="1"><span>개선으로 방문객의 신뢰를</span></div><div class="clip cap" id="cap53" data-start="103.525" data-duration="1.449" data-track-index="1"><span>되찾겠다고 말했어요</span></div><div class="clip cap" id="cap54" data-start="105.473" data-duration="2.100" data-track-index="1"><span>단속 횟수만이 아니라 정확한</span></div><div class="clip cap" id="cap55" data-start="107.573" data-duration="1.580" data-track-index="1"><span>가격 표시와 정량 판매처럼</span></div><div class="clip cap" id="cap56" data-start="109.153" data-duration="1.760" data-track-index="1"><span>손님이 현장에서 변화를 느끼는</span></div><div class="clip cap" id="cap57" data-start="110.913" data-duration="1.240" data-track-index="1"><span>게 중요하다는 지적도</span></div><div class="clip cap" id="cap58" data-start="112.153" data-duration="0.611" data-track-index="1"><span>나왔습니다</span></div><div class="clip cap" id="cap59" data-start="114.864" data-duration="2.900" data-track-index="1"><span>왜 이렇게까지 하는 걸까요?</span></div><div class="clip cap" id="cap60" data-start="117.764" data-duration="1.580" data-track-index="1"><span>그동안 소래포구에는 몇 차례</span></div><div class="clip cap" id="cap61" data-start="119.344" data-duration="0.885" data-track-index="1"><span>논란이 있었어요</span></div><div class="clip cap" id="cap62" data-start="120.729" data-duration="2.140" data-track-index="1"><span><b>2023년</b> <b>6월</b> 상인 <b>100</b>여</span></div><div class="clip cap" id="cap63" data-start="122.869" data-duration="2.420" data-track-index="1"><span>명이 모여 호객행위와 섞어팔기</span></div><div class="clip cap" id="cap64" data-start="125.289" data-duration="1.900" data-track-index="1"><span>물치기 바가지를 없애겠다는</span></div><div class="clip cap" id="cap65" data-start="127.189" data-duration="1.298" data-track-index="1"><span>자정대회를 열었습니다</span></div><div class="clip cap" id="cap66" data-start="128.988" data-duration="2.040" data-track-index="1"><span>하지만 열흘 만에 암꽃게</span></div><div class="clip cap" id="cap67" data-start="131.028" data-duration="1.520" data-track-index="1"><span><b>2kg</b>을 <b>6</b>만 원에 샀는데</span></div><div class="clip cap" id="cap68" data-start="132.548" data-duration="1.680" data-track-index="1"><span><b>7</b>마리 중 다리가 온전한 건</span></div><div class="clip cap" id="cap69" data-start="134.228" data-duration="1.860" data-track-index="1"><span><b>2</b>마리뿐이었다는 후기가 올라와</span></div><div class="clip cap" id="cap70" data-start="136.088" data-duration="2.020" data-track-index="1"><span>논란이 됐어요 상인 측은</span></div><div class="clip cap" id="cap71" data-start="138.108" data-duration="1.340" data-track-index="1"><span>자기네 꽃게가 아니라고</span></div><div class="clip cap" id="cap72" data-start="139.448" data-duration="0.525" data-track-index="1"><span>했습니다</span></div><div class="clip cap" id="cap73" data-start="140.473" data-duration="1.740" data-track-index="1"><span><b>2024년</b> <b>3월</b>에는 남동구가</span></div><div class="clip cap" id="cap74" data-start="142.213" data-duration="1.860" data-track-index="1"><span>점포 <b>290</b>여 곳의 저울을</span></div><div class="clip cap" id="cap75" data-start="144.073" data-duration="2.140" data-track-index="1"><span>점검해 <b>9</b>곳에서 불합격 저울을</span></div><div class="clip cap" id="cap76" data-start="146.213" data-duration="0.820" data-track-index="1"><span>찾아냈어요</span></div><div class="clip cap" id="cap77" data-start="147.533" data-duration="1.680" data-track-index="1"><span><b>5kg</b> 추를 올리니 최대</span></div><div class="clip cap" id="cap78" data-start="149.213" data-duration="2.100" data-track-index="1"><span><b>80g</b>이 차이 났는데 허용</span></div><div class="clip cap" id="cap79" data-start="151.313" data-duration="1.566" data-track-index="1"><span>오차는 <b>60g</b>이었습니다</span></div><div class="clip cap" id="cap80" data-start="153.379" data-duration="1.440" data-track-index="1"><span>올해 <b>1월</b>에는 한 방송</span></div><div class="clip cap" id="cap81" data-start="154.819" data-duration="1.970" data-track-index="1"><span>검증에서 <b>1.5kg</b>이라던</span></div><div class="clip cap" id="cap82" data-start="156.789" data-duration="0.950" data-track-index="1"><span>대게가 실제로는</span></div><div class="clip cap" id="cap83" data-start="157.739" data-duration="1.600" data-track-index="1"><span><b>870g</b>이었다는 보도가</span></div><div class="clip cap" id="cap84" data-start="159.339" data-duration="0.664" data-track-index="1"><span>나왔어요</span></div><div class="clip cap" id="cap85" data-start="160.503" data-duration="1.740" data-track-index="1"><span>이때 상인 측은 찌는 과정에서</span></div><div class="clip cap" id="cap86" data-start="162.243" data-duration="1.400" data-track-index="1"><span>물 무게가 빠진 걸 두고</span></div><div class="clip cap" id="cap87" data-start="163.643" data-duration="2.660" data-track-index="1"><span>영상을 조작했다며 법적 대응을</span></div><div class="clip cap" id="cap88" data-start="166.303" data-duration="1.165" data-track-index="1"><span>예고하기도 했습니다</span></div><div class="clip cap" id="cap89" data-start="169.567" data-duration="1.840" data-track-index="1"><span>손님이 직접 확인할 수 있는</span></div><div class="clip cap" id="cap90" data-start="171.407" data-duration="2.139" data-track-index="1"><span>것도 있어요 먼저 저울입니다</span></div><div class="clip cap" id="cap91" data-start="174.047" data-duration="1.640" data-track-index="1"><span>국가기술표준원 점검 기준처럼</span></div><div class="clip cap" id="cap92" data-start="175.687" data-duration="1.820" data-track-index="1"><span>올리기 전에 저울이 영점에</span></div><div class="clip cap" id="cap93" data-start="177.507" data-duration="1.820" data-track-index="1"><span>맞춰져 있는지 기울어 있지</span></div><div class="clip cap" id="cap94" data-start="179.327" data-duration="0.804" data-track-index="1"><span>않은지 보세요</span></div><div class="clip cap" id="cap95" data-start="180.630" data-duration="1.460" data-track-index="1"><span>봉이 달린 전자저울은 쟁반이</span></div><div class="clip cap" id="cap96" data-start="182.090" data-duration="0.960" data-track-index="1"><span>봉에 닿아 있으면</span></div><div class="clip cap" id="cap97" data-start="183.050" data-duration="2.000" data-track-index="1"><span><b>200~300g</b>이 더 나올 수</span></div><div class="clip cap" id="cap98" data-start="185.050" data-duration="2.320" data-track-index="1"><span>있고 케이블타이가 걸려 있으면</span></div><div class="clip cap" id="cap99" data-start="187.370" data-duration="1.540" data-track-index="1"><span><b>500g</b>에서 많게는 <b>1kg</b></span></div><div class="clip cap" id="cap100" data-start="188.910" data-duration="1.600" data-track-index="1"><span>넘게 늘어날 수 있다는 보도도</span></div><div class="clip cap" id="cap101" data-start="190.510" data-duration="0.587" data-track-index="1"><span>있었어요</span></div><div class="clip cap" id="cap102" data-start="191.598" data-duration="1.580" data-track-index="1"><span>쟁반과 봉을 떨어뜨려 달라고</span></div><div class="clip cap" id="cap103" data-start="193.178" data-duration="1.297" data-track-index="1"><span>요청해도 괜찮습니다</span></div><div class="clip cap" id="cap104" data-start="194.975" data-duration="1.240" data-track-index="1"><span>참고로 상거래용 저울은</span></div><div class="clip cap" id="cap105" data-start="196.215" data-duration="1.700" data-track-index="1"><span><b>2년</b>마다 정기검사를 받게 돼</span></div><div class="clip cap" id="cap106" data-start="197.915" data-duration="0.550" data-track-index="1"><span>있어요</span></div><div class="clip cap" id="cap107" data-start="198.965" data-duration="1.760" data-track-index="1"><span>전자저울 위쪽의 가장 큰</span></div><div class="clip cap" id="cap108" data-start="200.725" data-duration="2.620" data-track-index="1"><span>숫자는 금액인 경우가 많아요</span></div><div class="clip cap" id="cap109" data-start="203.345" data-duration="1.520" data-track-index="1"><span>아래 작은 창의 실제 무게를</span></div><div class="clip cap" id="cap110" data-start="204.865" data-duration="2.080" data-track-index="1"><span>보시고 단가 칸에 <b>1.7</b>이나</span></div><div class="clip cap" id="cap111" data-start="206.945" data-duration="1.760" data-track-index="1"><span><b>1.8</b> 같은 숫자가 미리 들어</span></div><div class="clip cap" id="cap112" data-start="208.705" data-duration="1.007" data-track-index="1"><span>있으면 물어보세요</span></div><div class="clip cap" id="cap113" data-start="210.212" data-duration="1.760" data-track-index="1"><span>바구니에 담아 잴 땐 바구니</span></div><div class="clip cap" id="cap114" data-start="211.972" data-duration="2.180" data-track-index="1"><span>무게부터 확인하세요 시장</span></div><div class="clip cap" id="cap115" data-start="214.152" data-duration="1.520" data-track-index="1"><span>바구니는 보통 <b>300g</b></span></div><div class="clip cap" id="cap116" data-start="215.672" data-duration="1.038" 도매가를 알아 두면</span></div><div class="clip cap" id="cap147" data-start="278.673" data-duration="1.980" data-track-index="1"><span>좋아요 노량진 새벽 경매</span></div><div class="clip cap" id="cap148" data-start="280.653" data-duration="2.012" data-track-index="1"><span>경락가를 참고로 보여 드릴게요</span></div><div class="clip cap" id="cap149" data-start="283.165" data-duration="1.380" data-track-index="1"><span>광어는 킬로그램당</span></div><div class="clip cap" id="cap150" data-start="284.545" data-duration="1.839" data-track-index="1"><span><b>25,088원</b>이었어요</span></div><div class="clip cap" id="cap151" data-start="286.884" data-duration="1.120" data-track-index="1"><span>참돔은 킬로그램당</span></div><div class="clip cap" id="cap152" data-start="288.004" data-duration="2.056" data-track-index="1"><span><b>19,588원</b>이었어요</span></div><div class="clip cap" id="cap153" data-start="290.560" data-duration="1.080" data-track-index="1"><span>농어는 킬로그램당</span></div><div class="clip cap" id="cap154" data-start="291.640" data-duration="1.579" data-track-index="1"><span><b>16,095원</b>이었어요</span></div><div class="clip cap" id="cap155" data-start="293.719" data-duration="1.540" data-track-index="1"><span>암꽃게는 킬로그램당</span></div><div class="clip cap" id="cap156" data-start="295.259" data-duration="1.818" data-track-index="1"><span><b>26,133원</b>이었어요</span></div><div class="clip cap" id="cap157" data-start="297.578" data-duration="1.620" data-track-index="1"><span>수꽃게는 킬로그램당</span></div><div class="clip cap" id="cap158" data-start="299.198" data-duration="1.788" data-track-index="1"><span><b>16,326원</b>이었어요</span></div><div class="clip cap" id="cap159" data-start="301.486" data-duration="1.260" data-track-index="1"><span>이건 노량진 도매가라서</span></div><div class="clip cap" id="cap160" data-start="302.746" data-duration="2.340" data-track-index="1"><span>소래포구 가게 값은 손질비와</span></div><div class="clip cap" id="cap161" data-start="305.086" data-duration="1.640" data-track-index="1"><span>가게 마진이 더해져 이보다</span></div><div class="clip cap" id="cap162" data-start="306.726" data-duration="1.940" data-track-index="1"><span>높은 게 정상이에요 다만</span></div><div class="clip cap" id="cap163" data-start="308.666" data-duration="1.740" data-track-index="1"><span>지나치게 차이 나면 한 번 더</span></div><div class="clip cap" id="cap164" data-start="310.406" data-duration="0.619" data-track-index="1"><span>물어보세요</span></div><div class="clip cap" id="cap165" data-start="313.125" data-duration="1.080" data-track-index="1"><span>자주 받을 만한 질문</span></div><div class="clip cap" id="cap166" data-start="314.205" data-duration="0.762" data-track-index="1"><span><b>3가지</b>예요</span></div><div class="clip cap" id="cap167" data-start="315.468" data-duration="2.380" data-track-index="1"><span>첫 번째 소래포구 지금 가도</span></div><div class="clip cap" id="cap168" data-start="317.848" data-duration="2.300" data-track-index="1"><span>될까요? 일부 업소의 잘못으로</span></div><div class="clip cap" id="cap169" data-start="320.148" data-duration="1.560" data-track-index="1"><span>선량한 상인들까지 피해를</span></div><div class="clip cap" id="cap170" data-start="321.708" data-duration="2.060" data-track-index="1"><span>본다는 지적이 있을 만큼</span></div><div class="clip cap" id="cap171" data-start="323.768" data-duration="2.460" data-track-index="1"><span>대부분은 정상적으로 장사해요</span></div><div class="clip cap" id="cap172" data-start="326.228" data-duration="1.460" data-track-index="1"><span>오늘 말씀드린 것만 챙기면</span></div><div class="clip cap" id="cap173" data-start="327.688" data-duration="0.640" data-track-index="1"><span>충분합니다</span></div><div class="clip cap" id="cap174" data-start="328.828" data-duration="2.740" data-track-index="1"><span>두 번째 문제가 생기면 어떻게</span></div><div class="clip cap" id="cap175" data-start="331.568" data-duration="2.420" data-track-index="1"><span>할까요? 영수증과 무게가 찍힌</span></div><div class="clip cap" id="cap176" data-start="333.988" data-duration="1.800" data-track-index="1"><span>화면 사진을 남겨 두고</span></div><div class="clip cap" id="cap177" data-start="335.788" data-duration="1.980" data-track-index="1"><span>구청이나 상인회에 알리세요</span></div><div class="clip cap" id="cap178" data-start="337.768" data-duration="1.600" data-track-index="1"><span>이번에 상인회 자체 징계도</span></div><div class="clip cap" id="cap179" data-start="339.368" data-duration="1.282" data-track-index="1"><span>연계하기로 했으니까요</span></div><div class="clip cap" id="cap180" data-start="341.151" data-duration="1.940" data-track-index="1"><span>세 번째 다음 점검은</span></div><div class="clip cap" id="cap181" data-start="343.091" data-duration="2.640" data-track-index="1"><span>언제일까요? 남동구는 <b>4~5월</b></span></div><div class="clip cap" id="cap182" data-start="345.731" data-duration="2.220" data-track-index="1"><span><b>9~11월</b> 성수기마다 매달</span></div><div class="clip cap" id="cap183" data-start="347.951" data-duration="1.552" data-track-index="1"><span>점검하겠다고 했어요</span></div><div class="clip cap" id="cap184" data-start="351.603" data-duration="3.060" data-track-index="1"><span>한 장으로 정리합니다 소래포구</span></div><div class="clip cap" id="cap185" data-start="354.663" data-duration="1.222" data-track-index="1"><span>장보기 <b>5단계</b>예요</span></div><div class="clip cap" id="cap186" data-start="356.384" data-duration="2.580" data-track-index="1"><span>첫째 노량진 경락가로 대략적인</span></div><div class="clip cap" id="cap187" data-start="358.964" data-duration="1.201" data-track-index="1"><span>시세를 알고 가세요</span></div><div class="clip cap" id="cap188" data-start="360.665" data-duration="1.900" data-track-index="1"><span>둘째 수조 앞 원산지 표시를</span></div><div class="clip cap" id="cap189" data-start="362.565" data-duration="0.684" data-track-index="1"><span>확인하세요</span></div><div class="clip cap" id="cap190" data-start="363.749" data-duration="2.780" data-track-index="1"><span>셋째 저울이 영점인지 기울지</span></div><div class="clip cap" id="cap191" data-start="366.529" data-duration="1.980" data-track-index="1"><span>않았는지 쟁반이 봉에 닿지</span></div><div class="clip cap" id="cap192" data-start="368.509" data-duration="1.008" data-track-index="1"><spa
