<!doctype html>
<html lang="ko" data-resolution="landscape">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Pretendard"; src: url("Pretendard-ExtraBold.otf"); font-weight: 900; }
:root { --bg:#181614; --ink:#fff; --muted:#a39d94; --red:#f2262b; --blue:#3d97e5; --yellow:#e3c04b; --gray:#5a5752; }
*{margin:0;padding:0;box-sizing:border-box} html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
#root{position:absolute;inset:0;font-family:"Pretendard",sans-serif;color:var(--ink)}
.t{position:absolute;font-weight:900}
#kicker{left:140px;top:120px;font-size:40px;color:var(--yellow);letter-spacing:2px}
#title{left:140px;top:180px;font-size:110px;letter-spacing:-4px}
#title span{display:inline-block}
#chart{position:absolute;left:140px;top:380px}
#mult{left:1330px;top:420px;font-size:200px;color:var(--red);letter-spacing:-6px}
#mult small{font-size:80px}
#cap{left:1340px;top:650px;font-size:40px;color:var(--muted)}
#bars{position:absolute;left:140px;top:380px;width:1640px;height:460px;opacity:0}
.row{display:flex;align-items:center;height:130px;gap:30px}
.lab{width:330px;font-size:44px;font-weight:900;text-align:right;color:var(--muted)}
.bar{height:84px;border-radius:10px;transform-origin:left center}
.val{font-size:56px;font-weight:900}
#end{left:0;right:0;top:880px;text-align:center;font-size:64px;color:var(--yellow)}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
 <div id="kicker" class="t clip" data-start="0" data-duration="10" data-track-index="0">경제 상식 1분</div>
 <div id="title" class="t clip" data-start="0" data-duration="10" data-track-index="1"><span>복리,</span> <span>시간이</span> <span>돈을</span> <span>낳는다</span></div>
 <svg id="chart" class="clip" data-start="0" data-duration="10" data-track-index="2" width="1160" height="460" viewBox="-20 -20 1160 460">
   <line x1="0" y1="420" x2="1100" y2="420" stroke="#5a5752" stroke-width="4"/>
   <line x1="0" y1="0" x2="0" y2="420" stroke="#5a5752" stroke-width="4"/>
   <path id="curve" d="M0.0 420.0 L27.5 417.9 L55.0 415.6 L82.5 413.2 L110.0 410.7 L137.5 407.9 L165.0 405.0 L192.5 401.8 L220.0 398.4 L247.5 394.8 L275.0 390.9 L302.5 386.8 L330.0 382.4 L357.5 377.6 L385.0 372.6 L412.5 367.1 L440.0 361.3 L467.5 355.1 L495.0 348.5 L522.5 341.4 L550.0 333.8 L577.5 325.6 L605.0 316.9 L632.5 307.6 L660.0 297.6 L687.5 286.9 L715.0 275.5 L742.5 263.3 L770.0 250.2 L797.5 236.2 L825.0 221.3 L852.5 205.3 L880.0 188.1 L907.5 169.8 L935.0 150.2 L962.5 129.2 L990.0 106.7 L1017.5 82.7 L1045.0 57.0 L1072.5 29.4 L1100.0 0.0" fill="none" stroke="#f2262b" stroke-width="10" stroke-linecap="round"/>
   <circle id="dot" cx="1100" cy="0" r="18" fill="#e3c04b" opacity="0"/>
 </svg>
 <div id="mult" class="t clip" data-start="0" data-duration="10" data-track-index="3"><span id="m">1.0</span><small>배</small></div>
 <div id="cap" class="t clip" data-start="0" data-duration="10" data-track-index="4">연 7% · 40년 복리 (예시)</div>
 <div id="bars" class="clip" data-start="0" data-duration="10" data-track-index="5">
   <div class="row"><div class="lab">단리 7%</div><div class="bar" id="b1" style="width:520px;background:var(--gray)"></div><div class="val" id="v1">3.8배</div></div>
   <div class="row"><div class="lab">복리 7%</div><div class="bar" id="b2" style="width:1000px;background:var(--red)"></div><div class="val" id="v2" style="color:var(--red)">15.0배</div></div>
 </div>
 <div id="end" class="t clip" data-start="0" data-duration="10" data-track-index="6">일찍 시작할수록, 오래 둘수록</div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const len = document.getElementById("curve").getTotalLength();
gsap.set("#curve", { strokeDasharray: len, strokeDashoffset: len });
tl.fromTo("#kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0);
tl.fromTo("#title span", { opacity: 0, y: 60, rotate: 4 }, { opacity: 1, y: 0, rotate: 0, duration: 0.45, ease: "back.out(2)", stagger: 0.14 }, 0.15);
tl.fromTo("#chart", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.1);
tl.to("#curve", { strokeDashoffset: 0, duration: 3.0, ease: "power2.in" }, 1.3);
const m = { v: 1 };
tl.fromTo("#mult", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.3);
tl.to(m, { v: 14.97, duration: 3.0, ease: "power2.in", onUpdate: () => { document.getElementById("m").textContent = m.v.toFixed(1); } }, 1.3);
tl.to("#dot", { opacity: 1, duration: 0.2 }, 4.3);
tl.fromTo("#dot", { scale: 0.3, transformOrigin: "50% 50%" }, { scale: 1.6, duration: 0.25, yoyo: true, repeat: 1 }, 4.3);
tl.fromTo("#cap", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.0);
tl.to(["#chart", "#mult", "#cap"], { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, 5.6);
tl.to("#bars", { opacity: 1, duration: 0.2 }, 6.0);
tl.fromTo("#b1", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power4.out" }, 6.1);
tl.fromTo("#b2", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power4.out" }, 6.5);
tl.fromTo(["#v1", "#v2"], { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.4 }, 6.8);
tl.fromTo("#end", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.0);
tl.to({}, { duration: 1.5 }, 8.5);
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body></html>
