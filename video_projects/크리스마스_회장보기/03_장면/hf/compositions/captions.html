="387.585" data-duration="0.386" data-track-index="1"><span>됩니다</span></div><div class="clip cap" id="cap205" data-start="390.071" data-duration="2.160" data-track-index="1"><span>자주 받을 만한 질문 <b>3가지</b>만</span></div><div class="clip cap" id="cap206" data-start="392.231" data-duration="0.540" data-track-index="1"><span>짚을게요</span></div><div class="clip cap" id="cap207" data-start="393.271" data-duration="1.916" data-track-index="1"><span>첫 번째 며칠 전에 미리 사서</span></div><div class="clip cap" id="cap208" data-start="395.187" data-duration="1.078" data-track-index="1"><span>두면 안 될까요?</span></div><div class="clip cap" id="cap209" data-start="396.765" data-duration="1.862" data-track-index="1"><span>활어는 사 온 날 회로 먹는</span></div><div class="clip cap" id="cap210" data-start="398.627" data-duration="1.614" data-track-index="1"><span>게 기본이에요 오늘 말한</span></div><div class="clip cap" id="cap211" data-start="400.240" data-duration="1.986" data-track-index="1"><span>미리는 사 두기가 아니라 날짜</span></div><div class="clip cap" id="cap212" data-start="402.226" data-duration="0.621" data-track-index="1"><span>계획입니다</span></div><div class="clip cap" id="cap213" data-start="403.347" data-duration="1.981" data-track-index="1"><span>두 번째 지난 편의 작년 값과</span></div><div class="clip cap" id="cap214" data-start="405.328" data-duration="0.866" data-track-index="1"><span>왜 다른가요?</span></div><div class="clip cap" id="cap215" data-start="406.694" data-duration="1.831" data-track-index="1"><span>지난 편은 주마다 월요일과</span></div><div class="clip cap" id="cap216" data-start="408.525" data-duration="1.962" data-track-index="1"><span>화요일 이틀만 뽑았고 이번엔</span></div><div class="clip cap" id="cap217" data-start="410.487" data-duration="1.831" data-track-index="1"><span>월요일부터 토요일까지 모든</span></div><div class="clip cap" id="cap218" data-start="412.318" data-duration="1.046" data-track-index="1"><span>날짜를 넣었어요</span></div><div class="clip cap" id="cap219" data-start="413.865" data-duration="1.889" data-track-index="1"><span>같은 자료지만 묶은 날짜가</span></div><div class="clip cap" id="cap220" data-start="415.754" data-duration="1.754" data-track-index="1"><span>달라서 값도 조금 다르게</span></div><div class="clip cap" id="cap221" data-start="417.508" data-duration="0.675" data-track-index="1"><span>나왔습니다</span></div><div class="clip cap" id="cap222" data-start="418.682" data-duration="1.984" data-track-index="1"><span>세 번째 일요일에는요? 일별</span></div><div class="clip cap" id="cap223" data-start="420.666" data-duration="1.984" data-track-index="1"><span>수집본에는 일요일 경매 값이</span></div><div class="clip cap" id="cap224" data-start="422.650" data-duration="2.116" data-track-index="1"><span>없어서 주간 비교는 월요일부터</span></div><div class="clip cap" id="cap225" data-start="424.766" data-duration="1.322" data-track-index="1"><span>토요일로 계산했어요</span></div><div class="clip cap" id="cap226" data-start="428.188" data-duration="1.488" data-track-index="1"><span>한 장으로 정리합니다</span></div><div class="clip cap" id="cap227" data-start="429.676" data-duration="2.029" data-track-index="1"><span>크리스마스와 연말 회 장보기</span></div><div class="clip cap" id="cap228" data-start="431.706" data-duration="0.947" data-track-index="1"><span>다섯 단계예요</span></div><div class="clip cap" id="cap229" data-start="433.153" data-duration="1.929" data-track-index="1"><span>첫째 날짜 고를 수 있다면</span></div><div class="clip cap" id="cap230" data-start="435.082" data-duration="1.653" data-track-index="1"><span><b>12월</b> 초나 중순으로요</span></div><div class="clip cap" id="cap231" data-start="437.235" data-duration="2.103" data-track-index="1"><span>둘째 인원 인원에 <b>200g</b>을</span></div><div class="clip cap" id="cap232" data-start="439.338" data-duration="2.243" data-track-index="1"><span>곱하고 수율로 나눠 킬로그램을</span></div><div class="clip cap" id="cap233" data-start="441.581" data-duration="0.561" data-track-index="1"><span>정하세요</span></div><div class="clip cap" id="cap234" data-start="442.641" data-duration="2.081" data-track-index="1"><span>셋째 생선 그 주 값을 보고</span></div><div class="clip cap" id="cap235" data-start="444.722" data-duration="1.942" data-track-index="1"><span>광어 참돔 농어를 섞으세요</span></div><div class="clip cap" id="cap236" data-start="447.165" data-duration="2.146" data-track-index="1"><span>넷째 시세 토요일 주간 시세로</span></div><div class="clip cap" id="cap237" data-start="449.311" data-duration="1.878" data-track-index="1"><span>그 주 경락가를 확인하세요</span></div><div class="clip cap" id="cap238" data-start="451.688" data-duration="1.990" data-track-index="1"><span>다섯째 당일 활어는 모임 날</span></div><div class="clip cap" id="cap239" data-start="453.678" data-duration="1.592" data-track-index="1"><span>사서 바로 회로 뜨세요</span></div><div class="clip cap" id="cap240" data-start="455.771" data-duration="2.001" data-track-index="1"><span>이 화면은 캡처해 두셨다가 장</span></div><div class="clip cap" id="cap241" data-start="457.771" data-duration="1.876" data-track-index="1"><span>보러 가기 전에 꺼내 보세요</span></div><div class="clip cap" id="cap242" data-start="463.247" data-duration="1.818" data-track-index="1"><span>다시 한 번 말씀드립니다</span></div><div class="clip cap" id="cap243" data-start="465.565" data-duration="2.076" data-track-index="1"><span>오늘 금액은 모두 노량진 도매</span></div><div class="clip cap" id="cap244" data-start="467.641" data-duration="1.947" data-track-index="1"><span>경락가로 계산한 값이고 가게</span></div><div class="clip cap" id="cap245" data-start="469.588" data-duration="1.557" data-track-index="1"><span>판매가와 초장집 비용은</span></div><div class="clip cap" id="cap246" data-start="471.145" data-duration="0.649" data-track-index="1"><span>따로입니다</span></div><div class="clip cap" id="cap247" data-start="472.294" data-duration="1.690" data-track-index="1"><span>작년 <b>12월</b> 숫자는 과거</span></div><div class="clip cap" id="cap248" data-start="473.984" data-duration="1.820" data-track-index="1"><span>데이터일 뿐 올해도 똑같이</span></div><div class="clip cap" id="cap249" data-start="475.804" data-duration="1.690" data-track-index="1"><span>흘러간다는 보장은 없어요</span></div><div class="clip cap" id="cap250" data-start="477.994" data-duration="2.064" data-track-index="1"><span>제 생각에는 크리스마스 회값을</span></div><div class="clip cap" id="cap251" data-start="480.059" data-duration="1.806" data-track-index="1"><span>아끼는 건 미리 사 두기가</span></div><div class="clip cap" id="cap252" data-start="481.865" data-duration="2.064" data-track-index="1"><span>아니라 날짜와 생선 조합입니다</span></div><div class="clip cap" id="cap253" data-start="484.429" data-duration="1.672" data-track-index="1"><span>인원별 필요한 킬로그램과</span></div><div class="clip cap" id="cap254" data-start="486.102" data-duration="1.801" data-track-index="1"><span>생선별 가성비는 지난 연말</span></div><div class="clip cap" id="cap255" data-start="487.902" data-duration="1.929" data-track-index="1"><span>모임 회 장보기 편에 자세히</span></div><div class="clip cap" id="cap256" data-start="489.832" data-duration="0.386" data-track-index="1"><span>있어요</span></div><div class="clip cap" id="cap257" data-start="490.718" data-duration="1.986" data-track-index="1"><span>매주 토요일 노량진 주간 시세</span></div><div class="clip cap" id="cap258" data-start="492.704" data-duration="1.862" data-track-index="1"><span>재생목록도 같이 보시면 모임</span></div><div class="clip cap" id="cap259" data-start="494.566" data-duration="1.738" data-track-index="1"><span>주의 값을 바로 확인할 수</span></div><div class="clip cap" id="cap260" data-start="496.303" data-duration="0.497" data-track-index="1"><span>있습니다</span></div><div class="clip cap" id="cap261" data-start="497.300" data-duration="2.232" data-track-index="1"><span>여러분은 크리스마스 모임 날짜</span></div><div class="clip cap" id="cap262" data-start="499.532" data-duration="1.814" data-track-index="1"><span>정하셨나요? 댓글로 알려</span></div><div class="clip cap" id="cap263" data-start="501.346" data-duration="0.419" data-track-index="1"><span>주세요</span></div></div><script>const tl = gsap.timeline({ paused: true }); window.__timelines["captions"] = tl;</script></template>
