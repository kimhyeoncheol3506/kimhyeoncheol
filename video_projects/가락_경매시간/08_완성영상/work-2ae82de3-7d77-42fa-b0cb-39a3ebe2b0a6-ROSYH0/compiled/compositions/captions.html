uration="1.700" data-track-index="1"><span>경매 현장 모습은 서울신문의</span></div><div class="clip cap" id="cap25" data-start="53.021" data-duration="1.880" data-track-index="1"><span>가락시장 <b>40년</b> 기획 르포를</span></div><div class="clip cap" id="cap26" data-start="54.901" data-duration="0.849" data-track-index="1"><span>참고했어요</span></div><div class="clip cap" id="cap27" data-start="56.250" data-duration="2.070" data-track-index="1"><span>먼저 알아 두실 점이 있어요</span></div><div class="clip cap" id="cap28" data-start="58.320" data-duration="1.690" data-track-index="1"><span>경매 시간은 출하 시기와</span></div><div class="clip cap" id="cap29" data-start="60.010" data-duration="2.220" data-track-index="1"><span>반입량에 따라 법인별 계절별로</span></div><div class="clip cap" id="cap30" data-start="62.230" data-duration="1.225" data-track-index="1"><span>바뀔 수 있습니다</span></div><div class="clip cap" id="cap31" data-start="63.955" data-duration="1.600" data-track-index="1"><span>또 토요일 저녁부터 일요일</span></div><div class="clip cap" id="cap32" data-start="65.555" data-duration="1.340" data-track-index="1"><span>새벽까지는 경매가 열리지</span></div><div class="clip cap" id="cap33" data-start="66.895" data-duration="0.407" data-track-index="1"><span>않아요</span></div><div class="clip cap" id="cap34" data-start="69.403" data-duration="1.880" data-track-index="1"><span>가락시장은 <b>1985년</b> <b>6월</b></span></div><div class="clip cap" id="cap35" data-start="71.283" data-duration="1.580" data-track-index="1"><span><b>19일</b> 우리나라 첫</span></div><div class="clip cap" id="cap36" data-start="72.863" data-duration="2.239" data-track-index="1"><span>공영도매시장으로 문을 열었어요</span></div><div class="clip cap" id="cap37" data-start="75.602" data-duration="1.840" data-track-index="1"><span>서울신문 보도로는 한 해 거래</span></div><div class="clip cap" id="cap38" data-start="77.442" data-duration="2.620" data-track-index="1"><span>규모가 약 <b>227</b>만 톤 하루</span></div><div class="clip cap" id="cap39" data-start="80.062" data-duration="1.401" data-track-index="1"><span><b>7,500
