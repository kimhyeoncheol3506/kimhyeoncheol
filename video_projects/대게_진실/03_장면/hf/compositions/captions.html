ration="1.573" data-track-index="1"><span>대게는 살아 있는 대게의</span></div><div class="clip cap" id="cap130" data-start="257.222" data-duration="1.694" data-track-index="1"><span>절반도 안 되는 값이니 싼</span></div><div class="clip cap" id="cap131" data-start="258.916" data-duration="1.815" data-track-index="1"><span>대게 중엔 선어가 섞여 있을</span></div><div class="clip cap" id="cap132" data-start="260.730" data-duration="0.605" data-track-index="1"><span>수 있어요</span></div><div class="clip cap" id="cap133" data-start="261.835" data-duration="2.281" data-track-index="1"><span>살 때 활대게인지 선어인지 꼭</span></div><div class="clip cap" id="cap134" data-start="264.117" data-duration="0.713" data-track-index="1"><span>물어보세요</span></div><div class="clip cap" id="cap135" data-start="265.329" data-duration="2.014" data-track-index="1"><span>세 번째는 크기예요 최근 <b>2</b>주</span></div><div class="clip cap" id="cap136" data-start="267.344" data-duration="2.014" data-track-index="1"><span>활대게는 거의 전부 같은 규격</span></div><div class="clip cap" id="cap137" data-start="269.358" data-duration="1.888" data-track-index="1"><span>표기로 경매돼서 크기별 값을</span></div><div class="clip cap" id="cap138" data-start="271.246" data-duration="1.636" data-track-index="1"><span>따로 비교하긴 어려웠어요</span></div><div class="clip cap" id="cap139" data-start="273.382" data-duration="1.709" data-track-index="1"><span>하지만 작은 대게나 다리가</span></div><div class="clip cap" id="cap140" data-start="275.092" data-duration="1.953" data-track-index="1"><span>빠진 대게는 같은 무게라도 더</span></div><div class="clip cap" id="cap141" data-start="277.045" data-duration="1.831" data-track-index="1"><span>싸게 팔리는 경우가 많습니다</span></div><div class="clip cap" id="cap142" data-start="279.376" data-duration="2.281" data-track-index="1"><span>네 번째는 살이 얼마나 찼느냐</span></div><div class="clip cap" id="cap143" data-start="281.658" data-duration="0.713" data-track-index="1"><span>수율이에요</span></div><div class="clip cap" id="cap144" data-start="282.871" data-duration="2.034" data-track-index="1"><span>같은 <b>1kg</b>이라도 살이 덜 찬</span></div><div class="clip cap" id="cap145" data-start="284.905" data-duration="2.034" data-track-index="1"><span>대게는 먹을 게 적고 이건 쪄</span></div><div class="clip cap" id="cap146" data-start="286.939" data-duration="1.653" data-track-index="1"><span>보기 전에는 정확히 알기</span></div><div class="clip cap" id="cap147" data-start="288.591" data-duration="0.509" data-track-index="1"><span>어려워요</span></div><div class="clip cap" id="cap148" data-start="291.200" data-duration="2.053" data-track-index="1"><span>연말 갑각류로 많이 비교하는</span></div><div class="clip cap" id="cap149" data-start="293.253" data-duration="2.053" data-track-index="1"><span>킹크랩도 볼게요 경락시세에는</span></div><div class="clip cap" id="cap150" data-start="295.305" data-duration="1.095" data-track-index="1"><span>왕게로 올라와요</span></div><div class="clip cap" id="cap151" data-start="296.900" data-duration="1.983" data-track-index="1"><span>이번 주 살아 있는 킹크랩은</span></div><div class="clip cap" id="cap152" data-start="298.883" data-duration="1.058" data-track-index="1"><span>킬로그램당 평균</span></div><div class="clip cap" id="cap153" data-start="299.941" data-duration="2.116" data-track-index="1"><span><b>70,039원</b>으로 활대게의 약</span></div><div class="clip cap" id="cap154" data-start="302.057" data-duration="0.926" data-track-index="1"><span><b>1.9배</b>였어요</span></div><div class="clip cap" id="cap155" data-start="303.482" data-duration="1.266" data-track-index="1"><span>선어 킹크랩은</span></div><div class="clip cap" id="cap156" data-start="304.748" data-duration="2.170" data-track-index="1"><span><b>27,638원</b>이었습니다</span></div><div class="clip cap" id="cap157" data-start="307.418" data-duration="1.888" data-track-index="1"><span>같은 예산이라면 대게를 <b>2배</b></span></div><div class="clip cap" id="cap158" data-start="309.306" data-duration="1.888" data-track-index="1"><span>가까이 살 수 있는 셈이지만</span></div><div class="clip cap" id="cap159" data-start="311.194" data-duration="1.636" data-track-index="1"><span>살 비율과 맛은 품목마다</span></div><div class="clip cap" id="cap160" data-start="312.831" data-duration="1.762" data-track-index="1"><span>다르니 무게만으로 비교하진</span></div><div class="clip cap" id="cap161" data-start="314.593" data-duration="0.378" data-track-index="1"><span>마세요</span></div><div class="clip cap" id="cap162" data-start="317.071" data-duration="1.941" data-track-index="1"><span>킬로그램 <b>2</b>만 <b>5</b>천 원 대게</span></div><div class="clip cap" id="cap163" data-start="319.012" data-duration="0.906" data-track-index="1"><span>사도 될까요?</span></div><div class="clip cap" id="cap164" data-start="320.418" data-duration="1.935" data-track-index="1"><span>선어인 걸 알고 바로 쪄 먹을</span></div><div class="clip cap" id="cap165" data-start="322.353" data-duration="1.572" data-track-index="1"><span>거라면 또 크기가 작아도</span></div><div class="clip cap" id="cap166" data-start="323.925" data-duration="1.693" data-track-index="1"><span>괜찮다면 충분히 살 만해요</span></div><div class="clip cap" id="cap167" data-start="326.118" data-duration="1.759" data-track-index="1"><span>찌기 전 무게를 내 눈으로</span></div><div class="clip cap" id="cap168" data-start="327.877" data-duration="1.382" data-track-index="1"><span>확인했다면 더 좋고요</span></div><div class="clip cap" id="cap169" data-start="329.759" data-duration="1.923" data-track-index="1"><span>반대로 살아 있는 대게라는데</span></div><div class="clip cap" id="cap170" data-start="331.682" data-duration="1.795" data-track-index="1"><span>경락가보다도 싸다면 크기와</span></div><div class="clip cap" id="cap171" data-start="333.477" data-duration="1.923" data-track-index="1"><span>상태를 한 번 더 확인하세요</span></div><div class="clip cap" id="cap172" data-start="335.900" data-duration="2.024" data-track-index="1"><span>무게를 쪄서만 알려 주는 곳도</span></div><div class="clip cap" id="cap173" data-start="337.924" data-duration="1.265" data-track-index="1"><span>조심하는 게 좋아요</span></div><div class="clip cap" id="cap174" data-start="339.688" data-duration="1.432" data-track-index="1"><span>방송 검증 보도에선</span></div><div class="clip cap" id="cap175" data-start="341.120" data-duration="1.861" data-track-index="1"><span><b>1.5kg</b>이라고 안내받은</span></div><div class="clip cap" id="cap176" data-start="342.981" data-duration="2.291" data-track-index="1"><span>대게를 재 보니 <b>870g</b>이었던</span></div><div class="clip cap" id="cap177" data-start="345.272" data-duration="2.148" data-track-index="1"><span>사례도 있었어요 가게 이름은</span></div><div class="clip cap" id="cap178" data-start="347.419" data-duration="1.145" data-track-index="1"><span>밝히지 않을게요</span></div><div class="clip cap" id="cap179" data-start="350.665" data-duration="2.297" data-track-index="1"><span>마지막으로 대게 <b>1kg</b>을 찌면</span></div><div class="clip cap" id="cap180" data-start="352.962" data-duration="1.579" data-track-index="1"><span>몇 그램이 남을까요?</span></div><div class="clip cap" id="cap181" data-start="355.041" data-duration="1.528" data-track-index="1"><span>수산물 전문가 김지민은</span></div><div class="clip cap" id="cap182" data-start="356.569" data-duration="1.782" data-track-index="1"><span>갑각류를 찌면 피와 수분이</span></div><div class="clip cap" id="cap183" data-start="358.351" data-duration="2.037" data-track-index="1"><span>빠져 무게가 준다고 설명했어요</span></div><div class="clip cap" id="cap184" data-start="360.888" data-duration="2.216" data-track-index="1"><span>킹크랩을 두고 한 설명이지만</span></div><div class="clip cap" id="cap185" data-start="363.105" data-duration="1.478" data-track-index="1"><span>살아 있는 에이급은</span></div><div class="clip cap" id="cap186" data-start="364.582" data-duration="1.921" data-track-index="1"><span><b>20~25%</b> 일반 개체는</span></div><div class="clip cap" id="cap187" data-start="366.503" data-duration="2.216" data-track-index="1"><span><b>30~35%</b> 물을 많이 먹은</span></div><div class="clip cap" id="cap188" data-start="368.719" data-duration="1.625" data-track-index="1"><span>채 죽은 개체는 최대</span></div><div class="clip cap" id="cap189" data-start="370.345" data-duration="1.773" data-track-index="1"><span><b>40%</b>까지 준다고 해요</span></div><div class="clip cap" id="cap190" data-start="372.618" data-duration="2.221" data-track-index="1"><span>이 기준이면 <b>1kg</b>이 쪄서</span></div><div class="clip cap" id="cap191" data-start="374.838" data-duration="1.904" data-track-index="1"><span><b>750~800g</b>쯤 되는</span></div><div class="clip cap" id="cap192" data-start="376.742" data-duration="0.635" data-track-index="1"><span>셈이에요</span></div><div class="clip cap" id="cap193" data-start="377.876" data-duration="2.038" data-track-index="1"><span>살만 따지면 더 적어요 대게</span></div><div class="clip cap" id="cap194" data-start="379.915" data-duration="1.223" data-track-index="1"><span>살은 전체 무게의</span></div><div class="clip cap" id="cap195" data-start="381.137" data-duration="2.174" data-track-index="1"><span><b>20~30%</b>라는 설명이 흔한데</span></div><div class="clip cap" id="cap196" data-start="383.311" data-duration="1.902" data-track-index="1"><span>공공기관이 잰 공식 수치는</span></div><div class="clip cap" id="cap197" data-start="385.214" data-duration="0.951" data-track-index="1"><span>찾지 못했어요</span></div><div class="clip cap" id="cap198" data-start="386.665" data-duration="2.306" data-track-index="1"><span>이 설명대로라면 <b>1kg</b>을 사도</span></div><div class="clip cap" id="cap199" data-start="388.971" data-duration="2.306" data-track-index="1"><span>살은 <b>200~300g</b> 정도예요</span></div><div class="clip cap" id="cap200" data-start="391.776" data-duration="1.587" data-track-index="1"><span>이번 주 활대게 경락가로</span></div><div class="clip cap" id="cap201" data-start="393.364" data-duration="1.465" data-track-index="1"><span>계산하면 살 <b>100g</b>에</span></div><div class="clip cap" id="cap202" data-start="394.829" data-duration="1.099" data-track-index="1"><span><b>12,000원</b>에서</span></div><div class="clip cap" id="cap203" data-start="395.928" data-duration="1.343" data-track-index="1"><span><b>18,100원</b>꼴이에요</span></div><div class="clip cap" id="cap204" data-start="397.771" data-duration="1.962" data-track-index="1"><span>도매가 기준인데도 이 정도니</span></div><div class="clip cap" id="cap205" data-start="399.733" data-duration="1.962" data-track-index="1"><span>대게는 무게보다 살이 얼마나</span></div><div class="clip cap" id="cap206" data-start="401.695" data-duration="1.570" data-track-index="1"><span>찼는지가 훨씬 중요하죠</span></div><div class="clip cap" id="cap207" data-start="405.365" data-duration="1.896" data-track-index="1"><span>경락가는 직접 확인할 수도</span></div><div class="clip cap" id="cap208" data-start="407.261" data-duration="2.031" data-track-index="1"><span>있어요 노량진수산 주식회사가</span></div><div class="clip cap" id="cap209" data-start="409.292" data-duration="1.625" data-track-index="1"><span>어종별 경락시세를 매일</span></div><div class="clip cap" id="cap210" data-start="410.917" data-duration="0.677" data-track-index="1"><span>공개합니다</span></div><div class="clip cap" id="cap211" data-start="412.094" data-duration="1.989" data-track-index="1"><span>여기서 활대게와 선어 대게가</span></div><div class="clip cap" id="cap212" data-start="414.083" data-duration="1.591" data-track-index="1"><span>따로 나오니 이름 앞의</span></div><div class="clip cap" id="cap213" data-start="415.674" data-duration="1.326" data-track-index="1"><span>표시부터 확인하세요</span></div><div class="clip cap" id="cap214" data-start="417.500" data-duration="1.944" data-track-index="1"><span>하루 값은 그날 들어온 물량에</span></div><div class="clip cap" id="cap215" data-start="419.444" data-duration="1.823" data-track-index="1"><span>따라 크게 흔들리니 며칠 치</span></div><div class="clip cap" id="cap216" data-start="421.267" data-duration="1.580" data-track-index="1"><span>평균을 보는 게 정확해요</span></div><div class="clip cap" id="cap217" data-start="423.347" data-duration="1.666" data-track-index="1"><span>물량이 적은 날은 몇 건의</span></div><div class="clip cap" id="cap218" data-start="425.013" data-duration="1.904" data-track-index="1"><span>경매만으로 값이 튈 수 있다는</span></div><div class="clip cap" id="cap219" data-start="426.916" data-duration="1.190" data-track-index="1"><span>점도 기억해 두세요</span></div><div class="clip cap" id="cap220" data-start="430.206" data-duration="1.553" data-track-index="1"><span>자주 받을 만 div><div class="clip cap" id="cap236" data-start="460.047" data-duration="1.523" data-track-index="1"><span>한 장으로 정리합니다</span></div><div class="clip cap" id="cap237" data-start="461.570" data-duration="1.384" data-track-index="1"><span><b>2</b>만 <b>5</b>천 원 대게</span></div><div class="clip cap" id="cap238" data-start="462.954" data-duration="0.969" data-track-index="1"><span>체크리스트예요</span></div><div class="clip cap" id="cap239" data-start="464.424" data-duration="1.859" data-track-index="1"><span>첫째 살아 있는 대게인지</span></div><div class="clip cap" id="cap240" data-start="466.282" data-duration="1.430" data-track-index="1"><span>선어인지 물어보세요</span></div><div class="clip cap" id="cap241" data-start="468.212" data-duration="1.989" data-track-index="1"><span>둘째 찌기 전 무게를 직접</span></div><div class="clip cap" id="cap242" data-start="470.201" data-duration="0.711" data-track-index="1"><span>확인하세요</span></div><div class="clip cap" id="cap243" data-start="471.412" data-duration="2.127" data-track-index="1"><span>셋째 다리 <b>10개</b>가 온전한지</span></div><div class="clip cap" id="cap244" data-start="473.539" data-duration="0.425" data-track-index="1"><span>보세요</span></div><div class="clip cap" id="cap245" data-start="474.465" data-duration="2.135" data-track-index="1"><span>넷째 배를 눌러 살이 찼는지</span></div><div class="clip cap" id="cap246" data-start="476.600" data-duration="0.712" data-track-index="1"><span>확인하세요</span></div><div class="clip cap" id="cap247" data-start="477.812" data-duration="2.055" data-track-index="1"><span>다섯째 그날 노량진 경락가를</span></div><div class="clip cap" id="cap248" data-start="479.867" data-duration="1.233" data-track-index="1"><span>미리 보고 가세요</span></div><div class="clip cap" id="cap249" data-start="481.600" data-duration="1.672" data-track-index="1"><span>이 화면은 캡처해 두셨다가</span></div><div class="clip cap" id="cap250" data-start="483.272" data-duration="1.911" data-track-index="1"><span>대게 사러 갈 때 꺼내 보세요</span></div><div class="clip cap" id="cap251" data-start="488.782" data-duration="1.818" data-track-index="1"><span>다시 한 번 말씀드립니다</span></div><div class="clip cap" id="cap252" data-start="491.100" data-duration="1.937" data-track-index="1"><span>오늘 경매 값은 모두 노량진</span></div><div class="clip cap" id="cap253" data-start="493.037" data-duration="2.066" data-track-index="1"><span>도매 경락가이고 가게에서 사는</span></div><div class="clip cap" id="cap254" data-start="495.102" data-duration="0.904" data-track-index="1"><span>값과는 달라요</span></div><div class="clip cap" id="cap255" data-start="496.506" data-duration="1.712" data-track-index="1"><span>제 생각에는 <b>2</b>만 <b>5</b>천 원</span></div><div class="clip cap" id="cap256" data-start="498.218" data-duration="1.956" data-track-index="1"><span>대게는 선어이거나 작은 대게일</span></div><div class="clip cap" id="cap257" data-start="500.174" data-duration="1.956" data-track-index="1"><span>가능성을 먼저 보고 살아 있는</span></div><div class="clip cap" id="cap258" data-start="502.131" data-duration="1.712" data-track-index="1"><span>대게라면 찌기 전 무게까지</span></div><div class="clip cap" id="cap259" data-start="503.842" data-duration="1.834" data-track-index="1"><span>확인하는 게 가장 확실합니다</span></div><div class="clip cap" id="cap260" data-start="506.176" data-duration="2.112" data-track-index="1"><span>노량진과 가락시장 소래포구까지</span></div><div class="clip cap" id="cap261" data-start="508.288" data-duration="1.848" data-track-index="1"><span>전국 시장의 도매가를 계속</span></div><div class="clip cap" id="cap262" data-start="510.136" data-duration="1.452" data-track-index="1"><span>정리해 드릴게요 시세</span></div><div class="clip cap" id="cap263" data-start="511.588" data-duration="1.848" data-track-index="1"><span>재생목록도 함께 봐 주세요</span></div><div class="clip cap" id="cap264" data-start="513.935" data-duration="1.849" data-track-index="1"><span>여러분은 대게 살 때 활대게</span></div><div class="clip cap" id="cap265" data-start="515.784" data-duration="1.972" data-track-index="1"><span>사세요 쪄 놓은 대게 사세요?</span></div><div class="clip cap" id="cap266" data-start="517.756" data-duration="1.232"
