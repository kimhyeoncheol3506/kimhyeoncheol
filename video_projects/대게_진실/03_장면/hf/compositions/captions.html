uration="1.300" data-track-index="1"><span>대게는 살아 있는 대게의</span></div><div class="clip cap" id="cap130" data-start="259.092" data-duration="2.000" data-track-index="1"><span>절반도 안 되는 값이니 싼</span></div><div class="clip cap" id="cap131" data-start="261.092" data-duration="1.520" data-track-index="1"><span>대게 중엔 선어가 섞여 있을</span></div><div class="clip cap" id="cap132" data-start="262.612" data-duration="0.667" data-track-index="1"><span>수 있어요</span></div><div class="clip cap" id="cap133" data-start="263.778" data-duration="2.520" data-track-index="1"><span>살 때 활대게인지 선어인지 꼭</span></div><div class="clip cap" id="cap134" data-start="266.298" data-duration="0.634" data-track-index="1"><span>물어보세요</span></div><div class="clip cap" id="cap135" data-start="267.432" data-duration="2.600" data-track-index="1"><span>세 번째는 크기예요 최근 <b>2</b>주</span></div><div class="clip cap" id="cap136" data-start="270.032" data-duration="1.760" data-track-index="1"><span>활대게는 거의 전부 같은 규격</span></div><div class="clip cap" id="cap137" data-start="271.792" data-duration="2.280" data-track-index="1"><span>표기로 경매돼서 크기별 값을</span></div><div class="clip cap" id="cap138" data-start="274.072" data-duration="1.513" data-track-index="1"><span>따로 비교하긴 어려웠어요</span></div><div class="clip cap" id="cap139" data-start="276.085" data-duration="1.420" data-track-index="1"><span>하지만 작은 대게나 다리가</span></div><div class="clip cap" id="cap140" data-start="277.505" data-duration="1.960" data-track-index="1"><span>빠진 대게는 같은 무게라도 더</span></div><div class="clip cap" id="cap141" data-start="279.465" data-duration="1.552" data-track-index="1"><span>싸게 팔리는 경우가 많습니다</span></div><div class="clip cap" id="cap142" data-start="281.517" data-duration="2.520" data-track-index="1"><span>네 번째는 살이 얼마나 찼느냐</span></div><div class="clip cap" id="cap143" data-start="284.037" data-duration="0.678" data-track-index="1"><span>수율이에요</span></div><div class="clip cap" id="cap144" data-start="285.215" data-duration="1.720" data-track-index="1"><span>같 v class="clip cap" id="cap160" data-start="314.108" data-duration="1.400" data-track-index="1"><span>다르니 무게만으로 비교하진</span></div><div class="clip cap" id="cap161" data-start="315.508" data-duration="0.456" data-track-index="1"><span>마세요</span></div><div class="clip cap" id="cap162" data-start="318.064" data-duration="1.540" data-track-index="1"><span>킬로그램 <b>2</b>만 <b>5</b>천 원 대게</span></div><div class="clip cap" id="cap163" data-start="319.604" data-duration="1.408" data-track-index="1"><span>사도 될까요?</span></div><div class="clip cap" id="cap164" data-start="321.512" data-duration="1.700" data-track-index="1"><span>선어인 걸 알고 바로 쪄 먹을</span></div><div class="clip cap" id="cap165" data-start="323.212" data-duration="1.900" data-track-index="1"><span>거라면 또 크기가 작아도</span></div><div class="clip cap" id="cap166" data-start="325.112" data-duration="1.497" data-track-index="1"><span>괜찮다면 충분히 살 만해요</span></div><div class="clip cap" id="cap167" data-start="327.109" data-duration="1.240" data-track-index="1"><span>찌기 전 무게를 내 눈으로</span></div><div class="clip cap" id="cap168" data-start="328.349" data-duration="1.454" data-track-index="1"><span>확인했다면 더 좋고요</span></div><div class="clip cap" id="cap169" data-start="330.303" data-duration="1.560" data-track-index="1"><span>반대로 살아 있는 대게라는데</span></div><div class="clip cap" id="cap170" data-start="331.863" data-duration="1.980" data-track-index="1"><span>경락가보다도 싸다면 크기와</span></div><div class="clip cap" id="cap171" data-start="333.843" data-duration="1.737" data-track-index="1"><span>상태를 한 번 더 확인하세요</span></div><div class="clip cap" id="cap172" data-start="336.080" data-duration="1.760" data-track-index="1"><span>무게를 쪄서만 알려 주는 곳도</span></div><div class="clip cap" id="cap173" data-start="337.840" data-duration="1.175" data-track-index="1"><span>조심하는 게 좋아요</span></div><div class="clip cap" id="cap174" data-start="339.515" data-duration="1.120" data-track-index="1"><span>방송 검증 보도에선</span></div><div class="clip cap" id="cap175" data-start="340.635" data-duration="2.000" data-track-index="1"><span><b>1.5kg</b>이라고 안내받은</span></div><div class="clip cap" id="cap176" data-start="342.635" data-duration="2.080" data-track-index="1"><span>대게를 재 보니 <b>870g</b>이었던</span></div><div class="clip cap" id="cap177" data-start="344.715" data-duration="2.480" data-track-index="1"><span>사례도 있었어요 가게 이름은</span></div><div class="clip cap" id="cap178" data-start="347.195" data-duration="1.144" data-track-index="1"><span>밝히지 않을게요</span></div><div class="clip cap" id="cap179" data-start="350.439" data-duration="2.460" data-track-index="1"><span>마지막으로 대게 <b>1kg</b>을 찌면</span></div><div class="clip cap" id="cap180" data-start="352.899" data-duration="1.427" data-track-index="1"><span>몇 그램이 남을까요?</span></div><div class="clip cap" id="cap181" data-start="354.826" data-duration="1.340" data-track-index="1"><span>수산물 전문가 김지민은</span></div><div class="clip cap" id="cap182" data-start="356.166" data-duration="1.760" data-track-index="1"><span>갑각류를 찌면 피와 수분이</span></div><div class="clip cap" id="cap183" data-start="357.926" data-duration="1.843" data-track-index="1"><span>빠져 무게가 준다고 설명했어요</span></div><div class="clip cap" id="cap184" data-start="360.269" data-duration="2.200" data-track-index="1"><span>킹크랩을 두고 한 설명이지만</span></div><div class="clip cap" id="cap185" data-start="362.469" data-duration="1.160" data-track-index="1"><span>살아 있는 에이급은</span></div><div class="clip cap" id="cap186" data-start="363.629" data-duration="2.140" data-track-index="1"><span><b>20~25%</b> 일반 개체는</span></div><div class="clip cap" id="cap187" data-start="365.769" data-duration="2.160" data-track-index="1"><span><b>30~35%</b> 물을 많이 먹은</span></div><div class="clip cap" id="cap188" data-start="367.929" data-duration="1.360" data-track-index="1"><span>채 죽은 개체는 최대</span></div><div class="clip cap" id="cap189" data-start="369.289" data-duration="1.703" data-track-index="1"><span><b>40%</b>까지 준다고 해요</span></div><div class="clip cap" id="cap190" data-start="371.492" data-duration="2.080" data-track-index="1"><span>이 기준이면 <b>1kg</b>이 쪄서</span></div><div class="clip cap" id="cap191" data-start="373.572" data-duration="1.680" data-track-index="1"><span><b>750~800g</b>쯤 되는</span></div><div class="clip cap" id="cap192" data-start="375.252" data-duration="0.612" data-track-index="1"><span>셈이에요</span></div><div class="clip cap" id="cap193" data-start="376.364" data-duration="2.420" data-track-index="1"><span>살만 따지면 더 적어요 대게</span></div><div class="clip cap" id="cap194" data-start="378.784" data-duration="0.960" data-track-index="1"><span>살은 전체 무게의</span></div><div class="clip cap" id="cap195" data-start="379.744" data-duration="1.940" data-track-index="1"><span><b>20~30%</b>라는 설명이 흔한데</span></div><div class="clip cap" id="cap196" data-start="381.684" data-duration="2.160" data-track-index="1"><span>공공기관이 잰 공식 수치는</span></div><div class="clip cap" id="cap197" data-start="383.844" data-duration="1.053" data-track-index="1"><span>찾지 못했어요</span></div><div class="clip cap" id="cap198" data-start="385.397" data-duration="2.020" data-track-index="1"><span>이 설명대로라면 <b>1kg</b>을 사도</span></div><div class="clip cap" id="cap199" data-start="387.417" data-duration="2.222" data-track-index="1"><span>살은 <b>200~300g</b> 정도예요</span></div><div class="clip cap" id="cap200" data-start="390.139" data-duration="1.490" data-track-index="1"><span>이번 주 활대게 경락가로</span></div><div class="clip cap" id="cap201" data-start="391.629" data-duration="1.990" data-track-index="1"><span>계산하면 살 무게 <b>100g</b>에</span></div><div class="clip cap" id="cap202" data-start="393.619" data-duration="0.900" data-track-index="1"><span><b>12,000원</b>에서</span></div><div class="clip cap" id="cap203" data-start="394.519" data-duration="1.285" data-track-index="1"><span><b>18,100원</b>꼴이에요</span></div><div class="clip cap" id="cap204" data-start="396.304" data-duration="1.620" data-track-index="1"><span>도매가 기준인데도 이 정도니</span></div><div class="clip cap" id="cap205" data-start="397.924" data-duration="1.940" data-track-index="1"><span>대게는 무게보다 살이 얼마나</span></div><div class="clip cap" id="cap206" data-start="399.864" data-duration="1.493" data-track-index="1"><span>찼는지가 훨씬 중요하죠</span></div><div class="clip cap" id="cap207" data-start="403.458" data-duration="1.920" data-track-index="1"><span>경락가는 직접 확인할 수도</span></div><div class="clip cap" id="cap208" data-start="405.378" data-duration="2.580" data-track-index="1"><span>있어요 노량진수산 주식회사가</span></div><div class="clip cap" id="cap209" data-start="407.958" data-duration="1.460" data-track-index="1"><span>어종별 경락시세를 매일</span></div><div class="clip cap" id="cap210" data-start="409.418" data-duration="0.666" data-track-index="1"><span>공개합니다</span></div><div class="clip cap" id="cap211" data-start="410.584" data-duration="1.660" data-track-index="1"><span>여기서 활대게와 선어 대게가</span></div><div class="clip cap" id="cap212" data-start="412.244" data-duration="1.740" data-track-index="1"><span>따로 나오니 이름 앞의</span></div><div class="clip cap" id="cap213" data-start="413.984" data-duration="1.223" data-track-index="1"><span>표시부터 확인하세요</span></div><div class="clip cap" id="cap214" data-start="415.707" data-duration="1.600" data-track-index="1"><span>하루 값은 그날 들어온 물량에</span></div><div class="clip cap" id="cap215" data-start="417.307" data-duration="2.160" data-track-index="1"><span>따라 크게 흔들리니 며칠 치</span></div><div class="clip cap" id="cap216" data-start="419.467" data-duration="1.337" data-track-index="1"><span>평균을 보는 게 정확해요</span></div><div class="clip cap" id="cap217" data-start="421.304" data-duration="1.400" data-track-index="1"><span>물량이 적은 날은 몇 건의</span></div><div class="clip cap" id="cap218" data-start="422.704" data-duration="1.820" data-track-index="1"><span>경매만으로 값이 튈 수 있다는</span></div><div class="clip cap" id="cap219" data-start="424.524" data-duration="1.335" data-track-index="1"><span>점도 기억해 두세요</span></div><div class="clip cap" id="cap220" data-start="427.960" data-duration="1.080" data-track-index="1"><span>자주 받을 만한 질문</span></div><div class="clip cap" id="cap221" data-start="429.040" data-duration="0.762" data-track-index="1"><span><b>3가지</b>예요</span></div><div class="clip cap" id="cap222" data-start="430.302" data-duration="3.240" data-track-index="1"><span>첫 번째 지금 사도 될까요?</span></div><div class="clip cap" id="cap223" data-start="433.542" data-duration="1.730" data-track-index="1"><span>활대게 경락가는 한 주 새 약</span></div><div class="clip cap" id="cap224" data-start="435.272" data-duration="2.010" data-track-index="1"><span><b>19%</b> 내렸지만 하루 사이에도</span></div><div class="clip cap" id="cap225" data-start="437.282" data-duration="1.940" data-track-index="1"><span><b>1</b>만 원 넘게 오르내리니 사기</span></div><div class="clip cap" id="cap226" data-start="439.222" data-duration="1.771" data-track-index="1"><span>전 그날 경락가를 확인하세요</span></div><div class="clip cap" id="cap227" data-start="441.493" data-duration="2.980" data-track-index="1"><span>두 번째 러시아산만 있나요?</span></div><div class="clip cap" id="cap228" data-start="444.473" data-duration="2.160" data-track-index="1"><span>최근 <b>2</b>주 노량진 대게 경매는</span></div><div class="clip cap" id="cap229" data-start="446.633" data-duration="1.140" data-track-index="1"><span>활대게와 선어 모두</span></div><div class="clip cap" id="cap230" data-start="447.773" data-duration="1.112" data-track-index="1"><span>러시아산이었어요</span></div><div class="clip cap" id="cap231" data-start="449.385" data-duration="2.520" data-track-index="1"><span>세 번째 살 찬 대게는 어떻게</span></div><div class="clip cap" id="cap232" data-start="451.905" data-duration="2.520" data-track-index="1"><span>고를까요? 배를 눌러 단단한지</span></div><div class="clip cap" id="cap233" data-start="454.425" data-duration="1.760" data-track-index="1"><span>들었을 때 묵직한지 다리</span></div><div class="clip cap" id="cap234" data-start="456.185" data-duration="1.300" data-track-index="1"><span><b>10개</b>가 온전한지 보라는</span></div><div class="clip cap" id="cap235" data-start="457.485" data-duration="0.759" data-track-index="1"><span>설명이 많아요</span></div><div class="clip cap" id="cap236" data-start="460.344" data-duration="2.140" data-track-index="1"><span>한 장으로 정리합니다</span></div><div class="clip cap" id="cap237" data-start="462.484" data-duration="1.080" data-track-index="1"><span><b>2</b>만 <b>5</b>천 원 대게</span></div><div class="clip cap" id="cap238" data-start="463.564" data-duration="1.063" data-track-index="1"><span>체크리스트예요</span></div><div class="clip cap" id="cap239" data-start="465.127" data-duration="2.220" data-track-index="1"><span>첫째 살아 있는 대게인지</span></div><div class="clip cap" id="cap240" data-start="467.347" data-duration="1.288" data-track-index="1"><span>선어인지 물어보세요</span></div><div class="clip cap" id="cap241" data-start="469.135" data-duration="1.740" data-track-index="1"><span>둘째 찌기 전 무게를 직접</span></div><div class="clip cap" id="cap242" data-start="470.875" data-duration="0.786" data-track-index="1"><span>확인하세요</span></div><div class="clip cap" id="cap243" data-start="472.161" data-duration="2.380" data-track-index="1"><span>셋째 다리 <b>10개</b>가 온전한지</span></div><div class="clip cap" id="cap244" data-start="474.541" data-duration="0.446" data-track-index="1"><span>보세요</span></div><div class="clip cap" id="cap245" data-start="475.487" data-duration="2.290" data-track-index="1"><span>넷째 배를 눌러 살이 찼는지</span></div><div class="clip cap" id="cap246" data-start="477.777" data-duration="0.753" data-track-index="1"><span>확인하세요</span></div><div class="clip cap" id="cap247" data-start="479.029" data-duration="1.880" data-track-index="1"><span>다섯째 그날 노량진 경락가를</span></div><div class="clip cap" id="cap248" data-start="480.909" data-duration="1.003" data-track-index="1"><span>미리 보고 가세요</span></div><div class="clip cap" id="cap249" data-start="482.413" data-duration="1.520" data-track-index="1"><span>이 화면은 캡처해 두셨다가</span></div><div class="clip cap" id="cap250" data-start="483.933" data-duration="1.855" data-track-index="1"><span>대게 사러 갈 때 꺼내 보세요</span></div><div class="clip cap" id="cap251" data-start="489.388" data-duration="1.314" data-track-index="1"><span>다시 한 번 말씀드립니다</span></div><div class="clip cap" id="cap252" data-start="491.202" data-duration="1.660" data-track-index="1"><span>오늘 경매 값은 모두 노량진</span></div><div class="clip cap" id="cap253" data-start="492.862" data-duration="2.380" data-track-index="1"><span>도매 경락가이고 가게에서 사는</span></div><div class="clip cap" id="cap254" data-start="495.242" data-duration="0.900" data-track-index="1"><span>값과는 달라요</span></div><div class="clip cap" id="cap255" data-start="496.642" data-duration="1.760" data-track-index="1"><span>제 생각에는 <b>2</b>만 <b>5</b>천 원</span></div><div class="clip cap" id="cap256" data-start="498.402" data-duration="1.740" data-track-index="1"><span>대게는 선어이거나 작은 대게일</span></div><div class="clip cap" id="cap257" data-start="500.142" data-duration="2.240" data-track-index="1"><span>가능성을 먼저 보고 살아 있는</span></div><div class="clip cap" id="cap258" data-start="502.382" data-duration="1.480" data-track-index="1"><span>대게라면 찌기 전 무게까지</span></div><div class="clip cap" id="cap259" data-start="503.862" data-duration="1.766" data-track-index="1"><span>확인하는 게 가장 확실합니다</span></div><div class="clip cap" id="cap260" data-start="506.127" data-duration="2.360" data-track-index="1"><span>노량진과 가락시장 소래포구까지</span></div><div class="clip cap" id="cap261" data-start="508.487" data-duration="1.640" data-track-index="1"><span>전국 시장의 도매가를 계속</span></div><div class="clip cap" id="cap262" data-start="510.127" data-duration="1.920" data-track-index="1"><span>정리해 드릴게요 시세</span></div><div class="clip cap" id="cap263" data-start="512.047" data-duration="1.788" data-track-index="1"><span>재생목록도 함께 봐 주세요</span></div><div class="clip cap" id="cap264" data-start="514.335" data-duration="1.680" data-track-index="1"><span>여러분은 대게 살 때 활대게</span></div><div class="clip cap" id="cap265" data-start="516.015" data-duration="2.660" data-track-index="1"><span>사세요 쪄 놓은 대게 사세요?</span></div><div class="clip cap" id="cap266" data-start="518.675" data-duration="1.1
