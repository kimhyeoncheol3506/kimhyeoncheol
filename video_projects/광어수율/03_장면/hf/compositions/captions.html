</div><div class="clip cap" id="cap205" data-start="399.969" data-duration="1.797" data-track-index="1"><span>유리한 편이고 머리와 뼈는</span></div><div class="clip cap" id="cap206" data-start="401.766" data-duration="1.925" data-track-index="1"><span>매운탕으로 챙기면 버리는 게</span></div><div class="clip cap" id="cap207" data-start="403.691" data-duration="0.385" data-track-index="1"><span>줄어요</span></div><div class="clip cap" id="cap208" data-start="404.576" data-duration="1.436" data-track-index="1"><span>두 번째 왜 도매가로</span></div><div class="clip cap" id="cap209" data-start="406.012" data-duration="1.566" data-track-index="1"><span>계산하나요? 매일 같은</span></div><div class="clip cap" id="cap210" data-start="407.578" data-duration="1.697" data-track-index="1"><span>기준으로 공개되는 값이라</span></div><div class="clip cap" id="cap211" data-start="409.275" data-duration="1.958" data-track-index="1"><span>생선끼리 비교하기 좋아서예요</span></div><div class="clip cap" id="cap212" data-start="411.233" data-duration="1.697" data-track-index="1"><span>실제 장보기 값은 이보다</span></div><div class="clip cap" id="cap213" data-start="412.930" data-duration="0.522" data-track-index="1"><span>높습니다</span></div><div class="clip cap" id="cap214" data-start="413.952" data-duration="1.805" data-track-index="1"><span>세 번째 회가 적게 나온 것</span></div><div class="clip cap" id="cap215" data-start="415.757" data-duration="1.684" data-track-index="1"><span>같다면요? 산 활어 무게에</span></div><div class="clip cap" id="cap216" data-start="417.441" data-duration="1.564" data-track-index="1"><span>수율 범위를 곱해 보세요</span></div><div class="clip cap" id="cap217" data-start="419.505" data-duration="1.272" data-track-index="1"><span>광어 <b>1kg</b>에 회</span></div><div class="clip cap" id="cap218" data-start="420.777" data-duration="2.261" data-track-index="1"><span><b>400~500g</b>이면 범위 안의</span></div><div class="clip cap" id="cap219" data-start="423.038" data-duration="1.978" data-track-index="1"><span>자연스러운 손질 결과일 수</span></div><div class="clip cap" id="cap220" data-start="425.017" data-duration="0.424" data-track-index="1"><span>있어요</span></div><div class="clip cap" id="cap221" data-start="427.541" data-duration="1.919" data-track-index="1"><span>한 장으로 정리합니다 회 한</span></div><div class="clip cap" id="cap222" data-start="429.460" data-duration="1.663" data-track-index="1"><span>접시 계산 다섯 단계예요</span></div><div class="clip cap" id="cap223" data-start="431.623" data-duration="2.061" data-track-index="1"><span>첫째 인원에 <b>200g</b>을 곱해</span></div><div class="clip cap" id="cap224" data-start="433.684" data-duration="1.374" data-track-index="1"><span>회 무게를 정하세요</span></div><div class="clip cap" id="cap225" data-start="435.558" data-duration="2.144" data-track-index="1"><span>둘째 수율 광어 <b>40</b> 참돔</span></div><div class="clip cap" id="cap226" data-start="437.702" data-duration="2.144" data-track-index="1"><span><b>30</b> 농어 <b>40%</b>로 잡으면</span></div><div class="clip cap" id="cap227" data-start="439.846" data-duration="0.766" data-track-index="1"><span>넉넉합니다</span></div><div class="clip cap" id="cap228" data-start="441.111" data-duration="2.220" data-track-index="1"><span>셋째 회 무게를 수율로 나누면</span></div><div class="clip cap" id="cap229" data-start="443.331" data-duration="1.804" data-track-index="1"><span>사야 할 활어 kg이에요</span></div><div class="clip cap" id="cap230" data-start="445.635" data-duration="2.057" data-track-index="1"><span>넷째 kg당 경락가를 수율로</span></div><div class="clip cap" id="cap231" data-start="447.691" data-duration="1.919" data-track-index="1"><span>나누고 <b>10</b>으로 나누면 회</span></div><div class="clip cap" id="cap232" data-start="449.611" data-duration="1.371" data-track-index="1"><span><b>100g</b> 원가입니다</span></div><div class="clip cap" id="cap233" data-start="451.482" data-duration="1.871" data-track-index="1"><span>다섯째 총비용은 판매가에</span></div><div class="clip cap" id="cap234" data-start="453.353" data-duration="2.015" data-track-index="1"><span>손질과 상차림비까지 더해서</span></div><div class="clip cap" id="cap235" data-start="455.368" data-duration="0.432" data-track-index="1"><span>보세요</span></div><div class="clip cap" id="cap236" data-start="456.299" data-duration="2.001" data-track-index="1"><span>이 화면은 캡처해 두셨다가 장</span></div><div class="clip cap" id="cap237" data-start="458.300" data-duration="1.876" data-track-index="1"><span>보러 가기 전에 꺼내 보세요</span></div><div class="clip cap" id="cap238" data-start="463.776" data-duration="1.818" data-track-index="1"><span>다시 한 번 말씀드립니다</span></div><div class="clip cap" id="cap239" data-start="466.093" data-duration="2.071" data-track-index="1"><span>오늘 금액은 모두 노량진 도매</span></div><div class="clip cap" id="cap240" data-start="468.164" data-duration="1.941" data-track-index="1"><span>경락가로 계산한 값이고 가게</span></div><div class="clip cap" id="cap241" data-start="470.105" data-duration="1.553" data-track-index="1"><span>판매가와 초장집 비용은</span></div><div class="clip cap" id="cap242" data-start="471.658" data-duration="0.518" data-track-index="1"><span>따로예요</span></div><div class="clip cap" id="cap243" data-start="472.676" data-duration="2.029" data-track-index="1"><span>수율은 자료마다 범위가 있고</span></div><div class="clip cap" id="cap244" data-start="474.705" data-duration="1.759" data-track-index="1"><span>생선 크기와 손질에 따라</span></div><div class="clip cap" id="cap245" data-start="476.464" data-duration="0.676" data-track-index="1"><span>달라집니다</span></div><div class="clip cap" id="cap246" data-start="477.641" data-duration="1.789" data-track-index="1"><span>제 생각에는 회를 살 때는</span></div><div class="clip cap" id="cap247" data-start="479.429" data-duration="1.661" data-track-index="1"><span>kg 값보다 회 <b>100g</b></span></div><div class="clip cap" id="cap248" data-start="481.090" data-duration="2.044" data-track-index="1"><span>값으로 비교하는 게 정확합니다</span></div><div class="clip cap" id="cap249" data-start="483.635" data-duration="1.933" data-track-index="1"><span>매주 토요일 노량진 주간 시세</span></div><div class="clip cap" id="cap250" data-start="485.568" data-duration="1.812" data-track-index="1"><span>재생목록에서 그 주 경락가를</span></div><div class="clip cap" id="cap251" data-start="487.380" data-duration="1.933" data-track-index="1"><span>보시면 오늘 공식에 바로 넣어</span></div><div class="clip cap" id="cap252" data-start="489.313" data-duration="0.846" data-track-index="1"><span>볼 수 있어요</span></div><div class="clip cap" id="cap253" data-start="490.658" data-duration="1.725" data-track-index="1"><span>연말 모임 회 장보기 편도</span></div><div class="clip cap" id="cap254" data-start="492.384" data-duration="1.602" data-track-index="1"><span>같이 보시면 인원별 생선</span></div><div class="clip cap" id="cap255" data-start="493.986" data-duration="1.725" data-track-index="1"><span>조합까지 정할 수 있습니다</span></div><div class="clip cap" id="cap256" data-start="496.211" data-duration="1.807" data-track-index="1"><span>여러분은 횟집 회 한 접시</span></div><div class="clip cap" id="cap257" data-start="498.019" data-duration="1.807" data-track-index="1"><span>얼마면 적당하다고 보세요?</span></div><div class="clip cap" id="cap258" data-start="499.826" data-duration="1.291" data-track-index="1"><span>댓글로 알려 주세요</span></div></div><script>const tl = gsap.timeline({ paused: true }); window.__timelines["captions"] = tl;</script></template>
