></div><div class="clip cap" id="cap205" data-start="405.785" data-duration="1.960" data-track-index="1"><span>유리한 편이고 머리와 뼈는</span></div><div class="clip cap" id="cap206" data-start="407.745" data-duration="1.520" data-track-index="1"><span>매운탕으로 챙기면 버리는 게</span></div><div class="clip cap" id="cap207" data-start="409.265" data-duration="0.382" data-track-index="1"><span>줄어요</span></div><div class="clip cap" id="cap208" data-start="410.146" data-duration="2.260" data-track-index="1"><span>두 번째 왜 도매가로</span></div><div class="clip cap" id="cap209" data-start="412.406" data-duration="1.880" data-track-index="1"><span>계산하나요? 매일 같은</span></div><div class="clip cap" id="cap210" data-start="414.286" data-duration="1.580" data-track-index="1"><span>기준으로 공개되는 값이라</span></div><div class="clip cap" id="cap211" data-start="415.866" data-duration="2.470" data-track-index="1"><span>생선끼리 비교하기 좋아서예요</span></div><div class="clip cap" id="cap212" data-start="418.336" data-duration="1.450" data-track-index="1"><span>실제 장보기 값은 이보다</span></div><div class="clip cap" id="cap213" data-start="419.786" data-duration="0.521" data-track-index="1"><span>높습니다</span></div><div class="clip cap" id="cap214" data-start="420.807" data-duration="2.280" data-track-index="1"><span>세 번째 회가 적게 나온 것</span></div><div class="clip cap" id="cap215" data-start="423.087" data-duration="1.880" data-track-index="1"><span>같다면요? 산 활어 무게에</span></div><div class="clip cap" id="cap216" data-start="424.967" data-duration="1.398" data-track-index="1"><span>수율 범위를 곱해 보세요</span></div><div class="clip cap" id="cap217" data-start="426.865" data-duration="1.100" data-track-index="1"><span>광어 <b>1kg</b>에 회</span></div><div class="clip cap" id="cap218" data-start="427.965" data-duration="2.200" data-track-index="1"><span><b>400~500g</b>이면 범위 안의</span></div><div class="clip cap" id="cap219" data-start="430.165" data-duration="1.600" data-track-index="1"><span>자연스러운 손질 결과일 수</span></div><div class="clip cap" id="cap220" data-start="431.765" data-duration="0.513" data-track-index="1"><span>있어요</span></div><div class="clip cap" id="cap221" data-start="434.379" data-duration="2.460" data-track-index="1"><span>한 장으로 정리합니다 회 한</span></div><div class="clip cap" id="cap222" data-start="436.839" data-duration="1.485" data-track-index="1"><span>접시 계산 다섯 단계예요</span></div><div class="clip cap" id="cap223" data-start="438.824" data-duration="2.360" data-track-index="1"><span>첫째 인원에 <b>200g</b>을 곱해</span></div><div class="clip cap" id="cap224" data-start="441.184" data-duration="1.267" data-track-index="1"><span>회 무게를 정하세요</span></div><div class="clip cap" id="cap225" data-start="442.951" data-duration="3.700" data-track-index="1"><span>둘째 수율 광어 <b>40</b> 참돔</span></div><div class="clip cap" id="cap226" data-start="446.651" data-duration="2.240" data-track-index="1"><span><b>30</b> 농어 <b>40%</b>로 잡으면</span></div><div class="clip cap" id="cap227" data-start="448.891" data-duration="0.776" data-track-index="1"><span>넉넉합니다</span></div><div class="clip cap" id="cap228" data-start="450.166" data-duration="2.200" data-track-index="1"><span>셋째 회 무게를 수율로 나누면</span></div><div class="clip cap" id="cap229" data-start="452.366" data-duration="1.702" data-track-index="1"><span>사야 할 활어 kg이에요</span></div><div class="clip cap" id="cap230" data-start="454.568" data-duration="2.160" data-track-index="1"><span>넷째 kg당 경락가를 수율로</span></div><div class="clip cap" id="cap231" data-start="456.728" data-duration="1.900" data-track-index="1"><span>나누고 <b>10</b>으로 나누면 회</span></div><div class="clip cap" id="cap232" data-start="458.628" data-duration="1.294" data-track-index="1"><span><b>100g</b> 원가입니다</span></div><div class="clip cap" id="cap233" data-start="460.422" data-duration="1.700" data-track-index="1"><span>다섯째 총비용은 판매가에</span></div><div class="clip cap" id="cap234" data-start="462.122" data-duration="1.380" data-track-index="1"><span>손질과 상차림비까지 더해서</span></div><div class="clip cap" id="cap235" data-start="463.502" data-duration="0.668" data-track-index="1"><span>보세요</span></div><div class="clip cap" id="cap236" data-start="464.670" data-duration="2.220" data-track-index="1"><span>이 화면은 캡처해 두셨다가 장</span></div><div class="clip cap" id="cap237" data-start="466.890" data-duration="1.570" data-track-index="1"><span>보러 가기 전에 꺼내 보세요</span></div><div class="clip cap" id="cap238" data-start="472.060" data-duration="1.314" data-track-index="1"><span>다시 한 번 말씀드립니다</span></div><div class="clip cap" id="cap239" data-start="473.874" data-duration="1.640" data-track-index="1"><span>오늘 금액은 모두 노량진 도매</span></div><div class="clip cap" id="cap240" data-start="475.514" data-duration="2.400" data-track-index="1"><span>경락가로 계산한 값이고 가게</span></div><div class="clip cap" id="cap241" data-start="477.914" data-duration="1.400" data-track-index="1"><span>판매가와 초장집 비용은</span></div><div class="clip cap" id="cap242" data-start="479.314" data-duration="0.519" data-track-index="1"><span>따로예요</span></div><div class="clip cap" id="cap243" data-start="480.333" data-duration="2.200" data-track-index="1"><span>수율은 자료마다 범위가 있고</span></div><div class="clip cap" id="cap244" data-start="482.533" data-duration="1.420" data-track-index="1"><span>생선 크기와 손질에 따라</span></div><div class="clip cap" id="cap245" data-start="483.953" data-duration="0.582" data-track-index="1"><span>달라집니다</span></div><div class="clip cap" id="cap246" data-start="485.034" data-duration="1.840" data-track-index="1"><span>제 생각에는 회를 살 때는</span></div><div class="clip cap" id="cap247" data-start="486.874" data-duration="1.620" data-track-index="1"><span>kg 값보다 회 <b>100g</b></span></div><div class="clip cap" id="cap248" data-start="488.494" data-duration="1.948" data-track-index="1"><span>값으로 비교하는 게 정확합니다</span></div><div class="clip cap" id="cap249" data-start="490.942" data-duration="1.680" data-track-index="1"><span>매주 토요일 노량진 주간 시세</span></div><div class="clip cap" id="cap250" data-start="492.622" data-duration="1.780" data-track-index="1"><span>재생목록에서 그 주 경락가를</span></div><div class="clip cap" id="cap251" data-start="494.402" data-duration="2.120" data-track-index="1"><span>보시면 오늘 공식에 바로 넣어</span></div><div class="clip cap" id="cap252" data-start="496.522" data-duration="0.946" data-track-index="1"><span>볼 수 있어요</span></div><div class="clip cap" id="cap253" data-start="497.969" data-duration="1.540" data-track-index="1"><span>연말 모임 회 장보기 편도</span></div><div class="clip cap" id="cap254" data-start="499.509" data-duration="1.800" data-track-index="1"><span>같이 보시면 인원별 생선</span></div><div class="clip cap" id="cap255" data-start="501.309" data-duration="1.692" data-track-index="1"><span>조합까지 정할 수 있습니다</span></div><div class="clip cap" id="cap256" data-start="503.501" data-duration="1.980" data-track-index="1"><span>여러분은 횟집 회 한 접시</span></div><div class="clip cap" id="cap257" data-start="505.481" data-duration="2.530" data-track-index="1"><span>얼마면 적당하다고 보세요?</span></div><div class="clip cap" id="cap258" data-start="508.011" data-duration="1.052" data-track-index="1"><span>댓글로 알려 주세요</span></div></div><script>const tl = gsap.timeline({ paused: true }); window.__timelines["captions"] = tl;</script></template>
