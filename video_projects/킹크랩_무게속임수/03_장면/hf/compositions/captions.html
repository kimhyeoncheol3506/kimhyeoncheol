<template><style>@font-face{font-family:"MJ";src:url("assets/fonts/NanumMyeongjo-ExtraBold.ttf");font-weight:800}@font-face{font-family:"PX";src:url("assets/fonts/Pretendard-Bold.otf");font-weight:700}@font-face{font-family:"PX";src:url("assets/fonts/Pretendard-SemiBold.otf");font-weight:500}@font-face{font-family:"PXB";src:url("assets/fonts/Pretendard-ExtraBold.otf");font-weight:800}#root{position:absolute;inset:0;font-family:PX,sans-serif}.cap{position:absolute;left:0;right:0;bottom:56px;text-align:center;overflow:visible}.cap span{display:inline-block;background:rgba(0,0,0,.56);color:#fff;font-size:87px;font-weight:700;line-height:1.2;padding:6px 26px;white-space:nowrap}.cap b{color:#FFD640;font-weight:700}</style><div id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div class="clip cap" id="cap0" data-start="0.700" data-duration="2.079" data-track-index="1"><span>노량진에서 킹크랩 <b>3kg</b>을</span></div><div class="clip cap" id="cap1" data-start="2.779" data-duration="2.376" data-track-index="1"><span>샀는데 집에서 재 보니 <b>2kg</b></span></div><div class="clip cap" id="cap2" data-start="5.155" data-duration="1.039" data-track-index="1"><span>속은 걸까요?</span></div><div class="clip cap" id="cap3" data-start="6.694" data-duration="2.180" data-track-index="1"><span><b>1kg</b> 차이면 이번 주 노량진</span></div><div class="clip cap" id="cap4" data-start="8.875" data-duration="1.363" data-track-index="1"><span>도매 경락가로만 약</span></div><div class="clip cap" id="cap5" data-start="10.237" data-duration="1.363" data-track-index="1"><span><b>6</b>만 <b>8</b>천 원입니다</span></div><div class="clip cap" id="cap6" data-start="12.100" data-duration="1.760" data-track-index="1"><span>가게에서 사는 값은 이보다</span></div><div class="clip cap" id="cap7" data-start="13.860" data-duration="2.012" data-track-index="1"><span>높으니 실제 차이는 더 클 수</span></div><div class="clip cap" id="cap8" data-start="15.872" data-duration="0.251" data-track-index="1"><span>있죠</span></div><div class="clip cap" id="cap9" data-start="16.624" data-duration="1.665" data-track-index="1"><span>하지만 먼저 알아 둘 게</span></div><div class="clip cap" id="cap10" data-start="18.289" data-duration="1.793" data-track-index="1"><span>있어요 킹크랩은 찌면 원래</span></div><div class="clip cap" id="cap11" data-start="20.082" data-duration="1.153" data-track-index="1"><span>무게가 줄어듭니다</span></div><div class="clip cap" id="cap12" data-start="21.735" data-duration="1.978" data-track-index="1"><span>보도된 전문가 설명으로는</span></div><div class="clip cap" id="cap13" data-start="23.714" data-duration="2.435" data-track-index="1"><span>일반적인 킹크랩은 찌면 무게가</span></div><div class="clip cap" id="cap14" data-start="26.149" data-duration="1.522" data-track-index="1"><span><b>30~35%</b> 줄어요</span></div><div class="clip cap" id="cap15" data-start="28.171" data-duration="2.137" data-track-index="1"><span><b>3kg</b>이 <b>2kg</b>이 됐다면</span></div><div class="clip cap" id="cap16" data-start="30.308" data-duration="2.630" data-track-index="1"><span><b>33%</b> 자연스러운 감량일 수도</span></div><div class="clip cap" id="cap17" data-start="32.938" data-duration="1.315" data-track-index="1"><span>있다는 뜻입니다</span></div><div class="clip cap" id="cap18" data-start="34.753" data-duration="2.093" data-track-index="1"><span>오늘은 자연스러운 무게 변화와</span></div><div class="clip cap" id="cap19" data-start="36.845" data-duration="1.831" data-track-index="1"><span>보도로 알려진 무게 속임수</span></div><div class="clip cap" id="cap20" data-start="38.676" data-duration="1.962" data-track-index="1"><span><b>5가지</b>를 구분해 보고 손해를</span></div><div class="clip cap" id="cap21" data-start="40.638" data-duration="1.962" data-track-index="1"><span>이번 주 경락가로 환산합니다</span></div><div class="clip cap" id="cap22" data-start="43.100" data-duration="1.856" data-track-index="1"><span>끝까지 보시면 저울 앞에서</span></div><div class="clip cap" id="cap23" data-start="44.956" data-duration="1.724" data-track-index="1"><span>바로 쓰는 체크리스트까지</span></div><div class="clip cap" id="cap24" data-start="46.680" data-duration="1.326" data-track-index="1"><span>가져가실 수 있어요</span></div><div class="clip cap" id="cap25" data-start="50.106" data-duration="1.918" data-track-index="1"><span>킹크랩 무게 데이터와 보도</span></div><div class="clip cap" id="cap26" data-start="52.024" data-duration="1.370" data-track-index="1"><span>사례로 따져 봅니다</span></div><div class="clip cap" id="cap27" data-start="53.894" data-duration="1.733" data-track-index="1"><span>가격 기준은 노량진수산의</span></div><div class="clip cap" id="cap28" data-start="55.627" data-duration="2.000" data-track-index="1"><span>어종별 경락시세 일별 수집본</span></div><div class="clip cap" id="cap29" data-start="57.627" data-duration="1.467" data-track-index="1"><span>새벽 경매 낙찰가예요</span></div><div class="clip cap" id="cap30" data-start="59.594" data-duration="2.027" data-track-index="1"><span>이번 주 <b>11월</b> <b>23일</b>부터</span></div><div class="clip cap" id="cap31" data-start="61.622" data-duration="1.593" data-track-index="1"><span>이틀 동안 활킹크랩은</span></div><div class="clip cap" id="cap32" data-start="63.215" data-duration="0.724" data-track-index="1"><span>킬로그램당</span></div><div class="clip cap" id="cap33" data-start="63.939" data-duration="1.738" data-track-index="1"><span><b>68,300원</b>이었습니다</span></div><div class="clip cap" id="cap34" data-start="66.176" data-duration="2.189" data-track-index="1"><span>지난주 <b>60,300원</b>보다 조금</span></div><div class="clip cap" id="cap35" data-start="68.366" data-duration="1.505" data-track-index="1"><span>올랐어요 경매 물량은</span></div><div class="clip cap" id="cap36" data-start="69.871" data-duration="1.505" data-track-index="1"><span><b>1,014kg</b>이었고요</span></div><div class="clip cap" id="cap37" data-start="71.876" data-duration="1.998" data-track-index="1"><span>사례는 언론에 보도된 내용과</span></div><div class="clip cap" id="cap38" data-start="73.874" data-duration="1.732" data-track-index="1"><span>공공기관 자료만 썼습니다</span></div><div class="clip cap" id="cap39" data-start="76.106" data-duration="1.988" data-track-index="1"><span>어느 가게인지는 말하지 않고</span></div><div class="clip cap" id="cap40" data-start="78.094" data-duration="1.988" data-track-index="1"><span>확인된 사실도 단정하지 않고</span></div><div class="clip cap" id="cap41" data-start="80.082" data-duration="1.723" data-track-index="1"><span>사례와 가능성으로만 전해</span></div><div class="clip cap" id="cap42" data-start="81.805" data-duration="0.530" data-track-index="1"><span>드릴게요</span></div><div class="clip cap" id="cap43" data-start="82.835" data-duration="2.112" data-track-index="1"><span>먼저 <b>3가지</b>를 기억해 주세요</span></div><div class="clip cap" id="cap44" data-start="85.447" data-duration="2.228" data-track-index="1"><span>첫째 경락가는 도매 낙찰가라서</span></div><div class="clip cap" id="cap45" data-start="87.676" data-duration="2.089" data-track-index="1"><span>가게에서 사는 값과 다릅니다</span></div><div class="clip cap" id="cap46" data-start="90.265" data-duration="1.856" data-track-index="1"><span>둘째 무게가 줄었다고 다</span></div><div class="clip cap" id="cap47" data-start="92.121" data-duration="1.285" data-track-index="1"><span>속임수는 아니에요</span></div><div class="clip cap" id="cap48" data-start="93.906" data-duration="1.729" data-track-index="1"><span>셋째 보도된 사례는 지난</span></div><div class="clip cap" id="cap49" data-start="95.635" data-duration="1.729" data-track-index="1"><span>일이고 지금 모든 가게가</span></div><div class="clip cap" id="cap50" data-start="97.363" data-duration="1.596" data-track-index="1"><span>그렇다는 뜻이 아닙니다</span></div><div class="clip cap" id="cap51" data-start="101.059" data-duration="1.965" data-track-index="1"><span><b>2가지</b>를 어떻게 나눌까요?</span></div><div class="clip cap" id="cap52" data-start="103.524" data-duration="2.058" data-track-index="1"><span>찌면 수분과 피가 빠지고 살아</span></div><div class="clip cap" id="cap53" data-start="105.582" data-duration="2.058" data-track-index="1"><span>있을 때 머금었던 물은 시간이</span></div><div class="clip cap" id="cap54" data-start="107.640" data-duration="1.415" data-track-index="1"><span>지나면 빠집니다 이건</span></div><div class="clip cap" id="cap55" data-start="109.055" data-duration="1.286" data-track-index="1"><span>자연스러운 변화예요</span></div><div class="clip cap" id="cap56" data-start="110.841" data-duration="2.052" data-track-index="1"><span>반면 저울의 영점 바구니 무게</span></div><div class="clip cap" id="cap57" data-start="112.894" data-duration="1.796" data-track-index="1"><span>누르기 바꿔치기 같은 일은</span></div><div class="clip cap" id="cap58" data-start="114.690" data-duration="2.052" data-track-index="1"><span>모두 찌기 전 생물 무게를 잴</span></div><div class="clip cap" id="cap59" data-start="116.742" data-duration="0.770" data-track-index="1"><span>때 생깁니다</span></div><div class="clip cap" id="cap60" data-start="118.012" data-duration="2.085" data-track-index="1"><span>기준은 하나예요 찌기 전 생물</span></div><div class="clip cap" id="cap61" data-start="120.097" data-duration="2.085" data-track-index="1"><span>무게를 내 눈앞에서 확인했는가</span></div><div class="clip cap" id="cap62" data-start="122.682" data-duration="1.576" data-track-index="1"><span>찐 뒤 무게만 가지고는</span></div><div class="clip cap" id="cap63" data-start="124.258" data-duration="1.970" data-track-index="1"><span>속임수인지 자연 감량인지 알</span></div><div class="clip cap" id="cap64" data-start="126.228" data-duration="0.919" data-track-index="1"><span>수가 없습니다</span></div><div class="clip cap" id="cap65" data-start="127.647" data-duration="1.665" data-track-index="1"><span>손해는 이번 주 경락가로</span></div><div class="clip cap" id="cap66" data-start="129.312" data-duration="2.050" data-track-index="1"><span>계산해 볼게요 <b>100g</b>이면 약</span></div><div class="clip cap" id="cap67" data-start="131.362" data-duration="0.897" data-track-index="1"><span><b>7</b>천 원입니다</span></div><div class="clip cap" id="cap68" data-start="132.759" data-duration="1.938" data-track-index="1"><span>가게 판매가로 따지면 이보다</span></div><div class="clip cap" id="cap69" data-start="134.697" data-duration="1.938" data-track-index="1"><span>더 크다는 점 기억해 두세요</span></div><div class="clip cap" id="cap70" data-start="138.735" data-duration="2.145" data-track-index="1"><span>첫 번째 물 무게입니다 흔히</span></div><div class="clip cap" id="cap71" data-start="140.880" data-duration="1.144" data-track-index="1"><span>물치기라고 하죠</span></div><div class="clip cap" id="cap72" data-start="142.524" data-duration="1.853" data-track-index="1"><span>살아 있는 게는 몸과 껍데기</span></div><div class="clip cap" id="cap73" data-start="144.376" data-duration="1.729" data-track-index="1"><span>사이에 물을 머금고 있어요</span></div><div class="clip cap" id="cap74" data-start="146.606" data-duration="2.054" data-track-index="1"><span>수산물 유튜버의 실험을 전한</span></div><div class="clip cap" id="cap75" data-start="148.660" data-duration="2.054" data-track-index="1"><span>보도에 따르면 킹크랩에 물을</span></div><div class="clip cap" id="cap76" data-start="150.715" data-duration="2.054" data-track-index="1"><span>먹이면 무게가 <b>60~120g</b></span></div><div class="clip cap" id="cap77" data-start="152.769" data-duration="1.096" data-track-index="1"><span>늘었다고 합니다</span></div><div class="clip cap" id="cap78" data-start="154.365" data-duration="1.989" data-track-index="1"><span>꽃게 사례도 있어요 구멍 난</span></div><div class="clip cap" id="cap79" data-start="156.354" data-duration="1.989" data-track-index="1"><span>봉투에 물과 함께 담아 재니</span></div><div class="clip cap" id="cap80" data-start="158.342" data-duration="0.928" data-track-index="1"><span>약 <b>1.9kg</b></span></div><div class="clip cap" id="cap81" data-start="159.771" data-duration="1.872" data-track-index="1"><span>물을 빼고 다시 재니 약</span></div><div class="clip cap" id="cap82" data-start="161.643" data-duration="1.872" data-track-index="1"><span><b>1.2kg</b>이었다는 보도가</span></div><div class="clip cap" id="cap83" data-start="163.515" data-duration="0.720" data-track-index="1"><span>있었습니다</span></div><div class="clip cap" id="cap84" data-start="164.735" data-duration="1.970" data-track-index="1"><span><b>2023년</b> <b>8월</b>에는 수도권의</span></div><div class="clip cap" id="cap85" data-start="166.705" data-duration="2.101" data-track-index="1"><span>한 수산시장에서 킹크랩 배딱지</span></div><div class="clip cap" id="cap86" data-start="168.806" data-duration="1.970" data-track-index="1"><span>안에 얼음을 채운 채 무게를</span></div><div class="clip cap" id="cap87" data-start="170.776" data-duration="1.707" data-track-index="1"><span>쟀다는 제보가 보도되기도</span></div><div class="clip cap" id="cap88" data-start="172.483" data-duration="0.394" data-track-index="1"><span>했어요</span></div><div class="clip cap" id="cap89" data-start="173.376" data-duration="1.825" data-track-index="1"><span><b>2kg</b>이 조금 넘게 나와</span></div><div class="clip cap" id="cap90" data-start="175.201" data-duration="1.684" data-track-index="1"><span><b>13</b>만 원이 넘는 값이</span></div><div class="clip cap" id="cap91" data-start="176.885" data-duration="1.544" data-track-index="1"><span>매겨졌다는 내용이었죠</span></div><div class="clip cap" id="cap92" data-start="178.929" data-duration="1.941" data-track-index="1"><span>물론 산 직후에 물을 머금어</span></div><div class="clip cap" id="cap93" data-start="180.871" data-duration="1.941" data-track-index="1"><span>무겁고 시간이 지나면 뱉어서</span></div><div class="clip cap" id="cap94" data-start="182.812" data-duration="1.682" data-track-index="1"><span>가벼워지는 건 자연스러운</span></div><div class="clip cap" id="cap95" data-start="184.494" data-duration="0.518" data-track-index="1"><span>일입니다</span></div><div class="clip cap" id="cap96" data-start="185.512" data-duration="2.039" data-track-index="1"><span>문제는 일부러 물을 먹이거나</span></div><div class="clip cap" id="cap97" data-start="187.551" data-duration="2.175" data-track-index="1"><span>물이나 얼음째로 저울에 올리는</span></div><div class="clip cap" id="cap98" data-start="189.727" data-duration="0.544" data-track-index="1"><span>경우예요</span></div><div class="clip cap" id="cap99" data-start="190.771" data-duration="2.121" data-track-index="1"><span><b>120g</b>이면 이번 주 경락가로</span></div><div class="clip cap" id="cap100" data-start="192.892" data-duration="1.856" data-track-index="1"><span>약 <b>8</b>천 원을 물값으로 더</span></div><div class="clip cap" id="cap101" data-start="194.748" data-duration="0.928" data-track-index="1"><span>내는 셈입니다</span></div><div class="clip cap" id="cap102" data-start="196.176" data-duration="1.973" data-track-index="1"><span>대처는 간단해요 물을 충분히</span></div><div class="clip cap" id="cap103" data-start="198.150" data-duration="1.710" data-track-index="1"><span>빼고 바구니 없이 배딱지</span></div><div class="clip cap" id="cap104" data-start="199.860" data-duration="2.105" data-track-index="1"><span>안까지 보고 재 달라고 하세요</span></div><div class="clip cap" id="cap105" data-start="204.065" data-duration="2.259" data-track-index="1"><span>두 번째 바구니와 영점입니다</span></div><div class="clip cap" id="cap106" data-start="206.824" data-duration="1.975" data-track-index="1"><span>시장에서 쓰는 바구니는 보통</span></div><div class="clip cap" id="cap107" data-start="208.799" data-duration="1.975" data-track-index="1"><span><b>300g</b> 안팎이라고 해요 이</span></div><div class="clip cap" id="cap108" data-start="210.775" data-duration="1.975" data-track-index="1"><span>무게를 빼지 않으면 바구니도</span></div><div class="clip cap" id="cap109" data-start="212.750" data-duration="1.185" data-track-index="1"><span>킹크랩값이 됩니다</span></div><div class="clip cap" id="cap110" data-start="214.435" data-duration="1.489" data-track-index="1"><span><b>2026년</b> <b>6월</b>에는</span></div><div class="clip cap" id="cap111" data-start="215.925" data-duration="1.936" data-track-index="1"><span>노량진에서도 이런 제보가</span></div><div class="clip cap" id="cap112" data-start="217.861" data-duration="0.745" data-track-index="1"><span>보도됐어요</span></div><div class="clip cap" id="cap113" data-start="219.106" data-duration="2.324" data-track-index="1"><span>저울엔 <b>3.2kg</b>으로 떴는데</span></div><div class="clip cap" id="cap114" data-start="221.430" data-duration="2.014" data-track-index="1"><span>바구니를 빼니 <b>2.4kg</b></span></div><div class="clip cap" id="cap115" data-start="223.444" data-duration="2.479" data-track-index="1"><span><b>800g</b> 차이였다는 내용입니다</span></div><div class="clip cap" id="cap116" data-start="226.424" data-duration="1.516" data-track-index="1"><span>제보자는 국민신문고에</span></div><div class="clip cap" id="cap117" data-start="227.940" data-duration="2.205" data-track-index="1"><span>신고했다고 해요 상인은 바구니</span></div><div class="clip cap" id="cap118" data-start="230.145" data-duration="1.654" data-track-index="1"><span>무게를 뺐다고 했다는데</span></div><div class="clip cap" id="cap119" data-start="231.799" data-duration="1.930" data-track-index="1"><span>영상으로는 그렇지 않았다는</span></div><div class="clip cap" id="cap120" data-start="233.728" data-duration="0.689" data-track-index="1"><span>주장이었죠</span></div><div class="clip cap" id="cap121" data-start="234.918" data-duration="1.905" data-track-index="1"><span>봉이 달린 저울도 조심하세요</span></div><div class="clip cap" id="cap122" data-start="236.823" data-duration="1.651" data-track-index="1"><span>쟁반이 봉에 닿아 있으면</span></div><div class="clip cap" id="cap123" data-start="238.474" data-duration="2.032" data-track-index="1"><span><b>200~300g</b>이 더 나올 수</span></div><div class="clip cap" id="cap124" data-start="240.505" data-duration="1.524" data-track-index="1"><span>있다는 보도가 있습니다</span></div><div class="clip cap" id="cap125" data-start="242.529" data-duration="1.884" data-track-index="1"><span>바구니를 이용하면 킹크랩</span></div><div class="clip cap" id="cap126" data-start="244.413" data-duration="2.029" data-track-index="1"><span>무게를 <b>500g</b>~<b>1kg</b>까지</span></div><div class="clip cap" id="cap127" data-start="246.442" data-duration="1.739" data-track-index="1"><span>늘릴 수 있다는 실험도</span></div><div class="clip cap" id="cap128" data-start="248.181" data-duration="0.725" data-track-index="1"><span>소개됐어요</span></div><div class="clip cap" id="cap129" data-start="249.406" data-duration="1.764" data-track-index="1"><span>지자체 점검에서도 문제가</span></div><div class="clip cap" id="cap130" data-start="251.170" data-duration="1.900" data-track-index="1"><span>확인됐습니다 인천 남동구는</span></div><div class="clip cap" id="cap131" data-start="253.070" data-duration="2.171" data-track-index="1"><span><b>2024년</b> <b>3 ta-duration="1.197" data-track-index="1"><span>무게를 확인하세요</span></div><div class="clip cap" id="cap147" data-start="285.388" data-duration="1.818" data-track-index="1"><span>세 번째 누르기입니다</span></div><div class="clip cap" id="cap148" data-start="287.706" data-duration="2.006" data-track-index="1"><span>저울에 올린 뒤 손이나 뜰채로</span></div><div class="clip cap" id="cap149" data-start="289.712" data-duration="1.755" data-track-index="1"><span>지그시 누르는 수법이 제보</span></div><div class="clip cap" id="cap150" data-start="291.467" data-duration="1.880" data-track-index="1"><span>영상에서 소개된 적이 있어요</span></div><div class="clip cap" id="cap151" data-start="293.847" data-duration="1.826" data-track-index="1"><span>누르는 장면을 직접 잡아낸</span></div><div class="clip cap" id="cap152" data-start="295.673" data-duration="1.956" data-track-index="1"><span>킹크랩 보도는 찾지 못했지만</span></div><div class="clip cap" id="cap153" data-start="297.629" data-duration="1.565" data-track-index="1"><span>비슷한 사례는 있습니다</span></div><div class="clip cap" id="cap154" data-start="299.694" data-duration="2.035" data-track-index="1"><span><b>2021년</b> 한 위탁판매장에서</span></div><div class="clip cap" id="cap155" data-start="301.729" data-duration="2.171" data-track-index="1"><span>생선 바구니 위에 벽돌 <b>2</b>장을</span></div><div class="clip cap" id="cap156" data-start="303.900" data-duration="1.628" data-track-index="1"><span>올려 계량했다는 보도가</span></div><div class="clip cap" id="cap157" data-start="305.528" data-duration="0.543" data-track-index="1"><span>있었어요</span></div><div class="clip cap" id="cap158" data-start="306.571" data-duration="2.226" data-track-index="1"><span>실제 <b>10kg</b>이 <b>16kg</b>으로</span></div><div class="clip cap" id="cap159" data-start="308.797" data-duration="2.226" data-track-index="1"><span>표시됐고 수협이 판매 자격을</span></div><div class="clip cap" id="cap160" data-start="311.023" data-duration="1.336" data-track-index="1"><span>정지했다고 합니다</span></div><div class="clip cap" id="cap161" data-start="312.859" data-duration="2.055" data-track-index="1"><span>요즘은 숫자로 헷갈리게 하는</span></div><div class="clip cap" id="cap162" data-start="314.914" data-duration="1.233" data-track-index="1"><span>경우도 보도됐어요</span></div><div class="clip cap" id="cap163" data-start="316.647" data-duration="1.904" data-track-index="1"><span>전자저울 위쪽의 큰 숫자는</span></div><div class="clip cap" id="cap164" data-start="318.551" data-duration="1.632" data-track-index="1"><span>금액인데 이걸 무게처럼</span></div><div class="clip cap" id="cap165" data-start="320.182" data-duration="1.224" data-track-index="1"><span>안내했다는 거예요</span></div><div class="clip cap" id="cap166" data-start="321.906" data-duration="1.429" data-track-index="1"><span>실제 <b>1.25kg</b>을</span></div><div class="clip cap" id="cap167" data-start="323.335" data-duration="2.144" data-track-index="1"><span><b>2.2kg</b>이라고 했다는 사례</span></div><div class="clip cap" id="cap168" data-start="325.478" data-duration="2.286" data-track-index="1"><span>단가 칸에 <b>1.7</b>이나 <b>1.8</b>을</span></div><div class="clip cap" id="cap169" data-start="327.765" data-duration="1.572" data-track-index="1"><span>미리 넣어 둔 경우도</span></div><div class="clip cap" id="cap170" data-start="329.337" data-duration="0.857" data-track-index="1"><span>소개됐습니다</span></div><div class="clip cap" id="cap171" data-start="330.694" data-duration="2.175" data-track-index="1"><span>이 경우 차이는 <b>950g</b> 이번</span></div><div class="clip cap" id="cap172" data-start="332.870" data-duration="1.224" data-track-index="1"><span>주 경락가로도 약</span></div><div class="clip cap" id="cap173" data-start="334.093" data-duration="1.360" data-track-index="1"><span><b>6</b>만 <b>5</b>천 원이에요</span></div><div class="clip cap" id="cap174" data-start="335.953" data-duration="1.769" data-track-index="1"><span>손을 뗀 뒤 숫자가 멈추면</span></div><div class="clip cap" id="cap175" data-start="337.722" data-duration="1.896" data-track-index="1"><span>아래 작은 창의 중량을 직접</span></div><div class="clip cap" id="cap176" data-start="339.618" data-duration="0.506" data-track-index="1"><span>읽으세요</span></div><div class="clip cap" id="cap177" data-start="342.224" data-duration="2.185" data-track-index="1"><span>네 번째는 속임수라기보다 가장</span></div><div class="clip cap" id="cap178" data-start="344.409" data-duration="2.048" data-track-index="1"><span>많이 오해하는 부분입니다 찐</span></div><div class="clip cap" id="cap179" data-start="346.457" data-duration="0.819" data-track-index="1"><span>뒤 무게예요</span></div><div class="clip cap" id="cap180" data-start="347.776" data-duration="1.912" data-track-index="1"><span>킹크랩을 찌면 피가 빠지고</span></div><div class="clip cap" id="cap181" data-start="349.688" data-duration="1.229" data-track-index="1"><span>수분이 날아갑니다</span></div><div class="clip cap" id="cap182" data-start="351.418" data-duration="2.187" data-track-index="1"><span>전문가 설명을 전한 보도에</span></div><div class="clip cap" id="cap183" data-start="353.605" data-duration="2.031" data-track-index="1"><span>따르면 살아 있는 A급은</span></div><div class="clip cap" id="cap184" data-start="355.635" data-duration="2.499" data-track-index="1"><span><b>20~25%</b> 일반적인 킹크랩은</span></div><div class="clip cap" id="cap185" data-start="358.135" data-duration="1.718" data-track-index="1"><span><b>30~35%</b>가 줄어요</span></div><div class="clip cap" id="cap186" data-start="360.353" data-duration="1.856" data-track-index="1"><span>죽어서 배에 물이 많이 찬</span></div><div class="clip cap" id="cap187" data-start="362.209" data-duration="2.121" data-track-index="1"><span>개체는 최대 <b>40%</b>까지 줄기도</span></div><div class="clip cap" id="cap188" data-start="364.331" data-duration="0.928" data-track-index="1"><span>한다고 합니다</span></div><div class="clip cap" id="cap189" data-start="365.759" data-duration="2.374" data-track-index="1"><span><b>3kg</b> 킹크랩을 찌면 감량</span></div><div class="clip cap" id="cap190" data-start="368.133" data-duration="2.205" data-track-index="1"><span><b>30~35%</b>로 계산해 약</span></div><div class="clip cap" id="cap191" data-start="370.337" data-duration="1.357" data-track-index="1"><span><b>2kg</b>이 남아요</span></div><div class="clip cap" id="cap192" data-start="372.194" data-duration="2.139" data-track-index="1"><span>제목의 <b>3kg</b>이 <b>2kg</b>이 된</span></div><div class="clip cap" id="cap193" data-start="374.333" data-duration="1.996" data-track-index="1"><span>상황 찌기 전 무게가 정말</span></div><div class="clip cap" id="cap194" data-start="376.329" data-duration="1.854" data-track-index="1"><span><b>3kg</b>이었다면 자연스러운</span></div><div class="clip cap" id="cap195" data-start="378.183" data-duration="1.711" data-track-index="1"><span>범위일 수 있다는 거죠</span></div><div class="clip cap" id="cap196" data-start="380.394" data-duration="1.596" data-track-index="1"><span>같은 보도에는 <b>3kg</b></span></div><div class="clip cap" id="cap197" data-start="381.990" data-duration="2.322" data-track-index="1"><span>상당이라는 찜 상품을 받아 재</span></div><div class="clip cap" id="cap198" data-start="384.312" data-duration="1.886" data-track-index="1"><span>보니 <b>1.75kg</b>이었다는</span></div><div class="clip cap" id="cap199" data-start="386.198" data-duration="1.161" data-track-index="1"><span>실측도 있었어요</span></div><div class="clip cap" id="cap200" data-start="387.859" data-duration="1.682" data-track-index="1"><span>판매처가 안내한 감량</span></div><div class="clip cap" id="cap201" data-start="389.541" data-duration="2.447" data-track-index="1"><span><b>20~30%</b>보다 많이 줄었다는</span></div><div class="clip cap" id="cap202" data-start="391.988" data-duration="1.071" data-track-index="1"><span>내용이었습니다</span></div><div class="clip cap" id="cap203" data-start="393.559" data-duration="1.989" data-track-index="1"><span>더 조심할 건 생물 판매는 안</span></div><div class="clip cap" id="cap204" data-start="395.548" data-duration="1.740" data-track-index="1"><span>하고 쪄서만 주는 경우예요</span></div><div class="clip cap" id="cap205" data-start="397.788" data-duration="2.474" data-track-index="1"><span>방송 검증에서 <b>1.5kg</b>이라고</span></div><div class="clip cap" id="cap206" data-start="400.262" data-duration="2.010" data-track-index="1"><span>안내받은 대게가 실제로는</span>
