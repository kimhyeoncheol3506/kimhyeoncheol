<template><style>@font-face{font-family:"MJ";src:url("assets/fonts/NanumMyeongjo-ExtraBold.ttf");font-weight:800}@font-face{font-family:"PX";src:url("assets/fonts/Pretendard-Bold.otf");font-weight:700}@font-face{font-family:"PX";src:url("assets/fonts/Pretendard-SemiBold.otf");font-weight:500}@font-face{font-family:"PXB";src:url("assets/fonts/Pretendard-ExtraBold.otf");font-weight:800}#root{position:absolute;inset:0;font-family:PX,sans-serif}.cap{position:absolute;left:0;right:0;bottom:56px;text-align:center;overflow:visible}.cap span{display:inline-block;background:rgba(0,0,0,.56);color:#fff;font-size:87px;font-weight:700;line-height:1.2;padding:6px 26px;white-space:nowrap}.cap b{color:#FFD640;font-weight:700}</style><div id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div class="clip cap" id="cap0" data-start="0.700" data-duration="2.100" data-track-index="1"><span>노량진에서 킹크랩 <b>3kg</b>을</span></div><div class="clip cap" id="cap1" data-start="2.800" data-duration="3.340" data-track-index="1"><span>샀는데 집에서 재 보니 <b>2kg</b></span></div><div class="clip cap" id="cap2" data-start="6.140" data-duration="1.647" data-track-index="1"><span>속은 걸까요?</span></div><div class="clip cap" id="cap3" data-start="8.287" data-duration="2.300" data-track-index="1"><span><b>1kg</b> 차이면 이번 주 노량진</span></div><div class="clip cap" id="cap4" data-start="10.587" data-duration="1.300" data-track-index="1"><span>도매 경락가로만 약</span></div><div class="clip cap" id="cap5" data-start="11.887" data-duration="1.352" data-track-index="1"><span><b>6</b>만 <b>8</b>천 원입니다</span></div><div class="clip cap" id="cap6" data-start="13.739" data-duration="1.580" data-track-index="1"><span>가게에서 사는 값은 이보다</span></div><div class="clip cap" id="cap7" data-start="15.319" data-duration="2.260" data-track-index="1"><span>높으니 실제 차이는 더 클 수</span></div><div class="clip cap" id="cap8" data-start="17.579" data-duration="0.488" data-track-index="1"><span>있죠</span></div><div class="clip cap" id="cap9" data-start="18.567" data-duration="1.400" data-track-index="1"><span>하지만 먼저 알아 둘 게</span></div><div class="clip cap" id="cap10" data-start="19.967" data-duration="2.040" data-track-index="1"><span>있어요 킹크랩은 찌면 원래</span></div><div class="clip cap" id="cap11" data-start="22.007" data-duration="1.098" data-track-index="1"><span>무게가 줄어듭니다</span></div><div class="clip cap" id="cap12" data-start="23.605" data-duration="2.100" data-track-index="1"><span>보도된 전문가 설명으로는</span></div><div class="clip cap" id="cap13" data-start="25.705" data-duration="2.140" data-track-index="1"><span>일반적인 킹크랩은 찌면 무게가</span></div><div class="clip cap" id="cap14" data-start="27.845" data-duration="1.511" data-track-index="1"><span><b>30~35%</b> 줄어요</span></div><div class="clip cap" id="cap15" data-start="29.856" data-duration="2.000" data-track-index="1"><span><b>3kg</b>이 <b>2kg</b>이 됐다면</span></div><div class="clip cap" id="cap16" data-start="31.856" data-duration="2.780" data-track-index="1"><span><b>33%</b> 자연스러운 감량일 수도</span></div><div class="clip cap" id="cap17" data-start="34.636" data-duration="1.235" data-track-index="1"><span>있다는 뜻입니다</span></div><div class="clip cap" id="cap18" data-start="36.370" data-duration="1.580" data-track-index="1"><span>오늘은 자연스러운 무게 변화와</span></div><div class="clip cap" id="cap19" data-start="37.950" data-duration="1.780" data-track-index="1"><span>보도로 알려진 무게 속임수</span></div><div class="clip cap" id="cap20" data-start="39.730" data-duration="2.180" data-track-index="1"><span><b>5가지</b>를 구분해 보고 손해를</span></div><div class="clip cap" id="cap21" data-start="41.910" data-duration="1.808" data-track-index="1"><span>이번 주 경락가로 환산합니다</span></div><div class="clip cap" id="cap22" data-start="44.218" data-duration="1.860" data-track-index="1"><span>끝까지 보시면 저울 앞에서</span></div><div class="clip cap" id="cap23" data-start="46.078" data-duration="1.500" data-track-index="1"><span>바로 쓰는 체크리스트까지</span></div><div class="clip cap" id="cap24" data-start="47.578" data-duration="1.278" data-track-index="1"><span>가져가실 수 있어요</span></div><div class="clip cap" id="cap25" data-start="50.956" data-duration="1.820" data-track-index="1"><span>킹크랩 무게 데이터와 보도</span></div><div class="clip cap" id="cap26" data-start="52.776" data-duration="1.088" data-track-index="1"><span>사례로 따져 봅니다</span></div><div class="clip cap" id="cap27" data-start="54.364" data-duration="1.440" data-track-index="1"><span>가격 기준은 노량진수산의</span></div><div class="clip cap" id="cap28" data-start="55.804" data-duration="1.960" data-track-index="1"><span>어종별 경락시세 일별 수집본</span></div><div class="clip cap" id="cap29" data-start="57.764" data-duration="1.831" data-track-index="1"><span>새벽 경매 낙찰가예요</span></div><div class="clip cap" id="cap30" data-start="60.095" data-duration="1.720" data-track-index="1"><span>이번 주 <b>11월</b> <b>23일</b>부터</span></div><div class="clip cap" id="cap31" data-start="61.815" data-duration="2.040" data-track-index="1"><span>이틀 동안 활킹크랩은</span></div><div class="clip cap" id="cap32" data-start="63.855" data-duration="0.560" data-track-index="1"><span>킬로그램당</span></div><div class="clip cap" id="cap33" data-start="64.415" data-duration="1.697" data-track-index="1"><span><b>68,300원</b>이었습니다</span></div><div class="clip cap" id="cap34" data-start="66.612" data-duration="2.000" data-track-index="1"><span>지난주 <b>60,300원</b>보다 조금</span></div><div class="clip cap" id="cap35" data-start="68.612" data-duration="1.820" data-track-index="1"><span>올랐어요 경매 물량은</span></div><div class="clip cap" id="cap36" data-start="70.432" data-duration="1.751" data-track-index="1"><span><b>1,014kg</b>이었고요</span></div><div class="clip cap" id="cap37" data-start="72.684" data-duration="2.040" data-track-index="1"><span>사례는 언론에 보도된 내용과</span></div><div class="clip cap" id="cap38" data-start="74.724" data-duration="1.573" data-track-index="1"><span>공공기관 자료만 썼습니다</span></div><div class="clip cap" id="cap39" data-start="76.797" data-duration="1.940" data-track-index="1"><span>어느 가게인지는 말하지 않고</span></div><div class="clip cap" id="cap40" data-start="78.737" data-duration="1.840" data-track-index="1"><span>확인된 사실도 단정하지 않고</span></div><div class="clip cap" id="cap41" data-start="80.577" data-duration="1.360" data-track-index="1"><span>사례와 가능성으로만 전해</span></div><div class="clip cap" id="cap42" data-start="81.937" data-duration="0.584" data-track-index="1"><span>드릴게요</span></div><div class="clip cap" id="cap43" data-start="83.021" data-duration="1.974" data-track-index="1"><span>먼저 <b>3가지</b>를 기억해 주세요</span></div><div class="clip cap" id="cap44" data-start="85.495" data-duration="2.320" data-track-index="1"><span>첫째 경락가는 도매 낙찰가라서</span></div><div class="clip cap" id="cap45" data-start="87.815" data-duration="2.293" data-track-index="1"><span>가게에서 사는 값과 다릅니다</span></div><div class="clip cap" id="cap46" data-start="90.609" data-duration="2.240" data-track-index="1"><span>둘째 무게가 줄었다고 다</span></div><div class="clip cap" id="cap47" data-start="92.849" data-duration="1.169" data-track-index="1"><span>속임수는 아니에요</span></div><div class="clip cap" id="cap48" data-start="94.517" data-duration="1.800" data-track-index="1"><span>셋째 보도된 사례는 지난</span></div><div class="clip cap" id="cap49" data-start="96.317" data-duration="1.680" data-track-index="1"><span>일이고 지금 모든 가게가</span></div><div class="clip cap" id="cap50" data-start="97.997" data-duration="1.401" data-track-index="1"><span>그렇다는 뜻이 아닙니다</span></div><div class="clip cap" id="cap51" data-start="101.498" data-duration="1.484" data-track-index="1"><span><b>2가지</b>를 어떻게 나눌까요?</span></div><div class="clip cap" id="cap52" data-start="103.482" data-duration="2.300" data-track-index="1"><span>찌면 수분과 피가 빠지고 살아</span></div><div class="clip cap" id="cap53" data-start="105.782" data-duration="1.600" data-track-index="1"><span>있을 때 머금었던 물은 시간이</span></div><div class="clip cap" id="cap54" data-start="107.382" data-duration="2.110" data-track-index="1"><span>지나면 빠집니다 이건</span></div><div class="clip cap" id="cap55" data-start="109.492" data-duration="0.977" data-track-index="1"><span>자연스러운 변화예요</span></div><div class="clip cap" id="cap56" data-start="110.969" data-duration="2.060" data-track-index="1"><span>반면 저울의 영점 바구니 무게</span></div><div class="clip cap" id="cap57" data-start="113.029" data-duration="2.200" data-track-index="1"><span>누르기 바꿔치기 같은 일은</span></div><div class="clip cap" id="cap58" data-start="115.229" data-duration="1.960" data-track-index="1"><span>모두 찌기 전 생물 무게를 잴</span></div><div class="clip cap" id="cap59" data-start="117.189" data-duration="0.764" data-track-index="1"><span>때 생깁니다</span></div><div class="clip cap" id="cap60" data-start="118.452" data-duration="2.780" data-track-index="1"><span>기준은 하나예요 찌기 전 생물</span></div><div class="clip cap" id="cap61" data-start="121.232" data-duration="1.935" data-track-index="1"><span>무게를 내 눈앞에서 확인했는가</span></div><div class="clip cap" id="cap62" data-start="123.667" data-duration="1.060" data-track-index="1"><span>찐 뒤 무게만 가지고는</span></div><div class="clip cap" id="cap63" data-start="124.727" data-duration="1.920" data-track-index="1"><span>속임수인지 자연 감량인지 알</span></div><div class="clip cap" id="cap64" data-start="126.647" data-duration="1.195" data-track-index="1"><span>수가 없습니다</span></div><div class="clip cap" id="cap65" data-start="128.341" data-duration="1.700" data-track-index="1"><span>손해는 이번 주 경락가로</span></div><div class="clip cap" id="cap66" data-start="130.041" data-duration="2.380" data-track-index="1"><span>계산해 볼게요 <b>100g</b>이면 약</span></div><div class="clip cap" id="cap67" data-start="132.421" data-duration="0.940" data-track-index="1"><span><b>7</b>천 원입니다</span></div><div class="clip cap" id="cap68" data-start="133.861" data-duration="1.300" data-track-index="1"><span>가게 판매가로 따지면 이보다</span></div><div class="clip cap" id="cap69" data-start="135.161" data-duration="2.075" data-track-index="1"><span>더 크다는 점 기억해 두세요</span></div><div class="clip cap" id="cap70" data-start="139.336" data-duration="2.840" data-track-index="1"><span>첫 번째 물 무게입니다 흔히</span></div><div class="clip cap" id="cap71" data-start="142.176" data-duration="1.118" data-track-index="1"><span>물치기라고 하죠</span></div><div class="clip cap" id="cap72" data-start="143.794" data-duration="1.720" data-track-index="1"><span>살아 있는 게는 몸과 껍데기</span></div><div class="clip cap" id="cap73" data-start="145.514" data-duration="1.479" data-track-index="1"><span>사이에 물을 머금고 있어요</span></div><div class="clip cap" id="cap74" data-start="147.493" data-duration="1.520" data-track-index="1"><span>수산물 유튜버의 실험을 전한</span></div><div class="clip cap" id="cap75" data-start="149.013" data-duration="2.100" data-track-index="1"><span>보도에 따르면 킹크랩에 물을</span></div><div class="clip cap" id="cap76" data-start="151.113" data-duration="1.760" data-track-index="1"><span>먹이면 무게가 <b>60~120g</b></span></div><div class="clip cap" id="cap77" data-start="152.873" data-duration="0.990" data-track-index="1"><span>늘었다고 합니다</span></div><div class="clip cap" id="cap78" data-start="154.363" data-duration="3.100" data-track-index="1"><span>꽃게 사례도 있어요 구멍 난</span></div><div class="clip cap" id="cap79" data-start="157.463" data-duration="2.080" data-track-index="1"><span>봉투에 물과 함께 담아 재니</span></div><div class="clip cap" id="cap80" data-start="159.543" data-duration="1.069" data-track-index="1"><span>약 <b>1.9kg</b></span></div><div class="clip cap" id="cap81" data-start="161.112" data-duration="1.590" data-track-index="1"><span>물을 빼고 다시 재니 약</span></div><div class="clip cap" id="cap82" data-start="162.702" data-duration="1.610" data-track-index="1"><span><b>1.2kg</b>이었다는 보도가</span></div><div class="clip cap" id="cap83" data-start="164.312" data-duration="0.757" data-track-index="1"><span>있었습니다</span></div><div class="clip cap" id="cap84" data-start="165.568" data-duration="1.980" data-track-index="1"><span><b>2023년</b> <b>8월</b>에는 수도권의</span></div><div class="clip cap" id="cap85" data-start="167.548" data-duration="1.970" data-track-index="1"><span>한 수산시장에서 킹크랩 배딱지</span></div><div class="clip cap" id="cap86" data-start="169.518" data-duration="1.610" data-track-index="1"><span>안에 얼음을 채운 채 무게를</span></div><div class="clip cap" id="cap87" data-start="171.128" data-duration="1.480" data-track-index="1"><span>쟀다는 제보가 보도되기도</span></div><div class="clip cap" id="cap88" data-start="172.608" data-duration="0.485" data-track-index="1"><span>했어요</span></div><div class="clip cap" id="cap89" data-start="173.593" data-duration="1.500" data-track-index="1"><span><b>2kg</b>이 조금 넘게 나와</span></div><div class="clip cap" id="cap90" data-start="175.093" data-duration="1.820" data-track-index="1"><span><b>13</b>만 원이 넘는 값이</span></div><div class="clip cap" id="cap91" data-start="176.913" data-duration="1.347" data-track-index="1"><span>매겨졌다는 내용이었죠</span></div><div class="clip cap" id="cap92" data-start="178.760" data-duration="1.620" data-track-index="1"><span>물론 산 직후에 물을 머금어</span></div><div class="clip cap" id="cap93" data-start="180.380" data-duration="2.280" data-track-index="1"><span>무겁고 시간이 지나면 뱉어서</span></div><div class="clip cap" id="cap94" data-start="182.660" data-duration="1.340" data-track-index="1"><span>가벼워지는 건 자연스러운</span></div><div class="clip cap" id="cap95" data-start="184.000" data-duration="0.504" data-track-index="1"><span>일입니다</span></div><div class="clip cap" id="cap96" data-start="185.005" data-duration="1.660" data-track-index="1"><span>문제는 일부러 물을 먹이거나</span></div><div class="clip cap" id="cap97" data-start="186.665" data-duration="2.280" data-track-index="1"><span>물이나 얼음째로 저울에 올리는</span></div><div class="clip cap" id="cap98" data-start="188.945" data-duration="0.532" data-track-index="1"><span>경우예요</span></div><div class="clip cap" id="cap99" data-start="189.977" data-duration="2.200" data-track-index="1"><span><b>120g</b>이면 이번 주 경락가로</span></div><div class="clip cap" id="cap100" data-start="192.177" data-duration="1.560" data-track-index="1"><span>약 <b>8</b>천 원을 물값으로 더</span></div><div class="clip cap" id="cap101" data-start="193.737" data-duration="0.817" data-track-index="1"><span>내는 셈입니다</span></div><div class="clip cap" id="cap102" data-start="195.054" data-duration="2.280" data-track-index="1"><span>대처는 간단해요 물을 충분히</span></div><div class="clip cap" id="cap103" data-start="197.334" data-duration="2.360" data-track-index="1"><span>빼고 바구니 없이 배딱지</span></div><div class="clip cap" id="cap104" data-start="199.694" data-duration="1.658" data-track-index="1"><span>안까지 보고 재 달라고 하세요</span></div><div class="clip cap" id="cap105" data-start="203.453" data-duration="2.207" data-track-index="1"><span>두 번째 바구니와 영점입니다</span></div><div class="clip cap" id="cap106" data-start="206.159" data-duration="1.720" data-track-index="1"><span>시장에서 쓰는 바구니는 보통</span></div><div class="clip cap" id="cap107" data-start="207.879" data-duration="2.340" data-track-index="1"><span><b>300g</b> 안팎이라고 해요 이</span></div><div class="clip cap" id="cap108" data-start="210.219" data-duration="1.940" data-track-index="1"><span>무게를 빼지 않으면 바구니도</span></div><div class="clip cap" id="cap109" data-start="212.159" data-duration="1.234" data-track-index="1"><span>킹크랩값이 됩니다</span></div><div class="clip cap" id="cap110" data-start="213.893" data-duration="1.300" data-track-index="1"><span><b>2026년</b> <b>6월</b>에는</span></div><div class="clip cap" id="cap111" data-start="215.193" data-duration="1.680" data-track-index="1"><span>노량진에서도 이런 제보가</span></div><div class="clip cap" id="cap112" data-start="216.873" data-duration="0.898" data-track-index="1"><span>보도됐어요</span></div><div class="clip cap" id="cap113" data-start="218.271" data-duration="1.920" data-track-index="1"><span>저울엔 <b>3.2kg</b>으로 떴는데</span></div><div class="clip cap" id="cap114" data-start="220.191" data-duration="2.130" data-track-index="1"><span>바구니를 빼니 <b>2.4kg</b></span></div><div class="clip cap" id="cap115" data-start="222.321" data-duration="2.767" data-track-index="1"><span><b>800g</b> 차이였다는 내용입니다</span></div><div class="clip cap" id="cap116" data-start="225.588" data-duration="1.200" data
