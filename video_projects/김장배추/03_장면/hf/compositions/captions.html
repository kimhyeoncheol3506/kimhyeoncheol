1"><span>보러 갈 때 꺼내 보세요</span></div><div class="clip cap" id="cap206" data-start="396.065" data-duration="1.314" data-track-index="1"><span>다시 한 번 말씀드립니다</span></div><div class="clip cap" id="cap207" data-start="397.879" data-duration="1.460" data-track-index="1"><span>오늘 배추와 채소 값은</span></div><div class="clip cap" id="cap208" data-start="399.339" data-duration="2.260" data-track-index="1"><span>가락시장 도매 경락가이고 김장</span></div><div class="clip cap" id="cap209" data-start="401.599" data-duration="1.760" data-track-index="1"><span>재료비는 aT 조사를 절반으로</span></div><div class="clip cap" id="cap210" data-start="403.359" data-duration="1.180" data-track-index="1"><span>나눈 단순 계산이에요</span></div><div class="clip cap" id="cap211" data-start="405.039" data-duration="1.260" data-track-index="1"><span>가격 전망은 참고일 뿐 꼭</span></div><div class="clip cap" id="cap212" data-start="406.299" data-duration="2.216" data-track-index="1"><span>그렇게 된다는 보장은 없습니다</span></div><div class="clip cap" id="cap213" data-start="409.015" data-duration="1.800" data-track-index="1"><span>제 생각에는 올해 김장은</span></div><div class="clip cap" id="cap214" data-start="410.815" data-duration="2.860" data-track-index="1"><span>배추보다 고춧가루 마늘 새우젓</span></div><div class="clip cap" id="cap215" data-start="413.675" data-duration="1.944" data-track-index="1"><span>같은 양념에서 비용이 갈립니다</span></div><div class="clip cap" id="cap216" data-start="416.119" data-duration="1.460" data-track-index="1"><span>앞으로는 노량진뿐 아니라</span></div><div class="clip cap" id="cap217" data-start="417.579" data-duration="2.200" data-track-index="1"><span>가락시장 소래포구까지 전국</span></div><div class="clip cap" id="cap218" data-start="419.779" data-duration="1.400" data-track-index="1"><span>시장의 도매가를 정리해</span></div><div class="clip cap" id="cap219" data-start="421.179" data-duration="2.280" data-track-index="1"><span>드릴게요 매주 시세 재생목록도</span></div><div class="clip cap" id="cap220" data-start="423.459" data-duration="1.115" data-track-index="1"><span>함께 봐 주세요</span></div><div class="clip cap" id="cap221" data-start="425.074" data-duration="2.300" data-track-index="1"><span>여러분은 올해 김장 몇 포기</span></div><div class="clip cap" id="cap222" data-start="427.374" data-duration="3.220" data-track-index="1"><span>하세요? 절임배추 사세요 직접</span></div><div class="clip cap" id="cap223" data-start="430.594" data-duration="2.403" data-track-index="1"><span>절이세요? 댓글로 알려 주세요</span></div></div><script>const tl = gsap.timeline({ paused: true }); window.__timelines["captions"] = tl;</script></template>
