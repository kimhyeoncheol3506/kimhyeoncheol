<template><style>@font-face{font-family:"MJ";src:url("assets/fonts/NanumMyeongjo-ExtraBold.ttf");font-weight:800}@font-face{font-family:"PX";src:url("assets/fonts/Pretendard-Bold.otf");font-weight:700}@font-face{font-family:"PX";src:url("assets/fonts/Pretendard-SemiBold.otf");font-weight:500}@font-face{font-family:"PXB";src:url("assets/fonts/Pretendard-ExtraBold.otf");font-weight:800}#root{position:absolute;inset:0;font-family:PX,sans-serif}.cap{position:absolute;left:0;right:0;bottom:56px;text-align:center;overflow:visible}.cap span{display:inline-block;background:rgba(0,0,0,.56);color:#fff;font-size:87px;font-weight:700;line-height:1.2;padding:6px 26px;white-space:nowrap}.cap b{color:#FFD640;font-weight:700}</style><div id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div class="clip cap" id="cap0" data-start="0.700" data-duration="1.700" data-track-index="1"><span>연말 모임 <b>10</b>명 회를</span></div><div class="clip cap" id="cap1" data-start="2.400" data-duration="1.340" data-track-index="1"><span>광어로만 준비하면 얼마가</span></div><div class="clip cap" id="cap2" data-start="3.740" data-duration="0.606" data-track-index="1"><span>들까요?</span></div><div class="clip cap" id="cap3" data-start="4.846" data-duration="2.500" data-track-index="1"><span>노량진 도매 경락가로 계산하면</span></div><div class="clip cap" id="cap4" data-start="7.346" data-duration="1.580" data-track-index="1"><span>활광어 <b>5kg</b> 약</span></div><div class="clip cap" id="cap5" data-start="8.926" data-duration="1.474" data-track-index="1"><span><b>14</b>만 <b>8</b>천 원입니다</span></div><div class="clip cap" id="cap6" data-start="10.900" data-duration="1.470" data-track-index="1"><span>가게에서 사는 값과 초장집</span></div><div class="clip cap" id="cap7" data-start="12.370" data-duration="2.010" data-track-index="1"><span>비용은 따로지만 도매가만 봐도</span></div><div class="clip cap" id="cap8" data-start="14.380" data-duration="0.960" data-track-index="1"><span>감이 오시죠</span></div><div class="clip cap" id="cap9" data-start="15.840" data-duration="1.690" data-track-index="1"><span>한 사람이 먹는 회 양과</span></div><div class="clip cap" id="cap10" data-start="17.530" data-duration="3.230" data-track-index="1"><span>생선의 수율 이 <b>2가지</b>만 알면</span></div><div class="clip cap" id="cap11" data-start="20.760" data-duration="1.680" data-track-index="1"><span>덜 사고 넉넉하게 준비할 수</span></div><div class="clip cap" id="cap12" data-start="22.440" data-duration="0.557" data-track-index="1"><span>있습니다</span></div><div class="clip cap" id="cap13" data-start="23.496" data-duration="1.780" data-track-index="1"><span>오늘은 인원별로 몇 킬로그램을</span></div><div class="clip cap" id="cap14" data-start="25.276" data-duration="1.980" data-track-index="1"><span>사야 하는지 어떤 생선이</span></div><div class="clip cap" id="cap15" data-start="27.256" data-duration="2.000" data-track-index="1"><span>가성비인지 <b>12월</b>엔 언제 사면</span></div><div class="clip cap" id="cap16" data-start="29.256" data-duration="1.476" data-track-index="1"><span>덜 비싼지 정리합니다</span></div><div class="clip cap" id="cap17" data-start="31.232" data-duration="2.440" data-track-index="1"><span>끝까지 보시면 장 보러 가기</span></div><div class="clip cap" id="cap18" data-start="33.672" data-duration="1.710" data-track-index="1"><span>전에 쓰는 체크리스트까지</span></div><div class="clip cap" id="cap19" data-start="35.382" data-duration="1.025" data-track-index="1"><span>가져가실 수 있어요</span></div><div class="clip cap" id="cap20" data-start="38.507" data-duration="2.280" data-track-index="1"><span>연말 모임 회 장보기 데이터로</span></div><div class="clip cap" id="cap21" data-start="40.787" data-duration="0.646" data-track-index="1"><span>계산합니다</span></div><div class="clip cap" id="cap22" data-start="41.933" data-duration="0.660" data-track-index="1"><span>가격 자료는</span></div><div class="clip cap" id="cap23" data-start="42.593" data-duration="1.700" data-track-index="1"><span>노량진수산주식회사의 어종별</span></div><div class="clip cap" id="cap24" data-start="44.293" data-duration="1.800" data-track-index="1"><span>경락시세 새벽 경매</span></div><div class="clip cap" id="cap25" data-start="46.093" data-duration="0.859" data-track-index="1"><span>낙찰가입니다</span></div><div class="clip cap" id="cap26" data-start="47.452" data-duration="1.520" data-track-index="1"><span>킬로그램 단위 경매의 수량</span></div><div class="clip cap" id="cap27" data-start="48.972" data-duration="1.969" data-track-index="1"><span>가중 중앙값으로 계산했어요</span></div><div class="clip cap" id="cap28" data-start="51.442" data-duration="2.040" data-track-index="1"><span>기간은 최근 <b>4</b>주 <b>10월</b></span></div><div class="clip cap" id="cap29" data-start="53.482" data-duration="1.140" data-track-index="1"><span><b>19일</b>부터 <b>11월</b></span></div><div class="clip cap" id="cap30" data-start="54.622" data-duration="1.064" data-track-index="1"><span><b>14일</b>까지입니다</span></div><div class="clip cap" id="cap31" data-start="56.186" data-duration="1.500" data-track-index="1"><span>작년 <b>12월</b>은 주마다 월요일과</span></div><div class="clip cap" id="cap32" data-start="57.686" data-duration="2.303" data-track-index="1"><span>화요일 <b>2일</b>씩만 뽑아 봤어요</span></div><div class="clip cap" id="cap33" data-start="60.489" data-duration="1.880" data-track-index="1"><span>최근 <b>4</b>주 값이 평균의 <b>30%</b></span></div><div class="clip cap" id="cap34" data-start="62.369" data-duration="2.040" data-track-index="1"><span>넘게 오르내린 생선은 판단을</span></div><div class="clip cap" id="cap35" data-start="64.409" data-duration="1.440" data-track-index="1"><span>흐릴 수 있어 계산에서</span></div><div class="clip cap" id="cap36" data-start="65.849" data-duration="0.526" data-track-index="1"><span>뺐습니다</span></div><div class="clip cap" id="cap37" data-start="66.875" data-duration="1.978" data-track-index="1"><span>먼저 <b>3가지</b>를 꼭 알아 두세요</span></div><div class="clip cap" id="cap38" data-start="69.352" data-duration="2.250" data-track-index="1"><span>첫째 경락가는 도매 낙찰가라서</span></div><div class="clip cap" id="cap39" data-start="71.602" data-duration="2.367" data-track-index="1"><span>가게에서 사는 값과는 다릅니다</span></div><div class="clip cap" id="cap40" data-start="74.469" data-duration="2.040" data-track-index="1"><span>둘째 초장집 상차림비나</span></div><div class="clip cap" id="cap41" data-start="76.510" data-duration="1.464" data-track-index="1"><span>손질비는 따로 듭니다</span></div><div class="clip cap" id="cap42" data-start="78.474" data-duration="2.010" data-track-index="1"><span>셋째 작년 숫자는 과거</span></div><div class="clip cap" id="cap43" data-start="80.484" data-duration="2.150" data-track-index="1"><span>데이터라서 올해도 똑같다는</span></div><div class="clip cap" id="cap44" data-start="82.634" data-duration="0.798" data-track-index="1"><span>보장은 없습니다</span></div><div class="clip cap" id="cap45" data-start="85.532" data-duration="2.600" data-track-index="1"><span>계산법은 간단합니다 필요한 회</span></div><div class="clip cap" id="cap46" data-start="88.132" data-duration="1.567" data-track-index="1"><span>양을 수율로 나누면 돼요</span></div><div class="clip cap" id="cap47" data-start="90.199" data-duration="1.520" data-track-index="1"><span>먼저 한 사람이 먹는 회</span></div><div class="clip cap" id="cap48" data-start="91.719" data-duration="2.680" data-track-index="1"><span>양입니다 여러 후기에서 <b>1</b>인당</span></div><div class="clip cap" id="cap49" data-start="94.399" data-duration="1.543" data-track-index="1"><span><b>200g</b>을 많이 잡아요</span></div><div class="clip cap" id="cap50" data-start="96.442" data-duration="1.400" data-track-index="1"><span><b>2</b>명이 <b>400~500g</b>이면</span></div><div class="clip cap" id="cap51" data-start="97.842" data-duration="1.816" data-track-index="1"><span>적당하다는 정리도 있습니다</span></div><div class="clip cap" id="cap52" data-start="100.158" data-duration="2.040" data-track-index="1"><span>매운탕이나 미역국으로 식사까지</span></div><div class="clip cap" id="cap53" data-start="102.198" data-duration="1.240" data-track-index="1"><span>한다면 <b>2</b>명에</span></div><div class="clip cap" id="cap54" data-start="103.438" data-duration="1.660" data-track-index="1"><span><b>350~450g</b>으로 조금</span></div><div class="clip cap" id="cap55" data-start="105.098" data-duration="1.987" data-track-index="1"><span>줄여도 된다는 설명도 있어요</span></div><div class="clip cap" id="cap56" data-start="107.586" data-duration="2.180" data-track-index="1"><span>술자리 위주라면 조금 넉넉하게</span></div><div class="clip cap" id="cap57" data-start="109.766" data-duration="1.400" data-track-index="1"><span>식사 위주라면 조금 적게</span></div><div class="clip cap" id="cap58" data-start="111.166" data-duration="0.795" data-track-index="1"><span>잡으면 됩니다</span></div><div class="clip cap" id="cap59" data-start="112.461" data-duration="2.260" data-track-index="1"><span>다음은 수율 살아 있는 생선</span></div><div class="clip cap" id="cap60" data-start="114.721" data-duration="2.200" data-track-index="1"><span>무게 가운데 회로 뜰 수 있는</span></div><div class="clip cap" id="cap61" data-start="116.921" data-duration="0.929" data-track-index="1"><span>살의 비율이에요</span></div><div class="clip cap" id="cap62" data-start="118.350" data-duration="2.620" data-track-index="1"><span>광어는 <b>40~50%</b> 참돔은</span></div><div class="clip cap" id="cap63" data-start="120.970" data-duration="2.740" data-track-index="1"><span><b>30~40%</b> 농어는 <b>40%</b></span></div><div class="clip cap" id="cap64" data-start="123.710" data-duration="2.011" data-track-index="1"><span>전후라는 설명이 많습니다</span></div><div class="clip cap" id="cap65" data-start="126.221" data-duration="2.220" data-track-index="1"><span>자료마다 차이가 커서 오늘은</span></div><div class="clip cap" id="cap66" data-start="128.441" data-duration="1.940" data-track-index="1"><span>모자라지 않게 낮은 쪽 값으로</span></div><div class="clip cap" id="cap67" data-start="130.381" data-duration="0.707" data-track-index="1"><span>계산했습니다</span></div><div class="clip cap" id="cap68" data-start="131.588" data-duration="1.620" data-track-index="1"><span>광어라면 <b>200g</b> 나누기</span></div><div class="clip cap" id="cap69" data-start="133.208" data-duration="1.920" data-track-index="1"><span><b>0.4</b> 한 사람에 활어</span></div><div class="clip cap" id="cap70" data-start="135.128" data-duration="1.021" data-track-index="1"><span><b>500g</b>입니다</span></div><div class="clip cap" id="cap71" data-start="136.650" data-duration="2.580" data-track-index="1"><span><b>4</b>명이면 <b>2kg</b> <b>6</b>명이면</span></div><div class="clip cap" id="cap72" data-start="139.230" data-duration="2.951" data-track-index="1"><span><b>3kg</b> <b>10</b>명이면 <b>5kg</b>죠</span></div><div class="clip cap" id="cap73" data-start="142.681" data-duration="1.440" data-track-index="1"><span>수조에서 고른 무게가 아니라</span></div><div class="clip cap" id="cap74" data-start="144.121" data-duration="2.060" data-track-index="1"><span>회로 떴을 때 몇 그램인지가</span></div><div class="clip cap" id="cap75" data-start="146.181" data-duration="1.501" data-track-index="1"><span>기준이라는 걸 기억하세요</span></div><div class="clip cap" id="cap76" data-start="148.182" data-duration="1.400" data-track-index="1"><span>수율이 <b>40%</b>라는 건</span></div><div class="clip cap" id="cap77" data-start="149.582" data-duration="2.380" data-track-index="1"><span><b>1kg</b>짜리 광어에서 회가 약</span></div><div class="clip cap" id="cap78" data-start="151.962" data-duration="1.813" data-track-index="1"><span><b>400g</b> 나온다는 뜻입니다</span></div><div class="clip cap" id="cap79" data-start="154.275" data-duration="1.840" data-track-index="1"><span>나머지 <b>600g</b>은 머리와 뼈</span></div><div class="clip cap" id="cap80" data-start="156.115" data-duration="2.860" data-track-index="1"><span>내장 껍질이에요 서더리로</span></div><div class="clip cap" id="cap81" data-start="158.975" data-duration="2.124" data-track-index="1"><span>매운탕을 끓이면 버릴 게 없죠</span></div><div class="clip cap" id="cap82" data-start="163.199" data-duration="1.920" data-track-index="1"><span>표를 보기 전에 최근 <b>4</b>주</span></div><div class="clip cap" id="cap83" data-start="165.119" data-duration="1.415" data-track-index="1"><span>흐름부터 짚어 볼게요</span></div><div class="clip cap" id="cap84" data-start="167.034" data-duration="1.600" data-track-index="1"><span>광어는 <b>28,400원</b>에서</span></div><div class="clip cap" id="cap85" data-start="168.63 t="391.901" data-duration="1.580" data-track-index="1"><span>경락가를 한번 확인하는 게</span></div><div class="clip cap" id="cap205" data-start="393.481" data-duration="0.801" data-track-index="1"><span>가장 확실해요</span></div><div class="clip cap" id="cap206" data-start="396.382" data-duration="1.660" data-track-index="1"><span>자주 받는 질문 <b>3가지</b>만 짚고</span></div><div class="clip cap" id="cap207" data-start="398.042" data-duration="0.460" data-track-index="1"><span>갈게요</span></div><div class="clip cap" id="cap208" data-start="399.002" data-duration="1.840" data-track-index="1"><span>첫 번째 작은 생선 여러</span></div><div class="clip cap" id="cap209" data-start="400.842" data-duration="2.180" data-track-index="1"><span>마리와 큰 생선 한 마리 뭐가</span></div><div class="clip cap" id="cap210" data-start="403.022" data-duration="0.673" data-track-index="1"><span>나을까요?</span></div><div class="clip cap" id="cap211" data-start="404.196" data-duration="2.820" data-track-index="1"><span>대광어처럼 큰 생선은 작은</span></div><div class="clip cap" id="cap212" data-start="407.016" data-duration="1.620" data-track-index="1"><span>생선보다 킬로그램당 수율이</span></div><div class="clip cap" id="cap213" data-start="408.636" data-duration="1.358" data-track-index="1"><span>높다는 설명이 있어요</span></div><div class="clip cap" id="cap214" data-start="410.494" data-duration="2.080" data-track-index="1"><span>인원이 많을수록 큰 생선 한두</span></div><div class="clip cap" id="cap215" data-start="412.574" data-duration="1.640" data-track-index="1"><span>마리로 사는 쪽이 회 양에서</span></div><div class="clip cap" id="cap216" data-start="414.214" data-duration="1.114" data-track-index="1"><span>유리할 수 있습니다</span></div><div class="clip cap" id="cap217" data-start="415.827" data-duration="2.180" data-track-index="1"><span>두 번째 회를 떠 왔는데 양이</span></div><div class="clip cap" id="cap218" data-start="418.007" data-duration="1.082" data-track-index="1"><span>적은 것 같다면요?</span></div><div class="clip cap" id="cap219" data-start="419.589" data-duration="1.640" data-track-index="1"><span>참돔 <b>2kg</b>이면 회가</span></div><div class="clip cap" id="cap220" data-start="421.229" data-duration="1.880" data-track-index="1"><span><b>660~800g</b> 정도를 참고</span></div><div class="clip cap" id="cap221" data-start="423.109" data-duration="1.953" data-track-index="1"><span>범위로 보는 설명이 있습니다</span></div><div class="clip cap" id="cap222" data-start="425.562" data-duration="2.240" data-track-index="1"><span>이보다 훨씬 적다면 손질 전과</span></div><div class="clip cap" id="cap223" data-start="427.802" data-duration="1.640" data-track-index="1"><span>후의 무게를 확인해 달라고</span></div><div class="clip cap" id="cap224" data-start="429.442" data-duration="0.438" data-track-index="1"><span>하세요</span></div><div class="clip cap" id="cap225" data-start="430.380" data-duration="1.940" data-track-index="1"><span>세 번째 킹크랩이나 대게도</span></div><div class="clip cap" id="cap226" data-start="432.320" data-duration="1.747" data-track-index="1"><span>같이 하면 어떻게 잡을까요?</span></div><div class="clip cap" id="cap227" data-start="434.566" data-duration="1.950" data-track-index="1"><span>게를 메인으로 먹는다면 <b>1</b>인당</span></div><div class="clip cap" id="cap228" data-start="436.516" data-duration="1.930" data-track-index="1"><span><b>800g</b>~<b>1kg</b>을 권하는</span></div><div class="clip cap" id="cap229" data-start="438.446" data-duration="1.444" data-track-index="1"><span>판매점이 많다고 해요</span></div><div class="clip cap" id="cap230" data-start="440.391" data-duration="2.060" data-track-index="1"><span>회와 함께 낸다면 회 양을</span></div><div class="clip cap" id="cap231" data-start="442.451" data-duration="1.820" data-track-index="1"><span>조금 줄여서 전체 양을 맞추면</span></div><div class="clip cap" id="cap232" data-start="444.271" data-duration="0.429" data-track-index="1"><span>됩니다</span></div><div class="clip cap" id="cap233" data-start="446.800" data-duration="2.500" data-track-index="1"><span>이제 한 장으로 정리합니다</span></div><div class="clip cap" id="cap234" data-start="449.300" data-duration="1.700" data-track-index="1"><span>연말 모임 회 장보기 다섯</span></div><div class="clip cap" id="cap235" data-start="451.000" data-duration="0.582" data-track-index="1"><span>단계예요</span></div><div class="clip cap" id="cap236" data-start="452.082" data-duration="3.120" data-track-index="1"><span>첫째 인원 인원에 <b>200g</b>을</span></div><div class="clip cap" id="cap237" data-start="455.202" data-duration="1.520" data-track-index="1"><span>곱해서 필요한 회 양을</span></div><div class="clip cap" id="cap238" data-start="456.722" data-duration="0.550" data-track-index="1"><span>정하세요</span></div><div class="clip cap" id="cap239" data-start="457.772" data-duration="2.800" data-track-index="1"><span>둘째 킬로그램 계산 회 양을</span></div><div class="clip cap" id="cap240" data-start="460.572" data-duration="2.180" data-track-index="1"><span>수율로 나누되 모자라지 않게</span></div><div class="clip cap" id="cap241" data-start="462.752" data-duration="1.286" data-track-index="1"><span>낮은 쪽 값으로요</span></div><div class="clip cap" id="cap242" data-start="464.538" data-duration="2.960" data-track-index="1"><span>셋째 생선 가성비는 농어</span></div><div class="clip cap" id="cap243" data-start="467.498" data-duration="2.760" data-track-index="1"><span>기본은 광어 그 사이에 참돔이</span></div><div class="clip cap" id="cap244" data-start="470.258" data-duration="0.548" data-track-index="1"><span>있습니다</span></div><div class="clip cap" id="cap245" data-start="471.306" data-duration="2.800" data-track-index="1"><span>넷째 날짜 연말 피크 전에</span></div><div class="clip cap" id="cap246" data-start="474.106" data-duration="2.480" data-track-index="1"><span>사고 가기 전날 경락가를 한번</span></div><div class="clip cap" id="cap247" data-start="476.586" data-duration="0.730" data-track-index="1"><span>확인하세요</span></div><div class="clip cap" id="cap248" data-start="477.815" data-duration="3.440" data-track-index="1"><span>다섯째 무게 확인 손질 전과</span></div><div class="clip cap" id="cap249" data-start="481.255" data-duration="1.200" data-track-index="1"><span>후의 무게를 눈앞에서</span></div><div class="clip cap" id="cap250" data-start="482.455" data-duration="0.646" data-track-index="1"><span>확인하세요</span></div><div class="clip cap" id="cap251" data-start="483.601" data-duration="2.020" data-track-index="1"><span><b>2kg</b>짜리 참돔에서 회가</span></div><div class="clip cap" id="cap252" data-start="485.621" data-duration="1.720" data-track-index="1"><span><b>258g</b>만 나왔다는 사례가</span></div><div class="clip cap" id="cap253" data-start="487.341" data-duration="1.700" data-track-index="1"><span>화제가 된 적도 있죠</span></div><div class="clip cap" id="cap254" data-start="489.541" data-duration="2.220" data-track-index="1"><span>이 화면은 캡처해 두셨다가 장</span></div><div class="clip cap" id="cap255" data-start="491.761" data-duration="1.570" data-track-index="1"><span>보러 가기 전에 꺼내 보세요</span></div><div class="clip cap" id="cap256" data-start="493.831" data-duration="1.660" data-track-index="1"><span>매일의 경락가는 노량진수산</span></div><div class="clip cap" id="cap257" data-start="495.491" data-duration="1.860" data-track-index="1"><span>홈페이지의 수산물가격정보에서</span></div><div class="clip cap" id="cap258" data-start="497.351" data-duration="1.724" data-track-index="1"><span>누구나 볼 수 있습니다</span></div><div class="clip cap" id="cap259" data-start="502.675" data-duration="1.314" data-track-index="1"><span>다시 한 번 말씀드립니다</span></div><div class="clip cap" id="cap260" data-start="504.489" data-duration="1.660" data-track-index="1"><span>오늘 금액은 모두 노량진 도매</span></div><div class="clip cap" id="cap261" data-start="506.149" data-duration="2.360" data-track-index="1"><span>경락가로 계산한 값이고 가게</span></div><div class="clip cap" id="cap262" data-start="508.509" data-duration="1.380" data-track-index="1"><span>판매가와 초장집 비용은</span></div><div class="clip cap" id="cap263" data-start="509.889" data-duration="0.620" data-track-index="1"><span>따로입니다</span></div><div class="clip cap" id="cap264" data-start="511.010" data-duration="1.520" data-track-index="1"><span>작년 <b>12월</b> 숫자는 과거</span></div><div class="clip cap" id="cap265" data-start="512.530" data-duration="2.180" data-track-index="1"><span>데이터일 뿐 올해도 똑같이</span></div><div class="clip cap" id="cap266" data-start="514.710" data-duration="1.332" data-track-index="1"><span>흘러간다는 보장은 없어요</span></div><div class="clip cap" id="cap267" data-start="516.542" data-duration="1.320" data-track-index="1"><span>수율과 <b>1</b>인당 회 양도</span></div><div class="clip cap" id="cap268" data-start="517.862" data-duration="1.960" data-track-index="1"><span>자료마다 차이가 있으니</span></div><div class="clip cap" id="cap269" data-start="519.822" data-duration="1.660" data-track-index="1"><span>가게에서 손질 후 무게를 꼭</span></div><div class="clip cap" id="cap270" data-start="521.482" data-duration="0.642" data-track-index="1"><span>물어보세요</span></div><div class="clip cap" id="cap271" data-start="522.624" data-duration="2.090" data-track-index="1"><span>제 생각에는 <b>10</b>명 모임이라도</span></div><div class="clip cap" id="cap272" data-start="524.714" data-duration="1.870" data-track-index="1"><span>활어 <b>5kg</b> 안팎이면 충분하고</span></div><div class="clip cap" id="cap273" data-start="526.584" data-duration="2.230" data-track-index="1"><span>예산은 어떤 생선을 섞느냐가</span></div><div class="clip cap" id="cap274" data-start="528.814" data-duration="1.389" data-track-index="1"><span>가장 크게 가릅니다</span></div><div class="clip cap" id="cap275" data-start="530.703" data-duration="1.840" data-track-index="1"><span>모임 날짜가 정해지면 매주</span></div><div class="clip cap" id="cap276" data-start="532.543" data-duration="1.630" data-track-index="1"><span>토요일 올라오는 노량진 주간</span></div><div class="clip cap" id="cap277" data-start="534.173" data-duration="2.070" data-track-index="1"><span>시세에서 그 주 값을 확인해</span></div><div class="clip cap" id="cap278" data-start="536.243" data-duration="0.429" data-track-index="1"><span>보세요</span></div><div class="clip cap" id="cap279" data-start="537.172" data-duration="2.000" data-track-index="1"><span>구독해 두시면 장보기 전에</span></div><div class="clip cap" id="cap280" data-start="539.172" data-duration="1.580" data-track-index="1"><span>이번 주 시세를 받아보실 수</span></div><div class="clip cap" id="cap281" data-start="540.752" data-duration="0.579" data-track-index="1"><span>있습니다</span></div><div class="clip cap" id="cap282" data-start="541.831" data-duration="1.540" data-track-index="1"><span>여러분은 몇 명이서 연말 모임</span></div><div class="clip cap" id="cap283" data-start="543.371" data-duration="3.102" data-track-index="1"><span>하시나요? 댓글로 알려 주세요</span></div></div><script>const tl = gsap.timeline({ paused: true }); window.__timelines["captions"] = tl;</script></template>
