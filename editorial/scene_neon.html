<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>네온 장면</title>
<!--
  가로 롱폼(1920x1080) '네온 다크' 장면. 참고: 개발의 신(yWug2Z6LlTg, 5Gu0bom1lBE) → docs/스타일_라이브러리.md S2.
  window.render(t, dur) 순수함수. window.DATA = {kind, tag, at:[...], captions:[...], source}
  kind: hook | title | number | icons | flow | terminal | chat | list | warn | doc | cta | part | recap | agenda | bars
  실측: 바탕 #01030A 에 옅은 점·선 별자리, 강조 민트 #7CD1BB, 굵은 제목 글꼴, 왼쪽 위 민트 꼬리표, 오른쪽 위 채널 표식,
       5초 간격 큰 변화 60%(3~5초마다 그림이 바뀜). 원칙: 한 화면 한 생각, 말하는 순간 등장(팝), 끝 0.4초 정지.
-->
<style>
@font-face{font-family:H;src:url(/assets/fonts/BlackHanSans.ttf)}
@font-face{font-family:P;font-weight:500;src:url(/assets/fonts/Pretendard-Medium.otf)}
@font-face{font-family:P;font-weight:700;src:url(/assets/fonts/Pretendard-Bold.otf)}
@font-face{font-family:P;font-weight:800;src:url(/assets/fonts/Pretendard-ExtraBold.otf)}
:root{--bg:#01030A;--mint:#7CD1BB;--mint2:#3FE0B5;--acc-rgb:124,209,187;--on:#04120E;--ink:#F2F5F7;--sub:#8B97A3;--card:#0E1520;--line:rgba(var(--acc-rgb),.35);--warn:#FFB547;--red:#FF5D5D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:P,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#sky{position:absolute;inset:0}
#vig{position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 45%,transparent 40%,rgba(0,0,0,.7) 100%)}
#cam{position:absolute;inset:0;transform-origin:50% 48%}
#stage{position:absolute;inset:0}
#tag{position:absolute;left:44px;top:34px;padding:6px 18px;border-radius:999px;background:var(--mint);color:var(--on);font:800 24px P;display:none}
#brand{position:absolute;right:44px;top:34px;font:800 24px P;color:rgba(242,245,247,.85);letter-spacing:-.02em}
#cap{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:1600px;font:700 36px/1.3 P;color:#fff;white-space:nowrap;
  text-shadow:0 0 6px #000,0 2px 4px #000,0 0 14px rgba(0,0,0,.9);display:none}
#src{position:absolute;right:44px;bottom:16px;font:500 18px P;color:var(--sub)}
.an{position:absolute;will-change:transform,opacity,filter}
.big{font-family:H;letter-spacing:-.01em;line-height:1.12}
.m{color:var(--mint)}
.glow{text-shadow:0 0 18px rgba(var(--acc-rgb),.55),0 0 42px rgba(var(--acc-rgb),.25)}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14);border-radius:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.hl{color:var(--on);background:var(--mint);padding:0 .14em;border-radius:6px}
.fr-none{display:none}
#frame{position:absolute;inset:0;pointer-events:none}
.fr-border{display:block;inset:22px!important;border:2px solid rgba(var(--acc-rgb),.35);border-radius:28px}
.fr-bracket{display:block;background:
 linear-gradient(var(--mint),var(--mint)) left 14px top 14px/64px 4px no-repeat,linear-gradient(var(--mint),var(--mint)) left 14px top 14px/4px 64px no-repeat,
 linear-gradient(var(--mint),var(--mint)) right 14px top 14px/64px 4px no-repeat,linear-gradient(var(--mint),var(--mint)) right 14px top 14px/4px 64px no-repeat,
 linear-gradient(var(--mint),var(--mint)) left 14px bottom 14px/64px 4px no-repeat,linear-gradient(var(--mint),var(--mint)) left 14px bottom 14px/4px 64px no-repeat,
 linear-gradient(var(--mint),var(--mint)) right 14px bottom 14px/64px 4px no-repeat,linear-gradient(var(--mint),var(--mint)) right 14px bottom 14px/4px 64px no-repeat;opacity:.75}
.fr-bars{display:block;border-top:10px solid rgba(var(--acc-rgb),.9);box-shadow:inset 0 -64px 0 rgba(0,0,0,.35)}
</style></head><body>
<canvas id="sky" width="1920" height="1080"></canvas><div id="vig"></div>
<div id="cam"><div id="stage"></div></div>
<div id="frame"></div><div id="tag"></div><div id="brand"></div><div id="cap"></div><div id="src"></div>
<script>
'use strict';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>b<=a?(t>=a?1:0):clamp((t-a)/(b-a));
const out3=x=>1-(1-x)**3,io=x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2,back=x=>{const c=1.7;x-=1;return x*x*((c+1)*x+c)+1};
const D=()=>window.DATA||{};
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mk=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="m">$1</span>').replace(/\{\{(.+?)\}\}/g,'<span class="hl">$1</span>').replace(/\n/g,'<br>');
let ST=null;
function el(cls,html,css){const e=document.createElement('div');e.className='an '+(cls||'');e.innerHTML=html||'';if(css)Object.assign(e.style,css);ST.appendChild(e);return e}
function center(e){e.style.left='0';e.style.right='0';e.style.textAlign='center';return e}
// 등장: 팝(살짝 튀어나옴) / 흐림→선명
function pop(e,t,at,dur=.4,base=''){const p=P(t,at,at+dur);e.style.opacity=p>0?Math.min(1,p*3):0;e.style.transform=`${base} scale(${p>0?Math.max(.01,back(p)):.01})`}
function rise(e,t,at,dur=.5,dy=30,base=''){const p=out3(P(t,at,at+dur));e.style.opacity=p;e.style.filter=p<1?`blur(${(1-p)*10}px)`:'none';e.style.transform=LK.enter==='slide'?`${base} translateX(${(1-p)*dy*2}px)`:LK.enter==='zoom'?`${base} scale(${.9+.1*p})`:`${base} translateY(${(1-p)*dy}px)`}
const fmt=(v,dec)=>v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}),decs=v=>{const s=String(v);return s.includes('.')?s.split('.')[1].length:0};
// 별자리 바탕(시드 고정 → 같은 t 면 같은 그림)
let stars=null;
function sky(t){const c=document.getElementById('sky'),g=c.getContext('2d');if(!stars){let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
    stars=[...Array(150)].map(()=>({x:r()*1920,y:r()*1080,z:.3+r()*.7,p:r()*6.28}))}
  g.fillStyle=LK.bg;g.fillRect(0,0,1920,1080);if(LK.sky!=='stars'){skyAlt(g,t);return}const dx=t*6;
  const pts=stars.map(s=>({x:(s.x-dx*s.z+1920)%1920,y:s.y+Math.sin(t*.3+s.p)*6,z:s.z,p:s.p}));
  g.lineWidth=1;for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<120){g.strokeStyle=`rgba(${LK.rgb},${.10*(1-d/120)*a.z})`;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}}
  pts.forEach(a=>{g.fillStyle=`rgba(200,240,230,${.25+.35*a.z*(.6+.4*Math.sin(t*1.5+a.p))})`;g.beginPath();g.arc(a.x,a.y,1.1+a.z*1.2,0,6.29);g.fill()})}

// ── look(EDIT-13): 영상마다 바탕·강조색·밝기·바탕무늬·틀·카메라를 바꾼다. 대본 look: → d.look
let LK={bg:'#01030A',acc:'#7CD1BB',rgb:'124,209,187',sky:'stars',frame:'none',cam:'zoom',enter:'rise',bright:0},LKs=null;
const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)).join(',')};
function applyLook(lk){const k=JSON.stringify(lk||{});if(k===LKs)return;LKs=k;lk=lk||{};
  LK={...LK,...lk};LK.rgb=hex2rgb(LK.acc);const r=document.documentElement.style;
  r.setProperty('--bg',LK.bg);r.setProperty('--mint',LK.acc);r.setProperty('--mint2',lk.acc2||LK.acc);r.setProperty('--acc-rgb',LK.rgb);
  if(lk.card)r.setProperty('--card',lk.card);if(lk.on)r.setProperty('--on',lk.on);
  document.getElementById('vig').style.opacity=String(Math.max(0,1-(LK.bright||0)));   // 밝기: 가장자리 어둡기를 줄인다
  const f=document.getElementById('frame');f.className='fr-'+LK.frame}
function skyAlt(g,t){const R=LK.rgb;
  if(LK.sky==='grid'){g.lineWidth=1.2;const hz=520;for(let i=-24;i<=24;i++){g.strokeStyle=`rgba(${R},${.16-.004*Math.abs(i)})`;g.beginPath();g.moveTo(960+i*40,hz);g.lineTo(960+i*190,1080);g.stroke()}
    for(let j=0;j<14;j++){const z=((j+t*.5)%14)/14,y=hz+Math.pow(z,2.2)*560;g.strokeStyle=`rgba(${R},${.05+.18*z})`;g.beginPath();g.moveTo(0,y);g.lineTo(1920,y);g.stroke()}
    const gr=g.createLinearGradient(0,0,0,hz);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,`rgba(${R},.10)`);g.fillStyle=gr;g.fillRect(0,0,1920,hz);return}
  if(LK.sky==='dots'){const s=48,ox=(t*10)%s;for(let y=24;y<1080;y+=s)for(let x=-s;x<1920+s;x+=s){const w=.5+.5*Math.sin(x*.004+y*.006-t*1.2);
      g.fillStyle=`rgba(${R},${.05+.16*w})`;g.beginPath();g.arc(x+ox,y,1.6+1.6*w,0,6.29);g.fill()}return}
  if(LK.sky==='aurora'){[[.25,.3,640,.32],[.75,.35,720,.27],[.5,.85,840,.2]].forEach(([fx,fy,r,o],i)=>{const x=1920*fx+Math.sin(t*.25+i*2)*160,y=1080*fy+Math.cos(t*.2+i)*90;
      const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${R},${o})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,1920,1080)});return}}
function camMove(p,t){const c=LK.cam;if(c==='drift')return `translate(${-24+48*p}px,${Math.sin(t*.4)*6}px) scale(1.035)`;
  if(c==='tilt')return `scale(${1+.025*p}) rotate(${-.5+1*p}deg)`;if(c==='pull')return `scale(${1.045-.035*p})`;return `scale(${1+.03*p})`}

const K={};
K.hook={build(d){const l1=center(el('big glow',mk(d.line1),{top:'330px',fontSize:(d.size||118)+'px'}));
    const l2=d.line2?center(el('big',mk(d.line2),{top:(330+(d.size||118)*1.25)+'px',fontSize:(d.size2||d.size||118)+'px',color:d.fire?'#FF8A3D':'var(--mint)'})):null;
    const sm=d.small?center(el('',mk(d.small),{top:'250px',font:'700 40px P',color:'var(--sub)'})):null;return {l1,l2,sm}},
  draw(g,t,d,a){if(g.sm)rise(g.sm,t,a[0],.4,16);pop(g.l1,t,a[1]??a[0]+.15,.45);if(g.l2){const t2=a[2]??a[0]+.6;if(d.punch){const p=P(t,t2,t2+.35),sh=P(t,t2+.3,t2+.75);g.l2.style.opacity=p>0?1:0;g.l2.style.transform=`scale(${p>0?1+1.2*(1-out3(p)):.01}) translate(${sh>0&&sh<1?Math.sin(sh*40)*10*(1-sh):0}px,0)`;g.l2.style.filter=p>0&&p<1?`brightness(${1+1.5*(1-p)})`:'none'}else pop(g.l2,t,t2,.45);
      if(d.fx)_hookDraw(g,t,d,a);if(d.fire)g.l2.style.textShadow=`0 0 ${20+8*Math.sin(t*18)}px rgba(255,120,40,.8),0 0 60px rgba(255,60,0,.45)`}return {}}};
/* 시네마틱 인트로(2026-11-04 ego lite): 빛줄기 → 고리 → 제목 글자가 모이며 등장 → 빛 쓸기. at: [시작, 제목, 부제] */
K.intro={build(d){const ln=el('',``,{left:'0',right:'0',top:'538px',height:'4px',background:'linear-gradient(90deg,transparent,var(--mint2) 30%,#fff 50%,var(--mint2) 70%,transparent)',boxShadow:'0 0 30px var(--mint2),0 0 80px var(--mint)'});
    const ring=el('',`<svg width="520" height="520" viewBox="0 0 520 520"><circle cx="260" cy="260" r="240" fill="none" stroke="${LK.acc}" stroke-width="3" stroke-dasharray="1508" stroke-dashoffset="1508" style="filter:drop-shadow(0 0 12px #3FE0B5)"/></svg>`,{left:'700px',top:'280px'});
    const k=d.kicker?center(el('',mk(d.kicker),{top:'200px',font:'800 44px P',color:'var(--sub)',letterSpacing:'.3em'})):null;
    const ti=center(el('big glow',[...String(d.title||'')].map(c=>`<span style="display:inline-block">${c===' '?'&nbsp;':esc(c)}</span>`).join(''),{top:'420px',fontSize:(d.size||170)+'px'}));
    const sb=d.sub?center(el('',mk(d.sub),{top:'830px',font:'700 50px P',color:'var(--ink)'})):null;
    const fl=el('',``,{left:'-600px',top:'0',width:'420px',height:'1080px',background:'linear-gradient(100deg,transparent,rgba(190,255,235,.14),transparent)',filter:'blur(40px)',transform:'skewX(-18deg)',mixBlendMode:'screen'});
    return {ln,ring,k,ti,sb,fl}},
  draw(g,t,d,a){const t0=a[0]||0,t1=a[1]??t0+.9,t2=a[2]??t1+1;
    const pl=out3(P(t,t0,t0+.6));g.ln.style.opacity=pl*(1-P(t,t1,t1+.5));g.ln.style.transform=`scaleX(${pl})`;
    const c=g.ring.querySelector('circle');c.setAttribute('stroke-dashoffset',1508*(1-out3(P(t,t0+.3,t1+.4))));g.ring.style.opacity=1-.6*P(t,t1+.4,t1+1.2);
    g.ring.style.transform=`scale(${1+.08*out3(P(t,t1,t1+1.5))})`;
    [...g.ti.children].forEach((sp,i,arr)=>{const st=t1+i*.05,p=out3(P(t,st,st+.55)),off=(i-(arr.length-1)/2)*60*(1-p);
      sp.style.opacity=p;sp.style.transform=`translateX(${off}px) scale(${1.4-.4*p})`;sp.style.filter=p<1?`blur(${(1-p)*14}px)`:'none'});
    if(g.k)rise(g.k,t,t0+.2,.6,12);if(g.sb)rise(g.sb,t,t2,.5,18);
    const pf=P(t,t1+.6,t1+1.6);g.fl.style.opacity=pf>0&&pf<1?1:0;g.fl.style.transform=`translateX(${pf*3000}px) skewX(-18deg)`;
    const fx=Math.max(0,1-Math.abs(t-t1)/.25);document.getElementById('vig').style.background=fx>0?`radial-gradient(70% 70% at 50% 45%,rgba(var(--acc-rgb),${.18*fx}) 0%,transparent 40%,rgba(0,0,0,.7) 100%)`:'';return {}}};
/* ── 2026-11-04 깃허브 영상: 새 모션 4종(지루함 줄이기) ─────────────────────────── */
/* files: 지저분한 파일 이름이 쏟아져 쌓였다가(at[1..n]) → at[n+1]에 한 장으로 빨려 들어가 깔끔한 파일 하나. d.files, d.clean, d.label */
K.files={build(d){const fs=d.files||[],lb=d.label?center(el('big',mk(d.label),{top:'120px',fontSize:'72px'})):null;
    const cards=fs.map((f,i)=>{const r=((i*37)%11-5)*1.6;return el('glass',`<span style="color:#FFB547">▤</span>&nbsp; ${esc(f)}`,{left:(520+((i*53)%5-2)*80)+'px',top:(250+i*150)+'px',
      padding:'22px 40px',font:'800 64px P',whiteSpace:'nowrap',transform:`rotate(${r}deg)`,'--r':r})});
    const cl=d.clean?el('glass glow',`<span class="m">▣</span>&nbsp; ${mk(d.clean)}`,{left:'0',right:'0',margin:'0 auto',width:'fit-content',top:'470px',padding:'26px 50px',font:'800 60px P',border:'2px solid var(--mint)'}):null;
    return {lb,cards,cl}},
  draw(g,t,d,a){if(g.lb)rise(g.lb,t,a[0],.4,16);const n=g.cards.length,tc=a[n+1]??(a[n]??a[0]+n*.4)+1.2;
    g.cards.forEach((c,i)=>{const at=a[i+1]??a[0]+.3+i*.35,p=out3(P(t,at,at+.35)),q=io(P(t,tc,tc+.55)),r=c.style.getPropertyValue('--r');
      c.style.opacity=p*(1-q);c.style.transform=`translate(${(1-p)*-120+q*(700-parseFloat(c.style.left))}px,${(1-p)*-40+q*(470-parseFloat(c.style.top))}px) rotate(${r*(1-q)}deg) scale(${1-.6*q})`});
    if(g.cl){const p=P(t,tc+.4,tc+.8);g.cl.style.opacity=p>0?1:0;g.cl.style.transform=`scale(${p>0?Math.max(.01,back(p)):.01})`}return {}}};
/* timeline: 가로줄 위 저장점(커밋)이 하나씩 켜짐. d.points=[{label,sub}], d.branch={from,label}(선택: 아래 갈래). at[1..n] */
K.timeline={build(d){const ps=d.points||[],n=ps.length,x0=260,x1=1660,y=520,gap=n>1?(x1-x0)/(n-1):0;
    const lb=d.label?center(el('big',mk(d.label),{top:'150px',fontSize:'70px'})):null;
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',1920);s.setAttribute('height',1080);s.classList.add('an');s.style.left=0;s.style.top=0;ST.appendChild(s);
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');Object.entries({x1:x0,y1:y,x2:x1,y2:y,stroke:LK.acc,'stroke-width':6,'stroke-linecap':'round'}).forEach(([k,v])=>ln.setAttribute(k,v));s.appendChild(ln);
    let br=null;if(d.branch){const bx=x0+gap*(d.branch.from||1);br=document.createElementNS('http://www.w3.org/2000/svg','path');br.setAttribute('d',`M${bx},${y} C${bx+90},${y} ${bx+90},${y+170} ${bx+220},${y+170} L${bx+460},${y+170}`);
      br.setAttribute('stroke','#FFB547');br.setAttribute('stroke-width','6');br.setAttribute('fill','none');br.setAttribute('stroke-dasharray','900');s.appendChild(br)}
    const bl=d.branch?el('',mk(d.branch.label||'갈래'),{left:(x0+gap*(d.branch.from||1)+260)+'px',top:(y+190)+'px',font:'800 34px P',color:'#FFB547'}):null;
    const dots=ps.map((p,i)=>{const x=x0+i*gap;const c=el('',``,{left:(x-26)+'px',top:(y-26)+'px',width:'52px',height:'52px',borderRadius:'50%',background:'#0E1520',border:'6px solid var(--mint)',boxShadow:'0 0 24px rgba(63,224,181,.7)'});
      const l=el('',`<div style="font:800 38px P">${mk(p.label)}</div>${p.sub?`<div style="font:600 26px P;color:var(--sub);margin-top:6px">${mk(p.sub)}</div>`:''}`,{left:(x-150)+'px',width:'300px',top:(y-150)+'px',textAlign:'center'});return [c,l]});
    return {lb,ln,br,bl,dots}},
  draw(g,t,d,a){if(g.lb)rise(g.lb,t,a[0],.4,16);const n=g.dots.length;g.ln.setAttribute('stroke-dasharray','1400');g.ln.setAttribute('stroke-dashoffset',1400*(1-out3(P(t,a[0],a[0]+.8))));
    g.dots.forEach(([c,l],i)=>{const at=a[i+1]??a[0]+.5+i*.6;pop(c,t,at,.35);rise(l,t,at+.05,.4,14);const fl=Math.max(0,1-Math.abs(t-at-.15)/.3);c.style.background=fl>0?`rgba(63,224,181,${fl})`:'#0E1520'});
    if(g.br){const at=a[n+1]??(a[n]??a[0]+n*.6)+.5;g.br.setAttribute('stroke-dashoffset',900*(1-out3(P(t,at,at+.8))));if(g.bl)rise(g.bl,t,at+.5,.4,12)}return {}}};
/* split: 왼쪽·오른쪽 카드가 양옆에서 밀려 들어오고 가운데 VS 가 쾅. d.left={title,lines,glyph}, d.right={...}, d.vs. at: [0, 왼쪽, 오른쪽, VS] */

      {left:L+'px',top:T+'px',width:W+'px',height:H+'px',background:'rgba(10,14,22,.94)',overflow:'hidden'});

// score(2026-11-05 클로드 코드 vs 코덱스): 라운드 점수판. 왼쪽·오른쪽 이름, 항목마다 이긴 쪽 표시, 맨 아래 누적 점수.

K.score={build(d){const L=d.left||{},R=d.right||{},lc=L.color||'#FF8A3D',rc=R.color||'#5B8CFF';

let built=null,G=null;
function build(){const d=D();built=JSON.stringify(d);applyLook(d.look);ST=document.getElementById('stage');ST.innerHTML='';G=(K[d.kind]||K.hook).build(d);

window.render=function(t,dur){if(built!==JSON.stringify(D()))build();const d=D(),a=d.at&&d.at.length?d.at:[0],tr=t;t=Math.min(t,dur-.4);
