<title>훌라후프 졸라맨</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<style>
/* Layout: one sheet of sketch paper, the stick figure centered, controls underneath. Single light look by choice (black pen on paper). */
:root {
  --paper: #fdfcf7;
  --ink: #161616;
  --muted: #6b6a62;
  --line: #e4e1d4;
  --pink: #f0288c;
  --font-hand: "Gaegu", "Comic Sans MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-hand);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
h1 { margin: 0; font-size: 2rem; font-weight: 700; text-wrap: balance; }
canvas { width: min(100%, 520px); aspect-ratio: 700 / 760; max-width: 100%; height: auto; }
.controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: center; font-size: 1.25rem; }
button {
  font: inherit; font-weight: 700; color: var(--ink); background: var(--paper);
  border: 2.5px solid var(--ink); border-radius: 14px 10px 16px 9px; padding: 4px 18px; cursor: pointer;
}
button:focus-visible, input:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
label { display: flex; gap: 8px; align-items: center; }
input[type=range] { accent-color: var(--pink); width: 140px; }
</style>

<h1>빙글빙글 훌라후프</h1>
<canvas id="c" width="1400" height="1520" aria-label="훌라후프를 돌리는 졸라맨 애니메이션"></canvas>
<div class="controls">
  <button id="toggle" type="button">멈추기</button>
  <label for="speed">속도 <input id="speed" type="range" min="0.3" max="3" step="0.1" value="1.2"></label>
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const S = 2;
ctx.scale(S, S);
const INK = '#161616';
const COLORS = ['#ffeb3c', '#5abef0', '#f0288c', '#5abef0', '#6edc3c', '#f0288c', '#ffeb3c', '#f0288c'];

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v * f))));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function lighten(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.min(255, v + a));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function curve(p0, p1, p2) {
  ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.quadraticCurveTo(p1[0], p1[1], p2[0], p2[1]); ctx.stroke();
}

function hoopRuns(phase, cx, cy, front) {
  const ox = 30 * Math.cos(phase);
  const tilt = (7 * Math.PI / 180) * Math.sin(phase);
  const rx = 215, ry = 42, N = 240, seg = 2 * Math.PI / COLORS.length;
  const runs = []; let cur = [], curCol = null;
  for (let i = 0; i <= N; i++) {
    const t = 2 * Math.PI * i / N;
    const x = rx * Math.cos(t), y = ry * Math.sin(t);
    const px = cx + ox + x * Math.cos(tilt) - y * Math.sin(tilt);
    const py = cy + x * Math.sin(tilt) + y * Math.cos(tilt);
    if ((Math.sin(t) > 0) !== front) { if (cur.length) runs.push([curCol, cur]); cur = []; curCol = null; continue; }
    let k = Math.floor((((t - phase) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / seg) % COLORS.length;
    const col = COLORS[k];
    if (col !== curCol && cur.length) { cur.push([px, py]); runs.push([curCol, cur]); cur = []; }
    curCol = col; cur.push([px, py]);
  }
  if (cur.length) runs.push([curCol, cur]);
  return runs;
}
function drawHoop(phase, cx, cy, front) {
  const runs = hoopRuns(phase, cx, cy, front);
  const k = front ? 1 : 0.82;
  ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
  const passes = [[19, c => shade(c, k * 0.72), 0], [13, c => shade(c, k), 0], [3, c => lighten(c, front ? 80 : 40), -3]];
  for (const [w, colf, dy] of passes) {
    ctx.lineWidth = w;
    for (const [col, pts] of runs) {
      if (pts.length < 2) continue;
      ctx.strokeStyle = colf(col);
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1] + dy);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1] + dy);
      ctx.stroke();
    }
  }
}

function drawMan(phase, sway) {
  ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const hx = 350 + sway * 0.3, hy = 140 + 3 * Math.sin(phase * 2), r = 95;
  ctx.beginPath(); ctx.arc(hx, hy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx - 92, hy + 25); ctx.lineTo(hx - 80, hy + 38); ctx.stroke();
  const neck = [hx, hy + r], hip = [350 + sway, 520];
  curve(neck, [(neck[0] + hip[0]) / 2 + 4, 380], hip);
  const sh = [hx, 290];
  const wave = 14 * Math.sin(phase);
  curve(sh, [hx - 110, 250], [hx - 165 + wave * 0.4, 150 - wave]);
  curve(sh, [hx + 110, 250], [hx + 170 + wave * 0.4, 160 + wave]);
  curve(hip, [hip[0] - 60, 610], [245, 700]);
  curve(hip, [hip[0] + 50, 620], [455, 700]);
}

let phase = 0.6, running = true, last = performance.now();
const speedEl = document.getElementById('speed');
const btn = document.getElementById('toggle');
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { running = false; btn.textContent = '돌리기'; }
btn.addEventListener('click', () => { running = !running; btn.textContent = running ? '멈추기' : '돌리기'; last = performance.now(); });

function render() {
  ctx.fillStyle = '#fdfcf7'; ctx.fillRect(0, 0, 700, 760);
  const sway = -12 * Math.cos(phase);
  drawHoop(phase, 350 + sway, 450, false);
  drawMan(phase, sway);
  drawHoop(phase, 350 + sway, 450, true);
}
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (running) phase += dt * 2 * Math.PI * parseFloat(speedEl.value);
  render();
  requestAnimationFrame(loop);
}
render();
requestAnimationFrame(loop);
</script>
