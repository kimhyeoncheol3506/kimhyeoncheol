<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>쇼츠 장면</title>
<!--
  세로 쇼츠 장면 한 장(1080x1920). window.render(t, dur) 가 t초 순간의 화면을 그린다(순수함수).
  window.DATA = {kind, ...} 로 값을 받는다. kind: hook | number | list | reveal | cta
  스타일은 분석한 쇼츠(검정 바탕 + 노랑 강조 + 흰 글자 + 은은한 격자/비네팅)를 따르되 우리 것으로 재해석.
  스마트대디 원칙: 한 화면에 한 생각, 같은 효과 반복 금지, 끝 0.5초 정지, 숫자는 말하는 순간 0부터.
-->
<style>
@font-face{font-family:P;font-weight:500;src:url(fonts/Pretendard-Medium.otf)}
@font-face{font-family:P;font-weight:700;src:url(fonts/Pretendard-Bold.otf)}
@font-face{font-family:P;font-weight:800;src:url(fonts/Pretendard-ExtraBold.otf)}
@font-face{font-family:P;font-weight:900;src:url(fonts/Pretendard-Black.otf)}
:root{--bg:#0A0A0C;--y:#FFD23F;--ink:#F5F5F7;--sub:#9A9AA3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:P,'Malgun Gothic',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:0;background:
  radial-gradient(900px 700px at 50% 38%,rgba(255,210,63,.10),transparent 70%),
  radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.65) 100%),var(--bg)}
#grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1.5px,transparent 1.6px);background-size:48px 48px}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 70px}
.an{will-change:transform,opacity,filter}
.l1{font-size:96px;font-weight:900;line-height:1.18;letter-spacing:-.02em;word-break:keep-all}
.l2{font-size:96px;font-weight:900;line-height:1.18;letter-spacing:-.02em;color:var(--y);word-break:keep-all}
.small{font-size:50px;font-weight:700;color:var(--sub);margin-bottom:34px}
.stk{display:inline-block;background:#fff;color:#0A0A0C;padding:0 .18em .04em;border-radius:.12em;transform:rotate(-2.5deg);box-shadow:0 .1em .35em rgba(0,0,0,.5)}
.num{font-size:330px;font-weight:900;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:var(--y)}
.unit{font-size:120px;font-weight:800;color:var(--ink);margin-left:18px}
.bar{width:860px;height:26px;border-radius:13px;background:rgba(255,255,255,.08);margin-top:60px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:13px;background:var(--y);box-shadow:0 0 30px rgba(255,210,63,.6)}
.item{width:880px;display:flex;align-items:center;gap:30px;padding:30px 40px;margin:12px 0;border-radius:26px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);font-size:54px;font-weight:800;text-align:left}
.item b{flex:none;width:76px;height:76px;border-radius:50%;background:var(--y);color:#0A0A0C;font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center}
.tag{margin-top:46px;padding:14px 34px;border-radius:18px;background:#0A0A0C;border:3px solid var(--y);color:var(--y);font-size:46px;font-weight:800}
.src{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-size:30px;font-weight:500;color:rgba(255,255,255,.55)}
</style></head><body>
<div id="bg"></div><div id="grid"></div><div id="stage"></div><div class="src an" id="src"></div>
<script>
'use strict';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>b<=a?(t>=a?1:0):clamp((t-a)/(b-a));
const out3=x=>1-(1-x)**3, back=x=>{const c=1.70158;x-=1;return x*x*((c+1)*x+c)+1};
const D=()=>window.DATA||{};
// 등장: 흐림→선명 + 위로 28px (스마트대디 기본 등장). at=시작, 0.6초
function enter(el,t,at,dur=.6,rise=28){const p=out3(P(t,at,at+dur));el.style.opacity=p;el.style.transform=`translateY(${(1-p)*rise}px)`;el.style.filter=`blur(${(1-p)*12}px)`}
function pop(el,t,at,dur=.35){const p=P(t,at,at+dur);el.style.opacity=p>0?1:0;el.style.transform=`scale(${p>0?Math.max(.001,back(p)):.001}) rotate(-2deg)`}
const html=s=>String(s).replace(/\[(.+?)\]/g,'<span class="stk">$1</span>');
let built=null;
function build(){const d=D();const st=document.getElementById('stage');st.innerHTML='';built=JSON.stringify(d);
  const add=(cls,inner,tag='div')=>{const e=document.createElement(tag);e.className='an '+cls;e.innerHTML=inner;st.appendChild(e);return e};
  window.__e=[];
  if(d.kind==='hook'){window.__e=[add('small',html(d.small||'')),add('l1',html(d.line1||'')),add('l2',html(d.line2||''))]}
  if(d.kind==='number'){window.__e=[add('small',html(d.label||'')),add('num','<span id=nv>0</span>'+(d.unit?'<span class=unit>'+d.unit+'</span>':'')),add('bar','<i id=bf></i>'),add('small',html(d.sub||''))];window.__e[3].style.margin='54px 0 0'}
  if(d.kind==='list'){window.__e=[add('small',html(d.label||'')),...(d.items||[]).map((x,i)=>add('item','<b>'+(i+1)+'</b><span>'+html(x)+'</span>'))]}
  if(d.kind==='reveal'){window.__e=[add('small',html(d.small||'')),add('num',html(d.word||'')),add('tag',html(d.tag||''))];window.__e[1].style.fontSize=(d.size||260)+'px';window.__e[1].style.color='#0A0A0C';window.__e[1].style.background='var(--y)';window.__e[1].style.padding='10px 60px 24px';window.__e[1].style.borderRadius='40px'}
  document.getElementById('src').textContent=d.source?('출처: '+d.source):''}
window.render=function(t,dur){
  if(built!==JSON.stringify(D()))build();
  const d=D(),e=window.__e,ts=d.at||[];
  const freeze=dur-0.5; t=Math.min(t,freeze);            // 끝 0.5초는 완전히 멈춘다
  const slow=1+0.02*P(t,0,dur);                           // 화면 전체가 천천히 2% 다가간다
  document.getElementById('stage').style.transform=`scale(${slow})`;
  if(d.kind==='hook'){enter(e[0],t,ts[0]??0);enter(e[1],t,ts[1]??.25);enter(e[2],t,ts[2]??.9,.5)}
  if(d.kind==='number'){enter(e[0],t,ts[0]??0);const at=ts[1]??.5,roll=d.roll||1.2,p=out3(P(t,at,at+roll));
    enter(e[1],t,at,.5);const v=(d.from||0)+((d.to||0)-(d.from||0))*p;document.getElementById('nv').textContent=Math.round(v).toLocaleString('en-US');
    e[2].style.opacity=P(t,at,at+.4);document.getElementById('bf').style.width=(100*clamp((d.to||0)/(d.max||d.to||1))*p)+'%';enter(e[3],t,(ts[2]??at+roll));}
  if(d.kind==='list'){enter(e[0],t,ts[0]??0);(d.items||[]).forEach((_,i)=>{const at=ts[i+1]??(.6+i*.8);enter(e[i+1],t,at,.5);
      const cur=t>=at&&t<(ts[i+2]??1e9);e[i+1].style.borderColor=cur?'var(--y)':'rgba(255,255,255,.1)';e[i+1].style.background=cur?'rgba(255,210,63,.14)':'rgba(255,255,255,.06)';
      if(t<at)e[i+1].style.opacity=0})}
  if(d.kind==='reveal'){enter(e[0],t,ts[0]??0);pop(e[1],t,ts[1]??.4,.45);enter(e[2],t,ts[2]??1.1)}
  document.getElementById('src').style.opacity=P(t,.3,.8)
};
window.render(0,4);
</script></body></html>
