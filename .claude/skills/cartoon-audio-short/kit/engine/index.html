<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}
@font-face{font-family:"Black Han Sans";src:url(fonts/BlackHanSans.ttf)}
@font-face{font-family:"Pretendard";font-weight:700;src:url(fonts/Pretendard-Bold.otf)}
@font-face{font-family:"Pretendard";font-weight:900;src:url(fonts/Pretendard-Black.otf)}</style></head>
<body><canvas id="c"></canvas>
<script>window.addEventListener('error',e=>{window.err=String(e.message);console.log('ERR '+e.message)});
// 크기: ?w=1920&h=1080 (가로 16:9) — 기본은 세로 1080x1920
const q=new URLSearchParams(location.search);window.KIT_W=+(q.get('w')||1080);window.KIT_H=+(q.get('h')||1920);
const c=document.getElementById('c');c.width=KIT_W;c.height=KIT_H;
// 한글 폰트를 먼저 읽은 뒤 엔진을 띄운다(캔버스 글자가 대체 글꼴로 그려지지 않게)
Promise.all(['900 40px "Black Han Sans"','700 40px Pretendard','900 40px Pretendard'].map(f=>document.fonts.load(f,'가나다'))).finally(()=>import('./main.js'));
</script></body></html>
