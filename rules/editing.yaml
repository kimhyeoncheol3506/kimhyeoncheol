# 편집 규칙: 스마트대디 편집 스킬에서 배운 숫자 규칙(2026-10-22) 등
- id: EDIT-01
  scope: all
  text: 효과음은 분당 상한(롱폼 6개, 모션 쇼츠 24개) 이하로 쓴다.
  why: 스마트대디 - 214개를 넣어 "누가 봐도 너무 많다", 15초에 12개로 "다닥다닥"
  date: 2026-10-22
  enforce: {type: lint, config: rules.sfx_max_per_min, code: "facetube/build.py:rule_check"}
- id: EDIT-02
  scope: all
  text: 효과음 사이 간격은 0.35초 이상(숫자 카운트 tick 은 예외). 휙(whoosh)은 챕터 전환과 3장면에 1번만.
  why: 스마트대디 - "휙은 잦으면 안 된다"
  date: 2026-10-22
  enforce: {type: lint, config: rules.sfx_min_gap_sec, code: "facetube/build.py:thin_sfx"}
- id: EDIT-03
  scope: all
  text: 내레이션 속도는 6.8~8.6음절/초(기준 7.7).
  why: 스마트대디 - 6.4는 "너무 느리다", 8.4는 "정신없다"
  date: 2026-10-22
  enforce: {type: lint, config: rules.syllables_per_sec, code: "facetube/build.py:rule_check"}
- id: EDIT-04
  scope: longform
  text: 자막은 목소리 시작 +0.15초에 뜨고 말 끝 +0.2초까지 남긴다.
  why: 스마트대디 - "목소리는 1.0초인데 자막은 0.8초에 뜬다"
  date: 2026-10-22
  enforce: {type: lint, config: subtitle.start_delay, code: "facetube/build.py:build_timeline"}
- id: EDIT-06
  scope: all
  text: 같은 구도로 10초를 넘기지 않는다.
  why: 스마트대디 - "PPT처럼 카드만 나열"
  date: 2026-10-22
  enforce: {type: lint, config: rules.same_layout_max_sec, code: "facetube/build.py:rule_check"}
- id: EDIT-07
  scope: all
  text: 가짜 댓글·가짜 차트·꾸민 숫자 금지. 숫자 장면은 출처(source)가 있어야 한다.
  why: 스마트대디 - 가짜 차트는 AI 느낌
  date: 2026-10-22
  enforce: {type: lint, config: rules.no_fake_numbers, code: "facetube/build.py:rule_check"}
- id: EDIT-08
  scope: all
  text: 첫 20초 안에 영상이 답할 질문을 던진다.
  why: 스마트대디 - 초반 30초에 시청자가 남을지 떠날지 갈린다
  date: 2026-10-22
  enforce: {type: lint, config: rules.intro_question_by_sec, code: "facetube/build.py:rule_check"}
- id: EDIT-09
  scope: all
  text: 카드 끝 0.5초는 완전히 멈춰 편집 때 늘려 쓸 수 있게 한다.
  why: 스마트대디
  date: 2026-10-22
  enforce: {type: lint, config: rules.card_end_freeze_sec, code: "shorts/scene.html:freeze"}
- id: EDIT-10
  scope: all
  text: 최종 음량은 -14 LUFS 로 맞춘다(트루피크 -1.5 dB).
  why: 유튜브 기준, 스마트대디 규칙
  date: 2026-10-22
  enforce: {type: lint, config: audio.loudness_lufs, code: "facetube/audio.py:mix"}
- id: EDIT-11
  scope: all
  text: 모션 원칙 - 실제 자료가 주인공, 같은 효과 반복 금지, 한 화면에 한 생각, 항목은 말하는 순서대로 한 칸씩, 숫자는 말하는 순간 0부터.
  why: 스마트대디 모션 카드 원칙
  date: 2026-10-22
  enforce: {type: manual}
