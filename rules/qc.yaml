# 품질검수: 첫 요청 3번 "자막오타, 소리 끊김, 화면 멈춤, 개인정보를 확인하고 고친 다음 결과를 보고"
- id: QC-01
  scope: all
  text: 덩어리마다 TTS 직후 음성인식으로 받아적어 대본과 비교하고, 글자오류율이 0.18 을 넘으면 최대 5가지 변형으로 다시 만들어 가장 정확한 것을 고른다. 완성본에서도 다시 확인한다.
  why: 첫 요청 - 자막과 음성의 미스매치·단어 틀림을 잡을 것
  date: 2026-10-10
  enforce: {type: lint, config: qc.asr_cer_retry, code: "facetube/voice.py:say"}
- id: QC-02
  scope: all
  text: 내레이션 구간 안 0.9초 이상 무음은 '소리 끊김'으로 보고한다.
  why: 첫 요청 - 소리가 끊기는 곳
  date: 2026-10-10
  enforce: {type: lint, config: qc.max_silence_sec, code: "facetube/qc.py:narration_gaps"}
- id: QC-03
  scope: all
  text: 2초 이상 정지한 화면과 검은 화면은 '화면 멈춤'으로 보고한다.
  why: 첫 요청 - 화면이 멈추는 곳
  date: 2026-10-10
  enforce: {type: lint, config: qc.freeze_sec, code: "facetube/qc.py:detect_freeze"}
- id: QC-04
  scope: all
  text: 1초마다 화면을 글자 인식해 전화번호·주민번호·이메일·카드·계좌·차량번호·IP 가 보이면 해당 영역을 흐림 처리한다.
  why: 첫 요청 - 화면에 개인정보가 보이는 곳
  date: 2026-10-10
  enforce: {type: lint, config: qc.ocr_every_sec, code: "facetube/qc.py:blur_regions"}
- id: QC-05
  scope: all
  text: 자막 오타(맞춤법 사전·이중 공백·단어 반복·괄호 짝)는 대본 단계에서 자동 교정하고 보고서에 기록한다.
  why: 첫 요청 - 자막 오타
  date: 2026-10-10
  enforce: {type: lint, code: "facetube/textnorm.py:lint_subtitle"}
- id: QC-06
  scope: all
  text: 검수 결과(고친 것, 남은 위험, 사용한 출처)를 빠짐없이 보고한다. ⚠ 가 남은 채로 끝내지 않는다.
  why: 첫 요청 - 확인하고 고친 다음 결과를 보고
  date: 2026-10-10
  enforce: {type: lint, code: "facetube/qc.py:report_md"}
