# 인박스(feedback/inbox.jsonl)에서 규칙으로 바뀐 것
- id: VOICE-03
  scope: voice
  text: 에디토리얼(종이 인포그래픽) 롱폼의 목소리는 여의도여자(Voicebox, Qwen3 Sohee)만 쓴다. Voicebox 에 닿지 않으면 다른 목소리로 대체하지 않고 멈춘다. (캐릭터·쇼츠 기본은 VOICE-01 그대로)
  why: 이제 이영상에서 목소리는 "여의도여자"로만 사용할거야 다시 샘플 만들어봐 (2026-11-02)
  date: '2026-11-02'
  enforce:
    type: lint
    config: editorial.voice
    code: facetube/voice.py:_voicebox
- id: PROC-09
  scope: process
  text: 주제를 받으면 docs/스타일_라이브러리.md 에서 스타일(S1 paper·S2 neon·S3 screen)을 골라 만든다. 맞는 스타일이 없으면 만들지 않고 '또 다른 유튜브 영상 샘플을 올려줘'라고 요청한다.
  why: 주제를 던지면 니가 주제에 맞게 영상스타일을 변경해가며 만드는거야. 혹시 주제에 따른 영상스타일이 안맞으면 나에게 또 다른 유튜브 영상 샘플을 올려줘라고 요청해 (2026-11-02)
  date: '2026-11-02'
  enforce:
    type: manual
