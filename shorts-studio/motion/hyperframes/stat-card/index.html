<!doctype html>
<html lang="ko" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* 쇼츠 '여러분 생각은?' 투표 결과 카드: A vs B 막대 비교 (5초) */
      @font-face { font-family: "BlackHan"; src: url("BlackHanSans-Regular.ttf"); }
      @font-face { font-family: "Pretendard"; src: url("Pretendard-ExtraBold.otf"); }
      :root { --ground: #1b1430; --ground2: #3a1f5c; --ink: #ffffff; --a: #ff4d6d; --b: #3ddc97; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; background: linear-gradient(160deg, var(--ground), var(--ground2)); font-family: "Pretendard"; color: var(--ink); }
      #q { position: absolute; top: 520px; width: 100%; text-align: center; font-size: 84px; }
      .row { position: absolute; left: 110px; width: 860px; }
      .lab { font-size: 64px; margin-bottom: 18px; display: flex; justify-content: space-between; }
      .pct { font-family: "BlackHan"; font-size: 96px; }
      .track { width: 860px; height: 64px; border-radius: 32px; background: rgba(255,255,255,.14); overflow: hidden; }
      .fill { height: 100%; width: 0; border-radius: 32px; }
      #ra { top: 760px; } #rb { top: 1040px; }
      #ra .fill { background: var(--a); } #rb .fill { background: var(--b); }
      #ra .pct { color: var(--a); } #rb .pct { color: var(--b); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <h1 id="q" class="clip" data-start="0" data-duration="5" data-track-index="0">데이트 비용, 누가 낼까?</h1>
      <div id="ra" class="row clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="lab"><span>남자가 낸다</span><span class="pct" id="pa">0%</span></div>
        <div class="track"><div class="fill" id="fa"></div></div>
      </div>
      <div id="rb" class="row clip" data-start="0" data-duration="5" data-track-index="2">
        <div class="lab"><span>번갈아 낸다</span><span class="pct" id="pb">0%</span></div>
        <div class="track"><div class="fill" id="fb"></div></div>
      </div>
    </div>
    <script>
      const A = 38, B = 62;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#q", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo(".row", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, stagger: 0.2, ease: "power3.out" }, 0.5);
      const ca = { v: 0 }, cb = { v: 0 };
      tl.to("#fa", { width: (860 * A) / 100, duration: 1.6, ease: "power2.out" }, 1.0);
      tl.to("#fb", { width: (860 * B) / 100, duration: 1.6, ease: "power2.out" }, 1.0);
      tl.to(ca, { v: A, duration: 1.6, ease: "power2.out", onUpdate: () => (document.getElementById("pa").textContent = Math.round(ca.v) + "%") }, 1.0);
      tl.to(cb, { v: B, duration: 1.6, ease: "power2.out", onUpdate: () => (document.getElementById("pb").textContent = Math.round(cb.v) + "%") }, 1.0);
      tl.to("#rb", { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 2.8);
      tl.to("#root", { opacity: 0, duration: 0.3 }, 4.7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
