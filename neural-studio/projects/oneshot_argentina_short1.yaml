# 아르헨티나 경제 몰락 쇼츠 1 — 1989년 하이퍼인플레이션 (본편 oneshot_argentina 3장에서). 2026-11-13, 더빙·렌더 전(대본만).
# 숫자는 모두 본편 sources(BCRA 1989 연차보고서) facts 에서. 4,923%는 1989년 12월의 전년 12월 대비, 18%는 1989년 3월의 전월 대비.
slug: oneshot_argentina_short1
format: short
title: "1년 만에 100원이 5,000원? 1989년 아르헨티나 물가 4,923%"
summary: |
  아르헨티나 경제 몰락의 한 장면. 1989년 아르헨티나의 소비자물가는 1년 동안 4,923%(1989년 12월, 전년 12월 대비) 올랐습니다. 3월엔 한 달에만 18%.
  모자란 나랏돈을 돈을 찍어 메운 결과였습니다. 전체 이야기는 본편 「아르헨티나 경제 몰락 100년」에서.
tags: ["#아르헨티나경제몰락", "#하이퍼인플레이션", "#아르헨티나", "#인플레이션", "#쇼츠"]
voice: {backend: voicebox, name: 여의도여자, speed: 1.0}
bgm_mood: calm
topic: {kind: evergreen}
numbers_ok: ["1", "2", "12", "100", "5000"]   # 1=1년·한 달, 12=1989년 12월(기간 기준 표기), 100원→약 5,000원은 4,923% 상승을 원화로 바꿔 본 예시
sources:
  - id: c5_bcra89
    outlet: 아르헨티나 중앙은행(BCRA) 연차보고서 Memoria 1989 (PDF, 스캔본을 OCR로 읽음 · 1990년 부분 포함)
    title: Memoria Anual 1989
    date: 1990-01-01
    url: https://www.bcra.gob.ar/archivos/Pdfs/PublicacionesEstadisticas/Memorias/mem1989.pdf
    verified: true
    facts: ['1989', '1980', 750%, '750', 8.5%, '8.5', 18%, '18', 1989년 2월, 2월, 3월, '4,923%', '4,923', '5,386%', '5,386', 46.7%, '46.7', 6.2%, '6.2', 4.1%, '4.1', 24.4%, '24.4', 7월 8일, '8', '1990', '1,343.9%', '1,343.9', '1343.9', '5,000', '약 5,000']

beats:
  - role: hook
    say: "연초에 100원이던 물건이, 연말엔 [[5,000원]]. 실제로 있었던 일입니다."
    source: "BCRA 1989 연차보고서 · 물가 +4,923%를 원화로 바꾼 예시"
    scene: {kind: hook, small: "1989년 아르헨티나", line1: "100원이 1년 만에", line2: "[5,000원]"}

  - role: twist
    say: "1989년 아르헨티나의 한 해 물가 상승률은 [[4,923%]]였습니다."
    source: "BCRA, Memoria 1989 · 소비자물가 1989년 12월, 전년 12월 대비"
    scene: {kind: number, label: "1989년 소비자물가 상승률", to: 4923, unit: "%", sub: "1989년 12월 · [전년 12월 대비]", roll: 1.4}
    sync: {at: [0, "4,923%"]}

  - role: core
    say: "원인은 오래된 습관이었습니다. 정부의 모자란 돈을, 세금 대신 [[돈을 찍어서]] 메운 겁니다."
    source: "BCRA, Memoria 1989 · 공공부문 적자를 인플레이션으로 메운 만성적 상황"
    scene: {kind: reveal, small: "중앙은행 1989년 보고서", word: "돈 찍기", size: 220, tag: "적자를 [인플레이션]으로 메움"}
    sync: {at: [0, "돈을"]}

  - role: twist
    say: "3월엔 한 달에만 물가가 [[18%]] 올랐습니다. 1년이 아니라, 한 달입니다."
    source: "BCRA, Memoria 1989 · 소비자물가 1989년 3월, 전월 대비"
    scene: {kind: number, label: "1989년 3월, 한 달 물가 상승률", to: 18, unit: "%", sub: "[전월 대비] · 1~2월 평균은 8.5%", roll: 1.0}
    sync: {at: [0, "18%"]}

  - role: twist
    say: "가장 크게 잃은 사람은 [[현금과 월급]]만 가진 사람들이었습니다."
    scene: {kind: reveal, small: "누가 잃었나", word: "월급쟁이", size: 220, tag: "현금·예금·[월급]만 가진 사람"}
    sync: {at: [0, "현금과"]}

  - role: pov
    say: "제 생각에, 돈을 찍어 다 같이 부자가 되는 길은 없습니다. 계산서가 물가로 돌아올 뿐이죠."
    scene: {kind: hook, small: "내 관점", line1: "다 같이 부자는 없다", line2: "계산서는 [물가]로"}

  - role: todo
    say: "오늘 내 예금 금리와 물가 상승률을 나란히 적어 보세요."
    scene: {kind: list, label: "오늘 할 것", items: ["예금 금리 적기", "물가 상승률 [나란히] 적기"]}
    sync: {at: [0, "금리와", "물가"]}

  - role: end
    say: "전체 이야기는 본편 「아르헨티나 경제 몰락 100년」에서 보실 수 있어요."
    scene: {kind: hook, small: "본편에서 이어서", line1: "아르헨티나", line2: "[경제 몰락 100년]"}
