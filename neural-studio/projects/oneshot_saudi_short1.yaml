title: 사우디 석유 부자도 적자, 필요한 유가 98달러 vs 실제 80달러
summary: '사우디 석유로 사는 나라도 적자를 봅니다. IMF 추정으로 2024년 사우디가 적자를 안 보는 유가는 약 98달러였지만, 실제 브렌트유는 약 80달러였습니다.

  정부 수입의 약 60%가 석유였고, 2024년 적자는 약 1,156억 리얄(재무부 결산). 전체 이야기는 본편 「사우디 석유 부자의 가계부」에서.

  '
