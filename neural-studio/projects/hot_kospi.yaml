# 계산 코드: projects/_series_hot/calc_kospi.py (Yahoo Finance ^KS11 일별 종가 + 11/17 기사 종가 4,968.48)
# 계산 메모 (모두 지수 기준, 배당·수수료·세금 제외)
#  - 고점 대비: 4,968.48 / 9,114.55 - 1 = -45.49% → -45.5% (연합뉴스 보도치와 같음)
#  - 본전까지: 9,114.55 / 4,968.48 - 1 = +83.447% → +83.4%  (검증: 1/(1-0.455)-1 = 83.49%, 반올림한 45.5%로 넣으면 83.5%. 화면은 정확값 83.4%)
#  - 1,000만 원 × 4,968.48 / 9,114.55 = 545.1만 원 → 약 545만 원, 손실 약 455만 원
#  - 손실별 필요 상승률 1/(1-손실)-1: 10%→11.1%, 20%→25%, 30%→42.9%, 50%→100%
#  - 2025년 말 4,214.17 대비 +17.9%, 5월 말 8,476.15 대비 -41.4%
#  - 시가총액 7,449조 5,928억 - 4,076조 8,389억 = 3,372.8조 → 약 3,373조 원
#  - 과거 사례 (종가 기준, 고점→바닥, 고점 종가를 다시 넘은 첫날):
#      1997 외환위기 1997-06-17 792.29 → 1998-06-16 280.00 (-64.7%) · 일시매수 본전 1999-04-27 (1년 10개월) · 적립식 1998-11-20 (1년 5개월) · 최악 평가손실 -64.7% vs -47.7%
#      2000 IT버블 2000-01-04 1,059.04 → 2001-09-17 468.76 (-55.7%) · 2005-07-14 (5년 6개월) · 적립식 2001-11-23 (1년 11개월) · -55.7% vs -36.2%
#      2008 금융위기 2007-10-31 2,064.85 → 2008-10-24 938.75 (-54.5%) · 2011-01-03 (3년 2개월) · 적립식 2009-07-17 (1년 9개월) · -54.5% vs -44.8%
#      2020 코로나 2020-01-22 2,267.25 → 2020-03-19 1,457.64 (-35.7%) · 2020-08-04 (6개월) · 적립식 2020-04-17 (3개월)
#      2021 고점 2021-07-06 3,305.21 → 2022-09-30 2,155.49 (-34.8%) · 2025-09-10 (4년 2개월) · 적립식 2023-06-09 (1년 11개월)
#    적립식 = 고점 날 첫 매수 후 매달 같은 날짜(휴장이면 다음 거래일) 같은 금액, 바닥 이후 평가액 ≥ 넣은 돈 이 된 첫날.
#    일시매수 = 버티기(고점에 한 번에 사서 보유): 지수 기준으로 같은 값.
#  - 가정: 과거 '고점→본전' 기간을 2026-06-22 에 그대로 붙이면 2027년 1월(코로나)·2028년 5월(외환위기)·2029년 8월(금융위기)·2030년 8월(2021 고점)·2032년 1월(IT버블)
#  - 2026 적립식: 6/22 9,114.55 · 7/22 6,797.70 · 8/24 6,696.96 · 9/22 7,017.91 · 10/22 5,533.77 다섯 번 → 평균 단가 약 6,855, 11/17 평가 -27.5%, 본전까지 +38.0%
