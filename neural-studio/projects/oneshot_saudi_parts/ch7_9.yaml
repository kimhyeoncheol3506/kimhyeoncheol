scenes:
  # ═════════════ 7장 · 자원의 저주와 노르웨이의 길 ═════════════
  - say: "일곱 번째 이야기는 이상한 질문에서 시작합니다. 자원이 많은 나라가, 왜 오히려 어려워질까요? 사우디가 피하고 싶어 하는 함정이기도 합니다."
    chapter: "7장 · 자원의 저주와 노르웨이의 길"
    theme: dark
    scene: {kind: chapter, kicker: "7장", title: "자원의 저주와\n노르웨이의 길"}
    sync: {at: [0]}
  - say: "경제학은 이것을 자원의 저주라고 부릅니다. 놀랍게도 이런 생각은 아주 오래됐죠. 1711년 영국 잡지 스펙테이터는, 가장 풍요로운 나라에 가장 가난한 삶이 있다고 썼습니다."
    source: "Wikipedia 'Resource curse'"
    scene: {kind: doc, tag: "1711년", meta: "Wikipedia 'Resource curse'", title: "풍요 속의 [[가난]]", lines: ["영국 잡지 『스펙테이터』", "'가장 풍요로운 나라에 가장 가난한 삶'"]}
    sync: {at: [0, "자원의", "1711년"]}
  - say: "1993년 경제학자 리처드 오티가 자원의 저주라는 말을 처음 썼고, 1995년 삭스와 워너의 연구가 자원이 많을수록 성장이 느린 경향을 보여 주며 널리 알려졌습니다."
    source: "Wikipedia 'Resource curse'"
    scene: {kind: timeline, title: "[[자원의 저주]]라는 생각", years: [1711, 1993, 1995], events: [{year: 1711, text: "『스펙테이터』"}, {year: 1993, text: "오티, [[이름]]을 붙이다"}, {year: 1995, text: "삭스·워너 연구"}]}
    sync: {at: [0, "1993년", "1995년"]}
  - say: "복권에 당첨된 사람이 몇 년 뒤 오히려 더 힘들어졌다는 이야기와 닮았다는 비유가 자주 쓰입니다. 물론 이 비유에도 한계가 있다는 지적이 있죠."
    source: "Wikipedia 'Resource curse'"
    scene: {kind: quote, text: "[[복권 당첨자]]의 역설", by: "자원의 저주를 쉽게 말하면 · 비유의 한계도 있다"}
    sync: {at: [0, "복권에", "한계가"]}
  - say: "왜 그럴까요? 손쉬운 돈에 기대 다른 산업을 키우지 않거나, 자원값이 출렁일 때마다 나라 살림이 함께 흔들리거나, 그 돈을 둘러싼 다툼이 생기기 때문이라는 설명이 있습니다."
    source: "Wikipedia 'Resource curse'"
    scene: {"kind": "doc", "tag": "왜 저주가 되나", "meta": "Wikipedia 'Resource curse'", "title": "자원의 저주, [[세 갈래]]", "lines": ["손쉬운 돈 → 다른 산업 소홀", "자원값 출렁임 → [[살림도 출렁]]", "돈을 둘러싼 다툼"]}
    sync: {"at": [0, "손쉬운", "다툼이"]}
  - say: "1980년대 유가 폭락 때 베네수엘라는 경제가 줄고, 1982년부터 1986년까지 물가가 6에서 12% 사이로 올랐습니다. 1989년엔 카라카소라 불리는 큰 시위로 이어지죠."
    source: "Wikipedia '1980s oil glut'"
    theme: "dark"
    scene: {"kind": "stack", "logo": "VENEZUELA", "label": "1980년대 유가 폭락의 그늘", "cards": [{"meta": "1982~1986년", "text": "물가 6~12%"}, {"meta": "1989년", "text": "카라카소 [[시위]]"}, {"meta": "멕시코", "text": "1982년 [[외채 위기]]"}]}
    sync: {"at": [0, "베네수엘라는", "1989년엔"]}
  - say: "대표적인 설명 가운데 하나가 네덜란드병입니다. 1959년 네덜란드에서 거대한 흐로닝언 가스전이 발견된 뒤의 일이죠. 가스를 팔아 돈은 많이 벌었는데, 다른 산업이 힘을 잃기 시작했습니다."
    source: "Wikipedia 'Dutch disease'"
    theme: dark
    scene: {kind: photo, photo: "@slochteren_1963", name: "흐로닝언 가스전 작업", role: "1963년 · 네덜란드 슬로흐테런"}
    sync: {at: [0]}
  - say: "1977년 영국 이코노미스트는 가스 붐 뒤 네덜란드 제조업이 쇠퇴한 현상에 네덜란드병이라는 이름을 붙였습니다. 축복처럼 보였던 가스가 병의 이름이 된 겁니다."
    source: "Wikipedia 'Dutch disease'"
    scene: {kind: doc, tag: "1977년", meta: "Wikipedia 'Dutch disease'", title: "[[네덜란드병]]", lines: ["이름 붙인 곳: 『이코노미스트』", "가스 붐 → [[제조업 쇠퇴]]"]}
    sync: {at: [0, "1977년", "네덜란드병이라는"]}
  - say: "원리는 이렇습니다. 자원을 팔아 외화가 쏟아지면 돈의 값어치와 임금이 오릅니다. 그러면 다른 수출 산업이 가격 경쟁에서 밀려나죠."
    source: "Wikipedia 'Dutch disease'"
    theme: dark
    scene: {kind: stack, logo: "DUTCH DISEASE", label: "네덜란드병의 원리", cards: [{meta: "하나", text: "자원 수출 → [[외화]] 유입"}, {meta: "둘", text: "돈값 · 임금 상승"}, {meta: "셋", text: "제조업 · 농업 [[경쟁력 하락]]"}]}
    sync: {at: [0, "외화가", "임금이", "밀려나죠."]}
  - say: "회사에서 한 부서가 대박을 내면 사람과 돈이 모두 그 부서로 몰리고, 다른 부서는 사람을 못 구하는 것과 비슷합니다. 대박 부서가 꺾이는 날, 회사 전체가 휘청이죠."
    scene: {kind: quote, text: "잘나가는 부서로 [[모두]] 몰린다", by: "네덜란드병의 비유"}
    sync: {at: [0, "대박을", "다른"]}
  - say: "1982년 경제학자 코든과 니어리는 이를 호황 부문, 뒤처지는 부문, 그리고 서비스 같은 비교역 부문의 세 칸 모델로 정리했습니다. 자원 부문이 커질수록 나머지 칸이 쪼그라든다는 설명입니다."
    source: "Wikipedia 'Dutch disease'"
    scene: {kind: doc, tag: "1982년", meta: "코든 · 니어리 모델", title: "[[세 칸]]으로 본 경제", lines: ["호황 부문: 자원", "뒤처지는 부문: 제조업 · 농업", "비교역 부문: 서비스"]}
    sync: {at: [0, "코든과", "세 칸"]}
  - say: "사우디도 이 위험을 안고 있습니다. 비전 2030이 관광, 광업, 제조업을 키우려는 것도, 다른 부서를 키우려는 시도로 볼 수 있죠. 석유 부서 하나에 회사 전체를 걸지 않으려는 거죠."
    scene: {kind: quote, text: "다른 [[부서]]를 키워라", by: "사우디의 과제"}
    sync: {at: [0, "관광,", "다른"]}
  - say: "이제 반대편 사례로 가 보죠. 1969년 크리스마스이브 하루 전, 노르웨이는 북해에서 큰 유전을 찾았다고 발표합니다. 에코피스크였습니다."
    source: "NBIM 'The history'"
    theme: dark
    scene: {kind: photo, photo: "@ekofisk", name: "에코피스크 유전", role: "노르웨이 북해 · 1971년 생산 시작"}
    sync: {at: [0]}
  - say: "에코피스크는 당시 바다에서 찾은 유전 가운데 가장 큰 유전이었고, 1971년부터 생산을 시작합니다. 노르웨이는 이 돈을 어떻게 다룰지 오래 고민했습니다."
    source: "NBIM 'The history'"
    scene: {"kind": "quote", "text": "바다에서 찾은 [[가장 큰 유전]]", "by": "1969년 노르웨이 · 1971년 생산 시작"}
    sync: {"at": [0, "1971년부터", "고민했습니다."]}
  - say: "노르웨이 의회는 1990년 석유 기금을 세우는 법을 만들고, 1996년에야 첫 돈을 넣습니다. 그리고 모든 돈을 나라 밖에 투자하기로 하죠. 기름이 발견되고 이십 년이 지나서야 기금을 만든 거죠."
    source: "NBIM 'The history'"
    scene: {kind: doc, tag: "1990 · 1996", meta: "NBIM 'The history'", title: "기금의 [[원칙]]", lines: ["1990년: 정부석유기금 설립 법", "1996년: 첫 자금 이전", "모든 자산은 [[나라 밖]]에 투자"]}
    sync: {at: [0, "1990년", "1996년에야", "나라 밖에"]}
  - say: "2025년 말 이 기금의 가치는 21조 2,680억 크로네에 이릅니다. 2025년 한 해 수익률만 15.1%였죠. 세계에서 가장 큰 국부펀드 가운데 하나입니다."
    source: "NBIM 보도자료 (2026)"
    scene: {kind: bignum, label: "노르웨이 정부연기금(글로벌) 가치", from: 0, to: 21.27, unit: "조 크로네", color: navy, sub: "2025년 말 · 한 해 수익률 [[15.1%]]"}
    sync: {at: [0, "21조", "15.1%였죠."]}
  - say: "노르웨이는 석유를 땅속 통장에서 금융 통장으로 옮겨 담았습니다. 석유는 언젠가 끝나도, 통장은 남도록요. 기름이 다 떨어져도 이자는 계속 나오게 한 겁니다."
    scene: {kind: quote, text: "땅속 통장 → [[금융 통장]]", by: "노르웨이를 쉽게 말하면"}
    sync: {at: [0, "금융"]}
  - say: "핵심은 이 규칙입니다. 기금의 원금은 쓰지 않고, 기대되는 실질 수익만 쓴다. 지금은 그 수익을 연 3%로 잡고 있죠. 원금이 줄지 않으니 미래 세대도 같은 혜택을 받습니다."
    source: "노르웨이 정부 Norskpetroleum"
    theme: dark
    scene: {kind: flip, label: "노르웨이 재정 준칙 · [[기대 실질 수익]]", from: "100%", to: "3%"}
    sync: {at: [0, "3%로"]}
  - say: "또 경기가 나쁠 땐 더 쓰고, 좋을 땐 덜 쓰게 했습니다. 석유 돈이 한꺼번에 풀려 경제가 달아오르지 않게 막는 장치죠. 한마디로 석유 돈을 천천히, 고르게 쓰는 겁니다."
    source: "노르웨이 정부 Norskpetroleum"
    scene: {kind: doc, tag: "재정 준칙", meta: "노르웨이 정부 Norskpetroleum", title: "원금은 [[건드리지 않는다]]", lines: ["쓰는 돈 = 기대 실질 수익 (약 3%)", "불황엔 더, 호황엔 덜", "미래 세대도 혜택을 받도록"]}
    sync: {at: [0, "나쁠", "장치죠."]}
  - say: "기금은 처음부터 이런 목적이었습니다. 유가가 떨어지거나 본토 경제가 나빠질 때, 정부가 숨 쉴 틈을 갖도록 만든 장치였죠."
    source: "NBIM 'The history'"
    scene: {"kind": "quote", "text": "유가가 떨어질 때 [[숨 쉴 틈]]", "by": "노르웨이 석유 기금의 처음 목적"}
    sync: {"at": [0, "목적이었습니다.", "숨"]}
  - say: "투자 구성은 주식 71.3%, 채권 26.5%, 그리고 비상장 부동산과 재생에너지 인프라가 조금씩입니다. 전 세계 시장에 잘게 나눠 담은 바구니입니다."
    source: "NBIM 보도자료 (2026)"
    scene: {kind: waffle, title: "노르웨이 기금 투자 구성 (2025년 말)", sub: "비상장 부동산 1.7% · 재생에너지 인프라 0.4%", groups: [{label: "주식", value: 71.3, color: navy}, {label: "채권", value: 26.5, color: sky}]}
    sync: {at: [0, "71.3%,", "26.5%,"]}
  - say: "1998년 상반기엔 채권의 약 40%를 주식으로 바꿨고, 이후 부동산과 재생에너지 인프라로도 넓혀 갔습니다. 한 번에 바꾸지 않고, 천천히 바구니를 넓힌 거죠."
    theme: dark
    source: "NBIM 'The history'"
    scene: {"kind": "doc", "tag": "1998년 이후", "meta": "NBIM 'The history'", "title": "천천히 넓힌 [[바구니]]", "lines": ["1998년: 채권의 약 40%를 주식으로", "부동산 · 재생에너지 인프라 추가"]}
    sync: {"at": [0, "40%를", "천천히"]}
  - say: "2025년 한 해 투자 수익은 2조 3,620억 크로네였고, 크로네 강세로 깎인 몫을 반영하고도 기금 가치는 1조 5,260억 크로네 늘었습니다. 기금이 스스로 벌어들인 돈이 해마다 쌓이는 구조입니다."
    source: "NBIM 보도자료 (2026)"
    scene: {kind: bars, dir: v, title: "노르웨이 기금, 2025년 한 해", sub: "억 크로네 · 크로네 강세로 가치 일부 감소 반영", unit: "억", items: [{label: "투자 수익", value: 23620, color: navy}, {label: "가치 증가", value: 15260, color: sky}]}
    sync: {at: [0, "2조", "1조"]}
  - say: "사우디 PIF와 나란히 놓으면 차이가 뚜렷합니다. PIF는 자산의 약 80%가 국내에 있고, 노르웨이 기금은 전부 해외에 있습니다. 한쪽은 나라 안을 키우고, 한쪽은 나라 밖에 쌓는 겁니다."
    source: "PIF 2024 연차보고서 (Semafor) · NBIM"
