scenes:
  # ═════════════ 1장 ═════════════
  # ← long60/ch1_3.yaml 장면 0
  - say: "첫 번째 이야기는 석유가 나오기 전, 모래뿐이던 왕국에서 시작합니다. 지금의 화려한 리야드를 떠올리면 믿기 어려운 출발점이죠."
    chapter: "1장 · 사막의 우물에서 석유 무기로"
    theme: dark
    scene: {kind: chapter, kicker: "1장", title: "사막의 우물에서\n석유 무기로"}
    sync: {at: [0]}
  # ← long60/ch1_3.yaml 장면 8
  - say: "그리고 1938년 3월 3일. 약 1,440미터 깊이에서 마침내 상업성 있는 기름이 솟구칩니다. 첫 시추를 시작한 지 몇 해 만에, 드디어 기다리던 순간이 온 겁니다."
    source: "Wikipedia 'Dammam No. 7'"
    theme: dark
    scene: {kind: photo, photo: "@dammam7_1938b", name: "1938년 3월 3일, 담맘 7호정", role: "약 1,440m 깊이에서 터진 첫 상업 유전"}
    sync: {at: [0]}
  # ← long60/ch1_3.yaml 장면 9
  # ← long60/ch1_3.yaml 장면 10
  - say: "여섯 번 실패한 뒤 일곱 번째에 터진 셈입니다. 창업으로 치면, 통장이 바닥나기 직전에 첫 매출이 난 순간이죠. 포기했다면 이 이야기는 없었을 겁니다."
    scene: {kind: quote, text: "여섯 번의 실패, [[일곱 번째]]의 성공", by: "담맘 7호정이 남긴 이야기"}
    sync: {at: [0, "일곱", "첫 매출이"]}
  # ← long60/ch1_3.yaml 장면 49
  - say: "미국 주유소엔 '기름 없음' 팻말이 걸렸습니다. 1973년 가을, 미국 오리건주의 모습입니다. 기름을 넣으려는 차들이 길게 줄을 서는 일이 흔해졌습니다."
    source: "미국 국립기록관리청(NARA) 사진 설명"
    theme: dark
    scene: {kind: photo, photo: "@no_gas_1973", name: "'기름 없음'", role: "1973년 가을 · 미국 오리건주 주유소"}
    sync: {at: [0]}
  # ← long60/ch1_3.yaml 장면 51
  - say: "1974년 3월 금수가 풀렸을 때, 국제 유가는 배럴당 3달러에서 12달러 가까이로, 약 300% 올라 있었습니다. 반년도 안 되는 사이에 기름값이 네 배 가까이 뛴 겁니다."
    source: "Wikipedia '1973 oil crisis'"
    scene: {kind: bignum, label: "1973~1974년 국제 유가 [[상승률]]", from: 0, to: 300, unit: "%", color: red, sub: "배럴당 약 3달러 → [[약 12달러]]"}
    sync: {at: [0, "300%"]}
  # ← long60/ch1_3.yaml 장면 56
  # ← long60/ch1_3.yaml 장면 69
  - say: "하지만 거꾸로도 성립합니다. 석유에만 기대는 나라는 석유값에 목줄이 잡히거든요. 그 이야기는 오일머니의 흐름에서 이어집니다."
    theme: dark
    scene: {kind: stack, logo: "LESSON", label: "내 돈으로 바꾸면", cards: [{meta: "강점", text: "대체 불가능한 [[기술]]"}, {meta: "약점", text: "하나의 수입원에 [[목줄]]"}]}
    sync: {at: [0, "거꾸로도", "목줄이"]}
  # ═════════════ 2장 ═════════════
  - say: "두 번째 이야기는 나라의 가계부입니다. 석유로 번 돈이 얼마나 들어오고 나가는지, 그리고 기름값이 흔들리면 살림이 어떻게 되는지 보겠습니다."
    chapter: "2장 · 나라의 가계부와 유가 롤러코스터"
    theme: dark
    scene: {kind: chapter, kicker: "2장", title: "나라의 가계부와\n유가 롤러코스터"}
    sync: {at: [0]}
  # ← long60/ch1_3.yaml 장면 73
  - say: "이제 나라의 가계부입니다. 2024년 사우디 정부의 총수입은 약 1조 2,590억 리얄이었습니다. 이 돈이 어디서 들어오는지 쪼개 보면 이 나라의 체질이 보입니다."
    source: "사우디 재무부 2024 결산 (Argaam 보도)"
    scene: {kind: bignum, label: "2024년 사우디 정부 [[총수입]]", from: 0, to: 1.26, unit: "조 리얄", color: navy, sub: "약 1조 2,590억 리얄 · 재무부 결산"}
    sync: {at: [0, "1조"]}
  # ← long60/ch1_3.yaml 장면 74
  - say: "그중 석유 수입은 약 7,566억 리얄, 석유가 아닌 수입은 약 5,025억 리얄. 석유가 약 60%를 채웁니다."
    theme: dark
    source: "사우디 재무부 2024 결산 (Argaam 보도)"
    scene: {kind: pie, title: "2024년 정부 수입 구성", sub: "사우디 재무부 결산", items: [{label: "석유 수입 · 약 7,566억 리얄", value: 60, color: red}, {label: "비석유 수입 · 약 5,025억 리얄", value: 40, color: sky}]}
    sync: {at: [0, "7,566억", "5,025억"]}
  - say: "재무부는 석유 수입이 예상보다 많았던 이유로 아람코의 성과 연동 배당을 꼽았습니다."
    scene: {kind: quote, text: "예상보다 많았던 석유 수입, 이유는 [[아람코 배당]]", by: "사우디 재무부 · 2024년 결산"}
    sync: {at: [0, "배당을"]}
  # ← long60/ch1_3.yaml 장면 76
  - say: "반면 지출은 약 1조 3,700억 리얄이었습니다. 그래서 2024년엔 약 1,156억 리얄의 적자가 났죠. 유가가 그리 나쁘지 않았던 해에도 쓰는 돈이 버는 돈보다 많았던 겁니다."
    source: "사우디 재무부 2024 결산 (Argaam 보도)"
    scene: {kind: bars, dir: v, title: "2024년 사우디 정부 재정", sub: "재무부 결산 · 억 리얄", unit: "억", items: [{label: "총수입", value: 12590, color: navy}, {label: "총지출", value: 13700, color: pink}, {label: "적자", value: 1156, color: red}]}
    sync: {at: [0, "1조", "적자가"]}
  # ← long60/ch4_6.yaml 장면 11
  - say: "브렌트유 연평균 가격은 2013년 약 109달러에서 2014년 99달러, 2015년 53달러, 2016년엔 45달러까지 내려갑니다."
    source: "IMF 1차 상품 가격 (FRED)"
    scene: {kind: bars, dir: v, title: "브렌트유 연평균 가격", sub: "배럴당 달러 · IMF 1차 상품 가격", unit: "달러", items: [{label: "2013년", value: 109, color: navy}, {label: "2014년", value: 99, color: navy}, {label: "2015년", value: 53, color: pink}, {label: "2016년", value: 45, color: red}]}
    sync: {at: [0, "109달러에서", "99달러,", "53달러,", "45달러까지"]}
  - say: "2년 사이에 기름값이 절반 아래로 떨어진 겁니다."
    theme: dark
    scene: {kind: flip, label: "브렌트유 연평균, 2년 사이 [[절반 아래]]로", from: "109달러", to: "45달러"}
    sync: {at: [0, "절반"]}
  # ← long60/ch4_6.yaml 장면 14
  # ← long60/ch4_6.yaml 장면 16
  - say: "여기서 꼭 알아야 할 숫자가 있습니다. 나라 살림이 적자도 흑자도 아니게 되는 유가, 재정 균형 유가입니다. 산유국 살림을 읽는 가장 중요한 잣대죠."
    theme: dark
    scene: {kind: flip, label: "재정 균형 유가 · 2025년 [[IMF 추정]]", from: "$??", to: "$91"}
    sync: {at: [0, "재정"]}
  # ← long60/ch4_6.yaml 장면 17
  - say: "개인으로 치면, 한 달에 최소 이만큼은 벌어야 적자가 안 난다는 손익분기 월급입니다. 생활비가 클수록 이 기준선도 높아지겠죠."
    scene: {kind: quote, text: "적자가 안 나는 [[최소 월급]]", by: "재정 균형 유가를 쉽게 말하면"}
    sync: {at: [0, "손익분기"]}
  # ← long60/ch4_6.yaml 장면 18
  - say: "국제통화기금의 추정으로 보면, 2014년 이후 사우디의 재정 균형 유가는 대체로 배럴당 80에서 100달러 사이였습니다. 실제 유가는 그보다 낮은 해가 많았죠."
    source: "IMF 지역경제전망 추정 (FRED) · IMF 브렌트유 가격"
    scene: {kind: line, title: "브렌트유 vs [[재정 균형 유가]]", sub: "배럴당 달러 · 균형 유가는 IMF 추정, 2025년은 전망", x: [2014, 2017, 2020, 2022, 2025], ymax: 120, series: [{label: "균형 유가 (IMF 추정)", color: red, points: [[2014, 106], [2015, 94], [2016, 87], [2017, 84], [2018, 89], [2019, 82], [2020, 76], [2021, 84], [2022, 88], [2023, 95], [2024, 98], [2025, 91]]}, {label: "브렌트유", color: navy, points: [[2014, 99], [2015, 53], [2016, 45], [2017, 55], [2018, 72], [2019, 64], [2020, 43], [2021, 71], [2022, 99], [2023, 82], [2024, 80], [2025, 68]]}]}
    sync: {at: [0, "국제통화기금의", "실제"]}
  # ← long60/ch4_6.yaml 장면 19
  - say: "2022년엔 브렌트유가 약 99달러로 균형 유가 약 88달러를 넘었습니다."
    source: "IMF 추정 (FRED)"
    scene: {kind: bars, dir: v, title: "2022년, 유가가 [[균형 유가]]를 넘은 해", sub: "배럴당 달러 · IMF 추정", unit: "달러", items: [{label: "브렌트유", value: 99, color: navy}, {label: "균형 유가", value: 88, color: sky}]}
    sync: {at: [0, "99달러로", "88달러를"]}
  - say: "하지만 2024년엔 균형 유가 약 98달러에 실제는 약 80달러였죠. 그래서 2024년에도 재정은 적자였습니다."
    source: "IMF 추정 (FRED)"
    scene: {kind: doc, tag: "IMF 추정", meta: "FRED · IMF 지역경제전망", title: "넘은 해와 [[못 넘은 해]]", lines: ["2022년: 브렌트 약 99달러 > 균형 약 88달러", "2024년: 브렌트 약 80달러 < 균형 약 98달러"]}
    sync: {at: [0, "2024년엔", "적자였습니다."]}
  # ← long60/ch4_6.yaml 장면 24
