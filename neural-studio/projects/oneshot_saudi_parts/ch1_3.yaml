scenes:
  # ═════════════ 1장 · 모래 아래의 검은 금 ═════════════
  - say: "첫 번째 이야기는 석유가 나오기 전, 모래뿐이던 왕국에서 시작합니다. 지금의 화려한 리야드를 떠올리면 믿기 어려운 출발점이죠."
    chapter: "1장 · 모래 아래의 검은 금"
    theme: dark
    scene: {kind: chapter, kicker: "1장", title: "모래 아래의\n검은 금"}
    sync: {at: [0]}
  - say: "1930년대까지 이 땅의 경제는 자급자족에 가까웠습니다. 끝없는 모래 언덕 아래 무엇이 잠들어 있는지, 아무도 확신하지 못했죠. 바로 그 모래 밑에 세계 최대급 유전이 있었습니다."
    source: "Wikipedia 'Economy of Saudi Arabia'"
    theme: dark
    scene: {kind: photo, photo: "@rub_al_khali", name: "룹알할리 사막", role: "아라비아반도 남부 · 세계 최대의 모래사막"}
    sync: {at: [0]}
  - say: "그런데 1932년, 바다 건너 섬나라 바레인에서 석유가 발견됩니다. 같은 지층이라면, 건너편 사막에도 있지 않을까요? 이 단순한 질문이 모든 것의 시작이었습니다."
    source: "Wikipedia 'Dammam No. 7'"
    scene: {kind: quote, text: "바다 건너 바레인에서 [[석유]]가 나왔다", by: "1932년"}
    sync: {at: [0, "바레인에서", "건너편"]}
  - say: "이듬해인 1933년, 사우디 정부는 미국 스탠더드오일 오브 캘리포니아, 줄여서 소칼에 석유를 찾을 권리를 내줍니다. 경쟁하던 이라크석유회사를 제치고서였죠."
    source: "Wikipedia 'Saudi Aramco'"
    scene: {kind: doc, tag: "1933년", meta: "사우디 정부 ↔ 소칼(SoCal)", title: "석유 탐사 [[양허 계약]]", lines: ["상대: 스탠더드오일 오브 캘리포니아", "탐사를 맡은 자회사: [[카속(CASOC)]]", "경쟁자 이라크석유회사를 제치고"]}
    sync: {at: [0, "소칼에", "이라크석유회사를"]}
  - say: "양허 계약을 쉽게 말하면, 땅 주인이 '우리 땅을 파 봐도 좋다, 대신 나오면 나눠 갖자'고 허락하는 약속입니다. 땅 주인은 돈 없이 기회를 얻고, 회사는 위험을 지는 대신 이익을 노리는 거래죠."
    scene: {kind: quote, text: "땅을 파도 좋다, 나오면 [[나눠 갖자]]", by: "양허 계약을 쉽게 말하면"}
    sync: {at: [0, "나눠"]}
  - say: "하지만 몇 년을 파도 쓸 만한 석유는 나오지 않았습니다. 1936년엔 텍사코가 지분 절반을 사들여 위험을 함께 나눠 졌습니다. 투자자에게는 돈만 들어가고 아무것도 나오지 않는 시간이었죠."
    source: "Wikipedia 'Saudi Aramco' · 'Dammam No. 7'"
    theme: dark
    scene: {kind: stack, logo: "CASOC", label: "빈 우물의 시간", cards: [{meta: "1933년", text: "탐사 시작"}, {meta: "1936년", text: "텍사코가 지분 [[50%]] 인수"}, {meta: "담맘 1~6호정", text: "[[상업성 없음]]"}]}
    sync: {at: [0, "나오지", "텍사코가"]}
  - say: "1937년 11월, 회사는 다른 시추를 모두 멈추고 한 우물에만 힘을 모읍니다. 담맘 7호정. 이미 바레인 유층보다 두 배나 깊이 판 곳이었죠. 말 그대로 마지막 승부였습니다."
    source: "Wikipedia 'Dammam No. 7'"
    scene: {kind: doc, tag: "1937년 11월", meta: "Wikipedia 'Dammam No. 7'", title: "모든 힘을 [[7호정]] 하나에", lines: ["다른 시추는 모두 중단", "바레인 유층의 [[두 배]] 깊이까지"]}
    sync: {at: [0, "담맘", "두 배나"]}
  - say: "현장을 이끈 미국 지질학자 맥스 스타이네키는 더 깊이 파자고 고집했습니다. 그 곁엔 베두인 출신 카미스 빈 림산이 있었죠. 남의 기술과 현지의 지식이 함께 움직인 셈입니다."
    source: "Wikipedia 'Dammam No. 7'"
    scene: {kind: person, role: "수석 지질학자", name: "맥스 스타이네키", quote: "실패한 우물 앞에서 [[더 깊이]] 파자고 한 사람"}
    sync: {at: [0, "맥스", "카미스"]}
  - say: "그리고 1938년 3월 3일. 약 1,440미터 깊이에서 마침내 상업성 있는 기름이 솟구칩니다. 첫 시추를 시작한 지 몇 해 만에, 드디어 기다리던 순간이 온 겁니다."
    source: "Wikipedia 'Dammam No. 7'"
    theme: dark
    scene: {kind: photo, photo: "@dammam7_1938b", name: "1938년 3월 3일, 담맘 7호정", role: "약 1,440m 깊이에서 터진 첫 상업 유전"}
    sync: {at: [0]}
  - say: "첫날 뽑아낸 양은 1,585배럴. 엿새 뒤에는 하루 3,810배럴로 늘었습니다. 사막의 우물 하나가 단숨에 나라의 미래를 바꿔 놓기 시작한 거죠. 그해 10월, 담맘 유전은 상업성이 확인됩니다."
    source: "Wikipedia 'Dammam No. 7'"
    scene: {kind: bignum, label: "담맘 7호정, [[첫날]] 생산량", to: 1585, unit: "배럴", color: navy, sub: "엿새 뒤 하루 [[3,810배럴]]"}
    sync: {at: [0, "1,585배럴.", "3,810배럴로"]}
  - say: "여섯 번 실패한 뒤 일곱 번째에 터진 셈입니다. 창업으로 치면, 통장이 바닥나기 직전에 첫 매출이 난 순간이죠. 포기했다면 이 이야기는 없었을 겁니다."
    scene: {kind: quote, text: "여섯 번의 실패, [[일곱 번째]]의 성공", by: "담맘 7호정이 남긴 이야기"}
    sync: {at: [0, "일곱", "첫 매출이"]}
  - say: "이 우물은 1982년 문을 닫을 때까지 3,200만 배럴이 넘는 기름을 뽑았습니다. 하루 평균 1,600배럴꼴이죠. 지금은 번영의 우물이라는 이름이 붙어 있습니다."
    source: "Wikipedia 'Dammam No. 7'"
    scene: {kind: doc, tag: "1938~1982", meta: "Wikipedia 'Dammam No. 7'", title: "[[번영의 우물]]", lines: ["누적 생산 [[3,200만 배럴]] 이상", "하루 평균 약 1,600배럴", "1999년 '번영의 우물'로 명명"]}
    sync: {at: [0, "3,200만", "1,600배럴꼴이죠.", "번영의"]}
  - say: "1944년 1월, 회사 이름도 바뀝니다. 캘리포니아 아라비안 스탠더드 오일에서 아라비안 아메리칸 오일 컴퍼니로. 줄여서 아람코입니다."
    source: "Wikipedia 'Saudi Aramco'"
    theme: dark
    scene: {kind: flip, label: "1944년 1월 31일, [[새 이름]]", from: "CASOC", to: "ARAMCO"}
    sync: {at: [0, "아람코입니다."]}
  - say: "1945년 2월, 미국 루스벨트 대통령과 압둘아지즈 국왕이 이집트 그레이트비터 호수에 뜬 군함 위에서 만납니다. 전쟁이 끝나 가던 무렵, 석유의 가치는 그 어느 때보다 높았습니다."
    source: "미 육군 통신대 사진(USA-C-545) 설명"
    theme: dark
    scene: {kind: photo, photo: "@quincy_1945", name: "USS 퀸시함 위의 회담", role: "1945년 2월 14일 · 이집트 그레이트비터 호수"}
    sync: {at: [0]}
  - say: "이 자리에서 무엇을 약속했는지는 기록과 해석이 엇갈립니다. 분명한 건, 이 무렵부터 사우디 석유가 세계 정치의 무대에 올랐다는 점이죠."
    scene: {kind: quote, text: "석유가 [[세계 정치]]의 무대에 오르다", by: "1945년의 의미 · 해석은 엇갈린다"}
    sync: {at: [0, "세계"]}
  - say: "1947년엔 훗날 엑슨과 모빌이 되는 두 회사가 지분 30%와 10%를 사들입니다. 미국 석유 회사 네 곳이 아람코를 나눠 가진 거죠. 사우디 땅의 석유를 미국 대기업들이 함께 개발하는 구조가 굳어진 겁니다."
    source: "Wikipedia 'Saudi Aramco'"
