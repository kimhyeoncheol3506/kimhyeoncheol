    scene: {kind: doc, tag: "이 영상의 약속", meta: "출처는 화면 오른쪽 아래 · 전체 목록은 설명란", title: "모든 숫자에 [[출처]]", lines: ["발표된 [[계획]]과 확인된 [[실제]]를 나누기", "전망 · 추정은 그렇다고 말하기", "정치 이슈는 경제 맥락에서 사실만"]}
