scenes:
  # ═════════════ 4장 · 유가의 롤러코스터 ═════════════
  - say: "네 번째 이야기는 석유 나라가 가장 두려워하는 것, 기름값의 오르내림입니다. 이 나라의 살림이 왜 늘 조마조마한지 알 수 있는 대목이죠."
    chapter: "4장 · 유가의 롤러코스터"
    theme: dark
    scene: {kind: chapter, kicker: "4장", title: "유가의\n롤러코스터"}
    sync: {at: [0]}
  - say: "월급이 어떤 해엔 두 배가 됐다가 어떤 해엔 반 토막 난다면, 살림을 어떻게 꾸려야 할까요? 산유국이 늘 겪는 일입니다. 계획을 세우기조차 어렵겠죠."
    scene: {kind: quote, text: "월급이 [[반 토막]] 나는 집", by: "4장의 질문"}
    sync: {at: [0, "반", "산유국이"]}
  - say: "1980년 유가는 배럴당 35달러를 넘으며 정점을 찍습니다. 그런데 비싼 기름값은 소비국들을 바꿔 놓았죠. 아끼고, 다른 연료로 바꾸고, 다른 곳에서 기름을 찾았습니다."
    source: "Wikipedia '1980s oil glut'"
    scene: {kind: doc, tag: "1980년대", meta: "Wikipedia '1980s oil glut'", title: "비싼 기름이 부른 [[반격]]", lines: ["에너지 절약 · 연료 전환", "북해 · 알래스카 · 시베리아 유전 개발", "오펙 밖 산유국의 생산 증가"]}
    sync: {at: [0, "35달러를", "아끼고,"]}
  - say: "사우디는 값을 지키려 생산을 줄입니다. 1981년 하루 약 1,000만 배럴이던 생산은 1985년 약 350만 배럴까지 떨어졌죠. 수입이 줄어드는 걸 감수하며 버틴 겁니다."
    source: "Wikipedia '1980s oil glut'"
    scene: {kind: bars, dir: v, title: "사우디 하루 원유 생산", sub: "1980년대 · 보도된 대략치", unit: "만 배럴", items: [{label: "1981년", value: 1000, color: navy}, {label: "1985년", value: 350, color: red}]}
    sync: {at: [0, "1,000만", "350만"]}
  - say: "값을 지키려고 혼자 가게 문을 반쯤 닫았는데, 옆 가게들은 계속 팔아서 손님만 빼앗긴 셈입니다. 버티는 쪽만 손해를 보는 구조였죠."
    scene: {kind: quote, text: "혼자 문을 닫으면 [[손님만]] 빼앗긴다", by: "생산을 조절하는 쪽의 딜레마"}
    sync: {at: [0, "손님만"]}
  - say: "1985년 사우디는 이 역할을 내려놓고 생산을 최대로 늘립니다. 결과는 1986년의 유가 폭락. 배럴당 27달러에서 10달러 아래로 떨어집니다."
    source: "Wikipedia '1980s oil glut'"
    theme: dark
    scene: {kind: stack, logo: "1986", label: "유가 폭락", cards: [{meta: "1985년", text: "사우디, [[증산]]으로 전환"}, {meta: "1986년", text: "배럴당 27달러 → [[10달러 아래]]"}]}
    sync: {at: [0, "최대로", "27달러에서"]}
  - say: "기름값이 반 토막 나자 산유국들의 살림이 흔들렸습니다. 기록은 사우디의 경제력도 크게 약해졌다고 전합니다. 쌓아 둔 돈이 빠르게 줄어드는 시기였습니다."
    source: "Wikipedia '1980s oil glut'"
    scene: {kind: doc, tag: "1986년 이후", meta: "Wikipedia '1980s oil glut'", title: "산유국의 [[긴 겨울]]", lines: ["1982년 멕시코 외채 위기", "소련 경제에도 큰 타격", "사우디의 경제력도 [[크게 약화]]"]}
    sync: {at: [0, "산유국들의", "사우디의"]}
  - say: "반대로 사우디의 큰 생산 여력이 빛난 때도 있습니다. 1990년 걸프전으로 이라크와 쿠웨이트의 기름이 막히자, 사우디는 하루 생산을 7월 540만 배럴에서 12월 850만 배럴로 늘렸죠."
    source: "Wikipedia 'Saudi Aramco'"
    scene: {"kind": "bars", "dir": "v", "title": "1990년 사우디 하루 원유 생산", "sub": "걸프전 대응 · 만 배럴", "unit": "만", "items": [{"label": "7월", "value": 540, "color": "sky"}, {"label": "12월", "value": 850, "color": "navy"}]}
    sync: {"at": [0, "540만", "850만"]}
  - say: "남는 생산 능력은 일종의 비상금입니다. 남들이 못 팔 때 대신 팔 수 있는 힘이죠. 사우디가 오펙의 사실상 지도자로 불리는 이유이기도 합니다."
    source: "Wikipedia 'OPEC'"
    scene: {"kind": "quote", "text": "남는 생산 능력 = 산유국의 [[비상금]]", "by": "사우디가 오펙의 사실상 지도자인 이유"}
    sync: {"at": [0, "비상금입니다.", "지도자로"]}
  - say: "2004년 아람코는 하루 1,000만 배럴 능력 가운데 860만 배럴을 생산했습니다. 이듬해엔 500억 달러를 들여 생산 능력을 하루 1,250만 배럴로 키우는 5년 계획을 시작하죠."
    source: "Wikipedia 'Saudi Aramco'"
    scene: {"kind": "doc", "tag": "2004~2005년", "meta": "Wikipedia 'Saudi Aramco'", "title": "여유를 [[미리]] 키우다", "lines": ["2004년: 능력 1,000만 배럴 중 860만 생산", "2005년: 500억 달러 · 5년 계획", "목표: 하루 [[1,250만 배럴]]"]}
    sync: {"at": [0, "860만", "500억"]}
  - say: "그리고 30년쯤 지나, 비슷한 장면이 다시 펼쳐집니다. 이번엔 2년 만에 기름값이 반 토막 났습니다. 산유국들의 살림은 다시 한번 큰 시험대에 오릅니다."
    theme: dark
    scene: {kind: photo, photo: "@tanker_gulf", name: "페르시아만의 유조선", role: "2004년 · 미 해군 사진"}
    sync: {at: [0]}
  - say: "브렌트유 연평균 가격은 2013년 약 109달러에서 2014년 99달러, 2015년 53달러, 2016년엔 45달러까지 내려갑니다. 2년 사이에 기름값이 절반 아래로 떨어진 겁니다."
    source: "IMF 1차 상품 가격 (FRED)"
    scene: {kind: bars, dir: v, title: "브렌트유 연평균 가격", sub: "배럴당 달러 · IMF 1차 상품 가격", unit: "달러", items: [{label: "2013년", value: 109, color: navy}, {label: "2014년", value: 99, color: navy}, {label: "2015년", value: 53, color: pink}, {label: "2016년", value: 45, color: red}]}
    sync: {at: [0, "109달러에서", "99달러,", "53달러,", "45달러까지"]}
  - say: "2015년 사우디 정부 수입은 6,080억 리얄로 목표 7,150억 리얄에 크게 못 미쳤고, 적자는 3,670억 리얄에 이르렀습니다. 달러로는 약 979억 달러의 구멍이었습니다."
    source: "Arab News(AFP, 2015.12)"
    scene: {kind: doc, tag: "2015년", meta: "Arab News (AFP)", title: "기록적인 [[적자]]", lines: ["수입 6,080억 리얄 (목표 7,150억)", "적자 3,670억 리얄 · 약 979억 달러"]}
    sync: {at: [0, "6,080억", "3,670억"]}
  - say: "월급은 줄었는데 생활비가 그대로면 마이너스 통장을 쓰게 됩니다. 나라도 똑같이 빚을 내고, 쌓아 둔 돈을 꺼내 써야 했죠. 한두 해는 버텨도, 오래가면 빚이 불어납니다."
    theme: dark
    scene: {kind: quote, text: "월급은 줄고 [[생활비]]는 그대로", by: "적자의 원리"}
    sync: {at: [0, "마이너스", "빚을"]}
  - say: "그래서 세금이 생깁니다. 2018년 1월 1일, 사우디는 처음으로 부가가치세 5%를 도입했고, 2020년 7월 1일엔 15%로 올립니다. 세금을 거의 내지 않던 나라에서는 큰 변화였죠."
    source: "Argaam(2020.7)"
    scene: {kind: doc, tag: "세금이 거의 없던 나라의 변화", meta: "Argaam (2020.7)", title: "부가가치세 [[5% → 15%]]", lines: ["2018년 1월 1일: 첫 도입 (5%)", "2020년 7월 1일: [[15%]]로 인상", "유가 급락 · 코로나 시기"]}
    sync: {at: [0, "5%를", "15%로"]}
  - say: "단번에 세 배입니다. 석유 수입이 흔들리자, 나라가 국민의 지갑에서 새 수입원을 찾기 시작한 거죠. 석유가 아니라 국민의 소비에서 돈을 걷는 구조로 한 걸음 옮긴 겁니다."
    source: "Argaam(2020.7)"
    scene: {kind: bignum, label: "부가가치세율 (2020년 7월)", from: 5, to: 15, unit: "%", color: red, sub: "2018년 5% → [[3배]]"}
    sync: {at: [0, "세", "지갑에서"]}
  - say: "여기서 꼭 알아야 할 숫자가 있습니다. 나라 살림이 적자도 흑자도 아니게 되는 유가, 재정 균형 유가입니다. 산유국 살림을 읽는 가장 중요한 잣대죠."
    theme: dark
    scene: {kind: flip, label: "재정 균형 유가 · 2025년 [[IMF 추정]]", from: "$??", to: "$91"}
    sync: {at: [0, "재정"]}
  - say: "개인으로 치면, 한 달에 최소 이만큼은 벌어야 적자가 안 난다는 손익분기 월급입니다. 생활비가 클수록 이 기준선도 높아지겠죠."
    scene: {kind: quote, text: "적자가 안 나는 [[최소 월급]]", by: "재정 균형 유가를 쉽게 말하면"}
    sync: {at: [0, "손익분기"]}
  - say: "국제통화기금의 추정으로 보면, 2014년 이후 사우디의 재정 균형 유가는 대체로 배럴당 80에서 100달러 사이였습니다. 실제 유가는 그보다 낮은 해가 많았죠."
    source: "IMF 지역경제전망 추정 (FRED) · IMF 브렌트유 가격"
    scene: {kind: line, title: "브렌트유 vs [[재정 균형 유가]]", sub: "배럴당 달러 · 균형 유가는 IMF 추정, 2025년은 전망", x: [2014, 2017, 2020, 2022, 2025], ymax: 120, series: [{label: "균형 유가 (IMF 추정)", color: red, points: [[2014, 106], [2015, 94], [2016, 87], [2017, 84], [2018, 89], [2019, 82], [2020, 76], [2021, 84], [2022, 88], [2023, 95], [2024, 98], [2025, 91]]}, {label: "브렌트유", color: navy, points: [[2014, 99], [2015, 53], [2016, 45], [2017, 55], [2018, 72], [2019, 64], [2020, 43], [2021, 71], [2022, 99], [2023, 82], [2024, 80], [2025, 68]]}]}
    sync: {at: [0, "국제통화기금의", "실제"]}
  - say: "2022년엔 브렌트유가 약 99달러로 균형 유가 약 88달러를 넘었습니다. 하지만 2024년엔 균형 유가 약 98달러에 실제는 약 80달러였죠. 그래서 2024년에도 재정은 적자였습니다."
    source: "IMF 추정 (FRED)"
    scene: {kind: doc, tag: "IMF 추정", meta: "FRED · IMF 지역경제전망", title: "넘은 해와 [[못 넘은 해]]", lines: ["2022년: 브렌트 약 99달러 > 균형 약 88달러", "2024년: 브렌트 약 80달러 < 균형 약 98달러"]}
    sync: {at: [0, "2022년엔", "2024년엔"]}
  - say: "주의할 점이 있습니다. 균형 유가는 IMF의 추정치라서, 계산 방법과 발표 시점에 따라 숫자가 달라집니다. 방향을 읽는 데 쓰는 게 좋습니다."
    scene: {kind: quote, text: "균형 유가는 [[추정]]이다", by: "숫자 읽는 법"}
    sync: {at: [0, "추정치라서,", "방향을"]}
