- say: '''석유만 있으면 평생 부자.'' 정말 그럴까요? 땅에서 돈이 솟아나는 나라, 사우디아라비아의 이야기입니다. 사막 아래 기름이 있는 한 걱정이 없을 것 같지만, 숫자를 따라가 보면 이야기는 조금 달라집니다.'
