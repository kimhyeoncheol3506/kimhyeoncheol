title: (이거 한편으로 끝) 사막 나라 사우디는 석유로 번 돈을 어디에 쓸까? 석유가 끝나면 벌어질 일까지 (1시간 몰아보기)
intro_chapter: 인트로 · 석유만 있으면 평생 부자?
voice:
  speed: 1.0
  instruct: 경제 다큐멘터리 해설자처럼 차분하고 또렷하게, 이야기를 들려주듯 따뜻하게. 숫자와 연도는 또박또박.
thumbnail:
  file: assets/thumbs/oneshot_saudi_thumb_B.png
summary: '''석유만 있으면 평생 부자''. 정말 그럴까요?

  1938년 담맘 7호정에서 처음 터진 석유, 미국 회사의 아람코가 사우디 국영 회사가 되기까지, 1973년 석유파동과 오펙, 정부 수입의 약 60%를 석유가 채우는 나라 살림, 국부펀드 PIF, 유가 롤러코스터와 IMF가 추정한 재정 균형 유가, 2019년 아람코 상장, 비전 2030과 네옴의 계획과 현실, 자원의 저주와 노르웨이 국부펀드, 그리고 석유 이후의
  시나리오까지 1시간에 정리했습니다.

  마지막 장에서는 한 가지 수입원에 기대는 사우디의 고민을 월급쟁이의 돈 관리 원칙으로 바꿔 봤습니다. 투자 권유가 아니며, 모든 숫자의 출처는 아래에 적었습니다.

  '
