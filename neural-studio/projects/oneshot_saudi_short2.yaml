slug: oneshot_saudi_short2
format: short
title: 사우디 네옴 170km 도시가 2.4km로, 비용 추정은 8조 8천억 달러
summary: '사우디 석유 돈으로 짓는 네옴의 직선 도시 더 라인. 처음엔 길이 170km였지만 2030년까지 짓는 구간은 약 2.4km로 줄었다는 블룸버그 보도가 나왔습니다(2024.4).

  거주 목표도 150만 명에서 30만 명 미만으로 줄었다는 보도입니다. 사우디 당국은 큰 목표는 유지한다는 입장입니다. 전체 이야기는 본편 「사우디 석유 부자의 가계부」에서.

  '
