# CEO 시리즈 4편 · SK하이닉스 — 모델 2(네온), 약 5분
# 근거: plans/ceo_series/research/sk_hynix.md (DART 분기보고서·대표이사변경 공시 원문 우선, 사실마다 근거 2곳). '확인' 사실 위주, 보도는 (보도).
# 쓰지 않은 것: 최태원 "반도체 무조건 해야" 발언(출처 1건), 인수 반대 발언 화자, HBM 점유율 50%(조사기관 1곳), '슈퍼카 메모리'(회사 자료 1건),
#   정주영 초대 대표·이천 기공식 날짜, 권오철 입사 연도(불일치), 최인근, 주가(52주 최고가 대비 -61%라 '사상 최고가' 표현 금지).
# 마지막 멘트: 4편부터 다음 편 예고 대신 구독·좋아요 부탁(plans/CEO시리즈_기획안.md '마지막 멘트 고정').
