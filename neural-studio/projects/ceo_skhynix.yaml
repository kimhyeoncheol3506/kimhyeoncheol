  # ───────── 인트로 (첫 15초 화면 3번 이상) ─────────
  - say: "2012년, SK가 약 3조 4천억 원을 내고 최대주주가 된 반도체 회사가 있습니다."
    instruct: "첫마디부터 또렷하게, '3조 4천억'에 힘을 준다."
    source: "DART 최대주주변경 2012-02-15 · 뉴스토마토 2012-02-14"
    scene: {kind: number, label: "2012년 SK 인수", from: 0, to: 3.4, unit: "조 원", sub: "최종 납입 3조 3,747억 원 · 지분 약 [[21%]]"}
    sync: {at: [0, "3조"]}
  - say: "그 회사 시가총액이 지금 822조 원. 코스피 2위, SK하이닉스입니다."
    source: "네이버 증권 · 2026-11-18 종가 기준"
    scene: {kind: number, label: "시가총액", from: 3, to: 822, unit: "조 원", sub: "2026년 11월 18일 · 코스피 [[2위]]"}
    sync: {at: [0, "822조"]}
  - say: "작년엔 영업이익으로 처음 삼성전자를 넘었죠. 그런데 이 회사, 24년 전엔 미국 회사에 팔려 갈 뻔했습니다. 어떻게 된 걸까요?"
    instruct: "앞 문장은 담담하게, '팔려 갈 뻔했습니다'에서 반전을 준다."
    source: "DART 사업보고서 2025 · 서울신문 2002-05-01"
    scene: {kind: hook, small: "2025년 영업이익 47.2조 · 삼성전자 43.6조", line1: "삼성을 넘은 회사", line2: "[[팔려 갈 뻔했다]]"}
    sync: {at: [0, "삼성전자를", "팔려"]}
  - say: "오늘은 SK하이닉스를 이끈 사람들의 학교와 이력, 결정적 한 수, 그리고 가계도까지 5분에 정리합니다."
    scene: {kind: intro, kicker: "CEO 연대기 · 시총 2위", title: "SK하이닉스를 이끈 사람들", sub: "학교 · 이력 · [[가계도]] · 2026년 11월 18일 기준"}
    sync: {at: [0, "학교와", "가계도까지"]}
  - say: "이런 회사 이야기, 시총 순서대로 매주 올립니다. 대표이사 계보는 전부 공시로 확인했어요."
    scene: {kind: title, tag: "약속", kicker: "대표이사 계보는", title: "DART 공시로 확인", sub: "언론으로만 확인한 건 [[(보도)]]"}
