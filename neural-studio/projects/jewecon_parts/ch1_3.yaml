scenes:
  # ═════════════ 1장 · 땅을 일구던 사람들 ═════════════
  - say: "첫 번째 이야기는 돈이 아니라, 흙에서 시작합니다."
    chapter: "1장 · 땅을 일구던 사람들"
    theme: dark
    scene: {kind: chapter, kicker: "1장", title: "땅을 일구던\n사람들"}
    sync: {at: [0]}
  - say: "기원전 587년, 바빌로니아가 예루살렘을 무너뜨리고 많은 주민을 바빌론으로 끌고 갑니다. 흩어져 사는 삶, 디아스포라의 시작입니다."
    source: "Lemche(2004), Wikipedia 'Babylonian captivity' 인용"
    scene: {kind: year, text: "기원전 587", up: "바빌론으로", down: "남은 사람들", to: "디아스포라"}
    sync: {at: [0, "바빌론으로", "디아스포라의"]}
  - say: "흩어진 사람들은 이후 여러 나라에 공동체를 이룹니다. 그런데 이들은 처음부터 장사꾼이었을까요?"
    scene: {kind: quote, text: "흩어진 사람들은 처음부터 [[장사꾼]]이었을까", by: "1장의 질문"}
    sync: {at: [0, "장사꾼이었을까요?"]}
  - say: "기원후 70년, 로마의 티투스가 예루살렘을 포위하고 두 번째 성전을 불태웁니다."
    source: "Britannica, Siege of Jerusalem (70 CE)"
    theme: dark
    scene: {kind: photo, photo: "@arch_of_titus", name: "티투스 개선문의 부조", role: "예루살렘 성전의 전리품을 든 로마 병사들"}
    sync: {at: [0]}
  - say: "요세푸스는 이 전쟁의 사망자를 110만 명이라고 적었습니다. 다만 현대 학자들은 당시 예루살렘 인구보다 큰, 과장된 숫자로 봅니다."
    source: "요세푸스 『유대 전쟁사』 6.420 (CCEL)"
    scene: {kind: bignum, label: "요세푸스가 적은 사망자", to: 1100000, unit: "명", color: red, sub: "현대 학계는 [[과장된 숫자]]로 봄"}
    sync: {at: [0, "110만", "현대"]}
  - say: "그런데 같은 요세푸스가 1세기 말에 이렇게 썼습니다. 우리는 바닷가 나라에 살지 않고, 장사를 즐기지도 않으며, 좋은 땅을 일구는 데 힘쓴다."
    source: "요세푸스 『아피온 반박』 1.60 (Lexundria)"
    scene: {kind: doc, tag: "1차 문헌", meta: "요세푸스 『아피온 반박』 1.60 · 1세기 말", title: "우리는 [[땅을 일군다]]", lines: ["바닷가 나라에 살지 않고", "장사를 즐기지도 않으며", "비옥한 땅을 경작하는 데 힘쓴다"]}
    sync: {at: [0, "좋은"]}
  - say: "물론 변론을 위한 글이라 과장이 섞였을 수 있습니다. 알렉산드리아의 유대인처럼 곡물 무역을 한 사람들도 있었으니까요."
    source: "Lexundria, 『아피온 반박』 1.60 해설"
    scene: {kind: quote, text: "변론서의 과장, 그래도 중심은 [[농업]]", by: "요세푸스 기록 읽기"}
    sync: {at: [0, "알렉산드리아의"]}
  - say: "경제학자 보티치니와 에크슈타인도 같은 결론입니다. 1세기 유대인의 대표 직업은 농업이었다는 거죠."
    source: "PBS NewsHour(2013), Botticini & Eckstein 『The Chosen Few』(2012)"
    scene: {kind: stack, logo: "THE CHOSEN FEW", label: "보티치니 · 에크슈타인 (2012)", cards: [{meta: "Princeton UP · 2012", text: "How Education Shaped Jewish History, [[70–1492]]"}, {meta: "1세기", text: "대표 직업은 [[농업]]"}]}
    sync: {at: [0, "보티치니와", "농업이었다는"]}
  - say: "땅을 일구던 사람들이, 어떻게 수백 년 뒤 도시의 상인과 금융가로 알려지게 됐을까요? 이 영상의 진짜 출발점입니다."
    scene: {kind: quote, text: "농부는 어떻게 [[상인]]이 되었나", by: "오늘 이야기의 출발점"}
    sync: {at: [0, "상인과"]}
  - say: "실마리 하나는 학교입니다. 탈무드는 예호슈아 벤 감라가 모든 지역과 도시에 교사를 두고, 아이를 6살이나 7살에 입학시키게 했다고 전합니다."
    source: "탈무드 바바 바트라 21a (Sefaria)"
    scene: {kind: doc, tag: "기록", meta: "탈무드 바바 바트라 21a", title: "모든 도시에 [[교사]]를", lines: ["아이는 6~7세에 입학", "그가 없었다면 토라는 잊혔을 것"]}
    sync: {at: [0, "교사를"]}
  - say: "다만 이 규정이 실제로 어디까지 지켜졌는지는, 학자들 사이에서도 아직 확실하지 않습니다."
    scene: {kind: quote, text: "기록은 있다, [[시행 범위]]는 논쟁 중", by: "학계 평가"}
    sync: {at: [0, "어디까지"]}
  - say: "보티치니와 에크슈타인은 70년 성전 파괴 뒤, 유대교가 모든 남자에게 토라를 직접 읽을 의무를 지웠다고 봅니다. 당시 다른 종교나 나라에는 없던 요구였다는 거죠."
    source: "PBS NewsHour(2013) · 저자들의 해석"
    theme: dark
    scene: {kind: flip, label: "70년 이후, 모든 남자에게", from: "듣기", to: "읽기"}
    sync: {at: [0, "읽을"]}
  - say: "그 대가는 컸다고 그들은 말합니다. 두 사람의 추정으로 유대인 인구는 65년 무렵 약 500만 명에서, 650년 무렵 약 120만 명으로 줄었습니다."
    source: "PBS NewsHour(2013) · 보티치니·에크슈타인 추정"
    scene: {kind: bars, dir: v, title: "유대인 인구", sub: "보티치니·에크슈타인의 추정 · 학계 논쟁", unit: "만", items: [{label: "65년 무렵", value: 500, color: navy}, {label: "650년 무렵", value: 120, color: red}]}
    sync: {at: [0, "500만", "120만"]}
  - say: "전쟁과 전염병도 있었지만, 이들은 교육비를 감당하지 못한 농민들이 다른 종교로 옮겨 간 것을 큰 원인으로 꼽습니다. 이 해석에는 반론도 적지 않습니다."
    source: "PBS NewsHour(2013) · Jerusalem Post 서평의 반론"
    scene: {kind: quote, text: "글을 가르칠 수 없던 농민은 [[떠났다]]", by: "보티치니·에크슈타인의 가설 · 반론 있음"}
    sync: {at: [0, "교육비를"]}
  - say: "750년에서 900년 사이, 남은 유대인의 약 75%가 메소포타미아와 페르시아에 살았습니다. 아바스 왕조의 큰 도시들이 있던 곳이죠."
    source: "PBS NewsHour(2013) · 보티치니·에크슈타인"
    scene: {kind: waffle, title: "750~900년, 유대인이 살던 곳", sub: "보티치니·에크슈타인 추정", groups: [{label: "메소포타미아·페르시아", value: 75, color: navy}]}
    sync: {at: [0, "75%가"]}
  - say: "이 무렵 이들은 거의 전부 농사를 떠나 도시의 숙련 직업으로 옮겼습니다. 아바스 왕조에선 유대인도 땅을 가질 수 있었는데도 말이죠."
    source: "PBS NewsHour(2013)"
    theme: dark
    scene: {kind: flip, label: "750~900년, 일터가 바뀌다", from: "농촌", to: "도시"}
    sync: {at: [0, "도시의"]}
  - say: "땅이 있어도 도시로 갔다는 것. 쫓겨나서만은 아니었다는 뜻이기도 합니다. 이 질문은 2장에서 다시 나옵니다."
    scene: {kind: quote, text: "땅이 있어도 [[도시로]]", by: "1장의 단서"}
    sync: {at: [0, "도시로"]}
  - say: "870년 무렵, 아바스 왕조에서 역참과 첩보를 맡은 관리 이븐 후르다드베가 한 무리의 상인을 기록합니다. 이름은 라다니트."
