scenes:
  # ═════════════ 7장 · 음모론은 어떻게 만들어졌나 ═════════════
  - say: "일곱 번째 이야기입니다. 유대인이 세계 경제를 지배한다는 말이, 대체 어디서 시작됐는지 따라가 보겠습니다."
    chapter: "7장 · 음모론은 어떻게 만들어졌나"
    theme: dark
    scene: {kind: chapter, kicker: "7장", title: "음모론은\n어떻게 만들어졌나"}
    sync: {at: [0]}
  - say: "1903년 러시아 제국의 한 신문에, 유대인 지도자들이 세계 지배를 꾸미는 비밀 회의록이라는 글이 실립니다. 제목은 시온 장로 의정서였습니다."
    source: "USHMM 홀로코스트 백과사전"
    scene: {kind: doc, tag: "1903년 · 러시아", meta: "러시아 제국 신문 연재", title: "『시온 장로 의정서』", lines: ["유대인 지도자들의 [[비밀 회의록]]이라고 주장", "돈과 언론으로 세계를 지배할 계획이라는 내용"]}
    sync: {at: [0, "회의록이라는"]}
  - say: "발행인은 크루셰반이라는 사람이었습니다. 그의 신문은 같은 해 4월, 키시너우에서 일어난 유대인 학살을 부추긴 신문이기도 했습니다."
    source: "USHMM 홀로코스트 백과사전"
    scene: {kind: quote, text: "같은 해 4월, [[키시너우 학살]]을 부추긴 신문", by: "발행인 크루셰반 · 일부 학자는 그를 의정서의 원저자로 봅니다"}
    sync: {at: [0, "키시너우에서"]}
  - say: "의정서는 1905년 책의 부록으로 다시 나왔고, 1917년 러시아 혁명 뒤 날개를 답니다. 1919년 독일어판, 1920년 일본어판, 1925년에는 아랍어판까지 나옵니다."
    source: "USHMM 홀로코스트 백과사전"
    scene: {kind: timeline, title: "의정서가 [[퍼진 길]]", years: [1903, 1925], events: [{year: 1905, text: "책 부록으로 재출간"}, {year: 1919, text: "독일어판"}, {year: 1920, text: "일본어판"}, {year: 1925, text: "아랍어판"}]}
    sync: {at: [0, "1905년", "1919년", "1920년", "1925년에는"]}
  - say: "전쟁과 혁명으로 세상이 뒤집힌 시기였습니다. 복잡한 혼란을 한 집단의 음모로 설명해 주는 이야기는, 불안한 사람들에게 너무 쉽게 팔렸습니다."
    scene: {kind: quote, text: "복잡한 혼란을 [[한 집단의 음모]]로 설명하는 이야기", by: "음모론이 퍼지는 방식"}
    sync: {at: [0, "음모로"]}
  - say: "그리고 1921년, 런던 타임스의 특파원 필립 그레이브스가 이 문서의 정체를 밝혀냅니다."
    source: "USHMM 홀로코스트 백과사전"
    theme: dark
    scene: {kind: photo, photo: "@times_1921_protocols", name: "1921년 런던 『타임스』", role: "필립 그레이브스의 폭로 기사"}
    sync: {at: [0]}
  - say: "그레이브스는 의정서의 문장을, 1864년 프랑스 작가 모리스 졸리가 쓴 정치 풍자문과 나란히 놓았습니다. 신문은 이것을 서툰 위조라고 불렀습니다."
    source: "The Times 1921-08-17 (USHMM 소장)"
    scene: {kind: doc, tag: "『타임스』 1921년 8월", meta: "The Times, 1921-08-17", title: "\"A [[Clumsy Forgery]]\"", lines: ["서툰 위조문", "1864년 프랑스 풍자문과 문장을 [[나란히 비교]]"]}
    sync: {at: [0, "서툰"]}
  - say: "그런데 졸리의 책은 나폴레옹 3세를 비꼰 글이었습니다. 거기엔 유대인이 한 명도 나오지 않습니다. 누군가 주인공만 바꿔서 베낀 겁니다."
    source: "USHMM 홀로코스트 백과사전"
    scene: {kind: quote, text: "그 책에는 [[유대인이 한 명도]] 나오지 않는다", by: "모리스 졸리, 『지옥에서의 대화』(1864) · 나폴레옹 3세 풍자"}
    sync: {at: [0, "한"]}
  - say: "또 다른 재료는 1868년 독일 소설 비아리츠였습니다. 프라하 유대인 묘지에서 밤에 비밀 회의가 열리는 소설 속 장면이, 실제 회의록처럼 둔갑했습니다."
    source: "USHMM 홀로코스트 백과사전"
    scene: {kind: doc, tag: "또 하나의 원재료", meta: "헤르만 괴셰, 소설 『비아리츠』(1868)", title: "프라하 묘지의 [[비밀 회의]]", lines: ["소설 속 장면이 '실제 회의록'으로 둔갑", "1920년 루시앙 울프가 지적"]}
    sync: {at: [0, "프라하"]}
  - say: "조작이 밝혀지기까지 18년이 걸렸습니다. 하지만 그사이 거짓은 이미 세계를 한 바퀴 돈 뒤였습니다."
    source: "USHMM 홀로코스트 백과사전"
    scene: {kind: flip, label: "거짓이 [[진실보다 먼저]] 돌았던 시간", from: "1903", to: "1921"}
    sync: {at: [0, "18년이"]}
  - say: "미국에서 이 거짓을 키운 사람은 의외의 인물이었습니다. 자동차 왕, 헨리 포드입니다."
    theme: dark
    scene: {kind: photo, photo: "@henry_ford", name: "헨리 포드", role: "포드 자동차 창업자 · 『디어본 인디펜던트』 소유주"}
    sync: {at: [0]}
  - say: "포드는 자기 소유 주간지 디어본 인디펜던트에 1920년부터 반유대 기사를 연재했고, 이 기사들을 묶어 국제 유대인이라는 책으로 냈습니다."
    source: "USHMM 갤러리"
    scene: {kind: doc, tag: "1920년부터", meta: "『디어본 인디펜던트』 연재 → 책 『The International Jew』", title: "포드의 신문이 퍼뜨린 [[반유대 기사]]", lines: ["1920년부터 주간지에 연재", "기사를 묶어 『국제 유대인』으로 출간"], photo: "@dearborn_independent"}
    sync: {at: [0, "묶어"]}
  - say: "이 책은 50만 부 넘게 팔렸고, 최소 16개 언어로 번역됐습니다. 1922년 독일에서는 벌써 21쇄를 찍었습니다."
    source: "USHMM 갤러리"
    scene: {kind: bignum, label: "『국제 유대인』 판매 부수", from: 0, to: 500000, unit: "부+", sub: "최소 [[16개 언어]]로 번역 · 1922년 독일 21쇄"}
    sync: {at: [0, "50만", "16개"]}
