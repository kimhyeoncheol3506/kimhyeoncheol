summary: '코스피가 6월 22일 종가 9,114.55에서 11월 20일 종가 4,869.96까지 46.6% 빠졌습니다. 엘리엇 파동으로 세어 보면 2025년 4월 9일 2,293.70에서 시작한 상승 5파가 끝나고 A-B-C 조정의 C파가 진행 중이며, 상승 전체의 62.2%를 되돌렸습니다. 4,900은 전체 상승의 61.8% 되돌림(4,899)과 C파
  목표(A파×0.618 = 4,905)가 겹치는 자리입니다. 지지와 반등, 이탈(3,753·3,560), 긴 조정까지 세 갈래 진로와 확인할 숫자 두 개(4,900 종가 지지, 7,081 돌파)를 정리했습니다. 파동 세기는 채널의 한 가지 해석이며 투자 권유가 아닙니다.

  '
