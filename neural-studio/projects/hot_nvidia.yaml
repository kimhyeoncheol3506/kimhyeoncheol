summary: '젠슨 황 사임, 엔비디아 주가는 어떻게 됐을까요? 2026년 11월 12일 엔비디아 이사회가 젠슨 황 CEO의 사임을 발표했고, 장중 시가총액 약 801조 원이 사라졌습니다. 같은 주 국민연금 엔비디아 평가액은 약 1조 6,229억 원 줄었고(세계일보 계산), 국내 개인은 4,274억 원어치를 순매수했습니다.

  3분기 실적, 복귀설 보도와 사실의 구분, 애플·마이크로소프트·스타벅스·우버의 창업자 퇴장 뒤 1년·3년 성적표, 국민연금과 내 노후의 비중 차이, 그리고 월급쟁이 행동 원칙까지 정리했습니다. 투자 권유가 아니며, 모든 숫자의 출처는 아래에 적었습니다.

  '
