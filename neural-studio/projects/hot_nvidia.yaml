# '지금 뜨거운 돈 이슈' 3편 중 마지막 — 젠슨 황 사임 / 엔비디아 주가 (2026-11-18 새벽 작성)
# 계산 메모 (모두 배당 제외, 종가는 Yahoo Finance 일별 종가 · 분할 반영)
#  - 엔비디아 10/6 최고 종가 239.24 → 11/16 156.14 : 156.14/239.24-1 = -34.7%  → 1,000만 원 → 약 653만 원(652.65)
#  - S&P 500 10/6 7,818.93 → 11/16 7,416.59 : -5.1% → 1,000만 원 → 약 949만 원(948.54)
#  - 손실 차이: 1,000-652.65 = 347만 원 / 1,000-948.54 = 51만 원
#  - 국민연금 엔비디아 평가액(9월 말 116억 5,499만 달러 × 11/13 환율 1,336.7원) = 약 15.6조 원 ÷ 8월 말 적립금 1,684.4조 = 약 0.9%
#  - 1조 6,229억 ÷ 1,684.4조 = 약 0.1% (0.096%)
#  - 노후 자금의 30%를 한 종목에: 30 ÷ 0.92 = 약 33배
#  - 5,103만 3,345주 × 186.64달러(6일) = 약 95.2억 달러, × 162.85달러(13일) = 약 83.1억 달러(세계일보 83억 1,078만)
#  - 13F 안 비중: 엔비디아 7.34% / 나머지 92.66%
#  - 애플 1985/9/17 0.0681 → 1986/9/17 0.1529 (+124.5%, 약 125%) → 1988/9/19 0.3728 (+447.4%, 약 447%)
#  - 마이크로소프트 2000/1/13 53.9062 → 2001/1/16 26.2812 (-51.2%) → 2003/1/13 28.195 (-47.7%)
#  - 스타벅스 2008/1/7 9.19 → 2009/1/7 4.995 (-45.6%) → 2011/1/7 16.39 (+78.3%)
#  - 우버 기업가치 680억 달러(2017/6) → 480억(2018/1 소프트뱅크 매입 기준, -29.4%) → 820억(2019/5 상장, +20.6% 약 21%)
