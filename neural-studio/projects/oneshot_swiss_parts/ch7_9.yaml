scenes:
  # ═════════════ 7장 · 손에 기술을, 도제제도 ═════════════
  - say: "일곱 번째 이야기는, 스위스 청소년 대부분이 걷는 조금 낯선 길에 관한 것입니다. 바로 일하면서 배우는 길이죠. 이 길이 스위스 산업의 품질을 떠받칩니다."
    chapter: "7장 · 손에 기술을, 도제제도"
    theme: dark
    scene: {kind: chapter, kicker: "7장", title: "손에 기술을,\n도제제도"}
    sync: {at: [0]}
  - say: "한국에서는 고등학교를 졸업하면 대학에 가는 게 당연하게 여겨지죠. 그런데 스위스는 많이 다릅니다. 대학이 유일한 성공의 길이 아니거든요."
    scene: {kind: quote, text: "대학이 [[유일한 길]]이 아닌 나라", by: "7장의 시작"}
    sync: {at: [0, "대학에", "다릅니다."]}
  - say: "스위스 교육연구혁신청에 따르면, 의무교육을 마친 청소년의 3분의 2가 직업교육 훈련, 이른바 도제 과정에 들어갑니다. 가장 인기 있는 진로죠."
    source: "SERI, VPET Facts and Figures 2022"
    theme: dark
    scene: {kind: waffle, title: "의무교육 이후 [[직업교육]]을 택한 청소년", sub: "스위스 교육연구혁신청 · 약 3분의 2", groups: [{label: "직업교육(도제) 약 3분의 2", value: 67, color: navy}]}
    sync: {at: [0, "3분의", "도제"]}
  - say: "도제란 학교와 회사를 오가며 배우는 방식입니다. 일주일 중 하루이틀은 직업학교에서 이론을 배우고, 나머지 날은 회사에서 실제 일을 하며 배우죠."
    scene: {kind: doc, tag: "도제 과정이란", meta: "SERI · 세 곳에서 배운다", title: "학교와 [[회사]]를 오가며", lines: ["직업학교: [[이론]] 수업", "회사: [[실무]] 훈련과 월급", "업계 연수 과정: 기초 실기"]}
    sync: {at: [0, "학교와", "회사에서"]}
  - say: "고를 수 있는 직업은 약 245가지입니다. 사무직과 은행원, 요리사와 전기 기술자, 그리고 정보기술 전문가까지 아주 다양하죠."
    source: "SERI, VPET Facts and Figures 2022"
    theme: dark
    scene: {kind: bignum, label: "도제로 배울 수 있는 직업", to: 245, unit: "가지", color: navy, sub: "SERI 2022 · 사무직부터 [[IT]]까지"}
    sync: {at: [0, "245가지입니다.", "사무직과"]}
  - say: "2020년 새로 도제 계약을 맺은 청소년이 가장 많이 고른 직업은 사무직으로, 1만 2,768명이었습니다. 의료 보조와 판매직이 그 뒤를 이었죠."
    source: "SERI, VPET Facts and Figures 2022 (2020년)"
    scene: {kind: bars, title: "가장 많이 고른 도제 직업 (2020)", sub: "SERI · 신규 계약 수", unit: "명", items: [{label: "사무직", value: 12768, color: navy}, {label: "의료 보조", value: 4979, color: sky}, {label: "판매직", value: 4196, color: pink}, {label: "IT 기술자", value: 2237, color: red}]}
    sync: {at: [0, "2020년", "1만", "의료"]}
  - say: "은행에서 일하는 사람도 대학 대신 도제로 시작하는 경우가 많습니다. 열여섯 살에 은행 창구에서 일을 배우기 시작하는 거죠."
    theme: dark
    scene: {kind: quote, text: "열여섯 살의 [[은행원]]", by: "스위스식 첫 직장"}
    sync: {at: [0, "도제로", "열여섯"]}
  - say: "비유하자면 도제는 ‘월급 받으면서 다니는 실전 학교’입니다. 일찍 일을 시작해 돈을 벌면서, 동시에 기술을 몸에 익히는 거죠. 졸업장보다 실력이 먼저 쌓이는 구조입니다."
    scene: {kind: stack, logo: "PAID SCHOOL", label: "도제를 [[쉽게]] 보면", cards: [{meta: "학교", text: "이론은 [[직업학교]]에서"}, {meta: "회사", text: "실전은 [[현장]]에서"}, {meta: "통장", text: "그동안 [[월급]]도 받는다"}]}
    sync: {at: [0, "실전", "월급"]}
  - say: "그렇다면 회사는 왜 굳이 청소년을 가르칠까요? 2016년 조사에서 기업들이 도제 훈련에 쓴 총비용은 약 50억 프랑이었습니다. 적지 않은 돈이죠."
    source: "SERI, VPET Facts and Figures 2022 (2016년 비용·편익 조사)"
    theme: dark
    scene: {kind: quote, text: "회사는 왜 [[청소년]]을 가르칠까", by: "도제제도의 수수께끼"}
    sync: {at: [0, "청소년을", "50억"]}
  - say: "그런데 같은 기간 도제들이 해낸 일의 가치는 약 56억 프랑이었습니다. 가르치는 데 든 돈보다, 도제들이 벌어 준 게 더 많았던 거죠."
    source: "SERI, VPET Facts and Figures 2022 (2016년 비용·편익 조사)"
    scene: {kind: bars, dir: v, title: "기업의 도제 훈련 비용과 성과 (2016)", sub: "SERI · 십억 프랑", unit: "십억 프랑", items: [{label: "훈련 총비용", value: 5, color: red}, {label: "도제가 만든 생산 가치", value: 5.6, color: navy}]}
    sync: {at: [0, "56억", "벌어"]}
  - say: "기업은 필요한 기술을 가진 사람을 직접 길러 내고, 청소년은 일찍부터 돈을 벌며 경력을 쌓습니다. 양쪽 모두에게 이득인 구조죠."
    theme: dark
    scene: {kind: stack, logo: "WIN-WIN", label: "도제제도의 [[양쪽 이득]]", cards: [{meta: "기업", text: "필요한 [[기술자]]를 직접 기른다"}, {meta: "청소년", text: "일찍 [[소득]]과 경력을 얻는다"}]}
    sync: {at: [0, "기업은", "청소년은"]}
  - say: "독일어권에서는 학교에서만 배우는 직업교육 과정이 2020년 기준 4%에 불과했습니다. 거의 모든 도제가 실제 회사 안에서 일을 배운다는 뜻이죠."
    source: "SERI, VPET Facts and Figures 2022 (2020년)"
    scene: {kind: bignum, label: "독일어권의 학교 중심 직업교육 비중 (2020)", to: 4, unit: "%", color: red, sub: "대부분은 [[회사에서]] 배운다"}
    sync: {at: [0, "독일어권에서는", "4%에"]}
  - say: "중요한 건 막다른 길이 아니라는 점입니다. 직업 바칼로레아를 따면 응용과학대학에 진학할 수 있고, 나중에 대학원까지 갈 수도 있죠."
    source: "SERI, VPET Facts and Figures 2022"
    theme: dark
    scene: {kind: doc, tag: "열린 사다리", meta: "SERI · 투과성", title: "도제는 [[막다른 길]]이 아니다", lines: ["직업 바칼로레아 → [[응용과학대학]]", "고급 직업 시험 약 420가지", "평생 다시 배울 수 있는 [[사다리]]"]}
    sync: {at: [0, "바칼로레아를", "응용과학대학에"]}
  - say: "도제를 마친 뒤에도 배움은 이어집니다. 약 420가지 연방 직업 시험과 55가지 전문대학 과정이 있고, 고를 수 있는 고급 자격은 약 470가지에 이르죠."
    source: "SERI, VPET Facts and Figures 2022"
    scene: {kind: stairs, title: "도제 다음의 [[배움의 계단]]", sub: "SERI 2022 · 선택지 수", unit: "가지", steps: [{label: "전문대학 과정", value: 55}, {label: "연방 직업 시험", value: 420}, {label: "고급 직업 자격", value: 470}]}
    sync: {at: [0, "420가지", "55가지", "470가지에"]}
  - say: "그리고 고급 직업 자격을 딴 사람은, 일반 직업 자격만 가진 사람보다 평균 30% 가까이 더 번다고 교육연구혁신청은 설명합니다."
    source: "SERI, VPET Facts and Figures 2022"
    theme: dark
    scene: {kind: gauge, title: "고급 직업 자격의 소득 효과", sub: "SERI 2022 · 평균, 일반 직업 자격 대비", value: 30, color: navy, label: "약 30% 더 높은 소득"}
    sync: {at: [0, "30%"]}
  - say: "대부분은 일을 계속하면서 이 자격을 땁니다. 연방은 준비 과정 수강료의 50%를 지원하기도 하죠. 일과 배움이 평생 함께 가는 구조입니다."
    source: "SERI, VPET Facts and Figures 2022"
    scene: {kind: quote, text: "일과 배움이 [[평생]] 함께 간다", by: "스위스 직업교육의 특징"}
    sync: {at: [0, "50%를", "평생"]}
  - say: "용병 시대엔 몸이 자산이었다면, 지금 스위스에선 손에 익힌 기술이 자산입니다. 3장의 시계 장인 조합이 현대식으로 살아 있는 셈이죠."
    theme: dark
    scene: {kind: flip, label: "스위스의 자산", from: "근육", to: "기술"}
    sync: {at: [0, "용병", "기술이"]}
  - say: "물론 한계도 지적됩니다. 열다섯, 열여섯 살에 진로를 정해야 하는 부담이 크고, 지역과 가정 형편에 따라 기회가 다를 수 있다는 비판이죠."
    scene: {kind: quote, text: "너무 이른 [[선택]]의 부담", by: "도제제도에 대한 비판"}
    sync: {at: [0, "진로를", "형편에"]}
  - say: "또 다른 나라가 그대로 따라 하기는 어렵습니다. 기업들이 오랫동안 청소년을 가르쳐 온 문화와 신뢰가 먼저 있어야 하니까요."
    theme: dark
    scene: {kind: doc, tag: "그대로 베끼기 어려운 이유", meta: "제도는 문화 위에 선다", title: "제도보다 [[문화]]가 먼저", lines: ["기업이 [[가르치는]] 문화", "자격에 대한 사회의 [[신뢰]]", "업계 단체의 적극적인 [[참여]]"]}
    sync: {at: [0, "따라", "문화와"]}
  - say: "한국에도 특성화고와 마이스터고, 일학습병행 같은 제도가 있습니다. 다만 사회가 그 길을 얼마나 믿고 대우하느냐에 따라, 같은 제도도 전혀 다른 결과를 냅니다."
    scene: {kind: quote, text: "제도보다 중요한 건 [[사회의 믿음]]", by: "한국의 직업교육과 비교하면"}
    sync: {at: [0, "마이스터고,", "대우하느냐에"]}
  - say: "한국에도 특성화고와 마이스터고, 일학습병행 같은 제도가 있습니다. 다만 사회가 그 길을 얼마나 믿고 대우하느냐에 따라, 같은 제도도 전혀 다른 결과를 냅니다."
    scene: {kind: quote, text: "제도보다 중요한 건 [[사회의 믿음]]", by: "한국의 직업교육과 비교하면"}
    sync: {at: [0, "마이스터고,", "대우하느냐에"]}
  - say: "이 제도가 왜 경제를 강하게 할까요? 제약 공장과 정밀 기계, 은행 창구까지, 현장 기술자의 실력이 곧 제품과 서비스의 품질이 되기 때문입니다."
    scene: {kind: doc, tag: "원리", meta: "품질은 현장에서 나온다", title: "현장 기술자가 [[품질]]을 만든다", lines: ["제약 공장의 [[정확함]]", "정밀 기계의 [[미세한 오차]]", "은행 창구의 [[신뢰]]"]}
    sync: {at: [0, "제약", "현장"]}
  - say: "6장에서 본 약과 기계, 시계가 비싸게 팔리는 이유도 여기에 있습니다. 비싼 제품 뒤에는, 오래 훈련받은 손들이 있었던 거죠. 품질은 결국 사람에게서 나옵니다."
    theme: dark
    scene: {kind: quote, text: "비싼 제품 뒤의 [[훈련된 손]]", by: "6장과 7장의 연결"}
    sync: {at: [0, "비싸게", "손들이"]}
