scenes:
- say: 첫 번째 이야기는 은행이 아니라, 산에서 시작합니다. 스위스라는 나라가 처음 어떤 조건에서 출발했는지부터 보겠습니다.
  chapter: 1장 · 산골의 용병과 피난민
  theme: dark
  scene:
    kind: chapter
    kicker: 1장
    title: '산골의

      용병과 피난민'
  sync:
    at:
    - 0
- say: 그런데 바로 이 불리함이 스위스 사람들의 선택을 바꿨습니다. 땅으로 부자가 될 수 없다면, 땅 말고 다른 것을 키워야 했으니까요.
  scene:
    kind: photo
    photo: '@alps_village'
    name: 땅이 안 되면 [[다른 것]]을 키운다
    role: 알프스의 산골 마을 (1890년대 컬러 사진)
  sync:
    at:
    - 0
    - 불리함이
    - 다른
  theme: dark
- say: 그 첫 번째 ‘다른 것’은 조금 서글픕니다. 산골의 젊은이들이 마지막으로 팔 수 있었던 자산, 바로 자기 몸이었거든요. 산골에서 가장 흔한 자원은 결국 사람이었으니까요.
  scene:
    kind: quote
    text: 마지막 자산, [[자기 몸]]
    by: 용병의 시대로
  sync:
    at:
    - 0
    - 젊은이들이
    - 몸이었거든요.
- say: 얼마나 많았을까요? swissinfo에 따르면 13세기부터 19세기까지 외국 군대에서 싸운 스위스인은 약 150만 명으로 추정됩니다. 정확한 숫자는 알 수 없지만, 규모가 엄청났던 건 분명하죠.
  source: swissinfo.ch (2011) · 추정치
  theme: dark
  scene:
    kind: bignum
    label: 외국 군대에서 싸운 스위스인
    to: 1500000
    unit: 명
    color: red
    sub: 13~19세기 · [[추정]]
  sync:
    at:
    - 0
    - 13세기부터
    - 150만
- say: 대가는 컸습니다. 같은 자료에 따르면 최대 20%가 탈영했고, 25에서 40%는 끝내 고향으로 돌아오지 못했습니다.
  source: swissinfo.ch (2011) · 추정치
  theme: dark
  scene:
    kind: bars
    title: 용병의 운명 (추정)
    sub: swissinfo · 13~19세기
    unit: '%'
    items:
    - label: 탈영 (최대)
      value: 20
      color: sky
    - label: 돌아오지 못함 (최대)
      value: 40
      color: red
  sync:
    at:
    - 0
    - 20%가
    - 40%는
- say: 그리고 1515년 9월, 이 용병 장사의 한계가 드러나는 전투가 벌어집니다. 밀라노 근처의 작은 마을, 마리냐노입니다. 스위스 용병의 명성이 가장 높던 바로 그때였죠.
  source: 스위스 역사사전(HLS), Marignano
  scene:
    kind: year
    text: '1515'
    up: 프랑스 왕 프랑수아 1세
    down: 스위스 연합군
    to: 마리냐노
  sync:
    at:
    - 0
    - 1515년
    - 마리냐노입니다.
- say: 스위스 쪽 전사자는 9천에서 1만 명. 돈을 받고 고용된 병력의 거의 절반이었습니다. 프랑스 쪽도 5천에서 8천 명을 잃었죠.
  source: 스위스 역사사전(HLS), Marignano
  scene:
    kind: bignum
    label: 마리냐노의 스위스 전사자
    from: 0
    to: 10000
    unit: 명
    color: red
    sub: 9천~1만 명 · [[병력의 거의 절반]]
  sync:
    at:
    - 0
    - 9천에서
    - 절반이었습니다.
    - 5천에서
- say: 월급쟁이에게 월급은 현대의 용병 수당과 닮았습니다. 몸이 건강하고, 회사가 나를 필요로 할 때만 들어오는 돈이니까요. 그래서 월급이 들어올 때 미래를 준비해야 합니다.
  theme: dark
  scene:
    kind: flip
    label: 월급의 정체
    from: 수당
    to: 자산
  sync:
    at:
    - 0
    - 용병
    - 회사가
- say: 16세기 유럽은 종교 갈등으로 들끓었습니다. 프랑스에서 개신교를 믿던 사람들, 위그노들은 박해를 피해 국경을 넘기 시작했죠.
  scene:
    kind: quote
    text: 신앙 때문에 [[쫓겨난]] 사람들
    by: 16세기 유럽
  sync:
    at:
    - 0
    - 위그노들은
- say: 그중 약 3천 명이 그대로 정착했는데, 이는 당시 제네바 인구의 30%에 해당하는 규모였습니다. 도시 사람 열 명 중 셋이 피난민 출신이 된 거죠.
  source: 스위스 역사사전(HLS), Refuge
  theme: dark
  scene:
    kind: waffle
    title: 정착한 피난민, 제네바 인구의
    sub: HLS · 16세기 후반
    groups:
    - label: 피난민 출신 정착민
      value: 30
      color: red
  sync:
    at:
    - 0
    - 3천
    - 30%에
    - 열
- say: 그리고 가장 큰 선물은 시계였습니다. 1550년부터 제네바로 온 위그노 피난민들은 휴대용 시계에 대한 깊은 기술을 함께 가지고 왔습니다.
  source: 스위스 역사사전(HLS), Uhrenindustrie
  scene:
    kind: year
    text: '1550'
    up: 위그노의 시계 기술
    down: 제네바의 금은 세공
    to: 시계 도시
  sync:
    at:
    - 0
    - 1550년부터
    - 시계에
- say: 쥐라의 농민들은 눈에 갇히는 긴 겨울 동안 집 안에서 시계 부품을 깎았습니다. 산골의 약점이던 긴 겨울이, 정밀 산업의 작업 시간이 된 거죠.
  scene:
    kind: flip
    label: 쥐라의 긴 겨울
    from: 약점
    to: 작업
  sync:
    at:
    - 0
    - 겨울
    - 작업
- say: 20세기 후반엔 더 큰 충격이 옵니다. 전자식 쿼츠 시계입니다. 시계 산업 종사자는 1960년대 중반 약 7만 명에서 1980년대 3만 명대로 줄었습니다.
  source: 스위스 역사사전(HLS), Uhrenindustrie
  theme: dark
  scene:
    kind: bars
    dir: v
    title: 스위스 시계 산업 종사자
    sub: 스위스 역사사전 · 쿼츠 위기
    unit: 만 명
    items:
    - label: 1960년대 중반
      value: 7
      color: navy
    - label: 1980년대 (3만~3만 5천)
      value: 3.5
      color: red
  sync:
    at:
    - 0
    - 쿼츠
    - 7만
    - 3만
- say: 내 돈에 옮겨 보면, 가장 오래가는 투자는 결국 내 머릿속 기술입니다. 그리고 그 기술도 쿼츠 위기처럼 낡을 수 있으니, 계속 고쳐 써야 하죠.
  scene:
    kind: flip
    label: 가장 오래가는 투자
    from: 종목
    to: 기술
  sync:
    at:
    - 0
    - 기술입니다.
    - 쿼츠
- say: 두 번째 이야기는, 오늘의 주인공처럼 여겨지는 그 이름. 스위스 비밀 은행입니다.
  chapter: 2장 · 비밀 은행의 진짜 역사
  theme: dark
  scene:
    kind: chapter
    kicker: 2장
    title: '비밀 은행의

      진짜 역사'
  sync:
    at:
    - 0
- say: 스위스 은행이 고객의 비밀을 지키는 건 오래된 관행이었습니다. 이 관행을 국가의 법으로 단단히 묶은 것이 1934년 은행법이죠. 이 법이 ‘스위스 비밀 은행’이라는 이름을 세계에 알리게 됩니다.
  source: Wikipedia, Federal Act on Banks and Savings Banks
  scene:
    kind: year
    text: '1934'
    up: 관행이던 비밀
    down: 대공황의 은행 위기
    to: 법
  sync:
    at:
    - 0
    - 관행이었습니다.
    - 1934년
- say: 그런데 이 법이 왜 만들어졌는지에 대해선 유명한 이야기가 하나 있습니다. 나치의 박해를 받던 유대인의 예금을 지키려고 만들었다는 거죠.
  theme: dark
  scene:
    kind: quote
    text: 유대인의 예금을 [[나치]]로부터 지키려고?
    by: 널리 알려진 설명
  sync:
    at:
    - 0
    - 나치의
    - 유대인의
- say: 로잔대학교의 역사학자 세바스티앵 게는 2000년 논문에서 이 설명을 정면으로 반박합니다. 그는 이 이야기를 ‘선전’이라고까지 불렀죠.
  source: JSTOR Daily(2015) — Guex, Business History Review(2000) 소개
  scene:
    kind: person
    role: 로잔대학교 역사학자
    name: 세바스티앵 게
    quote: 유대인 보호 기원설은 [[선전]]이다
  sync:
    at:
    - 0
    - 로잔대학교의
    - 2000년
    - 선전
- say: 비유하자면 은행 비밀은 아주 튼튼한 금고 자물쇠였습니다. 문제는 그 금고에 정직하게 번 돈만 들어온 건 아니었다는 거죠. 세금을 피한 돈도, 출처가 의심스러운 돈도 같은 자물쇠 뒤에 숨을 수 있었습니다.
  scene:
    kind: doc
    tag: 쉬운 비유
    meta: 은행 비밀 = 금고 자물쇠
    title: 자물쇠는 [[돈을 가리지 않는다]]
    lines:
    - 정직한 저축도 지키고
    - '[[세금을 피한 돈]]도 지켰다'
    - 그래서 결국 [[국제 압력]]이 왔다
  sync:
    at:
    - 0
    - 자물쇠였습니다.
    - 정직하게
- say: 2009년 2월 18일, 미국 법원은 UBS{{유비에스}}와 정부의 기소 유예 합의를 받아들였습니다. UBS{{유비에스}}는 벌금과 배상금 등으로 7억 8천만 달러를 내기로 했죠.
  source: 미국 법무부(DOJ) 증언문 (2009)
  theme: dark
