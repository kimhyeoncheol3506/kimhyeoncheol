#   1) 스위스 부자 이유, 비밀 은행이 아니었다｜월급쟁이가 배울 돈 원칙 7가지   ← title
#   2) 스위스 부자 이유｜산밖에 없던 나라가 약과 시계로 세계 최상위권이 된 과정
#   3) 스위스 부자 이유, 은행 비밀이 끝난 2018년 이후에도 부자인 까닭
