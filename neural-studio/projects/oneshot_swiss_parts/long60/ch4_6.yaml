scenes:
  # ═════════════ 4장 · 중립과 연방제 ═════════════
  - say: "네 번째 이야기는, 싸우지 않기로 한 나라와, 말도 종교도 다른 사람들이 한 나라에서 함께 사는 법에 관한 것입니다. 둘 다 스위스의 부와 깊이 이어져 있습니다."
    chapter: "4장 · 중립과 연방제"
    theme: dark
    scene: {kind: chapter, kicker: "4장", title: "중립과\n연방제"}
    sync: {at: [0]}
  - say: "스위스 하면 중립국이 먼저 떠오르죠. 그런데 중립은 정확히 언제부터였을까요? 이 질문의 답은 생각보다 복잡하고, 학자들 사이에서도 의견이 갈립니다."
    scene: {kind: quote, text: "중립은 [[언제부터]]였을까", by: "4장의 질문"}
    sync: {at: [0, "중립국이", "언제부터였을까요?"]}
  - say: "역사학자 올리비에 메우리는 마리냐노를 중립의 출발로 보는 건 ‘무리’라고 말합니다. 마리냐노엔 모든 칸톤이 있었던 것도 아니라는 거죠."
    source: "swissinfo.ch (2015), 역사학자 올리비에 메우리 인터뷰"
    theme: dark
    scene: {kind: person, role: "스위스 역사학자 (swissinfo 인터뷰)", name: "올리비에 메우리", quote: "마리냐노를 중립의 시작으로 보는 건 [[무리]]다"}
    sync: {at: [0, "메우리는", "칸톤이"]}
  - say: "그는 대신 1648년 베스트팔렌 조약을 독립 인정의 첫걸음으로 꼽습니다. 30년 전쟁을 끝낸 이 조약에서, 유럽은 스위스를 독립된 나라로 받아들이기 시작했죠."
    source: "swissinfo.ch (2015)"
    scene: {kind: year, text: "1648", up: "30년 전쟁의 끝", down: "제국의 그늘", to: "독립 인정"}
    sync: {at: [0, "1648년", "30년", "독립된"]}
  - say: "그러나 평화는 오래가지 않았습니다. 1798년 프랑스 혁명군이 스위스를 침공했고, 이후 나폴레옹은 19개 칸톤으로 이뤄진 나라의 틀을 새로 짜 줍니다."
    source: "swissinfo.ch (2015)"
    theme: dark
    scene: {kind: quote, text: "1798년, 중립의 [[실패]]", by: "프랑스의 침공과 나폴레옹의 중재"}
    sync: {at: [0, "1798년", "나폴레옹은", "19개"]}
  - say: "중립을 선언해도 강대국이 무시하면 소용이 없다는 걸, 스위스는 이때 뼈저리게 배웁니다. 중립은 남이 인정해 줘야 완성되는 거였죠."
    scene: {kind: doc, tag: "1798년의 교훈", meta: "중립의 조건", title: "중립은 [[인정받아야]] 완성된다", lines: ["혼자 선언만으로는 [[부족]]", "강대국들의 [[보증]]이 필요", "그 기회가 [[빈 회의]]에서 온다"]}
    sync: {at: [0, "강대국이", "인정해"]}
  - say: "나폴레옹이 무너진 뒤 열린 빈 회의. 1815년 3월 20일, 유럽 열강은 스위스의 영구 중립이 유럽 전체의 이익에 맞는다고 선언합니다."
    source: "swissinfo.ch (2015)"
    theme: dark
    scene: {kind: photo, photo: "@congress_vienna", name: "빈 회의 (1814~1815)", role: "스위스의 영구 중립이 국제적으로 인정된 자리"}
    sync: {at: [0]}
  - say: "같은 선언은 22개 칸톤의 영토도 보장했습니다. 열강은 프랑스와 오스트리아 사이에서 스위스가 완충지대 역할을 해 주길 바랐던 거죠."
    source: "swissinfo.ch (2015)"
    scene: {kind: doc, tag: "1815년 3월 20일", meta: "빈 회의의 스위스 선언", title: "영구 중립은 [[유럽의 이익]]", lines: ["스위스의 [[영구 중립]] 선언", "22개 칸톤의 영토 보장", "강대국 사이의 [[완충지대]]"]}
    sync: {at: [0, "22개", "완충지대"]}
  - say: "비유하자면 중립은, 싸움 잦은 동네 한가운데에 있는 편의점과 같습니다. 어느 편도 들지 않으니, 모두가 안심하고 드나들 수 있죠."
    theme: dark
    scene: {kind: quote, text: "모두가 드나드는 [[동네 편의점]]", by: "중립을 쉽게 보면"}
    sync: {at: [0, "편의점과", "안심하고"]}
  - say: "편의점 주인은 싸움에 끼지 않는 대신, 누구에게나 물건을 팝니다. 중립국 스위스도 전쟁 중인 양쪽 모두와 거래하고, 양쪽의 돈을 맡을 수 있었죠."
    scene: {kind: stack, logo: "NEUTRAL SHOP", label: "중립이 [[돈]]이 되는 방식", cards: [{meta: "거래", text: "양쪽 모두와 [[무역]]"}, {meta: "보관", text: "양쪽의 [[돈]]을 맡는 금고"}, {meta: "중재", text: "협상과 [[국제기구]]의 무대"}]}
    sync: {at: [0, "편의점", "양쪽"]}
  - say: "물론 중립에는 비판도 따릅니다. 옳고 그름이 분명한 전쟁에서도 편을 들지 않는 게 옳으냐는 거죠. 전쟁 중 돈을 맡아 준 일은 훗날 큰 논란이 되기도 했습니다."
    theme: dark
    scene: {kind: flip, label: "중립을 보는 두 시선", from: "지혜", to: "회피"}
    sync: {at: [0, "비판도", "논란이"]}
  - say: "스위스 외교부는 중립이 1848년부터 연방 헌법에 들어가 있고, 1907년 10월 18일 헤이그 협약으로 국제법에도 정리됐다고 설명합니다."
    source: "스위스 연방 외교부(EDA), Neutrality"
    scene: {kind: timeline, title: "스위스 중립의 [[이정표]]", years: [1648, 1798, 1815, 1848, 1907, 2026], events: [{year: 1648, text: "독립 인정의 첫걸음"}, {year: 1798, text: "프랑스의 침공"}, {year: 1815, text: "[[영구 중립]] 선언"}, {year: 1848, text: "연방 헌법"}, {year: 1907, text: "헤이그 협약"}, {year: 2026, text: "국민투표"}]}
    sync: {at: [0, "1848년부터", "1907년", "헤이그"]}
  - say: "그리고 2026년 9월 27일, 중립을 헌법에 더 엄격하게 못 박자는 국민 발의안이 투표에 붙었습니다. 결과는 반대 70.15%로 부결이었죠."
    source: "스위스 연방 외교부(EDA), Neutrality"
    theme: dark
    scene: {kind: bars, title: "2026년 중립 국민 발의안 투표", sub: "연방 외교부 · 2026년 9월 27일", unit: "%", items: [{label: "반대", value: 70.15, color: navy}, {label: "찬성", value: 29.85, color: red}]}
    sync: {at: [0, "2026년", "70.15%로"]}
  - say: "중립을 버리자는 게 아니라, 어떤 중립이어야 하느냐를 두고 사회가 계속 토론한다는 뜻입니다. 이 토론과 투표 자체가 스위스식 제도의 일부죠."
    scene: {kind: quote, text: "중립도 [[투표]]로 다시 묻는다", by: "스위스식 토론"}
    sync: {at: [0, "토론한다는", "투표"]}
  - say: "이제 연방제입니다. 스위스의 정치 체제는 1848년 연방 헌법 위에 서 있습니다. 1291년의 ‘따로 또 같이’가 마침내 국가의 설계도가 된 거죠."
    source: "스위스 연방 외교부 aboutswitzerland, Political system"
    theme: dark
    scene: {kind: photo, photo: "@bundeshaus", name: "베른의 연방 의사당", role: "1848년 연방 헌법이 세운 나라의 중심"}
    sync: {at: [0]}
  - say: "스위스엔 독일어, 프랑스어, 이탈리아어, 로만슈어를 쓰는 사람들이 함께 삽니다. 가톨릭과 개신교 지역도 섞여 있죠. 하나로 묶기 어려운 나라였습니다."
    scene: {kind: doc, tag: "다양함", meta: "하나로 묶기 어려운 나라", title: "말도 종교도 [[다르다]]", lines: ["독일어 · 프랑스어 · 이탈리아어 · [[로만슈어]]", "가톨릭과 개신교 지역", "그래서 필요했던 [[연방제]]"]}
    sync: {at: [0, "독일어,", "가톨릭과"]}
  - say: "그래서 권력은 세 층으로 나뉩니다. 연방, 26개 칸톤, 그리고 2,110개 기초 자치단체죠. 가장 작은 단위가 가장 가까운 살림을 맡습니다."
    source: "스위스 연방 외교부 aboutswitzerland, Political system"
    theme: dark
    scene: {kind: stairs, title: "스위스 권력의 [[세 층]]", sub: "연방 외교부 · 단위 개수", unit: "개", steps: [{label: "연방", value: 1}, {label: "칸톤", value: 26}, {label: "기초 자치단체", value: 2110}]}
    sync: {at: [0, "연방,", "26개", "2,110개"]}
  - say: "원칙은 아래에서 위로입니다. 꼭 필요할 때만 권한을 칸톤과 연방으로 올려 보낸다는 거죠. 학교와 경찰, 세금의 상당 부분을 칸톤이 정합니다."
    source: "스위스 연방 외교부 aboutswitzerland, Political system"
