  - say: "그 사이 일본이 전자시계 생산에서 스위스를 앞질렀습니다. 기술을 먼저 갖고도, 익숙한 성공 방식에 머문 대가였습니다. 잘나갈 때일수록 변화를 놓치기 쉽다는 교훈이죠."
