  - say: "3장의 교훈입니다. 스위스는 남이 버린 사람들을 받아들였고, 그 사람들의 기술이 수백 년 동안의 먹거리가 됐습니다. 사람을 받아들인 선택이 가장 큰 투자였던 셈입니다."
