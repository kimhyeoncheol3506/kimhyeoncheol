  - say: "하지만 위기는 여러 번 왔습니다. 19세기 미국의 기계식 대량 생산이 치고 들어오자, 스위스 시계의 미국 수출은 1872년 1,830만 프랑에서 몇 년 만에 4백만 프랑 안팎으로 줄었죠."
