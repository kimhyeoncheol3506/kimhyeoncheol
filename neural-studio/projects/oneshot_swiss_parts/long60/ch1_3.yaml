  - say: "일은 점점 잘게 나뉘었습니다. 1788년 제네바의 직업 통계엔 시계 관련 직업이 30가지가 넘고, 1867년 라쇼드퐁의 조사에는 54가지나 등장합니다."
    source: "스위스 역사사전(HLS), Uhrenindustrie"
