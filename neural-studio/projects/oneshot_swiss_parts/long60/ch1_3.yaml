  - say: "바젤의 비단 산업은 훗날 거대한 나비 효과를 낳습니다. 비단을 물들일 염료가 필요했고, 그 염료 공장이 제약 회사로 자라거든요. 6장의 이야기입니다."
    scene: {kind: stack, logo: "BUTTERFLY EFFECT", label: "바젤의 [[나비 효과]]", cards: [{meta: "17세기", text: "피난민의 [[비단]]"}, {meta: "19세기", text: "비단을 물들일 [[염료 공장]]"}, {meta: "20세기", text: "세계적인 [[제약 회사]]"}]}
    sync: {at: [0, "비단", "염료", "제약"]}
  - say: "다시 시계로 돌아가 볼까요? 17세기 말부터 제네바 장인들은 마무리 작업만 직접 하고, 부품 만드는 일은 쥐라산맥의 골짜기 마을에 맡깁니다."
