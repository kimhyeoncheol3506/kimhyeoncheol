  - say: "오늘날 화려한 줄무늬 제복은 관광객의 사진 명소가 됐지만, 그 뒤에는 가난한 산골의 수백 년 역사가 숨어 있습니다."
    theme: dark
    scene: {kind: quote, text: "화려한 제복 뒤의 [[가난]]", by: "교황 근위대"}
    sync: {at: [0, "제복은", "가난한"]}
  - say: "개인적으로 외국 군대에 들어간 스위스인은 그 뒤에도 있었습니다. 연방기록보관소는 1831년 창설 이후 프랑스 외인부대에서 복무한 스위스인을 최대 4만 명으로 봅니다."
    source: "스위스 연방기록보관소(BAR)"
    scene: {kind: bignum, label: "프랑스 외인부대의 스위스인 (1831년 이후)", to: 40000, unit: "명", color: navy, sub: "연방기록보관소 · [[최대치]]"}
    sync: {at: [0, "1831년", "4만"]}
  - say: "물론 이 무렵엔 이미 용병이 스위스 경제의 중심이 아니었습니다. 그 자리는 시계와 직물, 그리고 막 자라나던 화학 공장들이 채우고 있었죠."
