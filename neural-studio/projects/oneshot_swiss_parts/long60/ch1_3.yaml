scenes:
  # ═════════════ 1장 · 가진 게 산뿐이던 나라 ═════════════
  - say: "첫 번째 이야기는 은행이 아니라, 산에서 시작합니다. 스위스라는 나라가 처음 어떤 조건에서 출발했는지부터 보겠습니다."
    chapter: "1장 · 가진 게 산뿐이던 나라"
    theme: dark
    scene: {kind: chapter, kicker: "1장", title: "가진 게\n산뿐이던 나라"}
    sync: {at: [0]}
  - say: "스위스 하면 맑은 호수, 비싼 시계, 높은 연봉이 떠오르죠. 하지만 수백 년 전 이 나라의 출발점은, 지금의 이미지와 정반대였습니다."
    scene: {kind: quote, text: "출발점은 [[정반대]]였다", by: "1장의 시작"}
    sync: {at: [0, "연봉이", "정반대였습니다."]}
  - say: "스위스의 면적은 4만 1,285제곱킬로미터. 그 가운데 알프스가 약 58%, 중부 고원이 약 31%, 쥐라산맥이 약 11%를 차지합니다."
    source: "스위스 연방 외교부 aboutswitzerland, Geography"
    scene: {kind: pie, title: "스위스 땅은 [[대부분 산]]", sub: "면적 41,285㎢ · 연방 외교부", items: [{label: "알프스", value: 58, color: navy}, {label: "중부 고원", value: 31, color: sky}, {label: "쥐라산맥", value: 11, color: pink}]}
    sync: {at: [0, "알프스가", "중부", "쥐라산맥이"]}
  - say: "쥐라산맥까지 합치면 땅의 3분의 2 이상이 산입니다. 사람이 모여 살고 농사를 지을 만한 곳은 사실상 중부 고원 하나뿐이었죠. 그나마 그 땅도 넓지 않았습니다."
    theme: dark
    scene: {kind: photo, photo: "@alps_village", name: "골짜기에 기대어 사는 마을", role: "알프스의 산골 풍경 (1890년대 컬러 사진)"}
    sync: {at: [0, "쥐라산맥까지", "중부"]}
  - say: "땅의 절반은 해발 1,080미터보다 높습니다. 가장 높은 봉우리 두푸르슈피체는 4,634미터에 이르죠. 나라의 절반이 웬만한 산꼭대기 높이에 있는 셈입니다."
    source: "스위스 연방 외교부 aboutswitzerland, Geography"
    scene: {kind: bignum, label: "땅의 절반이 이보다 높다", to: 1080, unit: "m", color: navy, sub: "최고봉 두푸르슈피체 [[4,634m]]"}
    sync: {at: [0, "1,080미터보다", "두푸르슈피체는", "산꼭대기"]}
  - say: "농사지을 평지는 좁고 겨울은 깁니다. 바다로 나가는 항구도 없었죠. 대항해 시대, 바다를 통한 무역 경쟁에는 처음부터 끼기 어려운 자리였습니다."
    scene: {kind: doc, tag: "출발 조건", meta: "근대 이전의 스위스", title: "가진 것이 [[없는]] 나라", lines: ["좁은 평지, 긴 겨울", "바다로 나가는 [[항구 없음]]", "석탄·철 같은 지하자원도 빈약"]}
    sync: {at: [0, "평지는", "항구도", "대항해"]}
  - say: "산업혁명의 연료였던 석탄도, 철광석도 넉넉하지 않았습니다. 영국처럼 땅속 자원으로 공장을 돌리는 길은 처음부터 막혀 있었던 거죠."
    theme: dark
    scene: {kind: flip, label: "영국과 다른 출발", from: "석탄", to: "없음"}
    sync: {at: [0, "석탄도", "영국처럼"]}
  - say: "대신 이 나라엔 물이 있었습니다. 유럽 민물의 약 6%가 스위스에 모여 있어, 흔히 ‘유럽의 물탱크’라고 불리죠."
    source: "스위스 연방 외교부 aboutswitzerland, Geography"
    scene: {kind: gauge, title: "유럽 민물 가운데 스위스 몫", sub: "연방 외교부 · 약 6%", value: 6, color: navy, label: "‘유럽의 물탱크’"}
    sync: {at: [0, "6%가", "물탱크"]}
  - say: "이 물은 훗날 수력으로 공장을 돌리는 힘이 됩니다. 하지만 중세 산골 사람들에게 그건 아직 먼 이야기였고, 당장 먹을 것이 부족했습니다."
    theme: dark
    scene: {kind: quote, text: "물은 있었지만, [[먹을 것]]은 부족했다", by: "중세의 산골"}
    sync: {at: [0, "수력으로", "중세", "먹을"]}
  - say: "이런 산골에서 스위스의 씨앗이 뿌려집니다. 1291년 8월 초, 우리와 슈비츠, 운터발덴의 골짜기 공동체들이 서로 돕기로 약속하는 문서를 씁니다."
    source: "스위스 연방정부(admin.ch), Bundesbrief von 1291"
    scene: {kind: year, text: "1291", up: "서로 돕기로", down: "각자 버티기", to: "동맹"}
    sync: {at: [0, "1291년", "서로", "문서를"]}
  - say: "이른바 연방 헌장입니다. 스위스에서 가장 오래된 헌법 문서로 여겨지고, 지금도 8월 1일 건국 기념일의 근거가 되는 문서죠. 스위스 사람들에겐 일종의 출생증명서 같은 문서입니다."
    source: "스위스 연방정부(admin.ch), Bundesbrief von 1291"
    theme: dark
    scene: {kind: photo, photo: "@bundesbrief", name: "1291년 연방 헌장", role: "우리·슈비츠·운터발덴의 상호 원조 약속"}
    sync: {at: [0]}
  - say: "내용의 핵심은 간단합니다. 누군가 폭력이나 부당한 일을 당하면, 골짜기들이 힘을 합쳐 함께 맞선다는 약속이었죠. 작은 공동체들의 생존 보험이었습니다."
    scene: {kind: doc, tag: "1차 문헌", meta: "연방 헌장 · 1291년", title: "[[함께]] 맞선다", lines: ["폭력이나 부당한 일을 당하면", "골짜기 공동체들이 [[서로 돕는다]]", "작고 가난한 공동체의 [[생존 보험]]"]}
    sync: {at: [0, "폭력이나", "함께", "보험이었습니다."]}
  - say: "다만 이 문서는 1758년에야 문서고에서 다시 발견됐고, 정확한 제작 시기를 두고도 논쟁이 있습니다. 후대에 건국 신화로 다듬어진 면도 있다는 거죠."
    source: "Wikipedia 'Federal Charter of 1291' · Bundesbrief Museum"
    theme: dark
    scene: {kind: quote, text: "사실과 [[신화]] 사이의 문서", by: "학계 평가"}
    sync: {at: [0, "1758년에야", "신화로"]}
  - say: "그래서 이 영상에서는 1291년을 ‘정확한 건국일’이라기보다, 산골 공동체들이 손을 잡기 시작한 상징적인 해로 보겠습니다. 중요한 건 날짜보다 그 안에 담긴 약속이니까요."
    scene: {kind: doc, tag: "이 영상의 관점", meta: "1291년을 읽는 법", title: "건국일보다 [[상징]]", lines: ["정확한 연대는 [[논쟁 중]]", "그래도 분명한 것: 골짜기들의 [[동맹]]", "‘함께 지키기’라는 원칙의 상징"]}
    sync: {at: [0, "1291년을", "상징적인"]}
  - say: "비유하자면 이렇습니다. 혼자서는 월세도 버거운 사람들이 집 한 채를 함께 얻은 겁니다. 방은 각자 따로 쓰되, 현관 문단속은 같이 하는 거죠."
    theme: dark
    scene: {kind: stack, logo: "SHARE HOUSE", label: "1291년 동맹을 [[쉽게]] 보면", cards: [{meta: "각자", text: "방은 [[따로]] — 골짜기마다 자치"}, {meta: "함께", text: "문단속은 [[같이]] — 외부 위협에 공동 대응"}]}
    sync: {at: [0, "월세도", "방은", "문단속은"]}
  - say: "이 ‘따로 또 같이’의 원칙은 7백 년 넘게 이어져, 지금의 스위스 연방제로 자랍니다. 이 이야기는 4장에서 다시 만나겠습니다. 지금은 이 원칙만 기억해 두세요."
    scene: {kind: quote, text: "따로 또 [[같이]]", by: "스위스 연방제의 씨앗"}
    sync: {at: [0, "연방제로"]}
  - say: "그런데 동맹을 맺었다고 배가 부르진 않습니다. 외적을 함께 막는 건 해결됐지만, 산골 마을의 더 큰 문제는 결국 먹고사는 일이었죠."
    theme: dark
    scene: {kind: flip, label: "동맹 다음의 문제", from: "안보", to: "밥벌이"}
    sync: {at: [0, "동맹을", "먹고사는"]}
  - say: "사람들은 산이 허락한 것으로 살았습니다. 소를 키워 치즈를 만들고, 알프스를 넘는 상인들의 길을 안내하고 짐을 날랐죠. 산과 날씨를 잘 아는 것 자체가 기술이었습니다."
    scene: {kind: doc, tag: "산골의 생계", meta: "중세~근세", title: "산이 [[허락한]] 일", lines: ["소를 키우고 [[치즈]]를 만들기", "알프스 고개를 넘는 상인의 [[길잡이]]", "짐 나르기와 통행 관리"]}
    sync: {at: [0, "치즈를", "길을"]}
  - say: "치즈는 산골의 지혜가 담긴 저장 식품이었습니다. 여름 풀을 먹고 짠 우유를, 오래 두고 먹을 수 있는 형태로 바꾼 거죠. 시간을 견디는 자산을 만든 셈입니다."
    theme: dark
    scene: {kind: quote, text: "치즈는 [[시간을 견디는]] 자산", by: "산골의 지혜"}
    sync: {at: [0, "치즈는", "자산을"]}
  - say: "특히 고트하르트 고개는 북쪽 독일 땅과 남쪽 이탈리아를 잇는 지름길이었습니다. 이 길목을 지키는 마을에는 통행료와 운송비가 들어왔죠."
    theme: dark
    scene: {kind: photo, photo: "@gotthard_pass", name: "고트하르트 고개", role: "남북 유럽을 잇던 알프스의 길목"}
    sync: {at: [0]}
  - say: "길목이라는 위치 자체가 돈이 된 겁니다. 지금 말로 하면, 유동 인구가 많은 사거리의 가게 자리를 차지한 셈이죠. 지리가 곧 사업 모델이었던 겁니다."
    scene: {kind: quote, text: "길목은 [[목 좋은 가게 자리]]", by: "알프스 고개를 쉽게 보면"}
    sync: {at: [0, "길목이라는", "사거리의"]}
  - say: "하지만 길목 장사만으로 늘어나는 인구를 모두 먹여 살리기엔 부족했습니다. 남는 젊은이들은 일자리를 찾아 산 밖으로 나가야 했죠."
    theme: dark
    scene: {kind: quote, text: "남는 사람은 [[밖으로]] 나가야 했다", by: "산골의 현실"}
    sync: {at: [0, "길목", "밖으로"]}
  - say: "참고로 오늘날 스위스 인구는 2024년 말 기준 약 905만 명입니다. 지금도 그리 큰 나라는 아니죠. 옛날엔 훨씬 작고 가난했습니다."
    source: "스위스 연방통계청 잠정치 (swissinfo 2025-04-03 보도)"
    scene: {kind: bignum, label: "스위스 상주 인구 (2024년 말)", to: 9048900, unit: "명", color: navy, sub: "작은 나라, [[큰 소득]]"}
    sync: {at: [0, "905만", "가난했습니다."]}
