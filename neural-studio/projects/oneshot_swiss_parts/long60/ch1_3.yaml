    sync: {at: [0]}
  - say: "쥐라의 농민들은 눈에 갇히는 긴 겨울 동안 집 안에서 시계 부품을 깎았습니다. 산골의 약점이던 긴 겨울이, 정밀 산업의 작업 시간이 된 거죠."
    scene: {kind: flip, label: "쥐라의 긴 겨울", from: "약점", to: "작업"}
    sync: {at: [0, "겨울", "작업"]}
  - say: "뇌샤텔 산악 지대에는 조합이 없어 만들고 파는 일이 자유로웠습니다. 그래서 많은 제네바 시계상이 그곳에 생산을 맡겼다고 스위스 역사사전은 설명합니다."
    source: "스위스 역사사전(HLS), Uhrenindustrie"
    theme: dark
    scene: {kind: quote, text: "규제가 없는 곳으로 [[일감]]이 흘렀다", by: "뇌샤텔 산악 지대의 시계 산업"}
    sync: {at: [0, "조합이", "제네바"]}
  - say: "제네바 시계의 전성기는 1770년부터 1786년 무렵이었습니다. 제네바 시계는 멀리 동방과 아메리카 식민지까지 팔려 나갔죠."
