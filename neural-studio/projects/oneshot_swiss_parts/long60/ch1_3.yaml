  - say: "바로 바티칸의 교황 근위대입니다. 16세기 초부터 교황을 지켜 온 이 부대가, 지금 남아 있는 유일한 스위스 용병 부대입니다. 수백 년 용병 역사의 마지막 흔적인 셈이죠."
