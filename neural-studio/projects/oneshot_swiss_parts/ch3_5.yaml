- say: 먼저 숫자부터 보겠습니다. 스위스 관세국경청에 따르면, 2024년 스위스의 수출은 약 2,830억 프랑으로 사상 최대였습니다. 금 거래는 뺀 숫자입니다.
  source: BAZG, Swiss foreign trade 2024 (경기 기준 합계, 금 거래 제외)
