  #       1999년: 1998.12.31 종가 2,192.69 → 1999.12.31 4,069.31 = +85.6% → '약 86%'
  #       2000.4.7 종가 4,446.45 → 4.14 3,321.29 = −25.3% (위키 '한 주 25%'와 일치)
  #       해마다 첫 거래일 종가(선 그래프 점): 1997 1,281 · 1998 1,582 · 1999 2,208 · 2000 4,131 · 2001 2,292 · 2002 1,979 · 2003 1,385 · 2004 2,007
