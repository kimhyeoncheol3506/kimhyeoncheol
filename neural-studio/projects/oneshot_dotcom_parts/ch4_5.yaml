  - say: "그 중심에 엔비디아가 있습니다. 2025년, 세계 최초로 시가총액 5조 달러를 넘은 회사죠."
    source: "CNN (2026.11.9 보도)"
    scene: {kind: bignum, label: "엔비디아 시가총액, [[세계 최초]] (2025년)", from: 0, to: 5, unit: "조 달러", color: navy, sub: "CNN 2026년 11월 9일 보도"}
