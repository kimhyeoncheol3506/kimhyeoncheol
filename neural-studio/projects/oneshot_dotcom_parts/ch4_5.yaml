scenes:
  # ═════════════ 4장 ═════════════
  - say: "네 번째 이야기는 지금입니다. 2022년 챗지피티가 나온 뒤, 인공지능이 세상을 바꾼다는 말이 다시 시장을 움직이고 있습니다."
    chapter: "4장 · 지금의 AI 붐, 같은 점과 다른 점"
    theme: dark
    scene: {kind: chapter, kicker: "4장", title: "지금의 AI 붐\n같은 점과 다른 점"}
