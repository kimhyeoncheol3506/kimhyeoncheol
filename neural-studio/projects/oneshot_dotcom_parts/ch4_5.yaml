    theme: dark
    scene: {kind: doc, tag: "원칙 여섯", meta: "코스닥과 나스닥에서 배우기", title: "[[한 바구니]]에 담지 않기", lines: ["나라 나누기", "업종 나누기", "자산 종류 나누기"]}
