scenes:
  # ───────────── 후킹: 통화 장면으로 시작(콜드오픈)
  - say: "안녕하세요, 김뉴럴 님의 AI 비서예요. 이번 주 토요일 두 시에 예약할 수 있을까요? 이 전화, 사람이 아니라 AI가 건 거예요."
    instruct: "앞 두 문장은 AI 비서가 전화하듯 상냥하고 또박또박, 마지막 문장은 깜짝 놀라게 하듯 힘 있게."
    scene:
      kind: call
      to: 뉴럴 미용실
      sub: AI가 대신 예약 전화 중 · 예시 화면
      label: "이 전화,\n[[AI가 걸었어요]]"
      done: 토요일 2시 예약 완료
      lines:
        - {who: ai, text: "안녕하세요, 김뉴럴 님의 AI 비서예요."}
        - {who: ai, text: "이번 주 토요일 2시 예약할 수 있을까요?"}
        - {who: other, text: "네, 가능해요!"}
    sync: {at: [0, 0.4, "이번", "예약할", "이"]}

  - say: "컴퓨터에서는 AI가 척척 다 해 주는데, 폰만 켜면 여전히 내가 다 해야 했죠. 전화, 예약, 서류 떼기까지요."
    instruct: "공감하듯 웃음 섞어, 뒷부분은 살짝 한숨."
    scene: {kind: hook, small: "그동안은", line1: "컴퓨터는 AI가", line2: "[[폰은 아직 내가]]", fx: glitch}
    sync: {at: [0, "컴퓨터에서는", "폰만"], beats: ["서류"]}

  - say: "그런데 요즘 앱스토어 생산성 1위에 오른 앱이 있어요. 전화까지 대신 걸어 주는 AI 비서, 피클이에요."
    source: "App Store (2026-11-05 확인)"
    instruct: "신나게, '피클'에 힘을 준다."
    scene: {kind: number, tag: 앱스토어 생산성, label: "지금 순위", to: 1, unit: 위, sub: "전화까지 대신 거는 [[AI 비서]]"}
    sync: {at: [0, "앱스토어", "1위에"], beats: ["피클이에요."]}

  - say: "결론부터 말할게요. 호들갑이냐고요? 아니요, 써 볼 만해요. 단, 꼭 알고 써야 할 게 있어요."
    instruct: "결론을 먼저 던지듯 단호하게, 질문은 끝을 올린다."
    scene: {kind: hook, small: "결론부터", line1: "호들갑? 아니요", line2: "[[써 볼 만해요]]", fx: stamp}
    sync: {at: [0, "호들갑이냐고요?", "써"], beats: ["꼭"]}

  - say: "중학생도 이해할 수 있게 쉽고 빠르게 정리해 볼게요. 피클, 시작합니다."
    instruct: "영화 예고편처럼 낮고 힘 있게."
    scene: {kind: intro, kicker: "전화까지 대신 걸어 주는 AI 비서", title: "Pickle", sub: "피클 · [[무료 AI 비서 총정리]]"}
    sync: {at: [0, "쉽고", "피클,"]}

  - say: "오늘 순서는요, 피클이 뭔지, 시작하는 법, 대신 해 주는 일, 뮤즈·닷츠와 비교, 아쉬운 점, 그리고 꼭 지킬 점이에요."
    scene:
      kind: agenda
      items:
        - {slash: /what, text: "피클이 뭐예요?"}
        - {slash: /start, text: 시작하는 법}
        - {slash: /do, text: 대신 해 주는 일}
        - {slash: /vs, text: "뮤즈 · 닷츠와 비교"}
        - {slash: /cons, text: 아쉬운 점 3가지}
        - {slash: /safe, text: 꼭 지킬 점}
    sync: {at: [0, "뭔지,", "시작하는", "대신", "뮤즈·닷츠와", "아쉬운", "꼭"]}

  # ───────────── PART 01 /what
  - say: "첫 번째, 피클이 도대체 뭔지부터 볼게요."
    chapter: "PART 01 · 피클이 뭐예요?"
    scene: {kind: part, num: PART 01, slash: /what, title: "피클이 뭐예요?"}
    sync: {at: [0, "피클이"], beats: ["도대체"]}

  - say: "챗지피티 같은 AI는 물어보면 답을 해 주죠. 피클은 한 걸음 더 가요. 답만 하는 게 아니라, 나 대신 직접 움직여요."
    source: "App Store 앱 설명"
    scene: {kind: split, left: {glyph: "💬", title: 답하는 AI, lines: ["물어보면 대답", "움직이는 건 [[내가]]"]}, right: {glyph: "🏃", title: 피클, lines: ["부탁하면 직접", "움직이는 건 [[피클이]]"]}}
    sync: {at: [0, "챗지피티", "피클은"], beats: ["직접"]}

  - say: "웹사이트로 되는 일은 피클이 자기 전용 인터넷 창에서 처리하고, 웹으로 안 되는 일은 직접 전화를 걸어요. 내 폰 화면을 몰래 조종하는 방식은 아니에요."
    source: "피클 도움말 · 브라우저 넘겨받기"
    scene: {kind: flow, tag: 이렇게 일해요, label: "인터넷 창 + [[전화]]", nodes: [{glyph: "💬", name: 채팅으로 부탁, sub: 말하듯이}, {glyph: "🌐", name: 피클 전용 인터넷 창, sub: 예약 · 주문 · 서류}, {glyph: "📞", name: 안 되면 전화, sub: 피클이 직접}]}
    sync: {at: [0, "웹사이트로", "전용", "전화를"], beats: ["몰래"]}

  - say: "만든 곳도 궁금하죠? 실리콘밸리에 있는 한국인 창업팀이에요. 유명한 스타트업 학교인 와이콤비네이터 출신이고, 2025년에 투자금 60억 원을 받았어요."
    source: "Y Combinator · 플래텀 (2025-06-05)"
    instruct: "믿을 만한 정보를 짚어 주듯 또박또박."
    scene: {kind: icons, tag: "이 회사, 믿어도 돼?", label: "만든 곳 [[살펴보기]]", items: [{glyph: "🇰🇷", name: 한국인 창업팀}, {glyph: "YC", name: 와이콤비네이터 출신}, {glyph: "60억", name: "2025년 시드 투자", color: "#3DDC6A"}]}
    sync: {at: [0, "한국인", "와이콤비네이터", "60억"]}

  - say: "정리하면, 피클은 답하는 AI가 아니라 대신 해 주는 AI예요. 인터넷 창으로 안 되면 전화까지 걸죠."
    scene: {kind: recap, slash: /what, items: [{k: 정체, v: "대신 해 주는 [[AI 비서]]"}, {k: 일하는 법, v: "전용 인터넷 창 + 전화"}, {k: 만든 곳, v: "한국인 창업팀 · YC 출신"}]}
    sync: {at: [0, "답하는", "인터넷", "전화까지"]}

  # ───────────── PART 02 /start
  - say: "두 번째, 그럼 어떻게 시작할까요?"
    chapter: "PART 02 · 시작하는 법"
    scene: {kind: part, num: PART 02, slash: /start, title: 시작하는 법}
    sync: {at: [0, "어떻게"], beats: ["두"]}

  - say: "반가운 소식부터요. 한국에서는 지금 무료예요. 대신 하루에 쓸 수 있는 양이 정해져 있고, 매일 새벽 4시에 다시 채워져요."
    source: "피클 도움말 · 크레딧 (2026-11-05)"
    scene: {kind: warn, tag: 요금, title: "한국은 [[지금 무료]]", lines: ["하루 사용량이 정해져 있어요", "매일 새벽 4시에 다시 채워짐"]}
    sync: {at: [0, "무료예요.", "하루에", "새벽"]}

