    sync: {at: [0, "희망일까요", "근거가"]}
  - say: "오늘은 국내 증권사 아홉 곳과 해외 증권사 네 곳의 2027년 전망을, 최근 10일 안에 나온 자료만 골라 정리했습니다."
    scene: {kind: intro, kicker: "국내 9곳 · 해외 4곳", title: "2027 코스피 전망", sub: "증권사 리서치센터 뷰 [[총정리]]"}
