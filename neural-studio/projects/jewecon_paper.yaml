title: 경제 속 유대인의 역사｜고리대금업자에서 월가까지, 3천 년 진짜 이야기와 음모론 팩트체크 (1시간 몰아보기)
intro_chapter: 인트로 · 0.2%의 사람들과 돈
voice:
  speed: 1.0
  instruct: 역사 다큐멘터리 해설자처럼 차분하고 또렷하게, 이야기를 들려주듯 따뜻하게. 숫자와 연도는 또박또박.
thumbnail:
  file: assets/thumbs/jewecon_thumb_A.png
summary: '세계 인구의 0.2%, 약 1,580만 명. 그런데 왜 ''돈'' 하면 유대인이 먼저 떠오를까요?

  고대의 농부에서 시작해 중세의 이자 금지와 길드 배제, 영국·프랑스·스페인의 추방, 암스테르담의 신용 네트워크, 궁정 유대인, 로스차일드와 워털루 신화, 리먼·골드만·쿤로브와 연준, 『시온 의정서』와 포드, 나치의 경제 수탈, 이스라엘 경제와 오늘의 데이터까지 1시간에 정리했습니다.

  결론부터 말하면, 유대인이 금융과 가까워진 건 ''피''가 아니라 ''역사'' 때문이었습니다. 학자들의 의견이 갈리는 부분은 영상 안에서 그렇다고 밝혔고, 모든 숫자의 출처는 아래에 적었습니다.

  '
