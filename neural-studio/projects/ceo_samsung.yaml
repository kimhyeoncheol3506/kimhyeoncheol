# CEO 시리즈 1편 · 삼성전자 — 모델 2(네온), 약 5분 (현철님 지정: 이 시리즈는 5분)
# 근거: plans/ceo_series/research/samsung_elec.md (사실마다 근거 2곳, DART 원문 우선). 그 파일에서 '확인'인 사실만 썼다.
