# CEO 시리즈 3편 · 에스엠(코스닥) — 모델 2(네온), 약 5분
# 근거: plans/ceo_series/research/sm.md (DART 대표이사변경 공시·분기보고서 원문 우선, 사실마다 근거 2곳). '확인' 사실 위주, 보도는 (보도).
# 쓰지 않은 것: 이연희 조카설(근거 없음), '농업기계공학과', 유영진 본명, SM기획 설립 연도(1985/1989 엇갈림), 탁영준 생일,
#   김범수 재판(2026-11-20 항소심 선고 전이라 결과가 바뀔 수 있어 제외), 11-18 시간외 상한가(시점 뉴스라 제외).
# 시가총액은 정규장 종가 87,900원 × 22,894,690주 = 약 2조 124억 원 기준(네이버 표시 2조 2,872억은 시간외 가격 기준).
