scenes:
  # ───────── 인트로 ─────────
  - say: "1995년 2월, 자본금 5천만 원으로 세운 회사가 있습니다."
    instruct: "첫마디부터 또렷하게, '5천만 원'에 힘을 준다."
    source: "DART 사업보고서 2000 · 연혁"
    scene: {kind: hook, small: "1995년 2월 14일 · 법인 설립", line1: "자본금 [[5천만 원]]", size: 130}
    sync: {at: [0, "5천만"]}
  - say: "그 회사 시가총액이 지금 약 2조 124억 원. 에스엠입니다."
    source: "정규장 종가 87,900원 × 발행주식 (채널 계산) · 2026-11-18"
    scene: {kind: number, label: "시가총액", from: 0, to: 20124, unit: "억 원", sub: "2026년 11월 18일 정규장 종가 기준 · [[(계산)]]"}
    sync: {at: [0, "2조"]}
  - say: "H.O.T.와 보아, 동방신기, 소녀시대, 에스파까지. 이 회사를 세운 사람은 1970년대 가수였습니다."
    source: "DART 분기보고서 2026.09 · 아이뉴스24 (보도)"
    scene: {kind: hook, small: "K팝 회사를 세운 사람", line1: "1970년대", line2: "[[가수 출신]]"}
    sync: {at: [0, "보아", "가수였습니다"]}
  - say: "그런데 그 창업자 이수만은, 지금 이 회사에 없습니다."
    instruct: "반전을 말하듯, 쉼표에서 한 박자 쉰다."
    source: "DART 분기보고서 2026.09 · 임원 현황"
    scene: {kind: hook, small: "임원 명단을 열어 보면", line1: "창업자 이수만", line2: "[[회사에 없다]]"}
    sync: {at: [0, "이수만은", "없습니다"]}
  - say: "오늘은 가수가 세운 회사가 카카오에 넘어가기까지, 에스엠을 이끈 사람들을 5분에 정리합니다."
    scene: {kind: intro, kicker: "CEO 연대기 · 코스닥", title: "에스엠을 이끈 사람들", sub: "가수에서 [[카카오]]까지 · 2026년 11월 18일 기준"}
    sync: {at: [0, "가수가", "카카오에"]}
  - say: "이런 회사 이야기, 시총 순서대로 매주 올립니다. 대표이사 계보는 전부 공시로 확인했어요."
    scene: {kind: title, tag: "약속", kicker: "대표이사 계보는", title: "DART 공시로 확인", sub: "언론으로만 확인한 건 [[(보도)]]"}
    sync: {at: [0, "매주", "공시로"]}

  # ───────── 1 · 가수가 세운 회사 ─────────
  - say: "먼저 창업자 이야기입니다."
    chapter: "1 · 가수가 세운 회사"
    scene: {kind: part, num: "PART 01", slash: "/창업", title: "가수가 세운 회사"}
    sync: {at: [0]}
  - say: "이수만은 1952년생, 서울대 농대를 다녔고, 1970년대엔 가수와 MC, 라디오 DJ로 활동했습니다."
    source: "DART 사업보고서 2000·2003 · 아주경제·아이뉴스24 (보도)"
    scene: {kind: list, num: "創", title: "이수만", items: ["1952년생 · 서울대 [[(농대, 보도)]]", "1970년대 가수 · MC · 라디오 DJ (보도)"]}
    sync: {at: [0, "1952년생", "1970년대엔"]}
  - say: "1981년 미국으로 건너가 캘리포니아주립대 대학원에서 컴퓨터공학을 공부했고, 1985년 돌아와 기획사를 시작합니다. 법인 에스엠엔터테인먼트는 1995년 2월에 세워졌죠."
    source: "뉴시스 2019-10-14 · 아이뉴스24 2023-02-19 (보도) · DART 법인 설립"
    scene: {kind: timeline, label: "가수에서 [[제작자]]로", points: [{label: "1981", sub: "미국 유학 · 컴퓨터공학"}, {label: "1985", sub: "귀국 · 기획사"}, {label: "[[1995.2]]", sub: "법인 설립"}]}
    sync: {at: [0, "1981년", "1985년", "1995년"]}

  # ───────── 2 · 아이돌 공장의 시작 ─────────
  - say: "그리고 이 회사가 K팝의 방식을 만듭니다."
    chapter: "2 · 아이돌 공장의 시작"
    scene: {kind: part, num: "PART 02", slash: "/K팝", title: "아이돌 공장의 시작"}
    sync: {at: [0]}
  - say: "1996년 9월 H.O.T.가 데뷔합니다. 오디션과 트레이닝으로 만든 SM의 첫 기획 그룹이었죠. 2000년 4월엔 코스닥에 상장합니다."
    source: "DART 사업보고서 2000 연혁 · 시대 2025-09-05"
    scene: {kind: timeline, label: "기획 아이돌의 [[시작]]", points: [{label: "1996.9", sub: "H.O.T. 데뷔"}, {label: "[[2000.4]]", sub: "코스닥 상장"}]}
    sync: {at: [0, "1996년", "2000년"]}
  - say: "이 노래, 어디서 만들었는지 아십니까? 2002년 3월, 보아의 일본 첫 정규 앨범이 오리콘 앨범 차트 1위에 오릅니다. 한국 가수 최초였습니다."
    instruct: "질문하듯 시작해, '한국 가수 최초'에서 힘을 준다."
    source: "경향신문 2002-03-21 · 뉴시스 2019-10-14"
    scene: {kind: hook, small: "2002년 3월 · 일본 오리콘 앨범 차트", line1: "보아 [[1위]]", line2: "한국 가수 최초"}
    sync: {at: [0, "2002년", "1위에", "최초였습니다"]}
  - say: "회사는 이 방식을 문화기술, 컬처 테크놀로지라고 부릅니다. 그룹 이름 NCT도 네오 컬처 테크놀로지의 줄임말이죠."
    source: "DART 분기보고서 2026.09 회사의 개요 · 뉴시스 2019-10-14"
    scene: {kind: doc, meta: "DART 분기보고서 · 회사의 개요", title: "Culture [[Technology]]", lines: ["SM이 창안했다는 '문화기술'", "NCT = Neo Culture Technology"]}
    sync: {at: [0, "문화기술", "NCT도"]}
  - say: "재미있는 건, H.O.T. 출신 강타가 지금 SM의 미등기 임원이라는 겁니다. 직함은 크리에이티브 디렉터예요."
    source: "DART 분기보고서 2026.09 · 텐아시아 2014-03-21"
    scene: {kind: hook, small: "임원 명단에 있는 이름", line1: "H.O.T. 강타", line2: "[[지금은 임원]]"}
    sync: {at: [0, "강타가", "크리에이티브"]}

  # ───────── 3 · 대표이사 계보 ─────────
  - say: "그럼 회사는 누가 경영했을까요? 대표이사 계보입니다."
    chapter: "3 · 대표이사 계보"
    scene: {kind: part, num: "PART 03", slash: "/계보", title: "대표이사 계보"}
    sync: {at: [0]}
  - say: "법인을 세울 땐 정해익 대표, 1998년부터는 김경욱 대표, 그리고 2005년부터 12년 동안은 김영민 대표가 회사를 이끌었습니다."
    source: "DART 사업보고서 2000 · 대표이사변경 2005·2017"
    scene: {kind: timeline, label: "대표이사 계보 ①", points: [{label: "1995", sub: "정해익"}, {label: "1998", sub: "김경욱"}, {label: "[[2005]]", sub: "김영민 · 12년"}]}
    sync: {at: [0, "정해익", "김경욱", "김영민"]}
  - say: "2017년엔 한세민, 남소영 공동대표, 2020년엔 이성수, 탁영준 공동대표 체제로 바뀝니다."
    source: "DART 대표이사변경 2017·2020"
    scene: {kind: timeline, label: "대표이사 계보 ②", points: [{label: "2017", sub: "한세민 · 남소영"}, {label: "[[2020]]", sub: "이성수 · 탁영준"}]}
    sync: {at: [0, "2017년엔", "2020년엔"]}
  - say: "이성수 전 대표는 이수만의 처조카입니다. 이수만 본인이 아내의 조카라고 밝힌 적이 있죠."
    source: "OSEN · 한국경제 2023"
    scene: {kind: split, left: {glyph: "創", title: "이수만", lines: ["창업자"], color: "#C38BFF"}, right: {glyph: "姪", title: "이성수", lines: ["2020~2023 대표", "[[아내의 조카]]"], color: "#FFC23D"}, vs: "처조카"}
    sync: {at: [0, "처조카입니다", "아내의"]}

  # ───────── 4 · 2023년 경영권 전쟁 ─────────
  - say: "그리고 2023년, 회사의 주인이 바뀝니다."
    chapter: "4 · 2023년 경영권 전쟁"
    scene: {kind: part, num: "PART 04", slash: "/전쟁", title: "2023년 경영권 전쟁"}
    sync: {at: [0]}
  - say: "2023년 2월, 경영진은 이수만 한 사람 중심의 프로듀싱에서 벗어나겠다며 SM 3.0을 발표합니다."
    source: "MTN 2026-01-26 · 뉴시스 2023-03-31 (보도)"
    scene: {kind: hook, small: "2023년 2월", line1: "창업자 없는", line2: "[[SM 3.0]]"}
    sync: {at: [0, "이수만", "SM 3.0을"]}
  - say: "그러자 이수만은 자기 지분 14.8%를 하이브에 넘깁니다. 주당 12만 원, 4,228억 원이었습니다."
    source: "DART 최대주주 변경 수반 주식양수도 계약 2023-02-10"
    scene: {kind: number, label: "하이브에 넘긴 지분", from: 0, to: 14.8, unit: "%", sub: "주당 12만 원 · [[4,228억 원]]"}
    sync: {at: [0, "14.8%를", "4,228억"]}
  - say: "카카오는 주당 15만 원 공개매수로 맞섰고, 3월 12일 하이브가 인수 절차를 멈추면서 싸움은 끝납니다."
    source: "뉴시스 2023-03-12 · OSEN"
    scene: {kind: split, left: {glyph: "H", title: "하이브", lines: ["주당 12만 원", "3월 12일 [[중단]]"], color: "#FF5D5D"}, right: {glyph: "K", title: "카카오", lines: ["주당 [[15만 원]]", "공개매수"], color: "#FFC23D"}, vs: "VS"}
    sync: {at: [0, "15만", "하이브가"]}
  - say: "3월 28일, 최대주주는 카카오 쪽, 지분 40.2%로 바뀝니다. 하이브는 2025년 5월 남은 지분을 텐센트뮤직에 팔았죠."
    source: "DART 최대주주변경 2023-03-28 · SBS Biz 2025"
    scene: {kind: number, label: "카카오 쪽 지분", from: 0, to: 40.2, unit: "%", sub: "2023년 3월 28일 최대주주 변경 · 하이브는 [[2025년 매각]]"}
    sync: {at: [0, "40.2%로", "텐센트뮤직에"]}

  # ───────── 5 · 지금의 두 대표 ─────────
  - say: "그럼 지금 에스엠은 누가 이끌까요?"
    chapter: "5 · 지금의 두 대표"
    scene: {kind: part, num: "PART 05", slash: "/지금", title: "지금의 두 대표"}
    sync: {at: [0]}
  - say: "대표는 둘입니다. 회계법인 출신 장철혁, 그리고 2005년부터 SM에서 일해 온 탁영준이죠."
    source: "DART 분기보고서 2026.09"
    scene: {kind: split, left: {glyph: "₩", title: "장철혁", lines: ["공동대표", "[[회계법인 출신]]"], color: "#C38BFF"}, right: {glyph: "♪", title: "탁영준", lines: ["공동대표", "[[2005년 입사]]"], color: "#FFC23D"}, vs: "공동대표"}
    sync: {at: [0, "장철혁", "탁영준이죠"]}
  - say: "장철혁 대표는 1974년생, 고려대 대학원 경영학 석사입니다. 삼일회계법인과 스킨푸드 재무책임자를 거쳐 2022년 SM 재무책임자로 왔고, 2023년 3월 대표가 됐습니다."
    source: "DART 대표이사변경 2023 · 분기보고서 2026.09"
    scene: {kind: list, num: "CEO", title: "장철혁 대표", items: ["1974년생 · 고려대 대학원 경영학 석사", "삼일회계법인 → 스킨푸드 CFO", "2022년 SM CFO → [[2023년 3월 대표]]"]}
    sync: {at: [0, "1974년생", "삼일회계법인과", "2023년"]}
  - say: "탁영준 대표는 1978년생, 동국대 정치외교학과를 나와 2005년 입사했습니다. 가수매니지먼트본부장을 지냈고, 2020년과 2024년 두 번 공동대표에 올랐습니다."
    source: "DART 대표이사변경 2020·2024 · 분기보고서 2026.09"
    scene: {kind: list, num: "CEO", title: "탁영준 대표", items: ["1978년생 · 동국대 정치외교학", "2005년 입사 · 가수매니지먼트본부장", "2020 · [[2024]] 공동대표"]}
    sync: {at: [0, "1978년생", "가수매니지먼트본부장을", "2020년과"]}
  - say: "2025년 매출은 1조 1,749억 원, 영업이익은 1,830억 원이었습니다. 최대주주는 카카오와 카카오엔터, 합쳐서 41.5%입니다."
    source: "DART 분기보고서 2026.09 요약재무·주주 현황"
    scene: {kind: bars, label: "2025년 성적표 (연결)", sub: "최대주주 카카오 + 카카오엔터 [[41.5%]]", bars: [{label: "매출", value: 11749, show: "1조 1,749억"}, {label: "영업이익", value: 1830, show: "1,830억"}]}
    sync: {at: [0, "매출은", "영업이익은", "41.5%"]}
  - say: "그리고 이수만은 2026년 10월, 새 회사 A2O의 그룹을 국내에 데뷔시키며 다시 무대로 돌아왔습니다."
    source: "헤럴드경제 2026-10-10 · 서울신문 2026-10-13 (보도)"
    scene: {kind: hook, small: "2026년 10월 · 창업자의 귀환", line1: "이수만, 새 회사", line2: "[[A2O]]"}
    sync: {at: [0, "2026년", "A2O의"]}

  # ───────── 아웃트로 ─────────
  - say: "정리하면, 가수 출신 창업자가 아이돌 공장을 만들었고, 2023년 카카오로 넘어간 뒤엔 회계법인 출신과 SM 토박이가 함께 이끌고 있습니다."
    scene: {kind: recap, slash: "/정리", items: ["창업 · 이수만 [[가수 출신]]", "2023 · 최대주주 [[카카오]]", "지금 · 장철혁 · 탁영준"]}
    sync: {at: [0, "가수", "카카오로", "회계법인"]}
  - say: "창업자가 떠난 회사와 창업자가 새로 세운 회사, 여러분은 어느 쪽이 더 잘될 거라 보시나요? 댓글로 들려주세요."
