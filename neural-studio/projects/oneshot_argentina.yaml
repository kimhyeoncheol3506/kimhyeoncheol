brand: 월급쟁이 재테크 스킬
title: 아르헨티나 경제 몰락, 세계 6위 부자 나라가 64위로 떨어진 이유
intro_chapter: 인트로 · 100원이 5,000원이 된 해
voice:
  speed: 1.0
  instruct: 역사 다큐멘터리 해설자처럼 차분하고 또렷하게, 이야기를 들려주듯 따뜻하게. 숫자와 연도는 또박또박.
thumbnail:
  file: assets/thumbs/oneshot_argentina_thumb_A.png
summary: '아르헨티나 경제 몰락을 숫자로 따라갑니다. 1989년 한 해 소비자물가는 4,923%(1989년 12월, 전년 12월 대비) 올랐고, 1896년 세계 6위(매디슨 프로젝트 추정, 자료 있는 40개국 중)였던 1인당 소득 순위는 2022년 64위(165개국 중)가 됐습니다.

  곡물과 소고기의 황금시대, 대공황, 페론의 시대와 불어난 빚, 1989년 하이퍼인플레이션, 1페소=1달러 태환법, 2001년 코랄리토, 2023년 다시 폭발한 물가까지 14분에 정리했습니다.

  ''돈을 찍어내면 다 같이 부자가 된다''는 말이 맞는지 확인하고, 마지막 장에서는 월급쟁이가 지금 내 돈을 지키는 일반 원칙을 정리했습니다. 특정 종목 추천이나 투자 권유가 아닙니다. 모든 숫자의 출처는 아래에 적었습니다.

  '
