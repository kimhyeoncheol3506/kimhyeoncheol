slug: oneshot_argentina
name: 이거한편으로끝_아르헨티나
style: paper
format: longform
auto_beats: 2.4
brand: 월급쟁이 재테크 스킬
title: (이거 한편으로 끝) 세계 5대 부국이던 아르헨티나는 왜 몰락했을까｜돈을 찍어낸 나라의 100년 경제사와 내 돈 지키는 법 (1시간 몰아보기)
intro_chapter: 인트로 · 돈을 찍으면 다 같이 부자가 될까
voice:
  speed: 1.0
  instruct: 역사 다큐멘터리 해설자처럼 차분하고 또렷하게, 이야기를 들려주듯 따뜻하게. 숫자와 연도는 또박또박.
thumbnail:
  file: assets/thumbs/oneshot_argentina_thumb_B.png
summary: '1896년, 아르헨티나의 1인당 소득은 미국의 83%였습니다(매디슨 프로젝트 추정). 그런데 2022년에는 31%, 한국의 절반에도 못 미칩니다.

  곡물과 소고기로 부자가 된 벨 에포크, 대공황과 수입대체 산업화, 페론의 시대, 여섯 번의 쿠데타와 불어난 빚, 1989년 연 4,923%의 하이퍼인플레이션, 1페소=1달러 태환법과 2001년 코랄리토, 아홉 번의 국가부도와 반복된 IMF 프로그램, 그리고 2023~2026년의 물가와 정책 변화까지 1시간에 정리했습니다.

  ''돈을 찍어내면 다 같이 부자가 된다''는 말은 진짜일까요? 아르헨티나 100년의 숫자로 확인하고, 마지막 장에서는 월급쟁이가 지금 내 돈을 지키는 일반 원칙을 정리했습니다. 특정 종목 추천이나 투자 권유가 아닙니다.

  ''세계 5대 부국''은 널리 퍼진 주장이며, 영상에서는 매디슨 프로젝트 추정치로 실제 순위를 확인했습니다. 모든 숫자의 출처는 아래에 적었습니다.

  '
