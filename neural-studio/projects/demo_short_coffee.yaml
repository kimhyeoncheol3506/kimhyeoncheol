# 쇼츠 공장 시험작(원칙 01~06 검증용): 한국인 커피 소비량
# 사실은 모두 아시아경제 기사 원문(2023.12.25)에서 직접 확인함. 마지막 "내 관점" 줄은 예시이므로 직접 손볼 것.
slug: demo_short_coffee
format: short
title: 한국인은 1년에 커피를 몇 잔 마실까? (405잔)
summary: |
  유로모니터 추정으로 한국인 1인당 연간 커피 소비량은 405잔, 세계 평균 152잔의 두 배 이상입니다.
  2018년 363잔에서 연평균 2.8%씩 늘었고, 기사는 바쁜 기업 문화·쉬운 접근성·다양한 제품을 이유로 꼽았습니다.
tags: ["#커피", "#소비량", "#한국인", "#유로모니터", "#쇼츠"]
voice: {backend: auto, speed: 1.5}
bgm_mood: bright
topic: {kind: evergreen}          # 오래 가는 원리형. (뉴스면 kind: news, published: YYYY-MM-DD → 72시간 이내여야 함)
numbers_ok: ["1", "2"]            # 1=1년(기간), 2=두 배(기사 표현 '두 배 이상')
sources:
  - id: asiae
    outlet: 아시아경제
    title: 한국인, 올해 평균 커피 405잔 마셨다
    date: 2023-12-25
    url: https://www.asiae.co.kr/article/2023122216533377961
    verified: true                # 원문을 열어 문장 단위로 확인함
    note: 유로모니터 2023년 추정치. 이후 더 최신 수치가 있을 수 있음
    facts: ["405잔", "152잔", "363잔", "2.8%", "2018년", "2023년", "318잔", "80잔", "1131억5260만달러", "9.0%"]

beats:
  - role: hook
    say: "하루 한 잔도 모자란 걸까요?"
    scene: {kind: hook, small: 한국인 1인당 연간 커피, line1: 하루 한 잔도, line2: "모자란 걸까?"}

  - role: twist
    say: "한국인은 1년에 커피를 [[405잔]] 마십니다."
    source: "유로모니터 2023 추정 · 아시아경제 2023.12.25"
    scene: {kind: number, label: 한국인 1인당 연간 커피 소비량, to: 405, unit: 잔, sub: "하루 한 잔이 [넘는] 양", roll: 1.2}
    sync: {at: [0, "405잔"]}

  - role: twist
    say: "세계 평균은 [[152잔]]입니다. 한국은 그 [[두 배]]가 넘습니다."
    source: "유로모니터 2023 추정 · 아시아경제 2023.12.25"
    scene: {kind: reveal, small: 세계 평균 152잔 대비, word: "2배 이상", size: 190, tag: "한국인 1인당 연간 소비량"}
    sync: {at: [0, "두 배"]}

  - role: core
    say: "유로모니터 조사로는 2018년 [[363잔]]에서 해마다 평균 [[2.8%]]씩 늘었습니다."
    source: "유로모니터 · 아시아경제 2023.12.25"
    scene: {kind: number, label: 2018년에서 2023년까지, from: 363, to: 405, unit: 잔, sub: "연평균 [2.8%] 증가", roll: 1.3}
    sync: {at: [0, "363잔"]}

  - role: twist
    say: "미국은 [[318잔]]입니다. 한국이 미국보다 [[80잔]] 넘게 더 마십니다."
    source: "유로모니터 · 아시아경제 2023.12.25"
    scene: {kind: list, label: 1인당 연간 커피 소비량, items: ["미국 318잔", "한국 [405잔]"]}
    sync: {at: [0, "318잔", "80잔"]}

  - role: core
    say: "기사가 꼽은 이유는 바쁜 기업 문화, 쉬운 접근성, 다양한 제품입니다. 주요 상권이 아니어도 카페를 쉽게 찾을 수 있다는 점을 짚었습니다."
    source: "아시아경제 2023.12.25"
    scene: {kind: list, label: 기사가 꼽은 이유, items: ["바쁜 기업 문화", "쉬운 접근성", "다양한 제품"]}
    sync: {at: [0, "바쁜", "쉬운", "다양한"]}

  - role: twist
    say: "전 세계 커피 시장도 올해 [[9.0%]] 커졌습니다. 시장 규모는 약 [[1,131억 달러]]입니다."
    source: "유로모니터 · 아시아경제 2023.12.25"
    scene: {kind: reveal, small: 전 세계 커피 시장 (올해), word: "+9.0%", size: 250, tag: "약 1,131억 달러 규모"}
    sync: {at: [0, "9.0%", "1,131억"]}

  - role: pov
    say: "제 생각에 이 숫자는 취향이 아니라, 일하는 방식이 만든 결과입니다."
    scene: {kind: hook, small: 내 관점, line1: 취향이 아니라, line2: 일하는 방식}

  - role: todo
    say: "오늘 내가 마신 커피가 몇 잔인지, 한 번 세어 보세요."
    scene: {kind: list, label: 오늘 할 것, items: ["마신 커피 [세어] 보기"]}
    sync: {at: [0, "세어"]}

  - role: end
    say: "도움이 됐다면 구독과 좋아요 부탁드립니다."
    scene: {kind: hook, small: "", line1: 도움이 됐다면, line2: "구독 · 좋아요"}
