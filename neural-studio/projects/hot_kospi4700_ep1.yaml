title: 코스피 4700 붕괴, 하루 +6% 다음 날 −6%. 이런 장에서 개미가 돈 잃는 진짜 이유
intro_chapter: 인트로 · 코스피 4,700 붕괴
voice:
  speed: 1.0
  instruct: 경제 해설자처럼 차분하고 단단하게, 불안한 사람을 다독이듯. 숫자와 날짜는 또박또박.
