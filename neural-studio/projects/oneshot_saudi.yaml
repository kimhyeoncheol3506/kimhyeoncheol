title: 사우디 석유 경제, 유가가 반토막 나면 벌어지는 일
intro_chapter: 인트로 · 석유만 있으면 평생 부자?
voice:
  speed: 1.0
  instruct: 경제 다큐멘터리 해설자처럼 차분하고 또렷하게, 이야기를 들려주듯 따뜻하게. 숫자와 연도는 또박또박.
thumbnail:
  file: assets/thumbs/oneshot_saudi_thumb_A.png
summary: '사우디 석유로 번 돈은 어디로 갈까요? 2024년 사우디 정부 수입의 약 60%가 석유였고, IMF는 적자를 면하는 유가를 약 98달러로 추정했지만 실제 유가는 약 80달러였습니다.

  1938년 담맘 7호정, 1973년 석유파동, 유가 롤러코스터와 재정 균형 유가, 아람코 상장, 비전 2030과 네옴의 계획과 현실, 노르웨이 국부펀드, 그리고 월급쟁이가 배울 돈 관리 원칙까지 정리했습니다. 투자 권유가 아니며, 모든 숫자의 출처는 아래에 적었습니다.

  '
