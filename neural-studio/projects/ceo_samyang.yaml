    scene: {kind: hook, small: "1963년 9월 15일 · 한국 최초의 라면", line1: "한 봉지 [[10원]]", size: 140}
    sync: {at: [0, "10원짜리"]}
  - say: "그 회사의 시가총액이 지금 9조 3,786억 원입니다."
