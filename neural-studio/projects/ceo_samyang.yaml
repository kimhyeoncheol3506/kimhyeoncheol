    sync: {at: [0, "9조"]}
  - say: "그리고 지금 전 세계에서 1초에 약 63개씩 팔리는 라면, 불닭볶음면도 이 회사가 만듭니다."
    source: "경향신문·디지털데일리 2026-06-05"
    scene: {kind: hook, small: "불닭볶음면", line1: "1초에 [[63개]]", line2: "누적 100억 개 돌파"}
    sync: {at: [0, "63개씩", "불닭볶음면도"]}
  - say: "이 회사를 지금 이끄는 사람은 창업주의 맏며느리, 김정수 회장입니다."
