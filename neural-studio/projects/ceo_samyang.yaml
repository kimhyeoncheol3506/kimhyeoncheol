    scene: {kind: hook, small: "삼양식품 대표이사", line1: "창업주의 맏며느리", line2: "[[김정수 회장]]"}
    sync: {at: [0, "맏며느리", "김정수"]}
  - say: "오늘은 꿀꿀이죽 줄에서 시작해 불닭 100억 개까지, 삼양식품을 이끈 사람들을 5분에 정리합니다."
    scene: {kind: intro, kicker: "CEO 연대기 · 코스피", title: "삼양식품을 이끈 사람들", sub: "꿀꿀이죽에서 [[불닭]]까지 · 2026년 11월 18일 기준"}
    sync: {at: [0, "꿀꿀이죽", "불닭"]}
  - say: "이런 회사 이야기, 시총 순서대로 매주 올립니다. 학력과 경력은 전부 공시로 확인했어요."
    scene: {kind: title, tag: "약속", kicker: "경영진 학력·경력은", title: "DART 공시로 확인", sub: "언론으로만 확인한 건 [[(보도)]]"}
    sync: {at: [0, "매주", "공시로"]}

  # ───────── 1 · 꿀꿀이죽 줄에서 ─────────
  - say: "이야기는 1960년대 초 서울에서 시작합니다."
    chapter: "1 · 꿀꿀이죽 줄에서"
    scene: {kind: part, num: "PART 01", slash: "/창업", title: "꿀꿀이죽 줄에서"}
    sync: {at: [0]}
  - say: "창업주 전중윤은 보험회사를 이끌던 사람이었습니다. 미군 부대 잔반을 끓인 꿀꿀이죽 한 그릇을 사려고 줄 선 사람들을 보고, 식량난을 풀 방법을 찾았다고 회사는 소개합니다."
    source: "삼양식품 공식 회사소개 · 서울신문 2026-05-18 (보도)"
    scene: {kind: doc, meta: "삼양식품 회사소개", title: "꿀꿀이죽 줄에서 [[라면]]을 떠올리다", lines: ["창업주 전중윤 · 보험회사 경영 (보도)", "꿀꿀이죽으로 한 끼를 때우는 사람들", "→ 식량난 해결 방법을 찾다"]}
    sync: {at: [0, "보험회사를", "꿀꿀이죽", "식량난을"]}
  - say: "그는 직접 일본 묘조식품을 찾아가 기계와 기술을 들여왔고, 1963년 9월 15일 삼양라면을 내놓습니다."
    source: "삼양식품 공식 회사소개 · 국가기록원"
    scene:
      kind: flow
      label: "한국 최초의 라면"
      nodes:
        - {glyph: "日", name: "묘조식품", sub: "기계·기술 도입"}
        - {glyph: "1963", name: "[[삼양라면]]", sub: "9월 15일 출시"}
        - {glyph: "10원", name: "100g 한 봉지", sub: "국가기록원"}
    sync: {at: [0, "묘조식품을", "1963년", "삼양라면을"]}

  # ───────── 2 · 우지 파동 ─────────
  - say: "그런데 26년 뒤, 회사가 무너질 뻔한 일이 터집니다."
    chapter: "2 · 우지 파동"
    scene: {kind: part, num: "PART 02", slash: "/위기", title: "우지 파동"}
    sync: {at: [0]}
  - say: "1989년 11월 3일. 공업용 우지로 라면을 튀겼다는 수사 발표가 나오고, 회사 대표와 실무자들이 구속됩니다."
    instruct: "뉴스 속보처럼 긴장감 있게."
    source: "법률신문 2025-11-08 · 뉴시스 2025-11-03"
    scene: {kind: hook, small: "1989년 11월 3일", line1: "우지 파동", line2: "[[대표·실무자 구속]]"}
    sync: {at: [0, "공업용", "구속됩니다"]}
  - say: "1심은 유죄였습니다. 하지만 1995년 고등법원에서 무죄, 1997년 8월 대법원에서 무죄가 확정됩니다. 7년 9개월 만이었죠."
    source: "법률신문 2025-11-08 · 삼양식품 공식 연혁"
    scene: {kind: timeline, label: "7년 9개월의 [[법정 싸움]]", points: [{label: "1989.11", sub: "수사 발표"}, {label: "1심", sub: "유죄"}, {label: "1995", sub: "고법 무죄"}, {label: "[[1997.8]]", sub: "대법원 무죄 확정"}]}
    sync: {at: [0, "1심은", "1995년", "1997년"]}
  - say: "그 사이 점유율은 크게 떨어졌고, 외환위기 뒤인 1998년엔 화의에 들어가 2005년에야 벗어납니다."
    source: "삼양식품 공식 연혁 · 비즈한국 2014-07-11"
