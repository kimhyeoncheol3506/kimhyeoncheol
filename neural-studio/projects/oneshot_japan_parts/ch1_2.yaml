scenes:
- say: 첫 번째 이야기는 도쿄가 아니라 뉴욕에서 시작합니다. 일본의 30년을 바꿔 놓은 회의가 열린 곳이죠.
  chapter: 1장 · 1985년, 플라자 합의와 거품
  theme: dark
  scene:
    kind: chapter
    kicker: 1장
    title: '1985년,

      거품의 시작'
  sync:
    at:
    - 0
- say: 1985년 9월 22일 일요일, 뉴욕 센트럴파크 옆 플라자 호텔. 미국, 일본, 서독, 프랑스, 영국의 재무장관과 중앙은행 총재가 한 방에 모였습니다.
  source: Wikipedia 'Plaza Accord'
  theme: dark
  scene:
    kind: photo
    photo: '@plaza_hotel'
    name: 뉴욕 플라자 호텔
    role: 1985년 9월 22일, 5개국 재무장관·중앙은행 총재 회의
  sync:
    at:
    - 0
- say: 다섯 나라는 이렇게 발표합니다. 달러가 아닌 통화들이 질서 있게 더 오르는 것이 바람직하다. 다음 날, 달러는 다른 통화들에 비해 4% 떨어졌습니다.
  source: Wikipedia 'Plaza Accord'
  scene:
    kind: stack
    logo: PLAZA ACCORD
    label: 1985년 9월 22일 [[합의문]]
    cards:
    - meta: 참여
      text: 미국 · 일본 · 서독 · 프랑스 · 영국
    - meta: 합의
      text: 달러 외 통화의 [[질서 있는 절상]]
    - meta: 다음 날
      text: 달러 약 [[4% 하락]]
  sync:
    at:
    - 0
    - 다섯
    - 다음
- say: 이 합의가 일본에 무엇을 뜻했는지는 엔화 환율이 말해 줍니다. 합의 직전 금요일, 1달러는 240.10엔이었습니다. 이 숫자가 2년 뒤 어떻게 됐는지 보시죠.
  source: 연준 H.10 엔/달러 환율 (1985년 9월 20일)
  scene:
    kind: bignum
    label: 1985년 9월 20일 · 1달러는
    to: 240.1
    unit: 엔
    color: navy
    sub: 플라자 합의 [[직전]] 금요일
  sync:
    at:
    - 0
    - 240.10엔이었습니다.
- say: 그해 말에는 200엔, 1986년 말에는 158엔, 그리고 1987년 말에는 121엔까지 내려갑니다. 2년 남짓 만에 달러의 값이 거의 절반이 된 겁니다.
  source: 연준 H.10 엔/달러 환율 (연말 값)
  scene:
    kind: stairs
    title: 1달러 = 몇 엔?
    sub: 연준 H.10 · 숫자가 작을수록 [[엔화가 비싸다]]
    unit: 엔
    steps:
    - label: 1985년 9월 20일
      value: 240.1
    - label: 1985년 말
      value: 200.25
    - label: 1986년 말
      value: 158.3
    - label: 1987년 말
      value: 121.25
      color: red
  sync:
    at:
    - 0
    - 200엔,
    - 121엔까지
- say: 값을 올리면 덜 팔리고, 값을 그대로 두면 남는 게 없습니다. 이것이 1986년 일본을 덮친 '엔고 불황'입니다. 일본 수출 기업들은 갑자기 높아진 벽 앞에 섰습니다.
  scene:
    kind: doc
    tag: 원리
    meta: 환율과 수출 기업
    title: '[[엔고 불황]]의 구조'
    lines:
    - 값을 올리면 → 덜 팔린다
    - 값을 그대로 두면 → 남는 게 없다
    - 수출 기업이 먼저 [[숨이 찬다]]
  sync:
    at:
    - 0
    - 엔고
- say: 그래서 흔히 이렇게 말합니다. 미국이 플라자 합의로 일본을 무너뜨렸다. 그런데 정말 그렇게 단순할까요? 이 설명에는 반론도 만만치 않습니다.
  scene:
    kind: quote
    text: 플라자 합의가 [[일본을 무너뜨렸다?]]
    by: 흔한 설명
  sync:
    at:
    - 0
    - 무너뜨렸다.
    - 단순할까요?
- say: 정리하면 플라자 합의는 방아쇠 가운데 하나였을 뿐, 그 뒤 일본이 내린 선택들이 결과를 더 크게 갈랐다는 겁니다. 학자들 사이에서도 무게를 어디에 두느냐는 여전히 갈립니다.
  scene:
    kind: doc
    tag: 1장 정리
    meta: 해석은 갈린다
    title: 방아쇠는 하나, [[선택]]은 여럿
    lines:
    - '플라자 합의: 엔고라는 [[충격]]'
    - '그 뒤의 금리·대출·정책: 결과를 [[키운 것]]'
    - 무게를 어디 둘지는 학계도 논쟁 중
  sync:
    at:
    - 0
    - 방아쇠
    - 선택들이
- say: 일본은행은 엔고 불황에 맞서 기준이 되는 공정 할인율을 내리기 시작합니다. 1986년 1월 30일, 5.0%에서 4.5%로. 엔고로 힘들어진 기업들을 돕기 위해서였죠.
  source: Wikipedia 'Japanese asset price bubble' (일본은행 공정 할인율)
  scene:
    kind: bignum
    label: 1986년 1월 30일 · 공정 할인율
    from: 5.0
    to: 4.5
    unit: '%'
    color: navy
    sub: 다섯 차례 인하의 [[첫 번째]]
  sync:
    at:
    - 0
    - 5.0%에서
    - 4.5%로.
- say: 그리고 1987년 2월 23일까지 다섯 차례에 걸쳐 2.5%까지 내립니다. 당시로서는 사상 가장 낮은 수준이었습니다. 1년 남짓 사이에 금리가 절반이 된 겁니다.
  source: Wikipedia 'Japanese asset price bubble' (일본은행 공정 할인율)
  scene:
    kind: stairs
    title: 일본은행 공정 할인율, [[다섯 번]] 내리다
    sub: 1986년 1월 ~ 1987년 2월
    unit: '%'
    steps:
    - label: 1986년 1월 이전
      value: 5.0
    - label: 1986년 1월
      value: 4.5
    - label: 1986년 3월
      value: 4.0
    - label: 1986년 4월
      value: 3.5
    - label: 1986년 11월
      value: 3.0
    - label: 1987년 2월
      value: 2.5
      color: red
  sync:
    at:
    - 0
    - 다섯
    - 2.5%까지
- say: 빌린 돈은 어디로 갔을까요? 공장보다 훨씬 빨리 오르는 곳, 바로 땅과 주식이었습니다. 공장을 지어 버는 돈보다, 땅을 사 두고 기다려 버는 돈이 더 컸으니까요.
  theme: dark
  scene:
    kind: quote
    text: 빌린 돈은 [[땅과 주식]]으로
    by: 거품의 길
  sync:
    at:
    - 0
    - 땅과
- say: 도쿄, 요코하마, 나고야, 교토, 오사카, 고베. 일본부동산연구소가 꼽은 6대 도시의 상업지 땅값은 1991년에 1985년보다 302.9% 올랐습니다. 4배가 된 겁니다.
  source: 일본부동산연구소 · Wikipedia 'Japanese asset price bubble' 인용
  scene:
    kind: bignum
    label: 6대 도시 상업지 땅값 · 1985년 대비 1991년
    to: 302.9
    unit: '%'
    color: red
    sub: 6년 만에 [[4배]]
  sync:
    at:
    - 0
    - 6대
    - 302.9%
    - 4배가
- say: 가장 비싼 곳은 긴자였습니다. 거품의 정점 무렵, 1제곱미터에 3천만 엔까지 갔다고 기록돼 있습니다. 손바닥만 한 땅이 집 한 채 값이었던 셈이죠.
  source: Wikipedia 'Japanese asset price bubble'
  theme: dark
  scene:
    kind: photo
    photo: '@ginza'
    name: 도쿄 긴자
    role: 거품 정점 무렵 1제곱미터 약 3천만 엔
  sync:
    at:
    - 0
- say: 그리고 1989년 12월 29일, 그해 마지막 거래일. 닛케이는 38,915.87로 마감합니다. 10년 사이 약 6배가 된 숫자였습니다.
  source: Wikipedia 'Nikkei 225'
  theme: dark
  scene:
    kind: bignum
    label: 1989년 12월 29일 닛케이 평균 마감
    to: 38915.87
    unit: ''
    color: red
    sub: 1980년대에 [[약 6배]]
  sync:
    at:
    - 0
    - 38,915.87로
    - 6배가
- say: 땅값이 오르면 담보 가치가 커지니 더 빌릴 수 있고, 빌린 돈으로 또 땅을 사니 땅값은 더 오릅니다. 바퀴가 스스로 굴러가는 겁니다.
  scene:
    kind: flip
    label: 땅값 → 담보 → 대출 → 땅값
    from: LOAN
    to: LAND
  sync:
    at:
    - 0
    - 담보
    - 바퀴가
- say: 거품의 핵심은 값이 비싸다는 게 아닙니다. 그 값을 빚이 떠받치고 있다는 겁니다. 빚이 받쳐 준 가격은, 빚이 빠지면 함께 무너집니다.
  theme: dark
  scene:
    kind: stack
    logo: BUBBLE
    label: 거품의 [[핵심]]
    cards:
    - meta: 겉으로 보이는 것
      text: 비싼 땅 · 비싼 주식
    - meta: 속에 있는 것
      text: 그 값을 떠받친 [[빚]]
  sync:
    at:
    - 0
    - 비싸다는
    - 빚이
- say: 그리고 1989년 5월, 일본은행이 드디어 방향을 바꿉니다. 거품을 꺼뜨리려고 금리를 올리기 시작한 겁니다.
  scene:
    kind: flip
    label: 1989년 5월, 일본은행
    from: CUT
    to: HIKE
  sync:
    at:
