scenes:
  # ═════════════ 1장 · 1985년, 뉴욕의 호텔 방 ═════════════
  - say: "첫 번째 이야기는 도쿄가 아니라 뉴욕에서 시작합니다. 일본의 30년을 바꿔 놓은 회의가 열린 곳이죠."
    chapter: "1장 · 1985년, 뉴욕의 호텔 방"
    theme: dark
    scene: {kind: chapter, kicker: "1장", title: "1985년,\n뉴욕의 호텔 방"}
    sync: {at: [0]}
  - say: "1985년 9월 22일 일요일, 뉴욕 센트럴파크 옆 플라자 호텔. 미국, 일본, 서독, 프랑스, 영국의 재무장관과 중앙은행 총재가 한 방에 모였습니다."
    source: "Wikipedia 'Plaza Accord'"
    theme: dark
    scene: {kind: photo, photo: "@plaza_hotel", name: "뉴욕 플라자 호텔", role: "1985년 9월 22일, 5개국 재무장관·중앙은행 총재 회의"}
    sync: {at: [0]}
  - say: "일본 대표로 이 자리에 앉은 사람은 당시 대장상, 그러니까 재무장관이던 다케시타 노보루였습니다. 미국 쪽은 그해 1월 새로 재무장관이 된 제임스 베이커였죠."
    source: "Wikipedia 'Plaza Accord'"
    scene: {kind: doc, tag: "1985년 9월 22일", meta: "플라자 회의의 얼굴들", title: "다섯 나라의 [[재무장관]]", lines: ["일본: 다케시타 노보루 대장상", "미국: [[제임스 베이커]] 재무장관", "서독 · 프랑스 · 영국의 재무장관과 중앙은행 총재"]}
    sync: {at: [0, "다케시타", "제임스"]}
  - say: "의제는 하나였습니다. 너무 강해진 미국 달러를 어떻게 끌어내릴 것인가. 그리고 그 답은 일본 경제의 운명을 크게 흔들게 됩니다."
    scene: {kind: quote, text: "너무 강해진 [[달러]]를 끌어내려라", by: "1985년 플라자 회의의 의제"}
    sync: {at: [0, "달러를"]}
  - say: "1980년부터 1985년까지 달러는 엔화, 마르크화, 프랑화, 파운드화에 비해 약 50%나 올랐습니다. 미국의 금리가 높아 돈이 미국으로 몰렸기 때문이죠."
    source: "Wikipedia 'Plaza Accord'"
    theme: dark
    scene: {kind: bignum, label: "1980~1985년 달러 가치 상승", to: 50, unit: "%", color: red, sub: "엔 · 마르크 · 프랑 · 파운드 대비 [[약 50%]]"}
    sync: {at: [0, "50%나", "금리가"]}
  - say: "1985년 3월에는 달러가 영국 파운드에 대해 사상 최고 수준까지 올랐습니다. 이 기록은 그 뒤 30년 넘게 깨지지 않았을 정도였죠."
    source: "Wikipedia 'Plaza Accord' (Reuters 인용)"
    scene: {kind: quote, text: "30년 넘게 깨지지 않은 [[강달러]]의 기록", by: "1985년 3월 · 달러 대 파운드"}
    sync: {at: [0, "파운드에", "30년"]}
  - say: "달러가 비싸지면 미국 물건은 외국에서 비싸지고, 외국 물건은 미국에서 싸집니다. 미국의 공장들이 일본과 독일 제품에 밀리기 시작했습니다."
    source: "Wikipedia 'Plaza Accord'"
    scene: {kind: doc, tag: "1985년의 미국", meta: "Wikipedia 'Plaza Accord'", title: "비싼 달러, [[밀리는 공장]]", lines: ["미국 물건은 외국에서 비싸지고", "외국 물건은 미국에서 싸진다", "의회에서는 [[보호무역]] 법안 논의"]}
    sync: {at: [0, "미국의", "밀리기"]}
  - say: "미국의 경상수지 적자는 GDP의 3.5%까지 커졌습니다. 자동차, 기계, 농산물 업계가 한목소리로 외국 물건을 막아 달라고 요구했고, 의회는 보호무역 법안을 만지작거렸습니다."
    source: "Wikipedia 'Plaza Accord'"
    scene: {kind: bignum, label: "미국 경상수지 적자 (GDP 대비)", to: 3.5, unit: "%", color: red, sub: "자동차 · 기계 · 농산물 업계의 [[보호무역]] 요구"}
    sync: {at: [0, "3.5%까지", "의회는"]}
  - say: "베이커가 재무장관이 되면서 미국의 태도도 달라집니다. 강한 달러를 미국 경제에 대한 신뢰의 표시로 여기던 분위기에서, 달러를 낮춰야 한다는 쪽으로 방향을 튼 거죠."
    source: "Wikipedia 'Plaza Accord'"
    theme: dark
    scene: {kind: flip, label: "1985년 미국 재무부의 생각", from: "STRONG", to: "LOWER"}
    sync: {at: [0, "베이커가", "낮춰야"]}
  - say: "다섯 나라는 이렇게 발표합니다. 달러가 아닌 통화들이 질서 있게 더 오르는 것이 바람직하다. 다음 날, 달러는 다른 통화들에 비해 4% 떨어졌습니다."
    source: "Wikipedia 'Plaza Accord'"
    theme: dark
    scene: {kind: stack, logo: "PLAZA ACCORD", label: "1985년 9월 22일 [[합의문]]", cards: [{meta: "참여", text: "미국 · 일본 · 서독 · 프랑스 · 영국"}, {meta: "합의", text: "달러 외 통화의 [[질서 있는 절상]]"}, {meta: "다음 날", text: "달러 약 [[4% 하락]]"}]}
    sync: {at: [0, "다섯", "다음"]}
  - say: "사실 그해 1월에도 다섯 나라는 작은 규모의 시장 개입에 합의했고, 2월과 3월에는 독일이 대규모로 달러를 팔았습니다. 플라자 합의는 갑자기 떨어진 폭탄이 아니라, 몇 달에 걸친 준비의 결과였습니다."
    source: "Wikipedia 'Plaza Accord'"
    scene: {kind: doc, tag: "1985년의 준비", meta: "Wikipedia 'Plaza Accord'", title: "갑자기가 아니라 [[몇 달의 준비]]", lines: ["1월: G5, 소규모 시장 개입 합의", "2~3월: 독일의 [[대규모 달러 매도]]", "7~8월: 차관급 사전 회의 → 9월 22일 발표"]}
    sync: {at: [0, "1월에도", "2월과", "폭탄이"]}
  - say: "조금 더 거슬러 올라가 볼까요. 1971년 초, 1달러는 357엔 정도였습니다. 고정 환율 시대의 흔적이었죠. 그 뒤 엔화는 조금씩 비싸지고 있었습니다."
    source: "연준 H.10 엔/달러 환율 (1971년 1월 4일 357.73엔)"
    theme: dark
    scene: {kind: year, text: "1971", up: "1달러 = 357엔", down: "고정 환율의 흔적", to: "1985년 240엔"}
    sync: {at: [0, "1971년", "357엔", "비싸지고"]}
  - say: "이 합의가 일본에 무엇을 뜻했는지는 엔화 환율이 말해 줍니다. 합의 직전 금요일, 1달러는 240.10엔이었습니다. 이 숫자가 2년 뒤 어떻게 됐는지 보시죠."
    source: "연준 H.10 엔/달러 환율 (1985년 9월 20일)"
    scene: {kind: bignum, label: "1985년 9월 20일 · 1달러는", to: 240.10, unit: "엔", color: navy, sub: "플라자 합의 [[직전]] 금요일"}
    sync: {at: [0, "240.10엔이었습니다."]}
  - say: "그해 말에는 200엔, 1986년 말에는 158엔, 그리고 1987년 말에는 121엔까지 내려갑니다. 2년 남짓 만에 달러의 값이 거의 절반이 된 겁니다."
    source: "연준 H.10 엔/달러 환율 (연말 값)"
    scene: {kind: stairs, title: "1달러 = 몇 엔?", sub: "연준 H.10 · 숫자가 작을수록 [[엔화가 비싸다]]", unit: "엔", steps: [{label: "1985년 9월 20일", value: 240.10}, {label: "1985년 말", value: 200.25}, {label: "1986년 말", value: 158.30}, {label: "1987년 말", value: 121.25, color: red}]}
    sync: {at: [0, "200엔,", "121엔까지"]}
  - say: "쉽게 비유해 볼까요. 1달러짜리 장난감을 미국에 팔던 일본 회사가 있다고 해 봅시다. 이 회사는 장난감을 팔 때마다 달러를 받아 엔화로 바꿉니다."
    theme: dark
    scene: {kind: quote, text: "1달러짜리 장난감을 파는 [[일본 회사]]", by: "엔고를 이해하는 비유"}
    sync: {at: [0, "장난감을"]}
  - say: "1985년 가을에는 하나 팔면 240엔이 들어왔습니다. 2년 뒤에는 똑같이 팔아도 121엔뿐입니다. 공장 직원 월급과 재료비는 그대로인데 말이죠."
    source: "연준 H.10 엔/달러 환율 (1985년 9월 20일 · 1987년 말)"
    scene: {kind: bars, title: "1달러어치를 팔면 받는 돈", sub: "연준 H.10 · 같은 물건, 다른 수입", unit: "엔", items: [{label: "1985년 9월", value: 240.10, color: navy}, {label: "1987년 말", value: 121.25, color: red}]}
    sync: {at: [0, "240엔이", "121엔뿐입니다."]}
  - say: "값을 올리면 덜 팔리고, 값을 그대로 두면 남는 게 없습니다. 이것이 1986년 일본을 덮친 '엔고 불황'입니다. 일본 수출 기업들은 갑자기 높아진 벽 앞에 섰습니다."
    scene: {kind: doc, tag: "원리", meta: "환율과 수출 기업", title: "[[엔고 불황]]의 구조", lines: ["값을 올리면 → 덜 팔린다", "값을 그대로 두면 → 남는 게 없다", "수출 기업이 먼저 [[숨이 찬다]]"]}
    sync: {at: [0, "엔고"]}
  - say: "반대로 웃은 사람들도 있었습니다. 엔화가 비싸지니 일본 사람에게는 해외여행과 수입품, 그리고 해외 자산이 갑자기 싸졌습니다. 같은 엔고가 누군가에게는 위기, 누군가에게는 기회였던 거죠."
    theme: dark
    scene: {kind: quote, text: "같은 엔고, 누군가에게는 위기 [[누군가에게는 기회]]", by: "환율의 두 얼굴"}
    sync: {at: [0, "웃은", "해외여행과", "기회였던"]}
  - say: "실제로 일본의 실질 성장률은 1985년 5.2%에서 1986년 3.3%로 내려앉습니다. 수출로 커 온 나라에게는 큰 충격이었죠. 그래도 마이너스는 아니었다는 점은 기억해 두세요."
    source: "OECD 국민계정 · 일본 실질 GDP 성장률"
    scene: {kind: bars, dir: v, title: "일본 실질 성장률", sub: "OECD 국민계정", unit: "%", items: [{label: "1985년", value: 5.2, color: navy}, {label: "1986년", value: 3.3, color: red}]}
    sync: {at: [0, "5.2%에서", "3.3%로"]}
