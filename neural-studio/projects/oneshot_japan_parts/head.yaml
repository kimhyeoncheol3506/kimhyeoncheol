thumbnail:
  file: assets/thumbs/oneshot_japan_thumb_A.png
summary: '일본 잃어버린 30년, 물가를 반영한 일본의 평균 연봉은 1990년 50,787달러에서 2025년 50,183달러로 35년 동안 1% 남짓 줄었습니다(OECD). 같은 기간 한국은 두 배 넘게 올랐습니다.

  일본 잃어버린 30년의 시작부터 지금까지 — 1985년 플라자 합의와 엔고, 거품경제의 정점(1989년 닛케이 38,915), 거품 붕괴와 불량채권, 물가가 내리는 디플레이션과 멈춘 월급을 13분에 정리했습니다.

  이어서 ''한국이 제2의 일본''이라는 말을 출산율·고령화 속도·가계부채·부동산 비중·잠재성장률과 물가·임금·빚의 방향으로 나눠 양쪽 숫자로 확인합니다. 닮은 점도, 다른 점도 있습니다.

  마지막 장은 월급쟁이가 지금 내 돈을 어떻게 다루면 좋을지에 대한 일반적인 원칙 8가지입니다(특정 상품 추천이나 투자 권유가 아닙니다). 모든 숫자의 출처는 아래에 적었습니다.

  '
