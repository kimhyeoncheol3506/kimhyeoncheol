# 일본 잃어버린 30년 — 13분 줄인 판 (2026-11-13 v2, BRIEF_v2·채널규칙_제목썸네일첫15초 적용). 모델 2 · S1 paper, 여의도여자
# 60분판은 long60/ 에 보존. 남긴 문장의 say 는 60분판에서 한 글자도 바꾸지 않았다(녹음 캐시 재사용). 새로 쓴 문장: 인트로 N1~N6, 2·3·4장 머리, 3장 '월급이 멈춘 이유'(NR).
# 편집 원칙: 한국=일본이라고 단정하지 않는다. 닮은 숫자와 다른 숫자를 같은 무게로. 해석이 갈리는 곳(플라자 합의 책임론, 임금 정체 원인)은 양쪽 소개. 특정 종목 추천 없음, 투자 권유 아님.
# 제목 후보(검색어 '일본 잃어버린 30년' 맨 앞, 썸네일 문구와 다른 말):
#   1) 일본 잃어버린 30년, 한국 월급쟁이가 지금 챙길 8가지 원칙   ← 채택
#   2) 일본 잃어버린 30년, 한국은 제2의 일본일까 닮은 숫자 5개와 다른 숫자 5개
#   3) 일본 잃어버린 30년, 닛케이 본전까지 34년 걸린 나라에서 배울 내 돈 교훈
# 썸네일: A(숫자 두 개 · 일본 -1% vs 한국 2배) = 첫 장면 N1·N2 숫자와 일치, B(전/후 · 1989 꼭대기 → 본전까지 34년) = N3 숫자와 일치. 둘 다 첫 15초 안에 화면에 나옴.
