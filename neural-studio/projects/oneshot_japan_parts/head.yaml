  - say: "요즘 뉴스에서 자주 듣는 말이 있습니다. 한국이 제2의 일본이 된다. 정말 그럴까요? 오늘 한 시간 동안 숫자로 확인해 보겠습니다."
    instruct: "조용히 질문을 던지듯, 끝을 살짝 올린다."
