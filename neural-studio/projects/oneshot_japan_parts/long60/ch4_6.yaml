scenes:
  # ═════════════ 4장 · 물가가 내리는 나라 ═════════════
  - say: "네 번째 이야기는 물건값이 오르지 않는, 오히려 내리는 나라입니다. 일본의 30년을 이해하는 데 가장 중요한 열쇠입니다."
    chapter: "4장 · 물가가 내리는 나라"
    theme: dark
    scene: {kind: chapter, kicker: "4장", title: "물가가\n내리는 나라"}
    sync: {at: [0]}
  - say: "물가가 내린다니, 처음 들으면 좋은 일 같습니다. 월급은 그대로인데 물건이 싸지면 살림이 나아질 테니까요. 정말 그럴까요?"
    scene: {kind: quote, text: "물건이 싸지면 [[좋은 것]] 아닌가요?", by: "4장의 질문"}
    sync: {at: [0, "좋은", "싸지면"]}
  - say: "이렇게 물가가 계속 내려가는 현상을 디플레이션이라고 부릅니다. 그리고 일본은 이 디플레이션을 아주 오래 겪었습니다."
    theme: dark
    scene: {kind: flip, label: "물가가 오르는 대신 내려가는 현상", from: "INFLATION", to: "DEFLATION"}
    sync: {at: [0, "디플레이션이라고", "오래"]}
  - say: "거품이 한창이던 1990년과 1991년, 일본의 소비자물가는 각각 3.1%, 3.3% 올랐습니다. 여기까지는 평범한 나라의 모습이었죠."
    source: "OECD 소비자물가 상승률 (일본)"
    scene: {kind: bars, dir: v, title: "일본 소비자물가 상승률", sub: "OECD · 전년 대비", unit: "%", items: [{label: "1990년", value: 3.1, color: navy}, {label: "1991년", value: 3.3, color: navy}]}
    sync: {at: [0, "3.1%,", "3.3%"]}
  - say: "그런데 1995년, 물가가 처음으로 0.1% 떨어집니다. 그리고 1999년부터 2003년까지는 5년 연속으로 물가가 내려갑니다."
    source: "OECD 소비자물가 상승률 (일본)"
    scene: {kind: doc, tag: "기록", meta: "OECD 소비자물가 상승률 · 일본", title: "[[5년 연속]] 내려간 물가", lines: ["1995년 -0.1% · 첫 하락", "1999년 -0.3% · 2000년 -0.7% · 2001년 -0.7%", "2002년 [[-0.9%]] · 2003년 -0.3%"]}
    sync: {at: [0, "1995년,", "1999년부터"]}
  - say: "1995년부터 2012년까지 18년 가운데 물가가 내린 해가 10년입니다. 절반이 넘는 해 동안 물건값이 오히려 싸졌다는 뜻이죠."
    source: "OECD 소비자물가 상승률 (일본, 연간)"
    theme: dark
    scene: {kind: bignum, label: "1995~2012년, 물가가 내린 해", to: 10, unit: "년", color: red, sub: "18년 가운데 [[절반 넘게]]"}
    sync: {at: [0, "18년", "10년입니다."]}
  - say: "2009년에는 1.4%나 떨어졌습니다. 세계 금융위기의 충격까지 겹친 해였죠. 물가가 내리는 해가 다시 이어지기 시작한 거죠."
    source: "OECD 소비자물가 상승률 (일본)"
    scene: {kind: bars, title: "일본 물가가 가장 크게 내린 해들", sub: "OECD · 하락 폭(%)", unit: "%", items: [{label: "2002년 하락", value: 0.9, color: pink}, {label: "2009년 하락", value: 1.4, color: red}, {label: "2010년 하락", value: 0.7, color: pink}]}
    sync: {at: [0, "1.4%나"]}
  - say: "물가를 끌어올리려는 정책이 나온 뒤에도 디플레이션은 쉽게 떠나지 않았습니다. 2014년 2.7% 올랐던 물가는 2016년 다시 0.1% 내렸고, 2020년에는 0%에 머물렀습니다."
    source: "OECD 소비자물가 상승률 (일본)"
    scene: {kind: doc, tag: "끈질긴 디플레이션", meta: "OECD 소비자물가 상승률 · 일본", title: "쉽게 떠나지 않은 [[0%]]", lines: ["2014년: +2.7%", "2016년: [[-0.1%]]", "2020년: 0%"]}
    sync: {at: [0, "2014년", "2016년", "2020년에는"]}
  - say: "그럼 물가가 내리면 왜 문제일까요? 쉬운 비유로 보겠습니다. 오늘 100만 원짜리 텔레비전이 내년에 90만 원이 된다는 걸 모두가 안다면?"
    scene: {kind: doc, tag: "비유", meta: "디플레이션의 심리", title: "내년에 더 싸진다면 [[오늘 살까?]]", lines: ["오늘 100만 원짜리 텔레비전", "내년엔 90만 원이 된다고 [[모두가 안다면]]", "사람들은 사는 걸 미룬다"]}
    sync: {at: [0, "비유로", "100만", "90만"]}
  - say: "사람들은 사는 것을 미룹니다. 물건이 안 팔리니 회사는 값을 더 내리고, 이익이 줄어든 회사는 월급을 올려 줄 수 없습니다."
    theme: dark
    scene: {kind: stack, logo: "DEFLATION SPIRAL", label: "내려가는 [[소용돌이]]", cards: [{meta: "가계", text: "더 싸질 테니 [[미룬다]]"}, {meta: "기업", text: "안 팔리니 값을 내리고"}, {meta: "월급", text: "이익이 줄어 [[못 올린다]]"}]}
    sync: {at: [0, "미룹니다.", "회사는", "월급을"]}
  - say: "월급이 안 오르면 사람들은 더 아끼고, 그러면 물건은 더 안 팔립니다. 이것을 디플레이션의 악순환이라고 부릅니다. 한번 빠지면 스스로 빠져나오기 어려운 늪이죠."
    scene: {kind: quote, text: "아끼면 안 팔리고, 안 팔리면 [[월급이 멈춘다]]", by: "디플레이션의 악순환"}
    sync: {at: [0, "아끼고,", "악순환이라고"]}
  - say: "한 사람에게는 아끼는 것이 현명한 선택이지만, 모두가 함께 아끼면 경제 전체가 작아집니다. 경제학에서 말하는 절약의 역설입니다."
    scene: {kind: doc, tag: "원리", meta: "절약의 역설", title: "모두가 아끼면 [[모두가 가난해진다]]", lines: ["나 혼자 아끼기 → 현명한 선택", "모두 함께 아끼기 → 매출이 줄고", "줄어든 매출 → [[줄어든 월급]]"]}
    sync: {at: [0, "현명한", "역설입니다."]}
  - say: "그래서 디플레이션의 가장 무서운 점은 숫자보다 마음입니다. 내일은 더 싸질 거라는 생각이 사람들 머리에 박혀 버리는 거죠."
    theme: dark
    scene: {kind: flip, label: "가장 무서운 건 숫자보다", from: "PRICE", to: "MIND"}
    sync: {at: [0, "마음입니다."]}
  - say: "빚진 사람에게 디플레이션은 더 가혹합니다. 월급과 물건값은 내려가는데 갚아야 할 빚의 숫자는 그대로니까요. 경제학자 어빙 피셔가 말한 '부채 디플레이션'입니다."
    scene: {kind: doc, tag: "부채 디플레이션", meta: "어빙 피셔의 개념", title: "물가는 내려도 [[빚은 그대로]]", lines: ["월급 ↓ · 물건값 ↓", "갚아야 할 빚의 숫자는 [[그대로]]", "빚의 실제 무게는 오히려 [[커진다]]"]}
    sync: {at: [0, "빚진", "피셔가"]}
  - say: "일본에서는 이것을 '디플레이션 마인드'라고 불렀습니다. 기업은 값을 못 올리고, 노동자는 월급을 올려 달라고 하지 못하는 분위기가 30년 가까이 이어졌습니다."
    scene: {kind: quote, text: "값도 못 올리고, [[월급도 못 올리는]] 분위기", by: "일본의 '디플레이션 마인드'"}
    sync: {at: [0, "마인드'라고", "30년"]}
  - say: "월급쟁이 입장에서 보면 이렇습니다. 사장님이 올해도 물건값을 못 올렸으니 월급은 동결이라고 말합니다. 나도 물가가 안 올랐으니 그럴 수 있지 하고 넘어갑니다. 이런 해가 열 번, 스무 번 반복되는 겁니다."
    scene: {kind: doc, tag: "비유", meta: "디플레이션 마인드의 하루", title: "올해도 [[동결]]입니다", lines: ["사장: 물건값을 못 올렸으니 동결", "직원: 물가도 그대로니 [[그럴 수 있지]]", "이런 해가 열 번, 스무 번"]}
    sync: {at: [0, "사장님이", "열"]}
  - say: "이 시절 일본에서 문을 닫는 가게와 백화점이 이어졌고, 살아남은 가게들은 더 싸게 파는 경쟁에 매달렸습니다. 가격 인하 경쟁은 다시 월급을 누르는 힘이 됐습니다."
    theme: dark
    scene: {kind: quote, text: "더 싸게, 더 싸게 — [[가격 인하 경쟁]]", by: "디플레이션 시대의 거리"}
    sync: {at: [0]}
  - say: "물가가 내리니 나라 경제의 크기를 돈으로 잰 명목 GDP도 줄어듭니다. 일본의 명목 GDP는 1997년 554.1조 엔이었는데, 2012년에는 505.4조 엔이었습니다."
    source: "OECD 국민계정 · 일본 명목 GDP"
    scene: {kind: line, title: "일본 명목 GDP", sub: "OECD · 조 엔", x: [1990, 1997, 2003, 2009, 2016, 2025], ymax: 700, series: [{label: "명목 GDP", color: navy, points: [[1990, 471.0], [1997, 554.1], [2003, 530.2], [2009, 499.4], [2012, 505.4], [2016, 556.0], [2025, 663.6]]}]}
    sync: {at: [0, "554.1조", "505.4조"]}
  - say: "1990년 471.0조 엔이던 명목 GDP는 1997년 554.1조 엔까지 커졌다가, 2009년에는 499.4조 엔으로 다시 500조 엔 아래로 내려갑니다. 12년 동안 오히려 줄어든 겁니다."
    source: "OECD 국민계정 · 일본 명목 GDP"
    theme: dark
    scene: {kind: quote, text: "커졌다가 [[다시 줄어든]] 나라의 크기", by: "일본 명목 GDP · 2009년 499.4조 엔"}
    sync: {at: [0, "471.0조", "499.4조"]}
  - say: "15년 동안 경제가 오히려 작아진 셈입니다. 1997년 수준을 처음 넘은 건 2016년, 19년 만이었습니다. 사회에 막 나온 신입이 중간 관리자가 될 만큼의 시간입니다."
    source: "OECD 국민계정 · 일본 명목 GDP"
    scene: {kind: year, text: "2016", up: "556.0조 엔", down: "1997년 554.1조 엔", to: "19년 만에"}
    sync: {at: [0, "2016년,", "19년"]}
  - say: "명목 GDP가 그대로라는 건, 나라 전체가 버는 돈이 그대로라는 뜻입니다. 나눌 파이가 커지지 않으니 월급도 커질 수 없었습니다."
    theme: dark
