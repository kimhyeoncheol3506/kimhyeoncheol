scenes:
  # ═════════════ 7장 · 돈을 풀고 또 풀다 ═════════════
  - say: "일곱 번째 이야기는 가장 오래, 가장 과감하게 돈을 푼 중앙은행 가운데 하나의 이야기입니다. 1999년부터 2024년까지, 25년에 걸친 실험이었습니다."
    chapter: "7장 · 돈을 풀고 또 풀다"
    theme: dark
    scene: {kind: chapter, kicker: "7장", title: "돈을 풀고\n또 풀다"}
    sync: {at: [0]}
  - say: "도쿄 니혼바시에 있는 일본은행 본점입니다. 지난 30년 동안 이 건물에서 경제학 교과서에 새로 실릴 만한 실험들이 결정됐습니다."
    theme: dark
    scene: {kind: stack, logo: "BANK OF JAPAN", label: "일본은행 · [[도쿄 니혼바시]]", cards: [{meta: "1999년", text: "제로 금리"}, {meta: "2013년", text: "양적·질적 완화"}, {meta: "2016년", text: "마이너스 금리 · 수익률곡선 통제"}, {meta: "2024년", text: "[[금리 인상]] 시작"}]}
    sync: {at: [0]}
  - say: "1999년, 일본은행은 단기 금리를 사실상 0%로 내리는 제로 금리 정책을 시작합니다. 돈을 빌리는 값을 공짜에 가깝게 만든 거죠."
    source: "Wikipedia 'Bank of Japan'"
    scene: {kind: year, text: "1999", up: "제로 금리", down: "디플레이션", to: "금리 0%"}
    sync: {at: [0, "1999년,", "제로"]}
  - say: "2000년에 잠시 이를 거뒀다가, 2001년 3월에는 금리 대신 시중에 푸는 돈의 양 자체를 목표로 삼는 양적 완화를 시작합니다. 당시로서는 거의 처음 시도되는 실험이었습니다."
    source: "Wikipedia 'Bank of Japan'"
    scene: {kind: doc, tag: "2001년 3월", meta: "Wikipedia 'Bank of Japan'", title: "금리 대신 [[돈의 양]]을 목표로", lines: ["2000년: 제로 금리를 잠시 거두다", "2001년 3월: [[양적 완화]] 시작", "금리가 0이 되자 꺼낸 다음 카드"]}
    sync: {at: [0, "2000년에", "2001년", "양적"]}
  - say: "왜 이렇게까지 했을까요? 금리를 0까지 내려도 사람들이 돈을 빌려 쓰지 않았기 때문입니다. 디플레이션 마인드가 그만큼 단단했던 거죠."
    theme: dark
    scene: {kind: quote, text: "금리가 0이어도 [[빌리지 않는]] 사람들", by: "제로 금리의 한계"}
    sync: {at: [0, "0까지", "단단했던"]}
  - say: "비유하자면 수도꼭지를 끝까지 틀었는데 물이 파이프 안에서만 돌고 집 안까지 오지 않는 상황입니다. 경제학에서는 이를 유동성 함정이라고 부릅니다."
    scene: {kind: doc, tag: "비유", meta: "유동성 함정", title: "수도꼭지는 열었는데 [[물이 안 온다]]", lines: ["중앙은행: 돈을 푼다", "은행: 돈은 쌓이는데 빌려 갈 곳이 없다", "기업·가계: [[미래가 불안해]] 빌리지 않는다"]}
    sync: {at: [0, "수도꼭지를", "유동성"]}
  - say: "그리고 2013년 4월 4일, 일본은행은 훨씬 더 큰 카드를 꺼냅니다. 물가 상승률 2%를 약 2년 안에 달성하겠다며, 시중에 푸는 본원 통화를 두 배로 늘리겠다고 발표합니다."
    source: "일본은행 · 양적·질적 금융완화 도입 (2013년 4월 4일)"
    theme: dark
    scene: {kind: stack, logo: "QQE 2013", label: "2013년 4월 4일 [[양적·질적 완화]]", cards: [{meta: "목표", text: "물가 상승률 [[2%]]"}, {meta: "기한", text: "약 2년 안에"}, {meta: "수단", text: "본원 통화를 [[두 배]]로"}]}
    sync: {at: [0, "2013년", "2%를", "두"]}
  - say: "새 총재 구로다 하루히코가 이끈 이 정책에 주가가 먼저 반응합니다. 2013년 1만 600 근처에서 시작한 닛케이는 5월 15,942까지 올랐고, 2015년에는 2만을 넘었습니다."
    source: "Wikipedia 'Bank of Japan' · 'Nikkei 225'"
    scene: {kind: timeline, title: "돈이 풀리자 [[주가]]가 먼저", years: [2013, 2015], events: [{year: 2013, text: "1월 약 10,600 → 5월 [[15,942]]"}, {year: 2015, text: "[[20,000]] 돌파"}]}
    sync: {at: [0, "구로다", "15,942까지", "2만을"]}
  - say: "일본은행은 국채를 1년에 60조에서 70조 엔씩 사들이며 돈을 풀었습니다. 이른바 '아베노믹스'의 한 축으로 불린 정책입니다."
    source: "Wikipedia 'Bank of Japan'"
    scene: {kind: bignum, label: "2013년 발표 · 한 해 자산 매입 규모", from: 0, to: 70, unit: "조 엔", color: navy, sub: "[[60~70조 엔]] · 연간 기준"}
    sync: {at: [0, "60조에서", "아베노믹스"]}
  - say: "일본은행은 국채뿐 아니라 주식으로 만든 상장지수펀드, ETF까지 사들였습니다. 2017년 말에는 일본 ETF의 약 75%를 일본은행이 갖고 있었다는 보도도 있습니다."
    source: "Wikipedia 'Nikkei 225' (Bloomberg 등 보도 인용)"
    theme: dark
    scene: {kind: gauge, title: "일본 ETF 가운데 [[일본은행]] 보유분", sub: "2017년 말 · 보도 기준 추정", value: 75, label: "약 75%", color: red}
    sync: {at: [0, "ETF까지", "75%를"]}
  - say: "닛케이 225 종목의 90%에서 일본은행이 10대 주주 안에 들었다는 분석도 나왔습니다. 중앙은행이 사실상 주식 시장의 큰손이 된 겁니다."
    source: "Wikipedia 'Nikkei 225' (Barron's 보도 인용)"
    scene: {kind: quote, text: "중앙은행이 [[주식 시장의 큰손]]으로", by: "닛케이 225 종목의 90%에서 10대 주주"}
    sync: {at: [0, "90%에서", "큰손이"]}
  - say: "그래도 물가 2%는 쉽게 오지 않았습니다. 2016년 1월 29일, 일본은행은 은행이 맡긴 돈 일부에 마이너스 0.1%의 금리를 매기는 마이너스 금리까지 도입합니다. 찬성 5, 반대 4의 아슬아슬한 결정이었죠."
    source: "일본은행 · 마이너스 금리 부과 양적·질적 금융완화 도입 (2016년 1월 29일)"
    scene: {kind: bignum, label: "2016년 1월 29일 · 마이너스 금리", from: 0, to: -0.1, unit: "%", color: red, sub: "정책위원 [[5대 4]]로 결정"}
    sync: {at: [0, "1월", "0.1%의", "찬성"]}
  - say: "마이너스 금리란 돈을 맡기면 이자를 받는 게 아니라 오히려 수수료를 내는 것과 비슷합니다. 은행이 돈을 쌓아 두지 말고 빌려주라는 신호였죠."
    theme: dark
    scene: {kind: flip, label: "돈을 맡기면 이자 대신", from: "+INTEREST", to: "-INTEREST"}
    sync: {at: [0, "수수료를", "신호였죠."]}
  - say: "그런데 2016년이 되자, 3년 동안의 대규모 완화도 디플레이션을 크게 바꾸지 못했다는 것이 분명해집니다. 일본은행은 정책 전체를 다시 점검합니다."
    source: "Wikipedia 'Bank of Japan' · 일본은행 결정문(2016.9.21 종합적 검증)"
    scene: {kind: quote, text: "3년의 완화, [[바뀌지 않은]] 디플레이션", by: "2016년 일본은행의 종합 점검"}
    sync: {at: [0, "2016년이", "점검합니다."]}
  - say: "같은 해 9월 21일에는 10년 만기 국채 금리까지 0% 근처로 묶어 두는 수익률곡선 통제를 시작합니다. 단기 금리뿐 아니라 장기 금리까지 중앙은행이 정하겠다는 겁니다."
    source: "일본은행 · 수익률곡선 통제 부과 양적·질적 금융완화 (2016년 9월 21일)"
    scene: {kind: doc, tag: "2016년 9월 21일", meta: "일본은행 결정문", title: "장기 금리까지 [[묶어 두다]]", lines: ["단기 금리: [[-0.1%]]", "10년 국채 금리: [[0% 근처]]", "필요한 만큼 국채를 사들여 유지"]}
    sync: {at: [0, "9월", "10년", "장기"]}
  - say: "그 결과는 엇갈립니다. 물가가 마이너스로 빠지는 해는 줄었고 주가는 올랐지만, 2% 물가와 임금 상승이라는 목표는 오랫동안 오지 않았습니다."
