title: (이거 한편으로 끝) 일본은 왜 30년 동안 월급이 안 올랐을까? 한국이 똑같은 길을 가고 있다는 숫자들
intro_chapter: 인트로 · 한국이 제2의 일본?
voice:
  speed: 1.0
  instruct: 경제 다큐멘터리 해설자처럼 차분하고 또렷하게, 이야기를 들려주듯 따뜻하게. 숫자와 연도는 또박또박.
thumbnail:
  file: assets/thumbs/oneshot_japan_thumb_B.png
summary: '일본의 평균 임금은 물가를 반영하면 1990년과 2025년이 거의 같습니다(OECD). 왜 일본의 월급은 30년 넘게 멈춰 있었을까요?

  1985년 플라자 합의와 엔고, 거품경제의 정점(1989년 닛케이 38,915), 거품 붕괴와 불량채권, 물가가 내리는 디플레이션, 멈춘 월급, 고령화, 일본은행의 제로금리·양적완화·수익률곡선 통제와 2024년 이후 금리 인상, 닛케이 사상 최고치와 엔화 약세까지 1시간에 정리했습니다.

  그리고 ''한국이 제2의 일본''이라는 말이 진짜인지, 출산율·고령화 속도·가계부채·부동산 비중·잠재성장률·임금을 일본과 나란히 놓고 확인합니다. 닮은 점도, 다른 점도 있습니다.

  마지막 장은 월급쟁이가 지금 내 돈을 어떻게 다루면 좋을지에 대한 일반적인 원칙입니다(특정 상품 추천이나 투자 권유가 아닙니다). 모든 숫자의 출처는 아래에 적었습니다.

  '
