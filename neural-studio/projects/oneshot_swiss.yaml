name: 스위스가부자가된진짜이유_1시간
style: paper
format: longform
auto_beats: 2.4
brand: 월급쟁이 재테크 스킬
title: (이거 한편으로 끝) 산밖에 없는 스위스가 세계 최고 부자 나라가 된 진짜 이유｜용병·시계·약·비밀 은행 팩트체크 (1시간 몰아보기)
intro_chapter: 인트로 · 산밖에 없던 나라의 질문
voice:
  speed: 1.0
  instruct: 역사 다큐멘터리 해설자처럼 차분하고 또렷하게, 이야기를 들려주듯 따뜻하게. 숫자와 연도는 또박또박.
thumbnail:
  file: assets/thumbs/oneshot_swiss_thumb_B.png
summary: '땅의 절반이 해발 1,080m 위에 있고, 석유도 바다도 없는 나라. 그런데 2024년 1인당 GDP는 약 10만 7,700달러(World Bank)로 세계 최상위권입니다.

  흔히 ''비밀 은행 덕분''이라고들 하죠. 정말일까요? 가난한 산골의 용병, 위그노 피난민이 가져온 시계 기술, 중립과 연방제, 1934년 은행법과 2009년 UBS 사건·2018년 자동정보교환, 바젤의 염료 공장에서 시작된 제약 산업, 도제제도, 그리고 스위스프랑과 낮은 물가까지 1시간에 정리했습니다.

  결론부터 말하면, 금융업은 스위스 GDP의 약 9%(SIF·SECO, 2024)이고, 수출의 절반 이상은 약과 화학제품(BAZG, 2024)입니다. 마지막 장에서는 이 이야기가 월급쟁이의 돈 관리에 주는 교훈을 정리했습니다(투자 권유 아님). 모든 숫자의 출처는 아래에 적었습니다.

  '
