title: "세계 6위 부자 나라가 64위로… 아르헨티나 100년"
summary: |
  아르헨티나 경제 몰락의 숫자. 매디슨 프로젝트 추정으로 1896년 아르헨티나의 1인당 소득은 세계 6위(자료 있는 40개국 중), 미국의 83%였습니다. 2022년에는 64위(165개국 중), 미국의 31%.
  1950년 한국 소득은 아르헨티나의 8분의 1이었지만 지금은 두 배가 넘습니다. 전체 이야기는 본편 「아르헨티나 경제 몰락 100년」에서.
