summary: '코스피 4900 붕괴, 코스피 폭락. 11월 20일 코스피가 4,900 아래로 밀리며 매도 사이드카가 발동됐습니다. 지금 팔아야 할까요, 버텨야 할까요?

  2000년부터 2024년까지 코스피가 하루 6% 넘게 빠진 19번, 그날 판 사람과 버틴 사람의 1년 뒤를 지수로 직접 계산했습니다(배당·수수료·세금 제외). 버틸 수 있는 사람의 조건 3가지(빚 없음, 생활비 6개월, 여유자금)와 버티는 동안 할 일(적립 유지, 분할매수 규칙, 앱 끄기)을 정리했습니다. 빚투·단기자금은 예외입니다. 투자 권유가 아니며,
  모든 숫자의 출처와 계산 전제는 아래에 적었습니다.

  '
