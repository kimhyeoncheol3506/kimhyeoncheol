# hot_jibun — '지금 뜨거운 돈 이슈' 지분적립형 공공분양 편 (2026-11-18 대본, 더빙·렌더는 메인 세션)
# 채널 계산은 모두 projects/_series_hot/calc_jibun.py (전제는 그 파일 머리 주석과 3장 '계산 전제' 판에 적음).
# 계산 요약 (예금 3.5%·단리, 분양가 5억 1,000만 원, 처음 시세=분양가, 전세 4억 원, 주담대 LTV 70%·4.88%·30년, 세금·관리비 제외):
#   지분적립형: 처음 25% 1억 2,750만 / 추가 15%: 4년 8,721만 · 8년 9,792만 · 12년 1억 863만 · 16년 1억 1,934만 · 20년 1억 3,005만
#     = (5억 1,000만 + 5억 1,000만 × 3.5% × t) × 15%  → 지분값 합 6억 7,065만, 사용료(월세, 2년마다 그때 전세 90% × 미취득 지분 × 3.5%) 합 1억 1,340만
#     → 20년 총액 7억 8,405만 (집값 연 2%면 사용료 1억 2,922만, 총 7억 9,987만)
#   손익분기: (6억 7,065만 / 5억 1,000만)^(1/20) − 1 = 연 1.38%  · 회차별: 4년 회차 연 3.33%, 20년 회차 연 2.69%
#   집값 −1%: 20년 뒤 4억 1,713만 (낸 지분값과 차이 2억 5,352만) · 0%: 5억 1,000만 · 2%: 7억 5,783만
#   월 환산: 8,721만 / 48 = 182만 + 첫 월세 79만 ≈ 260만
#   주담대: 대출 3억 5,700만, 계약금 1억 5,300만, 월 189만, 20년 이자 2억 7,590만, 남은 빚 1억 7,921만
#   전세: 보증금 4억 × 3.5% × 20년 = 2억 8,000만 (집값 2%면 보증금이 2년마다 올라 3억 3,680만)
#   순비용(낸 돈 + 묶인 돈의 예금이자 − 20년 뒤 남는 자산):
#     금리 지금 · 집값 0%: 지분 5억 39만 · 주담대 4억 3,842만 · 전세 2억 8,000만
#     금리 지금 · 집값 2%: 지분 2억 6,837만 · 주담대 1억 9,058만 · 전세 3억 3,680만
#     금리 +0.5%p · 집값 0%: 지분 5억 6,221만 · 주담대 4억 9,085만 · 전세 3억 2,000만 (지분 첫 월세 90만, 총액 8억 1,172만, 주담대 월 200만)
