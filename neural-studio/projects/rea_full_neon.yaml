voice:
  instruct: "또렷하고 친근한 IT 해설 유튜버 톤. 시청자에게 말을 걸듯 자연스럽게, 핵심 낱말과 숫자는 힘주어 또박또박. 높낮이를 살려 단조롭지 않게, 문장 끝은 가볍게 닫는다."

scenes:
  # ───────── 인트로: 후킹 (참고 A의 '별 19만'·'소프트웨어는 끝났다' + 참고 B의 '들어보셨나요?') ─────────
  - say: "포토샵, 프리미어, 파워포인트, 워드. 이 프로그램들, 이제 끝났다는 말 들어보셨어요?"
    instruct: "충격적인 소식을 터뜨리듯 힘 있고 빠르게. 프로그램 이름은 하나씩 툭툭 끊어 강하게, 마지막 질문은 끝을 올려 궁금하게."
    scene: {kind: hook, small: 해외 개발자들 사이에서 나온 말, line1: "소프트웨어 시대는", line2: "[[끝났다?]]", fire: true}
    sync: {at: [0, "워드.", "끝났다는"]}      # 2026-11-03 정지 4.5초 넘던 판: 등장 시점 고르게
  - say: "범인은 깃허브에서 별을 무려 40만 개나 받은 오픈소스, 레아입니다."
    instruct: "놀라운 숫자를 강조하듯, '무려 40만 개'에 강세를 크게 준다."
    source: "github.com/morluto/rea README (2026-11-03)"
    scene: {kind: number, label: "GitHub ★", to: 400000, unit: "", sub: "오픈소스 [[REA]] · 2026-11-03 기준"}
    sync: {at: [0, "40만"]}
  - say: "한 유튜버가 10월 13일에 처음 조사했을 땐 16만 개였는데, 열흘 뒤엔 37만 개, 지금은 40만 개를 넘겼어요."
    instruct: "믿기 힘든 소식을 전하듯 점점 목소리를 키우며, 마지막 '40만 개'에서 가장 힘을 준다."
    source: "신영선의 AI탐구 조사(10/13·10/24) · REA README(11/03)"
    scene:
      kind: bars
      label: "GitHub 별, 말도 안 되는 속도"
      bars:
        - {label: "10월 13일", value: 16, show: "16만"}
        - {label: "10월 24일", value: 37, show: "37만"}
        - {label: "11월 3일", value: 40, show: "40만"}
      sub: "한 달도 안 돼 [[두 배 넘게]]"
    sync: {at: [0, "16만", "37만", "40만", "넘겼어요."]}
  - say: "소스 코드가 없는 완성된 앱을, AI가 거꾸로 뜯어보고 같은 기능까지 만들어 줍니다."
    instruct: "비밀을 털어놓듯 살짝 낮췄다가, '같은 기능까지'에서 힘을 준다."
    scene:
      kind: flow
      tag: REA
      nodes:
        - {glyph: "▣", name: 완성된 앱, sub: 소스 코드 없음}
        - {glyph: "⌕", name: AI가 뜯어보기, sub: 거꾸로 분석}
        - {glyph: "✦", name: 같은 기능, sub: 내 프로젝트에}
    sync: {at: [0, "완성된", "거꾸로", "같은"]}
  - say: "그래서 해외에서는 소프트웨어는 끝났다, 이런 말까지 나왔어요."
    source: "Ars Technica (2026-10-07)"
    scene:
      kind: doc
      meta: "arstechnica.com · 2026-10-07"
      title: 해외 기사 제목
      lines: ["{{“Software is over”}}: Bold AI developer takes aim", "at Adobe with open source clones"]
    sync: {at: [0, "소프트웨어는"]}
  - say: "근데 진짜 중요한 건 따로 있습니다. AI가 만든 결과를 어디까지 믿어야 할까요?"
    instruct: "잠깐 멈췄다가 진지하게. '진짜 중요한 건'을 천천히 힘주어, 질문은 시청자에게 직접 묻듯."
    scene: {kind: hook, small: 오늘 끝까지 보셔야 하는 이유, line1: "AI가 만든 결과,", line2: "[[어디까지 믿을까?]]", size: 104}
    sync: {at: [0, "AI가", "믿어야"]}
  - say: "오늘 뉴럴서랍에서 레아의 정체부터, 사람들이 실제로 뭘 하고 있는지 보겠습니다."
    scene:
      kind: agenda
      items:
        - {slash: /what, text: 레아는 무엇인가}
        - {slash: /use, text: 사람들은 이렇게 쓴다}
        - {slash: /how, text: 어떻게 작동하나}
        - {slash: /check, text: AI 결과 검증하기}
        - {slash: /install, text: 직접 설치하기}
        - {slash: /next, text: 누가 얻고 누가 잃나}
    sync: {at: [0, "정체부터,", "실제로"]}
  - say: "이어서 작동 원리와 결과 검증법, 설치 방법, 그리고 앞으로 뭐가 바뀌는지까지 정리해 드릴게요."
    scene:
      kind: recap
      slash: /today
      items:
        - {k: /how, v: 작동 원리}
        - {k: /check, v: "결과 [[검증법]]"}
        - {k: /install, v: 설치 방법}
        - {k: /next, v: 앞으로 바뀌는 것}
    sync: {at: [0, "작동", "검증법,", "설치", "앞으로"]}

  # ───────── PART 01 /what ─────────
  - say: "먼저, 레아가 어떤 도구인지부터 짚어 보겠습니다."
    chapter: "PART 01 · 레아(REA)의 정체"
    scene: {kind: part, num: PART 01, slash: /what, title: 레아는 무엇인가}
    sync: {at: [0, "레아가", "도구인지부터"]}
  - say: "레아는 리버스 엔지니어 애니싱을 줄인 이름이에요. 말 그대로, 무엇이든 거꾸로 뜯어본다는 뜻입니다."
    scene: {kind: title, tag: 이름, kicker: "Reverse Engineer Anything", title: "R · E · A", sub: "무엇이든 [[거꾸로]] 뜯어본다"}
    sync: {at: [0, "이름이에요.", "무엇이든"]}      # 2026-11-03 정지 4.5초 넘던 판: 등장 시점 고르게
  - say: "리버스 엔지니어링, 말은 어렵죠? 쉽게 말하면, 완성된 요리를 맛보고 레시피를 알아내는 거예요."
    instruct: "어려운 말을 쉽게 풀어 주듯 다정하게, '쉽게 말하면' 뒤에 살짝 쉬고 밝게."
    scene:
      kind: flow
      tag: 쉽게 말하면
      nodes:
        - {glyph: "🍲", name: 완성된 요리}
        - {glyph: "👅", name: 맛보기}
        - {glyph: "📝", name: 레시피 알아내기}
    sync: {at: [0, "완성된", "맛보고", "레시피를"]}
  - say: "원래는 다 만든 기계를 분해해서, 부품이 어떻게 짜여 있는지 확인하는 일에서 나온 말입니다."
    scene: {kind: hook, small: 리버스 엔지니어링의 출발, line1: "다 만든 기계를", line2: "[[분해해 본다]]", size: 110}
    sync: {at: [0, "기계를", "부품이"]}
  - say: "소프트웨어에서는 이미 나온 앱에서 출발해, 개발자가 처음 써 넣은 코드와 규칙을 되짚어 찾는 일이에요."
    scene:
      kind: flow
      tag: 소프트웨어에서는
      nodes:
        - {glyph: "▣", name: 이미 나온 앱}
        - {glyph: "↺", name: 되짚어 찾기}
        - {glyph: "</>", name: 처음 코드와 규칙}
    sync: {at: [0, "이미", "되짚어", "규칙을"]}
  - say: "어려운 점은, 우리 손에 들어오는 앱이 사람이 읽는 코드가 아니라는 겁니다."
    scene: {kind: warn, tag: 문제, title: "사람이 못 읽는다", lines: ["배포된 앱은 [[컴퓨터만 아는 숫자 묶음]]"]}
    sync: {at: [0, "사람이"]}
  - say: "배포되기 전에 컴퓨터만 알아보는 숫자 묶음으로 바뀌어 있어서, 열어 봐도 무슨 내용인지 알 수가 없어요."
    scene:
      kind: terminal
      tag: 열어 보면
      title: app.exe
      decor_numbers: true          # 헥스 덤프는 '사람 눈엔 숫자뿐'을 보여 주는 꾸밈. 사실 숫자 아님
      lines: ["4D 5A 90 00 03 00 00 00 04 00 00 00 FF FF", "B8 00 00 00 00 00 00 00 40 00 00 00 00 00", "0E 1F BA 0E 00 B4 09 CD 21 B8 01 4C CD 21", "# ...사람 눈에는 그냥 숫자"]
    sync: {at: [0, "숫자", "열어", "알"]}
  - say: "그래서 이걸 해석하려면 전용 분석 프로그램을 다룰 줄 알아야 했고, 그건 오랜 경험을 쌓은 보안 전문가의 몫이었죠."
    scene:
      kind: icons
      tag: 예전에는
      label: 전문가만 하던 일
      items:
        - {glyph: "🛠", name: 전용 분석기}
        - {glyph: "⏳", name: 오랜 경험}
        - {glyph: "🛡", name: 보안 전문가}
    sync: {at: [0, "전용", "오랜", "보안"]}
  - say: "레아는 바로 그 전문가의 자리에 클로드 같은 AI를 앉힙니다."
    instruct: "반전을 알리듯 또렷하게, '바로 그 자리에'에서 힘을 준다."
    scene: {kind: hook, line1: "전문가의 자리에", line2: "[[AI를 앉힌다]]", size: 116}
    sync: {at: [0, "전문가의", "AI를"]}
  - say: "클로드 코드나 코덱스 같은 AI 에이전트에 분석 도구를 붙여 주는 거예요."
    source: "github.com/morluto/rea README"
    scene:
      kind: icons
      tag: 어디에 붙나
      label: 내가 쓰는 AI 에이전트에 연결
      items:
        - {glyph: "✳", name: Claude Code}
        - {glyph: "◎", name: Codex}
        - {glyph: "▲", name: Cursor}
        - {glyph: "✦", name: Gemini CLI}
    sync: {at: [0, "클로드", "코덱스", "에이전트에", "분석"]}
  - say: "설치된 프로그램은 물론, 자바스크립트로 만든 앱, 웹사이트, 안드로이드 앱까지 들여다볼 수 있어요."
    source: "github.com/morluto/rea README · What you can analyze"
    scene:
      kind: list
      num: "ALL"
      title: 뜯어볼 수 있는 것
      items: ["설치된 프로그램 · 실행 파일", "자바스크립트 · 일렉트론 앱", "웹사이트 · 안드로이드 앱"]
    sync: {at: [0, "설치된", "자바스크립트로", "안드로이드"]}      # 2026-11-03 마지막 항목을 늦춰 4.8초 정지 해소
  - say: "그리고 나서, 이 기능은 이렇게 동작해요, 라고 근거와 함께 설명해 줍니다."
    scene:
      kind: chat
      tag: 결과는
      label: "설명 + [[근거]]"
      messages:
        - {who: me, text: "이 기능 어떻게 돌아가?"}
        - {who: ai, text: "이렇게 동작해요. 근거는 이 코드 위치와 호출 순서예요."}
    sync: {at: [0, "이", "근거와"]}
  - say: "공식 예시가 딱 이거예요. 메모 앱 검색이 어떻게 도는지 근거를 보여 주고, 비슷하게 만들어 줘."
    source: "github.com/morluto/rea README · Ask your agent"
    scene:
      kind: doc
      tag: 공식 예시
      meta: "github.com/morluto/rea · Quick start"
      title: 에이전트에게 이렇게 말한다
      lines: ["Understand how search works in the Notes app,", "{{show me the evidence}}, and build a", "similar feature for my project."]
    sync: {at: [0, "근거를"]}
  - say: "정리하면, 레아는 코드가 감춰진 앱의 작동 원리를 AI가 대신 읽어 내도록 만든 무료 공개 도구입니다."
    instruct: "차분하게 정리하듯, 마지막 '무료 공개 도구'를 또박또박."
    scene:
      kind: recap
      slash: /what
      items:
