intro:
  - say: "연초 100원이 연말엔 약 5,000원이 됐습니다."
    instruct: "첫마디부터 또렷하게, 숫자를 힘주어."
    source: "BCRA 1989 연차보고서 · 소비자물가 +4,923%(1989년 12월, 전년 12월 대비)를 원화로 바꿔 본 예시"
    scene: {kind: flip, label: "1989년 아르헨티나, 같은 [[물건값]]", from: "100원", to: "5,000원"}
    sync: {at: [0, "연말엔"]}
  - say: "물가가 4,923%나 뛰었죠."
    source: "BCRA, Memoria Anual 1989 · 소비자물가 1989년 12월, 전년 12월 대비"
    scene: {kind: bignum, label: "1989년 [[소비자물가]] 상승률", to: 4923, unit: "%", color: red, sub: "1989년 12월 · 전년 12월 대비"}
    sync: {at: [0, "4,923%나"]}
  - say: "아르헨티나, 원래 가난했을까요? 정반대죠."
    theme: dark
    scene: {kind: quote, text: "원래부터 [[가난]]했을까?", by: "아르헨티나"}
    sync: {at: [0, "가난했을까요?", "정반대죠."]}
  - say: "1896년 1인당 소득은 미국의 83%였습니다. 2022년엔 31%입니다."
    source: "Maddison Project Database 2023 (OWID) · 직접 계산"
    scene: {kind: bars, dir: v, title: "미국을 100으로 본 [[아르헨티나]] 1인당 소득", sub: "매디슨 프로젝트 2023 추정 · 2011년 국제달러 기준", unit: "%", items: [{label: "1896년", value: 83, color: navy}, {label: "2022년", value: 31, color: red}]}
    sync: {at: [0, "83%였습니다.", "31%입니다."]}
  - say: "세계 순위로는 6위에서 64위까지 떨어졌습니다."
    theme: dark
    source: "Maddison Project 2023 (OWID) · 1896년 자료 있는 40개국 중, 2022년 165개국 중"
    scene: {kind: flip, label: "1인당 소득 [[세계 순위]]", from: "6위", to: "64위"}
    sync: {at: [0, "64위까지"]}
  - say: "이런 계산 매주 올립니다. 구독해 두시면 다음 편도 받아 보실 수 있어요."
    instruct: "가볍고 짧게, 미소를 담아."
    scene: {kind: quote, text: "이런 계산 [[매주]] 올립니다", by: "구독해 두시면 다음 편도"}
    sync: {at: [0, "구독해"]}
  - say: "같은 자료에서 1950년 한국의 1인당 소득은 아르헨티나의 8분의 1이었습니다. 지금은 한국이 두 배를 넘습니다."
    source: "Maddison Project Database 2023 (OWID)"
    scene: {kind: flip, label: "1950년 → 2022년, 한국과 아르헨티나", from: "1:8", to: "2:1"}
    sync: {at: [0, "8분의", "두"]}
  - say: "흔히 '세계 5대 부국'이었다고들 하죠. 그런데 그 부자 나라는 왜 몰락했을까요? 오늘 이 영상이 끝까지 붙잡을 질문입니다."
    theme: dark
    scene: {kind: quote, text: "부자 나라는 왜 [[몰락]]했을까", by: "오늘의 질문"}
    sync: {at: [0, "5대", "몰락했을까요?"]}
  - say: "그리고 많은 사람이 이렇게 생각합니다. 돈을 찍어내면 다 같이 부자가 된다고. 아르헨티나는 그 생각을 몇 번이고 실제로 해 본 나라입니다."
    scene: {kind: doc, tag: 흔한 생각, meta: "3장에서 확인합니다", title: "돈 찍어내면 [[다 같이 부자]]?", lines: ["정부가 돈을 더 찍어서", "모두에게 나눠 주면?"]}
    sync: {at: [0, "찍어내면", "실제로"]}
  - say: "안녕하세요, 월급쟁이 재테크 스킬입니다. 오늘은 아르헨티나 백 년을 다섯 장으로 따라갑니다. 장마다 역사를 보고, 비유로 원리를 풀고, 숫자로 확인한 다음, 내 돈 교훈으로 마무리하겠습니다."
    theme: dark
    scene: {"kind": "stack", "logo": "HOW TO WATCH", "label": "다섯 장, 장마다 [[네 걸음]]", "cards": [{"meta": "1", "text": "역사 장면"}, {"meta": "2", "text": "쉬운 비유와 원리"}, {"meta": "3", "text": "출처 있는 [[숫자]]"}, {"meta": "4", "text": "지금 내 돈에 주는 교훈"}]}
    sync: {"at": [0, "역사를", "비유로", "숫자로", "교훈으로"]}
outro:
  - say: "오늘 이야기가 내 월급과 내 돈을 지키는 데 조금이라도 도움이 됐다면, 구독과 좋아요 부탁드립니다. 모든 출처와 사진의 이용 조건은 설명란에 정리해 두었습니다."
    instruct: "따뜻하게 인사하듯, '구독과 좋아요'에서 미소를 담는다."
    scene: {kind: quote, text: "끝까지 봐 주셔서 [[고맙습니다]]", by: "월급쟁이 재테크 스킬"}
    sync: {at: [0, "구독과"]}
  - say: "감사합니다."
    hold: 10
    scene: {kind: end, text: ""}
