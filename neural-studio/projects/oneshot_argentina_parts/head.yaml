  - say: "돈을 찍어내면, 다 같이 부자가 될까요? 정말 그렇다면, 세상에 가난한 나라는 하나도 없어야 하지 않을까요?"
    instruct: "조용히 질문을 던지듯, 끝을 살짝 올린다."
