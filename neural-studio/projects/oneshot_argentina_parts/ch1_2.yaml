scenes:
- say: 첫 번째 이야기는 끝없이 펼쳐진 초원, 팜파스에서 시작합니다. 소와 밀, 그리고 유럽에서 건너온 사람들이 이 나라를 부자로 만든 이야기입니다.
  theme: dark
  scene:
    kind: chapter
    kicker: 1장
    title: '세계 10위권

      부자 나라'
  sync:
    at:
    - 0
  chapter: 1장 · 세계 10위권 부자 나라
- say: 아르헨티나 한가운데에는 지평선까지 이어지는 평원이 있습니다. 흙이 기름지고 물이 넉넉해서, 소를 놓아 기르고 밀을 심기에 더없이 좋은 땅이었죠.
  scene:
    kind: photo
    photo: '@pampas_cattle'
    name: 팜파스의 소몰이
    role: 페르난도 브람빌라 그림 · 1794년
  sync:
    at:
    - 0
- say: 자, 여기서 오늘의 첫 번째 팩트체크입니다. 아르헨티나는 정말 '세계 5대 부국'이었을까요? 인터넷과 책에서 자주 보이는 말이지만, 실제 숫자로 확인해 보겠습니다.
  scene:
    kind: quote
    text: 정말 [[5대 부국]]이었을까
    by: 팩트체크 1
  sync:
    at:
    - 0
    - 5대
- say: 그런데 줄을 세워 보면, 1913년 자료가 있는 72개 나라 가운데 아르헨티나는 10위였습니다. 다섯 손가락 안은 아니었던 거죠.
  source: Maddison Project Database 2023 (OWID) · 직접 계산
  scene:
    kind: bignum
    label: 1913년 아르헨티나의 [[순위]]
    to: 10
    unit: 위
    color: navy
    sub: 자료가 있는 72개국 중 · 1인당 소득
  sync:
    at:
    - 0
    - 72개
    - 10위였습니다.
  theme: dark
- say: 그러니까 '5대 부국'은 조금 부풀려진 말입니다. 하지만 '세계 10위권 부자 나라'였다는 건, 이 추정으로 봐도 사실에 가깝습니다.
  theme: dark
  scene:
    kind: quote
    text: 5대는 과장, [[10위권]]은 사실에 가깝다
    by: 팩트체크 1 결과 · 매디슨 추정 기준
  sync:
    at:
    - 0
    - 부풀려진
    - 10위권
- say: 비유하자면 아르헨티나는 아주 잘 팔리는 상품 하나를 가진 가게였습니다. 장사가 잘될 땐 좋지만, 큰손 하나가 발길을 끊으면 어떻게 될까요?
  scene:
    kind: quote
    text: 잘 팔리는 [[상품 하나]]를 가진 가게
    by: 쉬운 비유
  sync:
    at:
    - 0
    - 상품
    - 발길을
- say: 전쟁이 끝나고 1920년대엔 다시 살아납니다. 1929년 1인당 소득은 6,961달러로 그때까지 가장 높았죠. 그런데 바로 그해 가을, 뉴욕 주식시장이 무너집니다.
  source: Maddison Project Database 2023 (OWID)
  scene:
    kind: year
    text: '1929'
    up: 사상 최고 소득
    down: 뉴욕 주가 폭락
    to: 대공황
  sync:
    at:
    - 0
    - 6,961달러로
    - 뉴욕
- say: 가장 큰 충격은 수출이었습니다. 아르헨티나의 수출액은 1929년 15억 3,700만 달러에서 1932년 5억 6,100만 달러로, 3년 만에 3분의 1 남짓이 됩니다.
  source: Wikipedia, Economic history of Argentina
  scene:
    kind: bars
    dir: v
    title: 아르헨티나 [[수출액]]
    sub: 단위 백만 달러
    unit: ''
    items:
    - label: 1929년
      value: 1537
      color: navy
    - label: 1932년
      value: 561
      color: red
  sync:
    at:
    - 0
    - 1929년
    - 1932년
- say: 1장의 교훈입니다. 잘나가는 수입원 하나에 모든 걸 거는 건 나라든 개인이든 위험합니다. 월급 하나, 자산 하나에 모든 게 묶여 있진 않은지 돌아볼 만합니다.
  scene:
    kind: doc
    tag: 1장의 교훈
    meta: 지금 내 돈에 적용하면
    title: 수입원 [[하나]]에 모든 걸 걸지 않기
    lines:
    - 월급 말고도 작은 [[현금 흐름]] 만들기
    - 한 자산에 몰린 비중을 정기적으로 점검
  sync:
    at:
    - 0
    - 수입원
    - 월급
- say: 두 번째 이야기는 아르헨티나 역사에서 가장 뜨거운 이름, 페론입니다. 1946년 선거로 대통령이 된 그는 더 높은 임금과 더 넓은 사회보장을 약속했습니다.
  theme: dark
  chapter: 2장 · 페론의 시대와 불어난 빚
  scene:
    kind: chapter
    kicker: 2장
    title: '페론의 시대와

      불어난 빚'
  sync:
    at:
    - 0
    - 페론입니다.
    - 임금과
- say: 페론 시대 경제를 이해하는 열쇠는 하나입니다. 나라의 돈을 농장 쪽에서, 도시의 공장과 노동자 쪽으로 옮기겠다는 것.
  scene:
    kind: quote
    text: 농장의 돈을 [[공장과 노동자]]에게
    by: 페론 경제의 핵심
  sync:
    at:
    - 0
    - 농장
    - 노동자
- say: 쉽게 말하면 정부가 농산물 도매상이 된 겁니다. 농민에게 싸게 사서 외국에 비싸게 팔고, 그 차익을 도시에 나눈 거죠. 농민 입장에선 눈에 보이지 않는 세금이었습니다.
  theme: dark
  scene:
    kind: quote
    text: 정부가 [[도매상]]이 되다
    by: 쉬운 비유
  sync:
    at:
    - 0
    - 도매상이
    - 세금이었습니다.
- say: 국민소득에서 노동자 임금이 차지하는 몫은 1945년 40%에서 1949년 49%로 커집니다. 지금도 이 시대를 그리워하는 사람이 많은 이유죠.
  source: Wikipedia, Juan Perón
  theme: dark
  scene:
    kind: waffle
    title: 국민소득 중 [[노동자의 몫]]
    sub: 1945년 → 1949년
    groups:
    - label: 1945년
      value: 40
      color: sky
    - label: 1949년
      value: 49
      color: navy
  sync:
    at:
    - 0
    - 40%에서
    - 49%로
- say: 중산층이 두터워지고, 처음으로 나도 이 나라의 주인이라고 느낀 사람이 많아졌다는 평가가 있습니다. 이것도 분명한 페론 시대의 한 얼굴입니다.
  scene:
    kind: quote
    text: 처음으로 [[주인]]이 된 사람들
    by: 페론 시대를 높이 보는 평가
  sync:
    at:
    - 0
    - 중산층이
    - 주인이라고
- say: 경제사학자들은 이 시기 공공투자와 지출의 상당 부분이 '인플레이션 세금'으로 충당됐다고 봅니다. 쉽게 말해 돈을 더 찍어 메웠다는 뜻이죠.
  source: Wikipedia, Economic history of Argentina
  theme: dark
  scene:
    kind: doc
    tag: 원리
    meta: inflationary tax
    title: 보이지 않는 세금, [[인플레이션]]
    lines:
    - 지출을 늘리고 모자란 돈은 찍어서
    - 물가가 오르며 모두가 [[조금씩]] 내는 세금
  sync:
    at:
    - 0
    - 인플레이션
    - 찍어
- say: 페론 시대의 평가는 지금도 둘로 갈립니다. 한쪽은 노동자의 권리와 중산층을 만든 시대로, 다른 쪽은 돈을 찍고 규제로 버틴 쇠퇴의 출발점으로 봅니다.
  scene:
    kind: doc
    tag: 양쪽의 평가
    meta: 페론 시대 · 1946~1955년
    title: 같은 시대, [[두 개의 기억]]
    lines:
    - '높이 보는 쪽: 임금 · 사회보장 · 노동권'
    - '비판하는 쪽: 인플레이션 · 수출 위축 · [[규제]]'
  sync:
    at:
    - 0
    - 권리와
    - 쇠퇴의
