scenes:
  # ═════════════ 7장 · 코랄리토, 은행 문이 닫힌 날 ═════════════
  - say: "일곱 번째 이야기는, 은행에 맡긴 내 돈을 마음대로 꺼낼 수 없게 된 날입니다. 숫자가 아니라 사람들의 일상이 무너진 이야기죠."
    chapter: "7장 · 코랄리토, 은행 문이 닫힌 날"
    theme: dark
    scene: {kind: chapter, kicker: "7장", title: "코랄리토,\n은행 문이 닫힌 날"}
    sync: {at: [0]}
  - say: "2001년 12월 1일, 정부는 대통령령 1570호를 발표합니다. 은행에서 현금은 한 사람이 일주일에 250페소, 또는 250달러까지만 찾을 수 있게 한 거죠."
    source: "대통령령 제1570/2001호 (argentina.gob.ar)"
    scene: {kind: doc, tag: "대통령령 제1570호", meta: "2001년 12월 1일", title: "현금 인출은 [[일주일에 250]]까지", lines: ["1주 현금 인출 250페소 또는 250달러", "해외 송금 금지", "카드·계좌이체는 가능"]}
    sync: {at: [0, "1570호를", "250페소,"]}
  - say: "이 조치는 처음엔 90일 동안만이라고 했습니다. 인출 한도도 나중에 250페소에서 300페소로 조금 늘었죠. 하지만 울타리는 생각보다 훨씬 오래 이어집니다."
    source: "Wikipedia, Corralito"
    theme: "dark"
    scene: {"kind": "quote", "text": "90일이라던 [[울타리]]", "by": "코랄리토의 시작"}
    sync: {"at": [0, "90일", "300페소로", "울타리는"]}
  - say: "사람들은 이 조치를 코랄리토라고 불렀습니다. 작은 울타리라는 뜻이죠. 내 돈이 은행이라는 울타리 안에 갇혀 버린 겁니다."
    scene: {kind: quote, text: "코랄리토, [[작은 울타리]]", by: "2001년 12월의 예금 동결"}
    sync: {at: [0, "작은", "갇혀"]}
  - say: "목적은 은행에서 돈이 한꺼번에 빠져나가는 걸 막는 것이었습니다. 하지만 카드보다 현금을 많이 쓰던 때라, 현금이 막히자 장사와 일상이 멈춰 버립니다."
    source: "Wikipedia, Corralito"
    theme: dark
    scene: {kind: doc, tag: "결과", meta: "코랄리토의 첫 몇 주", title: "현금이 막히자 [[일상]]이 멈추다", lines: ["카드 단말기가 없는 가게가 많았다", "현금으로 받던 일당·장사가 [[멈춤]]"]}
    sync: {at: [0, "한꺼번에", "멈춰"]}
  - say: "은행은 맡긴 돈을 금고에 다 쌓아 두지 않습니다. 대부분은 대출로 빌려주죠. 그래서 모두가 한꺼번에 찾으러 오면, 어떤 은행도 버틸 수 없습니다."
    scene: {kind: doc, tag: "원리", meta: "bank run", title: "[[뱅크런]]은 왜 무서운가", lines: ["예금의 대부분은 대출로 나가 있다", "모두가 동시에 찾으면 [[어떤 은행도]] 못 버틴다"]}
    sync: {at: [0, "금고에", "한꺼번에"]}
  - say: "극장에 불이 났다는 소문이 돌면, 진짜 불이 없어도 모두가 출구로 몰려 사람이 다칩니다. 뱅크런은 그 출구가 은행 창구인 셈이죠."
    scene: {kind: quote, text: "소문만으로 [[출구]]가 막힌다", by: "쉬운 비유"}
    sync: {at: [0, "소문이", "창구인"]}
  - say: "그래서 많은 나라에는 예금자 보호 제도가 있습니다. 은행이 어려워져도 일정 금액까지는 보장해 주는 장치죠. 사람들이 출구로 한꺼번에 몰리지 않게 하려는 겁니다."
    scene: {"kind": "doc", "tag": "안전장치", "meta": "예금자 보호 제도", "title": "출구로 몰리지 않게 하는 [[약속]]", "lines": ["은행이 어려워져도", "일정 금액까지는 [[보장]]"]}
    sync: {"at": [0, "예금자", "출구로"]}
  - say: "사람들은 냄비와 프라이팬을 들고 거리로 나와 두드렸습니다. 냄비 시위, 카세롤라소입니다. 정당도 노조도 아닌 평범한 이웃들이 밤마다 거리로 나왔습니다."
    scene: {kind: photo, photo: "@cacerolazo", name: "카세롤라소, 냄비 시위", role: "2001~2002년 · 은행과 코랄리토에 항의하는 시민들"}
    sync: {at: [0]}
  - say: "12월 19일과 20일, 시위는 폭동으로 번집니다. 이 위기 동안 39명이 목숨을 잃었습니다. 경제 위기가 얼마나 무서운 사회 위기로 번질 수 있는지 보여 준 날이었습니다."
    source: "Wikipedia es, Crisis de diciembre de 2001"
    scene: {kind: photo, photo: "@crisis_2001", name: "2001년 12월 20일, 부에노스아이레스", role: "시위와 진압이 이어진 날"}
    sync: {at: [0]}
  - say: "12월 20일, 데 라 루아 대통령이 물러납니다. 그 뒤 임시 대통령들이 잇따라 들어섰다 물러나고, 2002년 1월 의회가 두알데를 대통령으로 뽑습니다."
    source: "Wikipedia, Corralito · 1998–2002 Argentine great depression"
    scene: {kind: stack, logo: "DICIEMBRE 2001", label: "몇 주 사이 바뀐 [[대통령]]", cards: [{meta: "12월 20일", text: "데 라 루아 대통령 사임"}, {meta: "그다음", text: "상원의장 푸에르타 임시 대행"}, {meta: "며칠 뒤", text: "로드리게스 사아 임시 대통령, 곧 사임"}, {meta: "2002년 1월", text: "의회가 [[두알데]]를 선출"}]}
    sync: {at: [0, "데", "임시", "잇따라", "두알데를"]}
  - say: "몇 주 사이 대통령이 여러 번 바뀐 나라. 국민이 국가의 약속을 가장 믿기 어려워진 순간이었습니다."
    scene: {"kind": "quote", "text": "몇 주 사이 여러 번 바뀐 [[대통령]]", "by": "2001년 12월 ~ 2002년 1월"}
    sync: {"at": [0, "여러", "약속을"]}
  - say: "그사이 2001년 마지막 주, 정부는 공공부채의 상당 부분에 대해 상환을 멈춥니다. 당시로선 한 나라가 낸 가장 큰 규모의 부도였습니다."
    source: "Wikipedia, 1998–2002 Argentine great depression · Reuters"
    theme: dark
    scene: {kind: quote, text: "그때까지 가장 큰 [[국가부도]]", by: "2001년 12월 마지막 주"}
    sync: {at: [0, "상환을", "가장"]}
  - say: "2002년 1월 6일, 의회는 공공비상사태법을 만들어 10년 넘게 이어진 1페소는 1달러라는 약속을 끝냅니다. 페소는 다시 시장에서 값이 매겨지기 시작합니다."
    source: "법률 제25.561호 (argentina.gob.ar)"
    scene: {kind: doc, tag: "법률 제25.561호", meta: "2002년 1월 6일", title: "1페소 = 1달러의 [[끝]]", lines: ["공공 비상사태 선포", "태환법 개정 · [[고정환율 폐지]]"]}
    sync: {at: [0, "공공비상사태법을", "약속을"]}
  - say: "2월에는 대통령령 214호로 은행의 달러 예금을 1달러당 1.4페소로 바꿔 버립니다. 달러로 맡긴 돈이 강제로 페소가 된 거죠."
    source: "대통령령 제214/2002호 · Wikipedia, Corralito"
    scene: {kind: doc, tag: "대통령령 제214호", meta: "2002년 2월", title: "달러 예금이 [[페소]]가 되다", lines: ["달러 예금 → 1달러당 1.40페소로 강제 전환", "달러 대출은 1:1로 전환"]}
    sync: {at: [0, "214호로", "강제로"]}
  - say: "예금은 1.4페소, 달러 빚은 1페소. 달러로 빚진 기업과 사람은 부담이 줄었지만, 그 차이는 결국 예금자와 은행, 그리고 나라 재정이 떠안게 됩니다."
    source: "Wikipedia, Corralito"
    theme: "dark"
    scene: {"kind": "stack", "logo": "PESIFICACIÓN · 2002", "label": "차이는 [[누가]] 떠안았나", "cards": [{"meta": "달러 예금", "text": "1달러 → 1.4페소"}, {"meta": "달러 빚", "text": "1달러 → 1페소"}, {"meta": "그 차이", "text": "예금자 · 은행 · [[나라 재정]]"}]}
    sync: {"at": [0, "예금은", "빚은", "떠안게"]}
  - say: "그런데 시장 환율은 그보다 훨씬 높이 올라갑니다. 2002년 6월 25일, 1달러는 3.9페소가 됩니다. 정부가 정한 비율보다 시장이 매긴 값이 훨씬 가혹했던 거죠."
    source: "아르헨티나 중앙은행 환율 (datos.gob.ar)"
    theme: dark
