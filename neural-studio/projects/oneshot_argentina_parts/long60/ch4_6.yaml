scenes:
  # ═════════════ 4장 · 쿠데타와 빚의 반복 ═════════════
  - say: "네 번째 이야기는 넘어지고 일어서기를 끝없이 되풀이한 시간입니다. 정권도, 경제도, 빚도 시계추처럼 오갔습니다."
    chapter: "4장 · 쿠데타와 빚의 반복"
    theme: dark
    scene: {kind: chapter, kicker: "4장", title: "쿠데타와\n빚의 반복"}
    sync: {at: [0]}
  - say: "페론이 물러난 1955년부터 민주주의가 돌아온 1983년까지, 아르헨티나 정치는 시계추처럼 흔들립니다. 민간 정부와 군사정부가 번갈아 들어섰죠."
    source: "Wikipedia es, Golpes de Estado en Argentina"
    scene: {kind: quote, text: "시계추처럼 흔들린 [[28년]]", by: "1955~1983년"}
    sync: {at: [0, "1955년부터", "번갈아"]}
  - say: "경제학자들은 이 시기를 '스톱 앤 고'라고 부르기도 합니다. 성장하면 수입이 늘어 달러가 바닥나고, 그러면 허리띠를 졸라맸다가, 다시 풉니다."
    scene: {kind: doc, tag: "원리", meta: "stop-go cycle", title: "가다 서다, [[스톱 앤 고]]", lines: ["성장 → 수입 증가 → 달러 바닥", "긴축 → 경기 침체 → 다시 [[돈 풀기]]"]}
    sync: {at: [0, "스톱", "달러가", "다시"]}
  - say: "왜 성장하면 달러가 바닥날까요? 공장을 돌리려면 기계와 부품, 연료를 수입해야 하고, 그 값은 달러로 냅니다. 그런데 달러를 벌어 오는 건 여전히 농산물 수출이었죠."
    theme: "dark"
    scene: {"kind": "quote", "text": "공장은 달러를 쓰고, [[달러]]는 농장이 번다", "by": "스톱 앤 고의 뿌리"}
    sync: {"at": [0, "기계와", "농산물"]}
  - say: "세계은행 자료로 보면 1963년 경제는 5.3% 줄었다가, 1964년 10.1%, 1965년 10.6% 성장합니다. 그리고 1966년엔 다시 마이너스죠. 그해 또 쿠데타가 일어납니다."
    source: "World Bank, GDP growth (annual %)"
    scene: {kind: stack, logo: "STOP & GO", label: "롤러코스터 [[성장률]]", cards: [{meta: "1963년", text: "−5.3%"}, {meta: "1964년", text: "+10.1%"}, {meta: "1965년", text: "+10.6%"}, {meta: "1966년", text: "[[−0.7%]]"}]}
    sync: {at: [0, "1963년", "1964년", "1965년", "1966년엔"]}
  - say: "운전으로 치면 급가속과 급정거를 반복하는 차입니다. 평균 속도는 그럭저럭이어도, 탄 사람은 멀미가 나고 차는 빨리 망가지죠."
    scene: {kind: quote, text: "급가속과 [[급정거]]를 반복하는 차", by: "쉬운 비유"}
    sync: {at: [0, "급가속과", "멀미가"]}
  - say: "1969년 로사리오에서는 대규모 노동자, 학생 시위가 일어납니다. 군사정부에 대한 불만이 거리로 터져 나온 거죠. 경제가 흔들릴수록 정치도 거칠어졌습니다."
    scene: {kind: photo, photo: "@rosariazo", name: "1969년 로사리오 시위", role: "카를로스 살디 사진 · '로사리아소'"}
    sync: {at: [0]}
  - say: "1973년, 망명했던 페론이 돌아와 다시 대통령이 되지만 이듬해 세상을 떠납니다. 그 뒤 정치 폭력과 물가가 함께 치솟습니다."
    source: "Wikipedia, Juan Perón"
    scene: {kind: year, text: "1973", up: "페론의 귀국", down: "1974년 사망", to: "혼돈"}
    sync: {at: [0, "페론이", "치솟습니다."]}
  - say: "1976년 3월 24일, 마지막 군사 쿠데타가 일어납니다. 1983년까지 이어진 군사정권 아래에서 수많은 사람이 실종되고, 인권이 짓밟혔습니다."
    source: "Wikipedia es, Golpes de Estado en Argentina"
    theme: dark
    scene: {kind: doc, tag: "1976년 3월 24일", meta: "1976~1983년 군사정권", title: "마지막 [[군사정권]]", lines: ["강제 실종과 [[인권 침해]]", "경제는 시장 개방과 금융 자유화"]}
    sync: {at: [0, "3월", "실종되고,"]}
  - say: "이 시기의 가장 큰 비극은 경제가 아니라 사람이었습니다. 그 상처는 지금도 아르헨티나 사회에 깊이 남아 있고, 이 영상은 그 무게를 가볍게 다루지 않으려 합니다."
    scene: {"kind": "quote", "text": "가장 큰 비극은 [[사람]]이었다", "by": "1976~1983년"}
    sync: {"at": [0, "사람이었습니다.", "무게를"]}
  - say: "경제는 마르티네스 데 오스 장관이 맡아 시장 개방과 금융 자유화를 밀어붙입니다. 수입 장벽을 낮추고, 해외 자금을 끌어들였죠."
    source: "Wikipedia, National Reorganization Process"
    scene: {kind: doc, tag: "경제 정책", meta: "마르티네스 데 오스 경제장관 · 1976~1981년", title: "문을 열고 [[돈을 빌리다]]", lines: ["수출입 규제와 관세 완화", "금융 자유화 · 해외 자금 유입"]}
    sync: {at: [0, "마르티네스", "해외"]}
  - say: "문제는 그 돈의 상당 부분이 빚이었다는 겁니다. 그의 재임 동안 외채가 네 배로 불어났고, 끝은 큰 폭의 평가절하와 금융위기였습니다."
    source: "Wikipedia, National Reorganization Process"
    theme: dark
    scene: {kind: quote, text: "외채는 [[네 배]]로, 끝은 금융위기", by: "1976~1981년 경제 정책의 결과"}
    sync: {at: [0, "빚이었다는", "네"]}
  - say: "세계은행 집계로 아르헨티나의 대외부채는 1975년 79억 달러에서 1983년 461억 달러가 됩니다. 8년 만에 여섯 배 가까이 불어난 셈입니다."
    source: "World Bank, External debt stocks (DT.DOD.DECT.CD)"
    scene: {kind: bars, dir: v, title: "아르헨티나 [[대외부채]]", sub: "단위 억 달러 · 세계은행", unit: "억", items: [{label: "1975년", value: 79, color: navy}, {label: "1983년", value: 461, color: red}]}
    sync: {at: [0, "79억", "461억"]}
  - say: "비유하면 월급은 그대로인데 카드 한도만 크게 늘어난 겁니다. 당장은 풍족하지만, 금리가 오르는 순간 청구서가 무서워지죠."
    scene: {kind: quote, text: "늘어난 한도, [[무서운]] 청구서", by: "쉬운 비유"}
    sync: {at: [0, "카드", "청구서가"]}
  - say: "실제로 1979년 이후 세계 금리가 크게 오르자, 달러로 빚을 진 중남미 나라들이 줄줄이 흔들립니다. 1982년, 중남미 외채 위기가 터지죠."
    theme: dark
    scene: {kind: doc, tag: "1982년", meta: "중남미 외채 위기", title: "금리가 오르자 [[빚]]이 무거워졌다", lines: ["달러 빚 + 금리 상승", "이자를 갚으려 또 빌리는 [[악순환]]"]}
    sync: {at: [0, "금리가", "1982년,"]}
  - say: "핵심은 통화 불일치입니다. 버는 돈은 페소인데 갚을 돈은 달러인 상태. 페소 가치가 떨어지는 순간, 같은 빚이 몇 배로 불어납니다."
    scene: {"kind": "doc", "tag": "원리", "meta": "currency mismatch", "title": "버는 돈과 갚을 돈이 [[다르면]]", "lines": ["수입은 페소, 빚은 달러", "페소 가치 하락 → 빚이 [[몇 배]]로"]}
    sync: {"at": [0, "통화", "페소", "몇"]}
  - say: "월급은 원화로 받는데 대출은 달러로 받은 사람을 떠올려 보세요. 환율이 두 배가 되면, 하루아침에 빚도 두 배가 됩니다."
    theme: "dark"
    scene: {"kind": "quote", "text": "환율이 두 배면 [[빚도 두 배]]", "by": "쉬운 비유"}
    sync: {"at": [0, "원화로", "두"]}
  - say: "같은 1982년, 군사정권은 영국과 포클랜드 전쟁을 벌였다가 패배합니다. 군사정권은 힘을 잃고, 1983년 민주주의가 돌아옵니다."
    source: "Wikipedia, 1998–2002 Argentine great depression (배경)"
    scene: {kind: quote, text: "전쟁의 패배, 그리고 [[민주주의]]의 귀환", by: "1982~1983년"}
    sync: {at: [0, "포클랜드", "민주주의가"]}
  - say: "1983년 선거로 알폰신 대통령이 취임합니다. 민주주의는 돌아왔지만, 경제는 빚과 물가라는 무거운 짐을 진 채 출발해야 했습니다."
    scene: {"kind": "year", "text": "1983", "up": "민주주의의 귀환", "down": "빚과 물가", "to": "알폰신"}
    sync: {"at": [0, "알폰신", "빚과"]}
  - say: "그런데 새 민주 정부가 물려받은 건 빈 금고와 거대한 빚이었습니다. 군사정권 말기엔 민간 기업의 외채 수십억 달러가 나랏빚으로 넘어가기도 했죠."
    source: "Wikipedia, National Reorganization Process"
    scene: {kind: doc, tag: "1983년", meta: "민주 정부의 출발", title: "민주주의가 물려받은 [[청구서]]", lines: ["빈 금고와 거대한 대외부채", "민간 외채가 [[나랏빚]]으로 이전"]}
    sync: {at: [0, "빈", "나랏빚으로"]}
  - say: "1980년대 중반, 새 대출을 받아야만 갚을 수 있는 이자가 해마다 50억 달러에 이르렀다고 합니다. 빚을 갚기 위해 빚을 지는, 가장 위험한 고리에 들어선 거죠."
    source: "Wikipedia, 1998–2002 Argentine great depression"
    scene: {kind: bignum, label: "해마다 내야 했던 [[이자]]", to: 50, unit: "억 달러", color: red, sub: "1980년대 중반 · 새 빚으로 [[이자]]를 갚는 구조"}
    sync: {at: [0, "이자가", "50억"]}
  - say: "1985년 알폰신 정부는 새 돈 아우스트랄을 내놓습니다. 옛 페소 1,000을 1아우스트랄로 바꾸고, 물가와 임금을 묶는 아우스트랄 계획이었죠."
    source: "Wikipedia, Argentine peso"
    theme: dark
    scene: {kind: doc, tag: "1985년", meta: "아우스트랄 계획", title: "새 돈 [[아우스트랄]]", lines: ["옛 페소 1,000 = 1아우스트랄", "물가와 임금을 함께 [[묶는다]]"]}
    sync: {at: [0]}
  - say: "처음엔 효과가 있는 듯했습니다. 하지만 정부 적자가 그대로인 채 숫자만 바꾼 돈은 오래 버티지 못합니다. 이유는 다음 장에서 자세히 보겠습니다."
    scene: {kind: quote, text: "적자는 그대로, [[숫자만]] 바꾼 돈", by: "아우스트랄 계획"}
    sync: {at: [0, "적자가", "숫자만"]}
