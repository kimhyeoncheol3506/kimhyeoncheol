scenes:
  # ═════════════ 1장 · 세계 5대 부국이라는 말 ═════════════
  - say: "첫 번째 이야기는 끝없이 펼쳐진 초원, 팜파스에서 시작합니다. 소와 밀, 그리고 유럽에서 건너온 사람들이 이 나라를 부자로 만든 이야기입니다."
    chapter: "1장 · 세계 5대 부국이라는 말"
    theme: dark
    scene: {kind: chapter, kicker: "1장", title: "세계 5대 부국\n이라는 말"}
    sync: {at: [0]}
  - say: "아르헨티나 한가운데에는 지평선까지 이어지는 평원이 있습니다. 흙이 기름지고 물이 넉넉해서, 소를 놓아 기르고 밀을 심기에 더없이 좋은 땅이었죠."
    scene: {kind: photo, photo: "@pampas_cattle", name: "팜파스의 소몰이", role: "페르난도 브람빌라 그림 · 1794년"}
    sync: {at: [0]}
  - say: "하지만 19세기 중반까지 이 땅에는 사람이 너무 적었습니다. 좋은 땅은 있는데, 일할 사람도, 수확을 실어 나를 길도 없었던 거죠."
    scene: {kind: quote, text: "땅은 넓고 [[사람]]은 없었다", by: "19세기 중반의 아르헨티나"}
    sync: {at: [0, "사람이", "길도"]}
  - say: "1869년 첫 전국 인구조사에서 아르헨티나 인구는 약 187만 명이었습니다. 그 넓은 땅에 사는 사람이 이 정도였던 겁니다. 땅에 비해 일손이 턱없이 모자랐죠."
    source: "1869년 인구조사 (Wikipedia es, Censo argentino de 1869)"
    scene: {kind: bignum, label: "1869년 아르헨티나 [[인구]]", to: 187, unit: "만 명", color: navy, sub: "첫 전국 인구조사 · 1,877,490명"}
    sync: {at: [0, "187만", "넓은"]}
  - say: "그래서 당시 지도자들은 '다스리는 것은 곧 사람을 채우는 것'이라는 생각으로, 유럽 이민을 적극적으로 받아들였습니다."
    source: "Wikipedia, Immigration to Argentina"
    theme: dark
    scene: {kind: doc, tag: "그 시대의 구호", meta: "19세기 아르헨티나 · 이민 장려 정책", title: "다스리는 것은 [[채우는 것]]", lines: ["빈 땅에 사람을 불러 모은다", "유럽 이민자에게 [[문]]을 연다"]}
    sync: {at: [0, "채우는", "유럽"]}
  - say: "배를 타고 대서양을 건너온 사람들은 대부분 이탈리아와 스페인 출신이었습니다. 가난한 고향을 떠나 새 기회를 찾아온 사람들이었죠."
    scene: {kind: photo, photo: "@immigrants_1904", name: "아르헨티나에 도착한 유럽 이민자들", role: "1904년 사진"}
    sync: {at: [0]}
  - say: "부에노스아이레스 항구 옆에는 이민자 호텔이 세워집니다. 막 도착한 사람들이 며칠 묵으며 일자리를 소개받던 곳이죠. 지금 이 건물은 이민 박물관이 되어 있습니다."
    scene: {"kind": "photo", "photo": "@hotel_inmigrantes", "name": "부에노스아이레스 이민자 호텔", "role": "옛 이민자 숙소 · 지금은 이민 박물관"}
    sync: {"at": [0]}
  - say: "1861년부터 1920년 사이 이탈리아인 약 380만 명, 스페인인 약 150만 명이 아르헨티나로 건너왔다고 합니다. 모두가 눌러앉지는 않았지만, 이 물결이 나라의 얼굴을 완전히 바꿔 놓습니다."
    source: "Wikipedia, Immigration to Argentina"
    scene: {kind: bars, title: "1861~1920년 아르헨티나로 온 [[이민자]]", sub: "국적별 · 단위 만 명", unit: "만", items: [{label: "이탈리아인", value: 380, color: navy}, {label: "스페인인", value: 150, color: red}]}
    sync: {at: [0, "380만", "150만"]}
  - say: "그 결과 1914년 인구조사에서는 약 789만 명. 반세기도 안 돼 인구가 네 배 넘게 늘었습니다. 일할 사람이 늘자, 갈아엎는 땅도 거두는 곡식도 함께 늘어납니다."
    source: "1914년 인구조사 (Wikipedia es, Censo argentino de 1914)"
    scene: {kind: bignum, label: "1914년 아르헨티나 [[인구]]", from: 187, to: 789, unit: "만 명", color: red, sub: "1869년의 [[4배]] 이상 · 7,885,237명"}
    sync: {at: [0, "789만", "네"]}
  - say: "그해 아르헨티나에 사는 사람 열 명 가운데 세 명 가까이는 외국에서 태어난 사람이었습니다. 이민자가 이 나라를 만든 셈이죠."
    source: "Wikipedia, Immigration to Argentina"
    scene: {kind: waffle, title: "1914년, [[외국에서 태어난]] 주민", sub: "외국 태생 인구 비율 · 약 30%", groups: [{label: "외국 태생", value: 30, color: navy}]}
    sync: {at: [0, "세", "이민자가"]}
  - say: "특히 수도 부에노스아이레스는 1895년 인구조사에서 주민의 52%가 이민자였습니다. 거리에서는 이탈리아어와 스페인어, 여러 사투리가 뒤섞여 들렸을 겁니다."
    source: "Wikipedia, Immigration to Argentina"
    scene: {"kind": "gauge", "title": "1895년 부에노스아이레스의 [[이민자]] 비율", "sub": "인구조사 기준", "value": 52, "color": "navy", "label": "수도 주민 가운데 이민자"}
    sync: {"at": [0, "52%가", "이탈리아어와"]}
  - say: "경제학으로 보면 이 시기 아르헨티나는 땅과 노동과 자본, 세 가지 생산요소가 한꺼번에 갖춰진 나라였습니다. 땅은 원래 있었고, 사람은 유럽에서, 돈은 영국에서 왔죠."
    scene: {"kind": "doc", "tag": "원리", "meta": "생산의 세 가지 재료", "title": "땅 · 사람 · [[돈]]이 한꺼번에", "lines": ["땅: 팜파스", "사람: 유럽 이민자", "돈: [[영국]]에서 빌린 자본"]}
    sync: {"at": [0, "생산요소가", "땅은", "돈은"]}
  - say: "쉽게 말해, 엄청나게 넓은 농장에 일꾼들이 몰려온 겁니다. 그런데 거둔 곡식을 항구까지 옮기려면 무엇이 필요할까요?"
    theme: dark
    scene: {kind: quote, text: "넓은 농장, 몰려온 일꾼, 그다음은 [[길]]", by: "쉬운 비유"}
    sync: {at: [0, "일꾼들이", "필요할까요?"]}
  - say: "그리고 이웃 부자가 트랙터 살 돈까지 빌려준 셈입니다. 생산이 늘지 않을 수가 없었죠. 다만 트랙터 값은 언젠가 이자와 함께 갚아야 합니다. 이 이야기는 장 끝에서 다시 나옵니다."
    scene: {"kind": "quote", "text": "빌려 온 트랙터, 언젠가 갚을 [[값]]", "by": "쉬운 비유"}
    sync: {"at": [0, "트랙터", "갚아야"]}
  - say: "답은 철도였습니다. 1857년 부에노스아이레스에서 첫 기차가 달렸고, 영국 자본이 들어오면서 철길은 빠르게 뻗어 나갑니다."
    scene: {kind: photo, photo: "@la_portena", name: "아르헨티나 첫 기관차 '라 포르테냐'", role: "1857년 첫 운행 · 1873년 무렵 사진"}
    sync: {at: [0]}
  - say: "1880년 약 2,516킬로미터였던 철길은 1910년 약 2만 9천 킬로미터가 됩니다. 30년 만에 열 배 넘게 늘어난 거죠. 기차가 닿는 곳마다 새 농장과 마을이 생겨났습니다."
    source: "Wikipedia, Rail transport in Argentina (철도망 표)"
    scene: {kind: bars, dir: v, title: "아르헨티나 [[철도]] 길이", sub: "단위 km", unit: "km", items: [{label: "1880년", value: 2516, color: sky}, {label: "1910년", value: 29094, color: navy}]}
    sync: {at: [0, "2,516킬로미터였던", "2만"]}
  - say: "철길은 대부분 내륙의 농장에서 항구로 곧장 이어졌습니다. 아르헨티나 경제가 처음부터 수출을 향해 설계됐다는 뜻이기도 합니다."
    scene: {kind: doc, tag: "구조", meta: "19세기 말 철도망의 모양", title: "모든 철길은 [[항구]]로", lines: ["내륙 농장 → 기차 → 부에노스아이레스 항구", "곡물과 고기는 [[유럽]]으로"]}
    sync: {at: [0, "항구로", "수출을"]}
  - say: "그런데 소고기에는 큰 문제가 있었습니다. 대서양을 건너는 몇 주 동안 고기가 상해 버린다는 것. 그래서 오랫동안 소금에 절인 고기와 가죽을 주로 팔았죠."
    theme: dark
    scene: {kind: photo, photo: "@saladero", name: "로사리오의 염장 공장", role: "1865년 사진 · 소금에 절인 고기를 만들던 곳"}
    sync: {at: [0]}
  - say: "1870년대 냉동선이 발명되면서 판이 바뀝니다. 강가에 대형 냉동육 공장이 들어서고, 얼린 소고기가 영국의 식탁으로 향합니다."
    source: "Wikipedia, Economic history of Argentina"
    scene: {kind: photo, photo: "@frigorifico", name: "캄파나의 냉동육 공장", role: "1910년 무렵 · 리버플레이트 신선육 회사"}
    sync: {at: [0]}
  - say: "소금에 절인 싼 고기에서, 신선한 냉동 고기로. 같은 소 한 마리가 훨씬 비싼 값에 팔리기 시작한 겁니다. 기술 하나가 나라의 수출 지도를 바꾼 셈이죠."
    scene: {kind: flip, label: "냉동선이 바꾼 [[소고기]]", from: "소금", to: "냉동"}
    sync: {at: [0, "신선한"]}
  - say: "밀과 옥수수, 그리고 소고기. 아르헨티나는 '세계의 곡물창고'라는 별명을 얻고, 가장 큰 손님은 영국이었습니다."
    scene: {kind: stack, logo: "GRANERO DEL MUNDO", label: "세계의 [[곡물창고]]", cards: [{meta: "주력 수출품", text: "밀 · 옥수수 · 소고기"}, {meta: "가장 큰 손님", text: "[[영국]]"}, {meta: "돈줄", text: "영국 자본의 철도와 항구"}]}
    sync: {at: [0, "밀과", "영국이었습니다."]}
  - say: "돈이 돌자 부에노스아이레스는 몰라보게 화려해집니다. 대형 백화점과 넓은 대로, 웅장한 극장이 차례로 들어섰죠."
    scene: {kind: photo, photo: "@gath_chaves", name: "부에노스아이레스의 대형 백화점", role: "가스 이 차베스 본점 · 1914년"}
    sync: {at: [0]}
  - say: "자, 여기서 오늘의 첫 번째 팩트체크입니다. 아르헨티나는 정말 '세계 5대 부국'이었을까요? 인터넷과 책에서 자주 보이는 말이지만, 실제 숫자로 확인해 보겠습니다."
    scene: {kind: quote, text: "정말 [[5대 부국]]이었을까", by: "팩트체크 1"}
    sync: {at: [0, "5대"]}
  - say: "이 말의 근거로 자주 쓰이는 게 매디슨 프로젝트입니다. 경제사학자들이 나라별 1인당 소득을 수백 년 전까지 거슬러 추정한 자료죠."
    source: "Maddison Project Database 2023"
    scene: {kind: doc, tag: "자료", meta: "네덜란드 흐로닝언대학교 · 2023년판", title: "매디슨 프로젝트 [[데이터베이스]]", lines: ["나라별 1인당 GDP를 과거까지 추정", "2011년 국제달러로 물가 차이를 맞춤", "옛날 숫자일수록 [[오차]]가 크다"]}
    sync: {at: [0, "매디슨", "추정한"]}
  - say: "1913년을 보면 아르헨티나는 6,052달러. 미국과 영국에는 못 미치지만, 독일과 프랑스보다 높고 이탈리아와 스페인보다는 훨씬 높았습니다."
    source: "Maddison Project Database 2023 (OWID) · 2011년 국제달러"
    theme: dark
