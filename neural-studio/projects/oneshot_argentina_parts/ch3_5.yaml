scenes:
- say: 세 번째 이야기는 오늘의 핵심 질문입니다. 돈을 찍으면, 정말 다 같이 부자가 될까요? 원리를 먼저 쉽게 보고, 1989년의 숫자로 확인하겠습니다.
  theme: dark
  chapter: 3장 · 돈을 찍으면 생기는 일
  scene:
    kind: chapter
    kicker: 3장
    title: '돈을 찍으면

      생기는 일'
  sync:
    at:
    - 0
    - 핵심
    - 1989년의
- say: 섬에 빵이 100개, 돈이 100원 있다고 해 봅시다. 빵 한 개는 1원이죠. 이제 정부가 돈을 100원 더 찍어서 나눠 줍니다.
  scene:
    kind: doc
    tag: 사고 실험
    meta: 빵 100개와 돈 100원의 섬
    title: 돈만 [[두 배]]가 되면?
    lines:
    - 빵 100개 · 돈 100원 → 빵 1개 = 1원
    - 정부가 100원을 [[더]] 찍어 나눠 준다
  sync:
    at:
    - 0
    - 빵이
    - 1원이죠.
    - 더
- say: 빵은 그대로 100개인데 돈은 200원. 결국 빵 한 개 값은 2원이 됩니다. 모두의 지갑은 두꺼워졌지만, 살 수 있는 빵은 그대로죠.
  scene:
    kind: flip
    label: 빵은 그대로, 돈만 [[두 배]]
    from: 1원
    to: 2원
  sync:
    at:
    - 0
    - 2원이
- say: 진짜 문제는 돈을 찍는 이유가 경기 때문이 아니라, 정부가 쓸 돈이 모자라서일 때입니다. 세금으로 못 걷은 돈을 중앙은행이 찍어 메우는 거죠.
  scene:
    kind: quote
    text: 모자란 나랏돈을 [[찍어서]] 메우면
    by: 재정 적자의 화폐화
  sync:
    at:
    - 0
    - 모자라서일
    - 중앙은행이
- say: 그럼 누가 이득을 볼까요? 빚이 많은 쪽, 그리고 물건과 땅, 달러를 가진 쪽입니다. 손해는 현금과 예금, 월급만 가진 사람에게 돌아가죠.
  scene:
    kind: quote
    text: 현금을 쥔 사람이 [[가장 많이]] 잃는다
    by: 인플레이션의 승자와 패자
  sync:
    at:
    - 0
    - 빚이
    - 손해는
  theme: dark
- say: 그러니 팩트체크 2의 답은 이렇습니다. 돈을 찍어 다 같이 부자가 되지는 않습니다. 대신 누군가의 지갑에서 다른 누군가에게로 부가 조용히 옮겨 갑니다.
  theme: dark
  scene:
    kind: flip
    label: 팩트체크 2 · 돈 찍으면 다 같이 부자?
    from: 진짜
    to: 거짓
  sync:
    at:
    - 0
    - 부자가
- say: 이 원리가 극단까지 간 게 1989년의 아르헨티나입니다. 경제학 교과서에 하이퍼인플레이션의 대표 사례로 실리는 해죠.
  scene:
    kind: year
    text: '1989'
    up: 물가
    down: 월급
    to: 4,923%
  sync:
    at:
    - 0
    - 극단까지
- say: 1989년 2월 초, 외환보유액이 바닥나 중앙은행은 외환시장 개입을 멈춥니다. 1월과 2월 평균 8.5%였던 월간 물가 상승률이 3월엔 18%로 뜁니다.
  source: BCRA, Memoria Anual 1989 · 소비자물가 전월 대비(월간)
  theme: dark
  scene:
    kind: stairs
    title: 1989년 [[월간]] 물가 상승률
    sub: 아르헨티나 중앙은행 1989년 보고서
    unit: '%'
    steps:
    - label: 1~2월 평균
      value: 8.5
    - label: 3월
      value: 18
      color: red
  sync:
    at:
    - 0
