title: 닷컴버블, 세계 1등 시스코도 본전까지 25년… 지금 AI는 다를까?
intro_chapter: 인트로 · 78%와 15년
voice:
  name: 여의도여자
  speed: 1.0
  instruct: 경제 다큐멘터리 해설자처럼 차분하고 또렷하게, 이야기를 들려주듯 따뜻하게. 숫자와 연도는 또박또박.
thumbnail:
  file: assets/thumbs/oneshot_dotcom_thumb_A.png
summary: '닷컴버블 때 나스닥은 2000년 3월 꼭대기에서 2002년 10월까지 78% 떨어졌고, 그 꼭대기를 다시 넘기까지 15년이 걸렸습니다. 세계 시가총액 1위였던 시스코는 25년이 걸렸고, 한국 코스닥은 9개월 만에 약 81%가 빠졌습니다.

  인터넷 붐과 쉬운 돈, 펫츠닷컴과 새롬기술, 살아남은 아마존, 그리고 지금의 AI 붐이 그때와 무엇이 같고 다른지(양쪽 시각), 월급쟁이가 지켜야 할 돈 관리 원칙까지 정리했습니다. 투자 권유가 아니며, 모든 숫자의 출처는 아래에 적었습니다.

  '
