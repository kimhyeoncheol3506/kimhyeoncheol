# 진행 방식·목소리·외부 소재: 현철님이 직접 한 말에서 나온 규칙(원문은 feedback/inbox.jsonl)
- id: PROC-01
  scope: process
  text: 편집은 전혀 모른다고 생각하고 편집 관련 질문 없이 끝까지 진행한다(꼭 필요한 결정만 묻는다).
  why: '"내가 편집을 전혀 모른다고 생각하고, 묻지도 말고 끝까지 해라" (2026-10-10)'
  date: 2026-10-10
  enforce: {type: manual}
- id: PROC-02
  scope: process
  text: 롱폼을 만들기 전에 20초 내외 컨셉판을 먼저 만들어 핸드폰 알림으로 컨펌을 받는다. 컨펌 전에는 롱폼을 만들지 않는다.
  why: '"롱텀의 영상을 만들기 전에 20초 내외의 컨셉을 먼저 만들어서 반드시 나에게 컨펌을 받아라. 컨펌은 핸드폰 알림으로" (2026-10-10)'
  date: 2026-10-10
  enforce: {type: manual}
- id: PROC-03
  scope: all
  text: 자료화면(기사·숫자·이미지)에는 출처를 작게 적는다. 출처가 없으면 사전검사가 경고한다.
  why: '"자료의 출처는 보일 수 있게 작게 적어라" (2026-10-10)'
  date: 2026-10-10
  enforce: {type: lint, code: "facetube/build.py:preflight"}
- id: PROC-04
  scope: process
  text: 현철님은 광고주처럼 화두만 던지고, 저는 대형 기획사 PD 로서 맥락·구성·디테일을 정한다. 스크린샷은 직접 읽고 판독한다.
  why: '"나는 거기의 광고주처럼 큰 틀에서 화두만 던질테니 니가 나머지 디테일은 작성해라" (2026-10-10)'
  date: 2026-10-10
  enforce: {type: manual}
- id: VOICE-01
  scope: voice
  text: 기본 내레이션 목소리는 Edge 현수(ko-KR-HyunsuMultilingualNeural). 임의로 다른 목소리로 바꾸지 않는다.
  why: '"현수 목소리로 선택했어" (2026-10-21)'
  date: 2026-10-21
  enforce: {type: lint, code: "facetube/voice.py:DEFAULT_VOICE"}
- id: VOICE-02
  scope: voice
  text: 실존 인물(본인 동의 없는 사람)의 목소리를 복제하지 않는다.
  why: 여의도 음성 스킬 지침, Digen Voice Clone 검토 중 정리
  date: 2026-10-25
  enforce: {type: manual}
- id: EXT-01
  scope: external
  text: AI 소재는 tool, model, generated_on 을 기록한다.
  why: '"위 사이트도 영상 만들때 쓰자" (Pavo AI, Digen AI) (2026-10-25)'
  date: 2026-10-25
  enforce: {type: lint, config: ai_media.require_fields, code: "facetube/media.py:ai_issues"}
- id: EXT-02
  scope: external
  text: AI 생성 영상에는 'AI 생성 · 도구' 배지를 넣고, 도구가 넣은 워터마크를 가리지 않는다.
  why: Pavo AI 약관 5.4, 5.5 확인
  date: 2026-10-25
  enforce: {type: lint, config: ai_media.badge, code: "facetube/media.py:ai_issues"}
- id: EXT-03
  scope: external
  text: 약관(상업 이용)을 확인하지 않은 도구는 쓸 때마다 경고한다. 새 도구는 약관을 읽고 terms_checked 를 적는다.
  why: Digen 약관 못 찾음, Pavo 약관 확인
  date: 2026-10-25
  enforce: {type: lint, config: external_tools, code: "facetube/media.py:ai_issues"}
- id: EXT-04
  scope: external
  text: 개인정보·실존 인물 사진·미공개 자료는 외부 생성 사이트에 올리지 않는다.
  why: Pavo 약관 4.2(운영사에 영구 이용권), 중국 회사
  date: 2026-10-25
  enforce: {type: manual}
- id: EXT-05
  scope: external
  text: 외부 사이트의 로그인·결제·생성은 현철님이 하고, 저는 소재 요청서(프롬프트)와 편집·검수를 맡는다.
  why: 두 사이트 모두 공개 API/MCP 없음
  date: 2026-10-25
  enforce: {type: manual}
- id: EXT-06
  scope: external
  text: 외부에서 만든 음악(Suno 등)을 배경음으로 쓰면 tool, model, generated_on 을 기록하고 약관(상업 이용)을 확인한다. 설명란에 배경음악 출처가 적힌다.
  why: 알렉스 유튜브 공장 구성도 - Suno 는 브라우저 수동 레인으로 만들고 후반에 따로 믹스 (현철님 공유 2026-10-28)
  date: 2026-10-28
  enforce: {type: lint, config: external_tools, code: "facetube/audio.py:make_bgm"}
- id: PROC-05
  scope: process
  text: 업로드·예약·공개·삭제는 현철님이 하고, 알려 주시면 발행 원장(content/history/published.jsonl)에 이벤트로 기록한다. 앞 단계 기록이 없는 공개·삭제는 기록하지 않는다.
  why: 알렉스 유튜브 공장 구성도 - 발행 원장 (현철님 공유 2026-10-28)
  date: 2026-10-28
  enforce: {type: lint, code: "tools/ledger.py:check"}
