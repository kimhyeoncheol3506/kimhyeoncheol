# 쇼츠 공장 원칙 6가지 (2026-10-23 현철님 공유 "공장이 지키는 원칙")
- id: SHORT-01
  scope: shorts
  text: 소재는 오늘 뉴스와 72시간 안에 터진 영상에서 5개를 고른다(뉴스 3, 오래 가는 원리형 2). 뉴스 소재가 72시간을 넘으면 경고.
  why: 공장이 지키는 원칙 01
  date: 2026-10-23
  enforce: {type: lint, config: shorts.topics, code: "shorts/make_short.py:check_rules"}
- id: SHORT-02A
  scope: shorts
  text: 쇼츠는 40~50초(20초 컨셉판은 15~25초).
  why: 공장이 지키는 원칙 02
  date: 2026-10-23
  enforce: {type: lint, config: shorts.duration_sec, code: "shorts/make_short.py:check_rules"}
- id: SHORT-02B
  scope: shorts
  text: 줄마다 역할 hook→twist→core→pov→todo→end, hook 으로 시작하고 end 로 끝난다.
  why: 공장이 지키는 원칙 02
  date: 2026-10-23
  enforce: {type: lint, config: shorts.roles, code: "shorts/make_short.py:check_rules"}
- id: SHORT-02C
  scope: shorts
  text: 설명(core)만 두 줄 이어지지 않게 한다.
  why: 공장이 지키는 원칙 02
  date: 2026-10-23
  enforce: {type: lint, config: shorts.no_adjacent_core, code: "shorts/make_short.py:check_rules"}
- id: SHORT-03
  scope: shorts
  text: 화면 아래 18%(세로 y 1574 이후)는 비운다. 렌더마다 내용을 숨긴 배경과 픽셀을 비교해 검사한다.
  why: 공장이 지키는 원칙 03 (유튜브 버튼이 덮는 자리)
  date: 2026-10-23
  enforce: {type: lint, config: shorts.bottom_empty_ratio, code: "shorts/render_lib.py:_bottom_diff"}
- id: SHORT-04
  scope: shorts
  text: 자막은 목소리에 맞춰 시간을 맞추고 한 화면 13자 안팎(최대 15자)으로 나눈다.
  why: 공장이 지키는 원칙 04
  date: 2026-10-23
  enforce: {type: lint, config: shorts.caption_max_chars, code: "facetube/captions.py:split_pieces"}
- id: SHORT-05
  scope: shorts
  text: 내 관점 한 줄(role pov)은 꼭 넣고, 첫 줄은 현철님이 직접 손보게 보고서에 따로 적는다.
  why: 공장이 지키는 원칙 05
  date: 2026-10-23
  enforce: {type: lint, config: shorts.require_pov, code: "shorts/make_short.py:check_rules"}
- id: SHORT-06A
  scope: shorts
  text: 출처에 없는 숫자는 안 쓴다. 기사 원문을 열어 확인(verified)하고 숫자는 출처 facts 에 있어야 하며, 설명란에 출처를 남긴다.
  why: 공장이 지키는 원칙 06
  date: 2026-10-23
  enforce: {type: lint, config: shorts.sources_verified, code: "shorts/make_short.py:check_rules"}
- id: SHORT-06B
  scope: all
  text: 기사 게재일은 URL 번호가 아니라 원문의 datePublished/입력 시각으로 적는다.
  why: 파일럿에서 URL 번호로 2023.12.22 라고 썼으나 원문은 2023.12.25 였다
  date: 2026-10-23
  enforce: {type: manual}
